            } else { dmChat = ((dmLocal()[uid] || {}).msgs) || []; dmChat.forEach((m, i) => { if (!m.id) m.id = 'd' + m.ts + '_' + i; }); }
            renderDM();
        }
        function openDMRoom(uid) { const t = dmRooms().find(x => x.uid === uid); if (t) openDM(t.uid, t.nick, t.emoji, t.photo, t.area); }
        function closeDM() { dmWith = null; if (dmUnsub) { dmUnsub(); dmUnsub = null; } renderDM(); }
        // 채팅방 나가기: 내 목록에서만 지웁니다 (상대의 목록에는 남습니다)
        async function leaveDM(uid) {
            if (!confirm('이 채팅방을 목록에서 지울까요?')) return;
            try {
                const db = await commInit();
                if (db) await db.collection('dmThreads').doc(COMM_UID).collection('list').doc(uid).delete();
                else { const l = dmLocal(); delete l[uid]; lsSet('dm_local', JSON.stringify(l)); await subscribeDM(); }
            } catch (e) { console.error(e); }
            dmThreads = dmThreads.filter(t => t.uid !== uid);
            if (dmWith && dmWith.uid === uid) closeDM(); else renderDM();
        }
        async function dmSend() {
            const input = document.getElementById('dmText');
            const text = ((input && input.value) || '').trim();
            if (!text || !dmWith) return;
            if (!canChat(dmWith.uid)) { showAlertToast({ head: '1:1 대화', title: '상대가 대화 요청을 수락해야 메시지를 보낼 수 있습니다.' }); return; }
            if (isBlocked(dmWith.uid)) { showAlertToast({ head: '1:1 대화', title: '이 이웃에게는 메시지를 보낼 수 없습니다.' }); return; }
            const msg = { uid: COMM_UID, text: text.slice(0, 500), ts: Date.now() };
            if (replyTo.dm) msg.replyTo = replyTo.dm;
            try {
                const db = await commInit();
                if (db) {
                    // 상대가 나를 차단했는지 한 번 더 확인 (차단되어 있으면 보내지 않음)
                    try { const b = await db.collection('blocks').doc(dmWith.uid).get(); if (b.exists && (b.data().uids || []).includes(COMM_UID)) { blockedBy.add(dmWith.uid); showAlertToast({ head: '1:1 대화', title: '이 이웃에게는 메시지를 보낼 수 없습니다.' }); return; } } catch (e) {}
                    await db.collection('dm').doc(pairId(COMM_UID, dmWith.uid)).collection('messages').add(msg);
                    const base = { last: msg.text.slice(0, 60), ts: msg.ts, from: COMM_UID };
                    await db.collection('dmThreads').doc(COMM_UID).collection('list').doc(dmWith.uid).set(Object.assign({ uid: dmWith.uid, nick: dmWith.nick, emoji: dmWith.emoji, photo: dmWith.photo || '', area: dmWith.area || '' }, base));
                    await db.collection('dmThreads').doc(dmWith.uid).collection('list').doc(COMM_UID).set(Object.assign({ uid: COMM_UID, photo: myPhoto() }, meFields(), base));
                } else {
                    msg.id = 'd' + msg.ts + Math.random().toString(36).slice(2, 6);
                    const l = dmLocal();
                    l[dmWith.uid] = l[dmWith.uid] || { nick: dmWith.nick, emoji: dmWith.emoji, photo: dmWith.photo || '', area: dmWith.area || '', msgs: [] };
                    l[dmWith.uid].msgs.push(msg);
                    lsSet('dm_local', JSON.stringify(l));
                    dmChat = l[dmWith.uid].msgs;
                    await subscribeDM();
                    renderDMChat();
                }
                input.value = '';
                clearReply('dm');
            } catch (e) { console.error(e); }
        }
        // 말풍선 목록. ctx 를 주면(1:1 대화) 공감·답장을 쓸 수 있습니다.
        function chatBubbles(list, color, ctx) {
            return list.map(m => {
                const mine = m.uid === COMM_UID;
                return `<div ${ctx && m.id ? `id="msg_${ctx}_${esc(m.id)}"` : ''} class="msg-row flex ${mine ? 'justify-end' : 'justify-start'}"><div class="flex flex-col min-w-0 ${mine ? 'items-end' : 'items-start'}" style="max-width:80%;">
                    <div class="msg-bubble rounded-2xl border px-3 py-1.5 text-sm ${mine ? color : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100'}">${ctx ? replyQuote(m, ctx) : ''}<span class="whitespace-pre-line break-words">${esc(m.text)}</span><div class="text-[0.625rem] text-slate-400 mt-0.5">${timeAgo(m.ts)}</div></div>
                    ${ctx ? reactRow(ctx, m, mine) : ''}</div></div>`;
            }).join('');
        }
        function renderDMChat() {
            const box = document.getElementById('dmChat');
            if (!box) return;
            const near = (box.scrollHeight - box.scrollTop - box.clientHeight) < 150;
            box.innerHTML = dmChat.length ? chatBubbles(dmChat, 'bg-sky-100 dark:bg-sky-900/70 border-sky-300 dark:border-sky-700 text-slate-900 dark:text-white', 'dm')
                : '<div class="text-center py-10 text-xs text-slate-400">첫 인사를 건네 보세요.</div>';
            if (near || !box.dataset.ready) { box.scrollTop = box.scrollHeight; box.dataset.ready = '1'; }
        }
        function renderDMRooms() {
            const box = document.getElementById('dmRooms');
            if (!box) return;
            const rooms = dmRooms();
            const reqs = chatReqs.filter(r => !isBlocked(r.uid));
            const rb = 'px-2 py-1 rounded-lg text-[0.6875rem] font-bold';
            box.innerHTML = (reqs.length ? `<div class="px-3 py-1.5 text-[0.6875rem] font-bold text-sky-700 dark:text-sky-300 bg-sky-50 dark:bg-sky-950/40 border-b border-sky-200 dark:border-sky-900">받은 대화 요청 ${reqs.length}</div>` + reqs.map(r => `
                    <div class="px-3 py-2 border-b border-slate-100 dark:border-slate-800 space-y-1">
                        <div class="flex items-center gap-2">${avatarHtml(r, 'w-8 h-8', 'text-base')}<div class="min-w-0 flex-1"><div class="text-xs font-bold text-slate-900 dark:text-white truncate">${esc(r.nick || '이웃')}</div><div class="text-[0.625rem] text-slate-500 truncate">${esc(shortArea(r.area) || '')} · ${timeAgo(r.ts || Date.now())}</div></div></div>
                        ${r.msg ? `<div class="text-[0.6875rem] text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-800 rounded-lg px-2 py-1 break-words" style="white-space: normal;">"${esc(r.msg)}"</div>` : ''}
                        <div class="flex gap-1.5"><button onclick="acceptChat('${esc(r.uid)}')" class="${rb} bg-sky-600 hover:bg-sky-500 text-white">수락</button><button onclick="declineChat('${esc(r.uid)}')" class="${rb} border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300">거절</button><button onclick="showProfile('${esc(r.uid)}')" class="${rb} text-slate-500">프로필</button></div>
                    </div>`).join('') : '')
                + `<div class="px-3 py-2 text-[0.6875rem] font-bold text-slate-600 dark:text-slate-300 border-b border-slate-200 dark:border-slate-800 sticky top-0 bg-slate-50 dark:bg-slate-900">채팅방 ${rooms.length}개${dmUnread.size ? ' <span class="text-sky-500">· 새 글 ' + dmUnread.size + '</span>' : ''}</div>`
                + (rooms.length ? rooms.map(t => {
                    const on = dmWith && dmWith.uid === t.uid, un = dmUnread.has(t.uid);
                    return `<div class="group flex items-center border-b border-slate-100 dark:border-slate-800 ${on ? 'bg-sky-100 dark:bg-sky-900/40' : 'hover:bg-slate-100 dark:hover:bg-slate-800'}">
                        <button onclick="openDMRoom('${esc(t.uid)}')" class="flex-1 min-w-0 flex items-center gap-2 px-3 py-2 text-left">
                            <span class="relative shrink-0">${avatarHtml(t, 'w-9 h-9', 'text-lg')}${un ? '<span class="absolute -top-0.5 -right-0.5 w-3 h-3 rounded-full bg-red-500 border-2 border-white dark:border-slate-900"></span>' : ''}</span>
                            <span class="min-w-0 flex-1">
                                <span class="flex items-center justify-between gap-1"><span class="text-xs font-bold text-slate-900 dark:text-white truncate">${esc(displayName(t.uid, t.nick))}${isFriend(t.uid) ? ' 👥' : ''}</span><span class="text-[0.625rem] text-slate-400 shrink-0">${t.ts ? timeAgo(t.ts) : '새 대화'}</span></span>
                                <span class="block text-[0.6875rem] ${un ? 'text-slate-900 dark:text-white font-bold' : 'text-slate-500'} truncate">${esc(t.last || (t.area ? shortArea(t.area) : '대화를 시작해 보세요'))}</span>
                            </span>
                        </button>
                        <button onclick="leaveDM('${esc(t.uid)}')" title="채팅방 나가기" class="px-2 text-slate-300 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
                    </div>`;
                }).join('') : '<div class="text-center py-10 px-3 text-[0.6875rem] text-slate-400 leading-relaxed">아직 채팅방이 없습니다.<br>이웃의 아이콘이나 이름을 눌러 프로필에서 <b>1:1 대화</b>를 시작해 보세요.</div>');
        }
        function renderDM() {
            const main = document.getElementById('commMain');
            if (!main || commTab !== 'dm') return;
            const callBtn = 'px-2.5 py-1 rounded-lg border border-slate-300 dark:border-slate-600 text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700';
            // 왼쪽: 채팅방 목록 / 오른쪽: 고른 채팅방. 화면이 좁으면 한 번에 하나만 보입니다.
            main.innerHTML = `
                <div class="flex-1 min-h-0 flex">
                    <aside id="dmRooms" class="dm-rooms ${dmWith ? 'has-chat' : ''} w-56 shrink-0 overflow-y-auto custom-scrollbar border-r border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/60"></aside>
                    <section class="dm-chat ${dmWith ? '' : 'no-chat'} flex flex-1 min-w-0 flex-col">
                        ${dmWith ? `
                        <div class="px-3 py-1.5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2 shrink-0">
                            <button onclick="closeDM()" class="show-narrow text-xs text-blue-500 hover:underline shrink-0">← 목록</button>
                            <button onclick="showProfile('${esc(dmWith.uid)}')" class="flex items-center gap-2 min-w-0 text-left">${avatarHtml(dmWith, 'w-7 h-7', 'text-sm')}<span class="min-w-0"><b class="block text-xs text-slate-800 dark:text-slate-100 truncate">${esc(displayName(dmWith.uid, dmWith.nick))}${isFriend(dmWith.uid) ? ' 👥' : ''}</b>${dmWith.area ? `<span class="block text-[0.625rem] text-slate-500 truncate">${esc(dmWith.area)}</span>` : ''}</span></button>
                            <span class="flex items-center gap-1.5 shrink-0">
                                <button onclick="startCall('${esc(dmWith.uid)}', dmWith.nick, false)" class="${callBtn}"><i class="fa-solid fa-phone"></i> 음성</button>
                                <button onclick="startCall('${esc(dmWith.uid)}', dmWith.nick, true)" class="${callBtn}"><i class="fa-solid fa-video"></i> 영상</button>
                                <button onclick="blockUser('${esc(dmWith.uid)}', dmWith.nick, dmWith.emoji)" title="차단하기" class="${callBtn}">🚫</button>
                            </span>
                        </div>
                        <div id="dmChat" class="flex-1 min-h-0 overflow-y-auto custom-scrollbar p-3 space-y-2"></div>
                        <div class="border-t border-slate-200 dark:border-slate-800 p-2 space-y-1.5 shrink-0 bg-white dark:bg-slate-900">
                            <div id="replyBar_dm"></div>
                            ${chatInputRow({ id: 'dmText', send: 'dmSend()', label: '보내기', placeholder: '메시지를 입력하세요 (Enter 보내기 · Shift+Enter 줄바꿈)', enter: true, rows: 2, minH: '3.25rem' })}
                        </div>` : `
                        <div class="flex-1 flex flex-col items-center justify-center gap-2 text-center text-xs text-slate-400 p-6"><div class="text-4xl">💬</div><div>왼쪽에서 채팅방을 고르세요.<br>상대마다 채팅방이 따로 만들어집니다.</div></div>`}
                    </section>
                </div>`;
            renderDMRooms();
            if (dmWith) { renderReplyBar('dm'); renderDMChat(); }
        }

        // ---- 음성·영상 통화 (WebRTC) ----
        const RTC_CFG = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] };
        let call = null, callsUnsub = null, autoAcceptFrom = null;
        function callUi(show) { const o = document.getElementById('callOverlay'); if (o) { if (show) o.classList.remove('hidden'); else o.classList.add('hidden'); } }
        function callInfo(t) { const el = document.getElementById('callInfo'); if (el) el.textContent = t; }
        async function getMedia(video) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('이 브라우저는 통화를 지원하지 않습니다.');
            return await navigator.mediaDevices.getUserMedia({ audio: true, video: !!video });
        }
        function setupPeer(stream, video, peerNick, ref, myCands) {
            const pc = new RTCPeerConnection(RTC_CFG);
            stream.getTracks().forEach(tr => pc.addTrack(tr, stream));
            pc.onicecandidate = e => { if (e.candidate) ref.collection(myCands).add(e.candidate.toJSON()).catch(() => {}); };
            pc.ontrack = e => { const r = document.getElementById('callRemote'); if (r && r.srcObject !== e.streams[0]) r.srcObject = e.streams[0]; callInfo(peerNick + '님과 통화 중'); };
            pc.onconnectionstatechange = () => { if (['failed', 'disconnected', 'closed'].includes(pc.connectionState)) endCall(true); };
            const loc = document.getElementById('callLocal'), rem = document.getElementById('callRemote'), av = document.getElementById('callAvatar');
            if (loc) { loc.srcObject = stream; loc.style.display = video ? '' : 'none'; }
            if (rem) rem.style.display = video ? '' : 'none';
            if (av) av.style.display = video ? 'none' : '';
            return pc;
        }
        async function startCall(uid, nick, video) {
            if (isBlocked(uid)) { showAlertToast({ head: '통화', title: '이 이웃과는 통화할 수 없습니다.' }); return; }
            const db = await commInit();
            if (!db) { needServer(video ? '영상 통화' : '음성 통화'); return; }
            if (call) return;
            let stream;
            try { stream = await getMedia(video); }
            catch (e) { showAlertToast({ head: '통화', title: '마이크' + (video ? '·카메라' : '') + ' 사용을 허용해야 통화할 수 있습니다.', foot: (e && e.message) || '' }); return; }
            const ref = db.collection('calls').doc();
            const pc = setupPeer(stream, video, nick || '이웃', ref, 'callerCandidates');
            call = { ref: ref, pc: pc, stream: stream, unsubs: [], peer: nick || '이웃' };
            callUi(true); callInfo((nick || '이웃') + '님에게 거는 중...');
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await ref.set({ from: COMM_UID, fromNick: myNick(), fromEmoji: commProfile.emoji || '🙂', to: uid, video: !!video, status: 'ringing', ts: Date.now(), offer: { type: offer.type, sdp: offer.sdp } });
            call.unsubs.push(ref.onSnapshot(snap => {
                const d = snap.data();
                if (!d || !call) return;
                if (d.answer && !pc.currentRemoteDescription) pc.setRemoteDescription(new RTCSessionDescription(d.answer)).catch(() => {});
                if (d.status === 'ended' || d.status === 'declined') { if (d.status === 'declined') showAlertToast({ head: '통화', title: '상대가 통화를 받지 않았습니다.' }); endCall(true); }
            }));
            call.unsubs.push(ref.collection('calleeCandidates').onSnapshot(snap => snap.docChanges().forEach(ch => { if (ch.type === 'added') pc.addIceCandidate(new RTCIceCandidate(ch.doc.data())).catch(() => {}); })));
            call.timer = setTimeout(() => { if (call && !pc.currentRemoteDescription) { showAlertToast({ head: '통화', title: '상대가 응답하지 않습니다.' }); endCall(); } }, 45000);
        }
        async function answerCall(id) {
            const box = document.getElementById('callIncoming'); if (box) box.classList.add('hidden');
            const db = await commInit();
            if (!db || call) return;
            const ref = db.collection('calls').doc(id);
            const d = (await ref.get()).data();
            if (!d || d.status !== 'ringing') return;
            let stream;
            try { stream = await getMedia(d.video); }
            catch (e) { ref.update({ status: 'declined' }).catch(() => {}); showAlertToast({ head: '통화', title: '마이크' + (d.video ? '·카메라' : '') + ' 사용을 허용해야 통화할 수 있습니다.' }); return; }
            const pc = setupPeer(stream, d.video, d.fromNick || '이웃', ref, 'calleeCandidates');
            call = { ref: ref, pc: pc, stream: stream, unsubs: [], peer: d.fromNick || '이웃' };
            callUi(true); callInfo((d.fromNick || '이웃') + '님과 연결 중...');
            await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            await ref.update({ answer: { type: answer.type, sdp: answer.sdp }, status: 'active' });
            call.unsubs.push(ref.collection('callerCandidates').onSnapshot(snap => snap.docChanges().forEach(ch => { if (ch.type === 'added') pc.addIceCandidate(new RTCIceCandidate(ch.doc.data())).catch(() => {}); })));
            call.unsubs.push(ref.onSnapshot(snap => { const x = snap.data(); if (x && x.status === 'ended') endCall(true); }));
        }
        async function declineCall(id) {
            const box = document.getElementById('callIncoming'); if (box) box.classList.add('hidden');
            const db = await commInit();
            if (db) db.collection('calls').doc(id).update({ status: 'declined' }).catch(() => {});
        }
        function endCall(remote) {
            if (!call) { callUi(false); return; }
            const c = call; call = null;
            if (c.timer) clearTimeout(c.timer);
            c.unsubs.forEach(u => { try { u(); } catch (e) {} });
            try { c.stream.getTracks().forEach(tr => tr.stop()); } catch (e) {}
            try { c.pc.close(); } catch (e) {}
            if (remote !== true) c.ref.update({ status: 'ended' }).catch(() => {});
            ['callLocal', 'callRemote'].forEach(id => { const v = document.getElementById(id); if (v) v.srcObject = null; });
            callUi(false);
        }
        function toggleMute() {
            if (!call) return;
            const tr = call.stream.getAudioTracks()[0];
            if (!tr) return;
            tr.enabled = !tr.enabled;
            const b = document.getElementById('callMute'); if (b) b.textContent = tr.enabled ? '마이크 끄기' : '마이크 켜기';
        }
        function listenCalls() {
            if (callsUnsub || !commDb) return;
            callsUnsub = commDb.collection('calls').where('to', '==', COMM_UID).where('status', '==', 'ringing').onSnapshot(snap => {
                snap.docChanges().forEach(ch => {
                    const d = ch.doc.data();
                    if (ch.type !== 'added' || Date.now() - d.ts > 60000 || call) return;
                    if (isBlocked(d.from)) { declineCall(ch.doc.id); return; }      // 차단한 상대의 전화는 받지 않음
                    if (autoAcceptFrom && d.from === autoAcceptFrom) { autoAcceptFrom = null; answerCall(ch.doc.id); return; }   // 랜덤 화상 채팅 상대
                    const box = document.getElementById('callIncoming');
                    if (!box) return;
                    box.innerHTML = `
                        <div class="text-sm font-bold text-slate-900 dark:text-white">${esc(d.fromEmoji || '🙂')} ${esc(d.fromNick || '이웃')}님의 ${d.video ? '영상' : '음성'} 통화</div>
                        <div class="mt-2 flex gap-2 justify-center">
                            <button onclick="answerCall('${esc(ch.doc.id)}')" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold">받기</button>
                            <button onclick="declineCall('${esc(ch.doc.id)}')" class="px-4 py-1.5 rounded-lg bg-red-600 hover:bg-red-500 text-white text-xs font-bold">거절</button>
                        </div>`;
                    box.classList.remove('hidden');
                    playAlertSound('bell');
                    setTimeout(() => box.classList.add('hidden'), 40000);
                });
            }, err => console.error(err));
        }

        // ---- 신뢰 지수 (거래 매너 + 대화 매너 + 제보 정확도를 모두 합친 이웃 평판) ----
        //  votes 하나 = { score: 1~5, kind: 'trade'(거래) | 'manner'(대화 매너) | 'report'(제보 사실 확인), from, ts }
        // 신뢰 지수 = 50점에서 시작해서 평가 하나마다 올라가거나 내려감 (0~100점)
        const TRUST_BASE = 50;
        const TRUST_DELTA = {      // 받은 평가 → 점수 변화
            star: { 5: 3, 4: 1, 3: 0, 2: -2, 1: -4 },          // 거래·대화 매너 별점
            report: { 5: 3, 3: 0, 1: -5 }                      // 제보 사실 확인: 사실이에요 / 확인 필요 / 사실과 달라요
        };
        const TRUST_LEVELS = [     // [최소 점수, 등급, 색]
            [80, '매우 높음', 'text-emerald-600 dark:text-emerald-400'],
            [65, '높음', 'text-teal-600 dark:text-teal-400'],
            [45, '보통', 'text-slate-600 dark:text-slate-300'],
            [30, '낮음', 'text-amber-600 dark:text-amber-400'],
            [0, '매우 낮음 (주의)', 'text-red-600 dark:text-red-400']
        ];
        const TRUST_MIN_VOTES = 3;  // 평가가 3건 미만이면 '평가 부족'으로 표시 (점수는 계산하지만 등급은 보통으로 봄)
        const TRUST_HELP = '신뢰 지수는 이 이웃이 커뮤니티에서 얼마나 믿을 만하게 활동하는지 보여 주는 점수(0~100점)입니다. 누구나 50점에서 시작합니다. '
            + '① 거래 매너 별점 ② 대화 매너 별점: ★5 +3점 · ★4 +1점 · ★3 0점 · ★2 −2점 · ★1 −4점. '
            + '③ 제보 사실 확인: 👍 사실이에요 +3점 · 🤔 확인 필요 0점 · 👎 사실과 달라요 −5점. '
            + '등급: 80점 이상 매우 높음 · 65~79점 높음 · 45~64점 보통 · 30~44점 낮음 · 29점 이하 매우 낮음(주의). 평가가 3건 미만이면 "평가 부족"으로 표시됩니다.';
        function trustLevel(score) { return TRUST_LEVELS.find(l => score >= l[0]) || TRUST_LEVELS[TRUST_LEVELS.length - 1]; }
        const trustCache = {};
        function trustLocal() { try { return JSON.parse(lsGet('trust_local') || '{}'); } catch (e) { return {}; } }
        async function loadTrust(uid) {
            const db = await commInit();
            let votes = [];
            if (db) {
                try { const snap = await db.collection('trust').doc(uid).collection('votes').limit(500).get(); votes = snap.docs.map(d => d.data()).filter(v => Number.isFinite(v.score)); } catch (e) { console.error(e); }
            } else {
                const l = trustLocal()[uid] || {};
                votes = Object.keys(l).map(k => (typeof l[k] === 'number') ? { score: l[k], kind: 'trade' } : l[k]).filter(v => v && Number.isFinite(v.score));
            }
            const by = {};
            votes.forEach(v => { const k = v.kind || 'trade'; (by[k] = by[k] || []).push(v.score); });
            const avg = a => a && a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
            let score = TRUST_BASE;
            votes.forEach(v => { const tbl = (v.kind === 'report') ? TRUST_DELTA.report : TRUST_DELTA.star; score += tbl[Math.round(v.score)] || 0; });
            score = Math.max(0, Math.min(100, score));
            const t = { score: score, count: votes.length, avg: avg(votes.map(v => v.score)), trade: { n: (by.trade || []).length, avg: avg(by.trade) }, manner: { n: (by.manner || []).length, avg: avg(by.manner) }, report: { n: (by.report || []).length, avg: avg(by.report) } };
            trustCache[uid] = t;
            return t;
        }
        function trustText(t) {
            if (!t || !t.count) return '신뢰 지수 50점 · 아직 평가 없음';
            if (t.count < TRUST_MIN_VOTES) return '신뢰 지수 ' + t.score + '점 · 평가 부족 (' + t.count + '건)';
            return '신뢰 지수 ' + t.score + '점 · ' + trustLevel(t.score)[1] + ' (' + t.count + '건 평가)';
        }
        // 프로필 카드에 들어가는 신뢰 지수 (점수 막대 + 마우스를 올리면 기준 설명)
        function trustHtml(t) {
            const score = t && t.count ? t.score : TRUST_BASE;
            const lv = t && t.count >= TRUST_MIN_VOTES ? trustLevel(score) : [0, '', 'text-slate-500'];
            const part = (label, p) => p && p.n ? `${label} ★${p.avg.toFixed(1)}(${p.n})` : `${label} -`;
            const detail = t && t.count ? `<div class="text-[0.625rem] font-medium text-slate-500 mt-0.5">${part('거래', t.trade)} · ${part('대화', t.manner)} · ${part('제보', t.report)}</div>` : '';
            const bar = `<div class="mx-auto mt-1 w-40 h-1.5 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div class="h-full rounded-full" style="width:${score}%; background:${score >= 65 ? '#10b981' : (score >= 45 ? '#94a3b8' : (score >= 30 ? '#f59e0b' : '#ef4444'))};"></div></div>`;
            return `<span class="tip ${lv[2]}" tabindex="0">${esc(trustText(t))} <i class="fa-regular fa-circle-question opacity-70"></i><span class="tip-box">${esc(TRUST_HELP)}</span></span>${bar}${detail}`;
        }
        async function saveTrustVote(targetUid, key, score, kind) {
            if (!targetUid || targetUid === COMM_UID) return;
            const id = COMM_UID + '_' + key;
            const db = await commInit();
            if (db) {
                const ref = db.collection('trust').doc(targetUid).collection('votes').doc(id);
                if (score == null) await ref.delete(); else await ref.set({ score: score, kind: kind, from: COMM_UID, ts: Date.now() });
            } else {
                const l = trustLocal(); l[targetUid] = l[targetUid] || {};
                if (score == null) delete l[targetUid][id]; else l[targetUid][id] = { score: score, kind: kind };
                lsSet('trust_local', JSON.stringify(l));
            }
            delete trustCache[targetUid];
        }
        async function rateTrade(itemId, targetUid, score) {
            if (targetUid === COMM_UID) return;

                await saveTrustVote(targetUid, itemId, score, 'trade');
                showAlertToast({ head: '거래 평가', title: '별점 ' + score + '점으로 평가했습니다. 상대 프로필의 신뢰 지수에 반영됩니다.' });
                const el = document.getElementById('rate_' + targetUid); if (el) el.innerHTML = starRow(itemId, targetUid, score);
            } catch (e) { console.error(e); }
        }
        // 대화 매너 평가 (프로필에서 별점)
        async function rateManner(targetUid, score) {
            if (targetUid === COMM_UID) return;
            try {
                await saveTrustVote(targetUid, 'manner', score, 'manner');
                const mine = JSON.parse(lsGet('manner_given') || '{}'); mine[targetUid] = score; lsSet('manner_given', JSON.stringify(mine));
                showAlertToast({ head: '대화 매너 평가', title: '별점 ' + score + '점으로 평가했습니다. 상대의 신뢰 지수에 반영됩니다.' });
                const el = document.getElementById('mannerStars'); if (el) el.innerHTML = mannerStars(targetUid);
                loadTrust(targetUid).then(tr => { const p = document.getElementById('pfTrust'); if (p && profileShown.uid === targetUid) p.innerHTML = trustHtml(tr); });
            } catch (e) { console.error(e); }
        }
        function mannerStars(uid) {
            let cur = 0; try { cur = (JSON.parse(lsGet('manner_given') || '{}'))[uid] || 0; } catch (e) {}
            return [1, 2, 3, 4, 5].map(n => `<button onclick="rateManner('${esc(uid)}', ${n})" title="${n}점" class="text-lg leading-none ${n <= cur ? 'text-amber-400' : 'text-slate-300 dark:text-slate-600'} hover:text-amber-400">★</button>`).join('');
        }
        function starRow(itemId, targetUid, current) {
            return [1, 2, 3, 4, 5].map(n => `<button onclick="rateTrade('${esc(itemId)}', '${esc(targetUid)}', ${n})" title="${n}점" class="text-xl leading-none ${n <= (current || 0) ? 'text-amber-400' : 'text-slate-300 dark:text-slate-600'} hover:text-amber-400">★</button>`).join('');
        }
        // 물건 상세 화면에 넣는 '거래 평가' 영역
        function tradeRatingHtml(it) {
            const mine = it.uid === COMM_UID;

                if (!rows) rows = '<div class="text-[0.6875rem] text-slate-400">문의한 이웃이 생기면 여기서 평가할 수 있습니다.</div>';
            }
            return `<div class="rounded-xl border border-slate-200 dark:border-slate-700 p-3 space-y-1.5"><div class="text-xs font-bold text-slate-700 dark:text-slate-200">🤝 거래 평가 <span class="font-normal text-slate-400">(거래를 마친 뒤 별점을 눌러 주세요. 프로필의 신뢰 지수에 반영됩니다)</span></div>${rows}</div>`;
        }

        // ---- 랜덤 채팅 / 랜덤 화상 채팅 ----
        let rnd = { state: 'idle', mode: 'text', room: null, peer: null, msgs: [], unsubs: [] };   // state: idle / waiting / chatting / ended
        let rndAdult = lsGet('rnd_adult') === '1';
        function rndStop() { rnd.unsubs.forEach(u => { try { u(); } catch (e) {} }); rnd.unsubs = []; }
        function rndListenRoom(db, roomId) {
            const ref = db.collection('randomRooms').doc(roomId);
            rnd.unsubs.push(ref.onSnapshot(snap => {
                const d = snap.data();
                if (!d) return;
                if (rnd.state === 'waiting' && d.b) {            // 내가 기다리던 방에 상대가 들어옴
                    rnd.state = 'chatting'; rnd.peer = d.b;
                    if (rnd.mode === 'video') autoAcceptFrom = d.b.uid;
                    renderRandom();
                }
                if (d.status === 'closed' && rnd.state === 'chatting') { rnd.state = 'ended'; if (call) endCall(); renderRandom(); }
            }));
            rnd.unsubs.push(ref.collection('messages').orderBy('ts', 'asc').limit(300).onSnapshot(snap => { rnd.msgs = snap.docs.map(x => x.data()); renderRandomChat(); }));
        }
        async function rndStart(mode) {
            const chk = document.getElementById('rndAdult');
            if (chk && chk.checked) { rndAdult = true; lsSet('rnd_adult', '1'); }
            if (!rndAdult) { showAlertToast({ head: '랜덤 채팅', title: '만 19세 이상 확인란에 체크해 주세요.' }); return; }
            const db = await commInit();
            if (!db) { needServer(mode === 'video' ? '랜덤 화상 채팅' : '랜덤 채팅'); return; }
            rndStop();
            rnd = { state: 'waiting', mode: mode, room: null, peer: null, msgs: [], unsubs: [] };
            renderRandom();
            const me = { uid: COMM_UID, nick: myNick(), emoji: commProfile.emoji || '🙂' };
            const lobby = db.collection('randomLobby').doc(mode);
            try {
                const res = await db.runTransaction(async tx => {
                    const snap = await tx.get(lobby);
                    const w = snap.exists ? snap.data().waiting : null;
                    if (w && w.uid !== COMM_UID && Date.now() - w.ts < 90000) { tx.set(lobby, { waiting: null }); return { join: w }; }
                    const room = db.collection('randomRooms').doc().id;
                    tx.set(lobby, { waiting: Object.assign({ room: room, ts: Date.now() }, me) });
                    return { wait: room };
                });
                if (res.join) {
                    if (isBlocked(res.join.uid)) { rnd.state = 'idle'; renderRandom(); showAlertToast({ head: '랜덤 채팅', title: '지금은 연결할 상대가 없습니다. 잠시 후 다시 시도해 주세요.' }); return; }
                    rnd.room = res.join.room; rnd.peer = { uid: res.join.uid, nick: res.join.nick, emoji: res.join.emoji }; rnd.state = 'chatting';
                    await db.collection('randomRooms').doc(rnd.room).set({ a: rnd.peer, b: me, status: 'open', mode: mode, ts: Date.now() });
                    rndListenRoom(db, rnd.room);
                    renderRandom();
                    if (mode === 'video') setTimeout(() => startCall(rnd.peer.uid, rnd.peer.nick, true), 1200);
                } else {
                    rnd.room = res.wait;
                    await db.collection('randomRooms').doc(rnd.room).set({ a: me, status: 'open', mode: mode, ts: Date.now() });
                    rndListenRoom(db, rnd.room);
                }
            } catch (e) { console.error(e); rnd.state = 'idle'; renderRandom(); showAlertToast({ head: '랜덤 채팅', title: '연결하지 못했습니다. 잠시 후 다시 시도해 주세요.' }); }
        }
        async function rndLeave() {
            const db = await commInit();
            const was = rnd;
            rndStop();
            if (call) endCall();
            autoAcceptFrom = null;
            if (db && was.room) {
                db.collection('randomRooms').doc(was.room).update({ status: 'closed' }).catch(() => {});
                if (was.state === 'waiting') {
                    const lobby = db.collection('randomLobby').doc(was.mode);
                    db.runTransaction(async tx => { const s = await tx.get(lobby); const w = s.exists ? s.data().waiting : null; if (w && w.uid === COMM_UID) tx.set(lobby, { waiting: null }); }).catch(() => {});
                }
            }
            rnd = { state: 'idle', mode: was.mode, room: null, peer: null, msgs: [], unsubs: [] };
            renderRandom();
        }
        async function rndSend() {

            if (!db) return;

        }
        function renderRandomChat() {

                : '<div class="text-center py-10 text-xs text-slate-400">연결되었습니다. 인사를 건네 보세요.</div>';

        function renderRandom() {

                        <span class="flex items-center gap-1.5 shrink-0">
                            ${rnd.state === 'chatting' && rnd.mode === 'video' ? `<button onclick="startCall('${esc(p.uid)}', rnd.peer.nick, true)" class="px-2.5 py-1 rounded-lg border border-slate-300 dark:border-slate-600 text-xs font-bold text-slate-700 dark:text-slate-200"><i class="fa-solid fa-video"></i> 영상 다시 걸기</button>` : ''}
                            <button onclick="rndStart(rnd.mode)" class="px-2.5 py-1 rounded-lg bg-violet-600 hover:bg-violet-500 text-white text-xs font-bold">다음 상대</button>
                            <button onclick="rndLeave()" class="px-2.5 py-1 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold">나가기</button>

                        <button onclick="rndSend()" class="px-4 py-2 rounded-lg text-sm font-bold text-white bg-violet-600 hover:bg-violet-500 whitespace-nowrap">보내기</button>

                    <p class="text-[0.6875rem] text-slate-400 max-w-sm leading-relaxed">불쾌한 상대는 바로 [나가기]를 누르세요. 개인정보·금전 요구에는 응하지 마세요. 화상 채팅은 카메라와 마이크 허용이 필요합니다.</p>

        function socialInit() {

        }

        // ---- 친구 (채팅 앱처럼: 친구 요청 → 수락하면 서로 친구, 친구 이름은 내가 보기 편한 이름으로 바꿀 수 있음) ----
        let friends = (() => { try { return JSON.parse(lsGet('friends') || '{}') || {}; } catch (e) { return {}; } })();   // { uid: { nick, emoji, photo, area, alias, ts } }
        let friendReqs = [];          // 나에게 온 친구 요청
        let friendSent = new Set((() => { try { return JSON.parse(lsGet('friend_sent') || '[]'); } catch (e) { return []; } })());
        let friendUnsubs = [], friendEditing = null, friendQuery = '';
        function isFriend(uid) { return !!uid && uid !== COMM_UID && Object.prototype.hasOwnProperty.call(friends, uid); }
        function friendAlias(uid) { return isFriend(uid) ? (friends[uid].alias || '') : ''; }
        function displayName(uid, nick) { if (uid === COMM_UID) return myNick(); return friendAlias(uid) || nick || '이웃'; }
        async function saveFriends() {
            lsSet('friends', JSON.stringify(friends));
            try { const db = await commInit(); if (db) await db.collection('friends').doc(COMM_UID).set({ list: friends, ts: Date.now() }); } catch (e) { console.error(e); }
        }
        async function subscribeFriends() {
            friendUnsubs.forEach(u => { try { u(); } catch (e) {} }); friendUnsubs = [];
            const db = await commInit();
            if (!db) return;
            try {   // 다른 기기에서 추가한 친구와 합침
                const d = await db.collection('friends').doc(COMM_UID).get();
                const list = d.exists ? (d.data().list || {}) : {};
                Object.keys(list).forEach(u => { if (!friends[u]) friends[u] = list[u]; });
                lsSet('friends', JSON.stringify(friends));
            } catch (e) { console.error(e); }
            let first = true;
            friendUnsubs.push(db.collection('friendReqs').doc(COMM_UID).collection('list').orderBy('ts', 'desc').limit(100).onSnapshot(snap => {
                const prev = new Set(friendReqs.map(r => r.uid));
                friendReqs = snap.docs.map(d => d.data()).filter(r => r.uid && !isFriend(r.uid) && !isBlocked(r.uid));
                if (!first) friendReqs.filter(r => !prev.has(r.uid)).forEach(r => showAlertToast({ head: '👥 친구 요청', title: (r.nick || '이웃') + '님이 친구 요청을 보냈습니다.', foot: '커뮤니티 > 친구 탭에서 수락할 수 있습니다', openCommunity: true }));
                first = false;
                if (commTab === 'friends') renderFriends();
                renderCommHead();
            }, err => console.error(err)));
            friendUnsubs.push(db.collection('friendAccepted').doc(COMM_UID).collection('list').onSnapshot(snap => {
                snap.docs.forEach(d => {
                    const r = d.data();
                    if (r.uid && !isFriend(r.uid)) {
                        friends[r.uid] = { nick: r.nick || '이웃', emoji: r.emoji || '🙂', photo: r.photo || '', area: r.area || '', alias: '', ts: Date.now() };
                        friendSent.delete(r.uid); lsSet('friend_sent', JSON.stringify(Array.from(friendSent)));
                        showAlertToast({ head: '👥 친구', title: (r.nick || '이웃') + '님이 친구 요청을 수락했습니다.' });
                        saveFriends();
                    }
                    d.ref.delete().catch(() => {});
                });
                if (commTab === 'friends') renderFriends();
            }, err => console.error(err)));
        }
        function friendInfo(uid) {
            if (profileShown.uid === uid) return { nick: profileShown.nick, emoji: profileShown.emoji, photo: profileShown.photo, area: profileShown.area };
            const m = commMembers.concat(commMessages, freeMessages).find(x => x.uid === uid) || dmThreads.find(x => x.uid === uid) || {};

        // ---- 동네 인증 ----
        function nearestSigungu(lat, lng, n) {
            const arr = [];
            Object.keys(SIGUNGU_CENTERS).forEach(k => {
                const i = k.indexOf(' ');
                const sido = k.slice(0, i), sigungu = k.slice(i + 1);
                if (!(regionHierarchy[sido] && regionHierarchy[sido][sigungu])) return;
                const c = SIGUNGU_CENTERS[k];
                const dy = (c[0] - lat) * 111, dx = (c[1] - lng) * 88;
                arr.push({ sido: sido, sigungu: sigungu, dist: Math.sqrt(dx * dx + dy * dy) });
            });
            return arr.sort((a, b) => a.dist - b.dist).slice(0, n);
        }

        // 주소 글자에서 시·도 / 시·군·구 / 동을 찾아냄
        function matchTownFromText(text) {
            const sidos = Object.keys(regionHierarchy);
            let sido = sidos.find(s => text.includes(s));
            if (!sido) sido = sidos.find(s => (SIDO_ALIASES[s] || []).some(a => text.includes(a)));
            if (!sido) return null;
            let sigungu = null;
            Object.keys(regionHierarchy[sido]).forEach(sg => {
                if (sg.split(' ').every(p => text.includes(p)) && (!sigungu || sg.length > sigungu.length)) sigungu = sg;
            });
            if (!sigungu) return { sido: sido };
            let dong = null;
            regionHierarchy[sido][sigungu].forEach(d => {
                if (d === '전체') return;
                if ((text.includes(d) || text.includes(communityDong(d))) && (!dong || d.length > dong.length)) dong = d;
            });
            return { sido: sido, sigungu: sigungu, dong: dong ? communityDong(dong) : null };
        }

        async function reverseGeocode(lat, lng) {
            const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
            const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, 7000);
            try {
                const res = await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=ko&lat=' + lat + '&lon=' + lng, ctrl ? { signal: ctrl.signal } : undefined);
                if (!res.ok) return null;
                const j = await res.json();
                const text = Object.values(j.address || {}).join(' ') + ' ' + (j.display_name || '');
                return matchTownFromText(text);
            } catch (e) { return null; } finally { clearTimeout(timer); }
        }

        function verifyTown() {
            if (!navigator.geolocation) { commStatus('이 기기(브라우저)는 위치 확인을 지원하지 않습니다.'); return; }
            commStatus('현재 위치를 확인하는 중입니다... (위치 권한을 허용해 주세요)');
            navigator.geolocation.getCurrentPosition(async pos => {
                const lat = pos.coords.latitude, lng = pos.coords.longitude;
                const near = nearestSigungu(lat, lng, 3);
                if (near.length === 0 || near[0].dist > 60) { commStatus('대한민국 안에서만 동네 인증을 할 수 있습니다.'); return; }
                commFound = await reverseGeocode(lat, lng);
                commCands = [];
                if (commFound && commFound.sigungu) commCands.push({ sido: commFound.sido, sigungu: commFound.sigungu });
                near.forEach(c => { if (!commCands.some(x => x.sido === c.sido && x.sigungu === c.sigungu)) commCands.push(c); });
                commStatus('');
                renderTownConfirm();
            }, err => {
                commStatus(err && err.code === 1 ? '위치 권한이 거부되었습니다. 브라우저 주소창의 자물쇠 아이콘에서 위치를 허용한 뒤 다시 눌러 주세요.' : '위치를 확인하지 못했습니다. 잠시 후 다시 시도해 주세요.');
            }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
        }

        function briefCenter() {

        function briefMatch(n, c) {

        const IMPACT_RE = /사망|숨져|숨진|숨졌|사상|중상|중태|의식\s*불명|심정지|부상|다쳐|다친|대피|실종|붕괴|폭발|전소|이재민|피해액|\d+\s*억|수백|수십\s*명|일가족|어린이|초등생|아동/;

            const attention = evs.slice().sort((a, b) => (b.items.length - a.items.length) || (b.lead.timestamp - a.lead.timestamp)).slice(0, 5);
            const impactful = evs.slice().map(ev => ({ ev: ev, s: impact(ev) })).sort((a, b) => b.s - a.s).filter(x => !attention.slice(0, 3).includes(x.ev)).slice(0, 3).map(x => x.ev);
            // 피싱·사기 수법은 지역과 관계없이 전국 기사로 집계 (수법은 어디서든 똑같이 쓰이므로)

        function briefSection(title, a, days) {

        // 정한 시간이 되면 브리핑을 자동으로 보여 줌 (30초마다 확인)

        // 글씨 크기: 1·2·3번 칸(과 창으로 뜨는 화면)만 커지고 작아집니다. 맨 위 제목 줄과 버튼 줄(.fixed-scale)은 항상 100%로 고정

        // 라이트/다크 모드: 마지막으로 고른 모드를 저장해서 새로고침하거나 다시 접속해도 그대로 유지 (처음 접속은 라이트 모드)
        function syncThemeUi() {
            const dark = document.documentElement.classList.contains('dark');
            const ic = document.getElementById('themeIcon'), tx = document.getElementById('themeText');
            if (ic) ic.className = dark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            if (tx) tx.textContent = dark ? '라이트모드' : '다크모드';
        }
        function toggleTheme() {
            const dark = document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
            syncThemeUi();
            if (mapStyle === 'auto') applyMapStyle();
            if (map) map.invalidateSize();
        }

        function openReportModal() { document.getElementById('reportModal').classList.remove('hidden'); }
        function closeReportModal() { document.getElementById('reportModal').classList.add('hidden'); }
        function submitReport() {
            const title = document.getElementById('reportTitle').value.trim();
            const sido = document.getElementById('reportSido').value;
            const loc = document.getElementById('reportLocationDetail').value.trim();
            const content = document.getElementById('reportContent').value.trim();
            if (!title || !loc) { alert('제목과 위치를 입력해주세요.'); return; }

            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const centers = { '서울특별시': [37.5665, 126.9780], '경기도': [37.4138, 127.5183], '충청남도': [36.5184, 126.8000], '부산광역시': [35.1796, 129.0756] };
            const c = centers[sido] || [36.35, 127.38];
            const newR = {
                id: Date.now(), category: '시민제보', group: '생활안전·소동', title: `[시민제보] ${title}`,
                summary: content || title, content: content || '제보 내용',
                location: `${sido} ${loc}`, lat: c[0] + (Math.random() - 0.5) * 0.05, lng: c[1] + (Math.random() - 0.5) * 0.05,
                time: `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} (${WD_KR[now.getDay()]}요일) ${pad(now.getHours())}:${pad(now.getMinutes())}`,
                source: '시민 직접 제보', timestamp: now.getTime() / 1000, link: ''
            };
            localReports.unshift(newR);
            newsData.unshift(newR);
            closeReportModal();
            selectedDate = dateKey(newR.timestamp);
            renderCategoryBar();
            selectNews(newR.id);
            updateMapMarkers();
            alert('제보가 등록되었습니다! (이 화면에서만 보이며, 새로고침하면 사라집니다)');
        }
    </script>
</body>
</html>
