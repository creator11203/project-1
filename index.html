        // 전국 위험 요약: 내 지역 보고와 별개로, 지금 전국에서 많이 일어나는 위험 3가지와 대비책을 한 줄씩만 보여 줌
        function briefNational() {
            const now = Date.now() / 1000;
            const calc = days => {
                const list = newsData.filter(n => n.timestamp >= now - days * 86400 && n.source !== '시스템' && !isOverseas(n) && !isCourt(n));
                const evs = groupEvents(list), by = {};
                evs.forEach(ev => groupsOf(ev.lead).forEach(g => { by[g] = (by[g] || 0) + 1; }));
                return { total: evs.length, by: by };
            };
            const d = calc(1), w = calc(7);
            const top = Object.keys(w.by).filter(g => BRIEF_TIPS[g] && CATEGORY_GROUPS[g]).sort((a, b) => w.by[b] - w.by[a]).slice(0, 3);
            return { today: d.total, week: w.total, top: top.map(g => ({ g: g, week: w.by[g], today: d.by[g] || 0, tip: (BRIEF_TIPS[g] || [])[0] || '' })) };
        }
        // 큰 꼭지 제목: 꼭지마다 색을 달리해 멀리서도 구분되게 (글씨 크고 굵게, 색 막대)
        function briefBanner(icon, text, sub, cls) {
            return `<div class="flex items-center justify-between gap-2 rounded-xl px-3 py-2.5 text-white shadow-md ${cls}"><span class="text-base font-black tracking-tight leading-none">${icon} ${text}</span>${sub ? `<span class="text-[0.625rem] font-bold opacity-90 whitespace-nowrap">${sub}</span>` : ''}</div>`;
        }
        function briefGroupName(g) { return CATEGORY_GROUPS[g] ? CATEGORY_GROUPS[g].label.replace(/^[^\s가-힣]+\s/, '') : g; }
        // 맨 위 요약 카드: 숫자 두 개와 '오늘 주의' 한 줄만
        function briefHero(c, d, w, now) {
            const p = n => String(n).padStart(2, '0');
            const num = (lbl, v, on) => `<div class="rounded-xl px-3 py-2 ${on ? 'bg-white text-indigo-700' : 'bg-white/15 text-white'}"><div class="text-[0.625rem] font-bold ${on ? 'text-indigo-500' : 'opacity-80'}">${lbl}</div><div class="text-3xl font-black leading-none mt-0.5">${v}<span class="text-sm font-bold ml-0.5">건</span></div></div>`;
            const hot = d.topGroups[0] ? `<div class="mt-2.5 flex flex-wrap items-center gap-1.5 text-xs font-extrabold"><span>⚡ 오늘 주의</span>${d.topGroups.slice(0, 2).map(x => `<span class="px-2.5 py-0.5 rounded-full bg-amber-300 text-slate-900">${esc(briefGroupName(x.g))} ${x.n}</span>`).join('')}</div>` : '';
            return `<div class="rounded-2xl bg-gradient-to-br from-indigo-700 via-violet-700 to-fuchsia-700 text-white p-3.5 shadow-lg">
                <div class="text-[0.6875rem] font-bold opacity-80">${now.getMonth() + 1}월 ${now.getDate()}일 ${p(now.getHours())}:${p(now.getMinutes())} · ${esc(briefLabelAll(c))}</div>
                <div class="mt-2 grid grid-cols-2 gap-2">${num('오늘', d.total, true)}${num('최근 7일', w.total, false)}</div>${hot}</div>`;
        }
        // 전국 위험 TOP3: 분류 이름 + 건수만
        function briefNationalHtml() {
            if (briefHas('all')) return '';          // 보고 범위가 이미 전국이면 같은 내용이 되풀이되므로 생략
            const a = briefNational();
            if (!a.top.length) return '';
            return `<section class="space-y-1.5">${briefBanner('🇰🇷', '전국 위험 TOP3', '오늘 ' + a.today + ' · 주간 ' + a.week, 'bg-gradient-to-r from-sky-600 to-blue-700')}
                <ol class="grid grid-cols-3 gap-1.5">${a.top.map((x, i) => `<li class="rounded-xl border border-sky-200 dark:border-sky-900 bg-sky-50 dark:bg-sky-950/30 px-2 py-2 text-center">
                    <div class="text-[0.625rem] font-black text-sky-600 dark:text-sky-300">${i + 1}위</div>
                    <div class="text-xs font-extrabold text-slate-900 dark:text-white leading-tight">${esc(briefGroupName(x.g))}</div>
                    <div class="text-[0.6875rem] font-bold text-slate-500 dark:text-slate-400">${x.week}건</div></li>`).join('')}</ol></section>`;
        }
        function briefSection(a, days) {
            const evRow = (ev, i, badge) => {
                const n = ev.lead, k = ev.items.length;
                return `<li class="flex gap-2.5 items-start rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-2.5">
                    <span class="shrink-0 w-6 h-6 rounded-lg ${badge} text-white text-xs font-black inline-flex items-center justify-center">${i + 1}</span>
                    <div class="min-w-0 flex-1">
                        <button onclick="closeSheet(); openHeadline(${n.id})" class="block w-full text-left text-[0.8125rem] font-extrabold text-slate-900 dark:text-white hover:text-indigo-600 leading-snug" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;">${esc(n.title)}</button>
                        <div class="mt-1 flex flex-wrap items-center gap-1 text-[0.625rem] text-slate-500 dark:text-slate-400">${tagBadges(n)}<span>${esc(shortTime(n))} · ${esc((n.location || '').replace('대한민국 (세부 위치 미상)', '위치 미상'))}</span>${k > 1 ? `<span class="px-1.5 rounded-full bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300 font-black">기사 ${k}</span>` : ''}</div>
                    </div></li>`;
            };
            const scope = esc(briefLabelAll(a.c));
            if (!a.total) return `<div class="rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-700 p-4 text-center text-sm font-extrabold text-slate-500">${scope} · 보도된 사건 없음<div class="text-xs font-normal mt-0.5">⚙ 설정에서 범위를 넓혀 보세요</div></div>`;
            const tips = a.topGroups.slice(0, 3).map(x => { const t = (BRIEF_TIPS[x.g] || [])[0]; return t ? `<li class="flex gap-1.5"><b class="shrink-0 text-emerald-700 dark:text-emerald-300">${esc(briefGroupName(x.g))}</b><span>${esc(t)}</span></li>` : ''; }).join('');
            return `<div class="space-y-4">
                <section class="space-y-1.5">${briefBanner('🔥', '가장 주목받은 사건', scope + ' · 보도 많은 순', 'bg-gradient-to-r from-orange-500 to-red-600')}
                    <ol class="space-y-1.5">${a.attention.slice(0, days === 1 ? 3 : 5).map((ev, i) => evRow(ev, i, 'bg-red-600')).join('')}</ol></section>
                ${a.impactful.length ? `<section class="space-y-1.5">${briefBanner('⚠️', '파장 큰 사건', '인명·재산 피해', 'bg-gradient-to-r from-rose-700 to-slate-800')}
                    <ol class="space-y-1.5">${a.impactful.map((ev, i) => evRow(ev, i, 'bg-rose-800')).join('')}</ol></section>` : ''}
                ${tips ? `<section class="space-y-1.5">${briefBanner('🛡', '이렇게 예방하세요', '', 'bg-gradient-to-r from-emerald-600 to-teal-600')}
                    <ul class="rounded-xl border border-emerald-200 dark:border-emerald-900 bg-emerald-50 dark:bg-emerald-950/30 p-2.5 text-xs text-slate-700 dark:text-slate-200 space-y-1 leading-snug">${tips}</ul></section>` : ''}
                ${a.scams.length ? `<section class="space-y-1.5">${briefBanner('📵', '유행 사기 수법', '전국 보도 기준', 'bg-gradient-to-r from-amber-500 to-orange-600')}
                    <div class="flex flex-wrap gap-1.5">${a.scams.map(s => `<span class="px-2.5 py-1 rounded-full border border-amber-300 dark:border-amber-700 bg-amber-50 dark:bg-amber-950/30 text-xs font-extrabold text-amber-900 dark:text-amber-200">${esc(s.name.replace(/\s*\(.*\)/, ''))} <span class="font-black text-red-600">${s.n}</span></span>`).join('')}</div></section>` : ''}
            </div>`;
        }
        // 안전 브리핑: [화면 설정]에서 칸에 넣었으면 그 칸에 그리고, 아니면 창(sheet)으로 띄움
        function openBriefing(tab, quiet) {
            if (tab) briefTab = tab;
            const docked = isDocked('briefing');
            if (!quiet || !docked) { const dot = document.getElementById('briefDot'); if (dot) dot.classList.add('hidden'); }
            const c = briefCenter();
            const now = new Date(), p = n => String(n).padStart(2, '0');
            const tabBtn = (k, label) => `<button onclick="openBriefing('${k}')" class="px-3 py-1.5 rounded-full text-xs font-bold ${briefTab === k ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">${label}</button>`;
            let body = '';
            if (briefTab === 'settings') {
                const inp = 'bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-2 py-1.5 text-sm text-slate-900 dark:text-white';
                body = `<div class="space-y-4 text-sm text-slate-700 dark:text-slate-200">
                    <div><div class="font-bold mb-1">⏰ 보고 받을 시간 <span class="text-xs font-normal text-slate-400">(최대 4개)</span></div>
                        <div class="flex flex-wrap items-center gap-2">${briefCfg.times.map((t, i) => `<span class="flex items-center gap-1"><input type="time" value="${esc(t)}" onchange="briefCfg.times[${i}] = this.value; saveBriefCfg()" class="${inp}"><button onclick="briefCfg.times.splice(${i}, 1); saveBriefCfg(); openBriefing('settings')" class="text-red-500 text-xs">삭제</button></span>`).join('')}
                        ${briefCfg.times.length < 4 ? `<button onclick="briefCfg.times.push('18:00'); saveBriefCfg(); openBriefing('settings')" class="px-2 py-1 rounded-lg border border-indigo-400 text-indigo-600 text-xs font-bold">+ 시간 추가</button>` : ''}</div>
                        <p class="text-[0.6875rem] text-slate-400 mt-1">정한 시간이 되면 화면에 브리핑이 자동으로 열리고 알림이 갑니다. (이 웹사이트를 열어 둔 상태에서 동작합니다. 휴대폰 앱으로 설치하면 더 편리합니다)</p></div>
                    <div><div class="font-bold mb-1">📍 보고 범위 <span class="text-xs font-normal text-slate-400">(여러 개 함께 고를 수 있어요)</span></div>
                        <div class="flex flex-wrap gap-1.5">${BRIEF_SCOPES.map(s => `<button onclick="briefToggleScope('${s[0]}')" class="px-2.5 py-1 rounded-full text-xs font-bold border ${briefHas(s[0]) ? 'bg-indigo-600 text-white border-indigo-600' : 'border-slate-300 dark:border-slate-600'}">${briefHas(s[0]) ? '✓ ' : ''}${s[1]}</button>`).join('')}</div>
                        <div class="mt-3 font-bold mb-1">🗺 다른 지역도 직접 추가 <span class="text-xs font-normal text-slate-400">(시·도 → 시·군·구 → 읍·면·동 까지, 원하는 만큼)</span></div>
                        <div class="flex flex-wrap items-center gap-1.5">
                            <select id="briefSido" onchange="briefPick.sido = this.value; briefPick.sgg = ''; openBriefing('settings')" class="${inp}"><option value="">시·도 선택</option>${Object.keys(briefAreaMap()).sort(briefKo).map(s => `<option value="${esc(s)}" ${briefPick.sido === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
                            <select id="briefSgg" onchange="briefPick.sgg = this.value; openBriefing('settings')" class="${inp}"><option value="">${briefPick.sido ? '시·도 전체' : '—'}</option>${(briefAreaMap()[briefPick.sido] || []).slice().sort(briefKo).map(s => `<option value="${esc(s)}" ${briefPick.sgg === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
                            <select id="briefDong" class="${inp}"><option value="">${briefPick.sgg ? '시·군·구 전체' : '—'}</option>${(briefPick.sgg ? (() => { try { return (townDongs(briefPick.sido, briefPick.sgg) || []).slice().sort(briefKo); } catch (e) { return []; } })() : []).map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select>
                            <button onclick="briefAddArea()" class="px-2.5 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold">+ 추가</button></div>
                        ${briefCfg.areas.length ? `<div class="mt-2 flex flex-wrap gap-1.5">${briefCfg.areas.map((a, i) => `<span class="inline-flex items-center gap-1 pl-2.5 pr-1.5 py-1 rounded-full bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-300 dark:border-indigo-700 text-xs font-bold text-indigo-800 dark:text-indigo-200">${esc(a.replace('|', ' '))}<button onclick="briefRemoveArea(${i})" aria-label="삭제" class="text-red-500 text-sm leading-none px-1">×</button></span>`).join('')}</div>` : ''}
                        ${briefHas('near') ?`<div class="mt-2 flex items-center gap-2 text-xs">반경 <input type="range" min="3" max="50" step="1" value="${briefCfg.radius}" oninput="briefCfg.radius = Number(this.value); this.nextElementSibling.textContent = this.value + 'km'" onchange="saveBriefCfg()"><b>${briefCfg.radius}km</b></div>` : ''}
                        <p class="text-[0.6875rem] text-slate-400 mt-1">기준 지역: <b>${esc(c ? c.label : '아직 없음')}</b> — 커뮤니티 동네 인증, 맨 위 🔔 알림 설정의 지역, 또는 현재 위치 알림을 켜면 정해집니다.</p></div>
                    <label class="flex items-center gap-2"><input type="checkbox" ${briefCfg.autoOpen ? 'checked' : ''} onchange="briefCfg.autoOpen = this.checked; saveBriefCfg()"> 정한 시간에 브리핑 창 자동으로 열기</label>
                    <label class="flex items-center gap-2"><input type="checkbox" ${briefCfg.notify ? 'checked' : ''} onchange="briefCfg.notify = this.checked; saveBriefCfg(); if (this.checked && window.Notification && Notification.permission === 'default') Notification.requestPermission()"> 브라우저 알림으로도 받기</label>
                    <button onclick="openBriefing('report')" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold">저장하고 보고서 보기</button>
                </div>`;
            } else {
                const wk = briefTab === 'week';
                const d = briefAnalyze(1), w = briefAnalyze(7);
                body = `<div class="space-y-3">
                    ${briefHero(c, d, w, now)}
                    ${briefNationalHtml()}
                    ${briefSection(wk ? w : d, wk ? 7 : 1)}
                    <p class="text-[0.625rem] text-slate-400">언론 보도를 자동 요약한 참고용입니다. 제목을 누르면 원문으로 이동합니다.</p>
                </div>`;
            }
            const sub = `보고 시간 ${briefCfg.times.join(', ') || '없음'} · 범위: ${esc(briefLabelAll(c))}`;
            if (docked) {
                const pb = document.getElementById('briefPanelBody'), ps = document.getElementById('briefPanelSub');
                if (ps) ps.innerHTML = sub + ' · ' + p(now.getHours()) + ':' + p(now.getMinutes()) + ' 기준';
                if (pb) {
                    const keep = pb.querySelector('.brief-scroll'), top = keep ? keep.scrollTop : 0;
                    pb.innerHTML = `<div class="px-3 pt-2 flex flex-wrap gap-1.5 shrink-0">${tabBtn('report', '📅 오늘')}${tabBtn('week', '🗓 이번 주')}${tabBtn('settings', '⚙ 설정')}</div>
                        <div class="brief-scroll flex-1 min-h-0 overflow-y-auto custom-scrollbar p-3">${body}</div>`;
                    if (quiet) { const s2 = pb.querySelector('.brief-scroll'); if (s2) s2.scrollTop = top; }
                }
                if (!quiet) { const el = panelEl('briefing'); el.classList.remove('panel-flash'); void el.offsetWidth; el.classList.add('panel-flash'); }
                return;
            }
            openSheet(sheetHead('📋', '오늘의 안전 브리핑', sub) + `
                <div class="px-5 pt-3 flex flex-wrap gap-1.5 shrink-0">${tabBtn('report', '📅 오늘')}${tabBtn('week', '🗓 이번 주')}${tabBtn('settings', '⚙ 설정')}</div>
                <div class="flex-1 min-h-0 overflow-y-auto custom-scrollbar p-5">${body}</div>`);
        }
        // 정한 시간이 되면 브리핑을 자동으로 보여 줌 (30초마다 확인)
        function initBriefing() { setInterval(briefTick, 30000); setTimeout(briefTick, 5000); }
        function briefTick() {
            const now = new Date(), p = n => String(n).padStart(2, '0');
            const hm = p(now.getHours()) + ':' + p(now.getMinutes());
            const day = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
            const due = (briefCfg.times || []).filter(t => t && t <= hm).sort().pop();
            if (!due) return;
            const key = day + ' ' + due;
            if (briefCfg.lastShown === key) return;
            const [hh, mm] = due.split(':').map(Number);
            if ((now.getHours() * 60 + now.getMinutes()) - (hh * 60 + mm) > 90) { briefCfg.lastShown = key; saveBriefCfg(); return; }   // 90분 넘게 지난 예약은 건너뜀
            briefCfg.lastShown = key; saveBriefCfg();
            const d = briefAnalyze(1);
            const dot = document.getElementById('briefDot'); if (dot) dot.classList.remove('hidden');
            if (alertCfg.briefAlert !== false) showAlertToast({ head: '📋 ' + due + ' 안전 브리핑', title: '오늘 ' + (d.c ? d.c.label : '전국') + ' 사건사고 ' + d.total + '건. 누르면 보고서를 엽니다.', briefing: true });
            if (briefCfg.notify && window.Notification && Notification.permission === 'granted') {
                try { new Notification('우리동네 안전 브리핑 (' + due + ')', { body: '오늘 ' + (d.c ? d.c.label : '전국') + ' 사건사고 ' + d.total + '건' + (d.attention[0] ? ' · ' + d.attention[0].lead.title : '') }); } catch (e) {}
            }
            if (isDocked('briefing')) openBriefing('report');
            else if (briefCfg.autoOpen && document.getElementById('sheetModal').classList.contains('hidden')) openBriefing('report');
        }

        function manualRefreshData() {
            const ri = document.getElementById('refreshIcon');
            if (ri) { ri.classList.add('fast'); setTimeout(() => ri.classList.remove('fast'), 1500); }
            currentCategory = 'all'; 
            currentSub = null;
            selectedDate = null;
            renderLimit = 100;
            selectedHotspotRegion = null;
            document.getElementById('sidoSelect').value = 'all';
            onSidoChange();
            loadIncidentsFromJSON(true);
        }

        // 글씨 크기: 1·2·3번 칸(과 창으로 뜨는 화면)만 커지고 작아집니다. 맨 위 제목 줄과 버튼 줄(.fixed-scale)은 항상 100%로 고정
        function applyFontSize() {
            document.documentElement.style.fontSize = currentFontSizePx + 'px';
            document.documentElement.style.setProperty('--fixed-zoom', String(16 / currentFontSizePx));   // 제목 줄은 반대로 되돌려 100% 유지
            const ind = document.getElementById('fontSizeIndicator');
            if (ind) ind.textContent = Math.round((currentFontSizePx / 16) * 100) + '%';
        }
        function initFontSize() {
            try { const f = Number(localStorage.getItem('font_px')); if (f >= 12 && f <= 24) currentFontSizePx = f; } catch (e) {}
            applyFontSize();
        }
        function adjustFontSize(direction) {
            currentFontSizePx += direction * 2;
            if (currentFontSizePx < 12) currentFontSizePx = 12;
            if (currentFontSizePx > 24) currentFontSizePx = 24;
            applyFontSize();
            try { localStorage.setItem('font_px', String(currentFontSizePx)); } catch (e) {}
            fitArticleFrame();   // 기사 원문도 같은 비율로 확대/축소
            setTimeout(() => { if (map) map.invalidateSize(); }, 50);
        }

        // 라이트/다크 모드: 마지막으로 고른 모드를 저장해서 새로고침하거나 다시 접속해도 그대로 유지 (처음 접속은 라이트 모드)
        function syncThemeUi() {
            const dark = document.documentElement.classList.contains('dark');
            const ic = document.getElementById('themeIcon'), btn = document.getElementById('themeBtn');
            if (ic) ic.className = (dark ? 'fa-solid fa-sun' : 'fa-solid fa-moon') + ' text-[0.9rem]';   // 다크일 때 해(→ 라이트로), 라이트일 때 달(→ 다크로)
            if (btn) { const lb = dark ? '라이트 모드로 바꾸기' : '다크 모드로 바꾸기'; btn.title = lb; btn.setAttribute('aria-label', lb); }
        }
        function toggleTheme() {
            const dark = document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
            syncThemeUi();
            if (mapStyle === 'auto') applyMapStyle();
            if (map) map.invalidateSize();
        }

        function openReportModal() { document.getElementById('reportModal').classList.remove('hidden'); }
        function closeReportModal() { document.getElementById('reportModal').classList.add('hidden'); }
        function submitReport() {
            const title = document.getElementById('reportTitle').value.trim();
            const sido = document.getElementById('reportSido').value;
            const loc = document.getElementById('reportLocationDetail').value.trim();
            const content = document.getElementById('reportContent').value.trim();
            if (!title || !loc) { alert('제목과 위치를 입력해주세요.'); return; }

            } else if (r) {
                Object.assign(spot.style, { display: 'block', left: (r.left - pad) + 'px', top: (r.top - pad) + 'px', width: (r.width + pad * 2) + 'px', height: (r.height + pad * 2) + 'px' });
                spot.classList.remove('flat', 'pill');
                dim.style.display = 'block';
                root.classList.remove('tour-plain');
            } else { spot.style.display = 'none'; dim.style.display = 'none'; root.classList.add('tour-plain'); }
        }
        function tourGo(k) { if (k < 0 || k >= TOUR_STEPS.length) return; tourState.i = k; tourRender(); }
        function tourClose() {
            const root = document.getElementById('tourRoot'); if (root) root.remove();
            tourCloseComm();
            tourState.open = false; document.body.classList.remove('tour-on'); document.removeEventListener('keydown', tourKey); window.removeEventListener('resize', tourRender);
        }
        function tourHide(mode) {
            if (mode === 'never') lsSet('tour_never', '1');
            else lsSet('tour_until', String(Date.now() + 24 * 3600000));
            tourClose();
            try { showAlertToast({ head: '👋 사용 안내', title: mode === 'never' ? '앞으로 자동으로 열지 않아요. 상단 [사용 안내]로 다시 볼 수 있어요.' : '오늘은 다시 열지 않아요. 상단 [사용 안내]로 다시 볼 수 있어요.' }); } catch (e) {}
        }
        function tourKey(e) {
            if (e.key === 'Escape') tourClose();
            else if (e.key === 'ArrowRight') tourGo(tourState.i + 1);
            else if (e.key === 'ArrowLeft') tourGo(tourState.i - 1);
        }
        function openTour(start) {
            if (tourState.open) return;
            try { helpHintDone(); } catch (e) {}
            if (!document.getElementById('tourCss')) {
                const st = document.createElement('style'); st.id = 'tourCss';
                st.textContent = `
                #tourRoot { position: fixed; inset: 0; z-index: 3000; }
                #tourRoot.tour-plain { background: rgba(2,6,23,.62); backdrop-filter: blur(2px); }
                #tourDim { position: fixed; inset: 0; background: transparent; }
                #tourSpot { position: fixed; border-radius: 12px; box-shadow: 0 0 0 3px #818cf8, 0 0 22px 4px rgba(129,140,248,.7), 0 0 0 100vmax rgba(2,6,23,.62); pointer-events: none; animation: tourPulse 1.6s ease-in-out infinite; }
                #tourSpot.flat { border-radius: 0; box-shadow: 0 0 0 100vmax rgba(2,6,23,.62); animation: none; }
                #tourSpot.pill { border-radius: 999px; }
                .tour-arrow.hi { gap: 0; } .tour-stem { display: block; width: 3px; height: 30px; margin: 2px 0 -4px; border-radius: 2px; background: #fff; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
                .tour-arrow { position: fixed; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; animation: tourBob 1s ease-in-out infinite; }
                .tour-arrow span { background: #4f46e5; color: #fff; font-size: .75rem; font-weight: 800; padding: .3rem .55rem; border-radius: 999px; white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
                .tour-arrow i { color: #fff; font-size: 1.4rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
                @keyframes tourBob { 50% { transform: translateX(-50%) translateY(-6px); } }
                @keyframes tourPulse { 50% { box-shadow: 0 0 0 5px #a5b4fc, 0 0 30px 8px rgba(165,180,252,.75), 0 0 0 100vmax rgba(2,6,23,.62); } }
                #tourCard { position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%); width: min(28rem, calc(100vw - 2rem)); max-height: calc(100vh - 2.5rem); overflow-y: auto;
                    padding-top: 1.1rem; background: #fff; color: #0f172a; border-radius: 20px; padding: 1.4rem 1.25rem 1rem; box-shadow: 0 24px 60px -12px rgba(0,0,0,.55); text-align: center; user-select: none; }
                .tour-list { list-style: none; padding: 0; margin: .6rem 0 0; text-align: left; font-size: .8125rem; line-height: 1.5; color: #334155; display: flex; flex-direction: column; gap: .3rem; word-break: keep-all; }
                .tour-list li { background: #f1f5f9; border-radius: 10px; padding: .4rem .65rem; } .dark .tour-list { color: #e2e8f0; } .dark .tour-list li { background: #1e293b; }
                .dark #tourCard { background: #0f172a; color: #f1f5f9; border: 1px solid #334155; }
                .tour-x { position: absolute; top: .6rem; right: .6rem; width: 2rem; height: 2rem; border-radius: 999px; background: #f1f5f9; color: #475569; font-size: .9rem; } .tour-x:hover { background: #e2e8f0; }
                .dark .tour-x { background: #1e293b; color: #cbd5e1; }
                .tour-icon { font-size: 2.4rem; line-height: 1; } .tour-step { margin-top: .5rem; font-size: .6875rem; font-weight: 800; color: #6366f1; letter-spacing: .04em; }
                .tour-title { font-size: 1.15rem; font-weight: 900; letter-spacing: -.02em; margin-top: .15rem; } .tour-text { font-size: .875rem; line-height: 1.6; color: #475569; margin-top: .5rem; word-break: keep-all; }
                .dark .tour-text { color: #cbd5e1; }
                .tour-dots { display: flex; justify-content: center; gap: .35rem; margin: .9rem 0 .8rem; } .tour-dots button { width: .5rem; height: .5rem; border-radius: 999px; background: #cbd5e1; transition: all .2s; } .tour-dots button.on { width: 1.4rem; background: #4f46e5; }
                .tour-nav { display: flex; gap: .5rem; } .tour-btn { flex: 1; padding: .65rem .8rem; border-radius: 12px; font-size: .875rem; font-weight: 800; }
                .tour-prev { background: #f1f5f9; color: #475569; } .tour-prev:disabled { opacity: .4; cursor: default; } .dark .tour-prev { background: #1e293b; color: #cbd5e1; }
                .tour-next { flex: 2; background: linear-gradient(90deg, #4f46e5, #7c3aed); color: #fff; box-shadow: 0 8px 18px -8px rgba(79,70,229,.8); } .tour-next:hover { filter: brightness(1.1); }
                .tour-foot { margin-top: .75rem; padding-top: .6rem; border-top: 1px solid #e2e8f0; display: flex; justify-content: center; align-items: center; gap: .5rem; font-size: .6875rem; color: #94a3b8; }
                .dark .tour-foot { border-color: #334155; } .tour-foot button { color: #64748b; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; } .tour-foot button:hover { color: #0f172a; } .dark .tour-foot button:hover { color: #fff; }
                @media (max-width: 767px), (max-height: 480px) and (pointer: coarse) {
                    #tourCard { width: calc(100vw - 1rem); max-height: 60vh; padding: .8rem .9rem .6rem; border-radius: 16px; }
                    .tour-list { gap: .2rem; margin-top: .4rem; } .tour-list li { padding: .3rem .55rem; line-height: 1.4; }
                    .tour-step { margin-top: .25rem; } .tour-foot { font-size: .625rem; }
                    .tour-icon { font-size: 1.6rem; } .tour-title { font-size: 1rem; } .tour-text { font-size: .8125rem; margin-top: .3rem; line-height: 1.5; }
                    .tour-dots { display: none; } .tour-nav { margin-top: .7rem; } .tour-btn { padding: .6rem; } .tour-foot { margin-top: .55rem; padding-top: .45rem; }
                    .tour-list { font-size: .75rem; } .tour-x { width: 2.2rem; height: 2.2rem; }
                    /* 커뮤니티 설명 단계: 카드를 작게 줄여 뒤의 게시물이 잘 보이게 (아이콘·쪽수 줄·아래 링크는 숨김, 자세한 내용은 접어 둠) */
                    #tourCard.tour-compact { max-height: 38vh; padding: .5rem .75rem .45rem; border-radius: 14px; }
                    #tourCard.tour-compact .tour-icon, #tourCard.tour-compact .tour-foot { display: none; }
                    #tourCard.tour-compact .tour-step { display: inline-block; margin: 0 .35rem 0 0; }
                    #tourCard.tour-compact .tour-title { display: inline; font-size: .95rem; margin: 0; padding-right: 2rem; }
                    #tourCard.tour-compact .tour-text { margin-top: .25rem; font-size: .78rem; line-height: 1.4; }
                    #tourCard.tour-compact .tour-nav { margin-top: .45rem; } #tourCard.tour-compact .tour-btn { padding: .5rem; }
                    #tourCard.tour-compact .tour-x { top: .35rem; right: .4rem; width: 1.9rem; height: 1.9rem; }
                    .tour-more { margin-top: .3rem; text-align: left; } .tour-more summary { cursor: pointer; font-size: .72rem; font-weight: 800; color: #4f46e5; list-style: none; text-align: center; } .dark .tour-more summary { color: #a5b4fc; }
                    .tour-more[open] summary { margin-bottom: .3rem; }
                }
                /* 안내 중에는 커뮤니티 창이 아래에서 올라오는 움직임을 없앰 — 비추는 테두리가 움직이는 창을 따라 흔들려 보이던 문제 */
                body.tour-on #floatModal:not(.hidden) #floatBox { animation: none !important; }`;
                document.head.appendChild(st);
            }
            const root = document.createElement('div'); root.id = 'tourRoot'; root.setAttribute('role', 'dialog'); root.setAttribute('aria-modal', 'true'); root.setAttribute('aria-label', '사용 안내');
            root.innerHTML = '<div id="tourDim"></div><div id="tourSpot"></div><div id="tourCard"></div>';
            document.body.appendChild(root);
            TOUR_STEPS = tourBuildSteps();
            tourState.open = true; tourState.i = start || 0;
            document.body.classList.add('tour-on');
            document.addEventListener('keydown', tourKey); window.addEventListener('resize', tourRender);
            tourRender();
        }
        // 첫 방문 때 사용 안내를 자동으로 띄우지 않음 (처음 보는 사람도 바로 사건 목록·지도를 볼 수 있게). 상단 [사용 안내] 버튼을 눌렀을 때만 열림
        // 대신 처음 온 사람에게는 [사용 안내] 버튼만 살짝 빛나게 하고 작은 말풍선 한 줄만 띄움 (화면을 가리지 않음 · 누르거나 ✕ 하거나 12초 지나면 사라지고, 다시 뜨지 않음)
        function helpHintDone() {
            lsSet('help_hint_seen', '1');
            const b = document.getElementById('helpHint'); if (b) b.remove();
            document.querySelectorAll('.tool-help.hint-glow').forEach(e => e.classList.remove('hint-glow'));
            window.removeEventListener('resize', helpHintPlace);
        }
        function helpHintPlace() {
            const b = document.getElementById('helpHint'); if (!b) return;
            const btn = Array.from(document.querySelectorAll('.tool-help')).find(e => { const r = e.getBoundingClientRect(); return r.width > 4 && r.height > 4; });
            if (!btn) { b.style.display = 'none'; return; }
            const r = btn.getBoundingClientRect();
            b.style.display = '';
            const w = b.offsetWidth || 200;
            const cx = r.left + r.width / 2;
            const left = Math.max(8, Math.min(innerWidth - w - 8, cx - w / 2));
            b.style.left = left + 'px'; b.style.top = (r.bottom + 10) + 'px';
            b.style.setProperty('--arrow-x', Math.max(14, Math.min(w - 14, cx - left)) + 'px');
        }
        function helpHintShow() {
            if (lsGet('help_hint_seen') === '1' || document.getElementById('helpHint') || tourSkipped() && lsGet('tour_never') === '1') return;
            const btn = Array.from(document.querySelectorAll('.tool-help')).find(e => { const r = e.getBoundingClientRect(); return r.width > 4 && r.height > 4; });
            if (!btn) return;
            if (!document.getElementById('helpHintCss')) {
                const st = document.createElement('style'); st.id = 'helpHintCss';
                st.textContent = `
                    .tool-help.hint-glow { position: relative; background: #0284c7; color: #fff !important; animation: hintPulse 1.6s ease-out infinite; }
                    @keyframes hintPulse { 0% { box-shadow: 0 0 0 0 rgba(2,132,199,.55); } 70% { box-shadow: 0 0 0 10px rgba(2,132,199,0); } 100% { box-shadow: 0 0 0 0 rgba(2,132,199,0); } }
                    #helpHint { position: fixed; z-index: 1002; max-width: min(15rem, calc(100vw - 16px)); display: flex; align-items: center; gap: .4rem; padding: .4rem .45rem .4rem .7rem; border-radius: .75rem;
                        background: #0f172a; color: #fff; font-size: .75rem; font-weight: 700; line-height: 1.3; box-shadow: 0 8px 24px -8px rgba(15,23,42,.5); animation: pop-in .25s ease both; }
                    #helpHint::before { content: ''; position: absolute; top: -5px; left: var(--arrow-x, 20px); margin-left: -5px; width: 10px; height: 10px; background: #0f172a; transform: rotate(45deg); }
                    #helpHint button.hh-go { text-align: left; color: inherit; font: inherit; }
                    #helpHint button.hh-x { flex: none; width: 1.4rem; height: 1.4rem; border-radius: 9999px; color: #94a3b8; }
                    #helpHint button.hh-x:hover { background: rgba(255,255,255,.12); color: #fff; }
                    @media (prefers-reduced-motion: reduce) { .tool-help.hint-glow, #helpHint { animation: none; } }`;
                document.head.appendChild(st);
            }
            btn.classList.add('hint-glow');
            const b = document.createElement('div'); b.id = 'helpHint'; b.setAttribute('role', 'status');
            b.innerHTML = '<button type="button" class="hh-go" onclick="openTour(0)">처음 오셨나요? <u>사용 안내</u>를 눌러 보세요</button><button type="button" class="hh-x" aria-label="닫기" onclick="helpHintDone()"><i class="fa-solid fa-xmark"></i></button>';
            document.body.appendChild(b);
            helpHintPlace();
            window.addEventListener('resize', helpHintPlace);
            setTimeout(helpHintPlace, 400);
            setTimeout(() => { if (document.getElementById('helpHint')) helpHintDone(); }, 12000);
        }
        window.addEventListener('load', () => setTimeout(helpHintShow, 1500));

        // 맨 위 제목 줄(속보 바 포함)의 아래쪽 위치를 재서, 가운데 창(커뮤니티 등)이 제목 줄·속보 바 밑에서 시작하게 함
        // (창이 화면 맨 위부터 꽉 차 있어서 윗부분이 제목 줄과 겹치던 문제)
        function syncHeaderH() {
            const h = document.getElementById('appHeader');
            if (!h) return;
            document.documentElement.style.setProperty('--hdr-h', Math.max(0, Math.round(h.getBoundingClientRect().bottom)) + 'px');
            if (typeof tourState !== 'undefined' && tourState.open) setTimeout(tourPlace, 50);     // 제목 줄이 숨거나 나타나서 자리가 밀리면 안내 테두리도 다시 맞춤
        }
        window.addEventListener('resize', syncHeaderH);
        window.addEventListener('load', () => { syncHeaderH(); setTimeout(syncHeaderH, 400); });
        try { const _h = document.getElementById('appHeader'); if (_h && window.ResizeObserver) new ResizeObserver(syncHeaderH).observe(_h); } catch (e) {}
        syncHeaderH();
    </script>
</body>
</html>
