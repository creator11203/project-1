<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리동네 사건사고 - 글로벌 실시간 관제 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: inherit; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        @keyframes radar-sweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-radar-sweep { animation: radar-sweep 3s linear infinite; }
        .resizer { width: 6px; cursor: col-resize; transition: background-color 0.2s; flex-shrink: 0; position: relative; z-index: 20; }
    </style>
</head>
<body id="appBody" class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 h-screen flex flex-col overflow-hidden select-none transition-colors duration-200" style="font-size: 16px;">

    <!-- 상단 헤더 -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-6 py-3 flex items-center justify-between shrink-0 shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="relative w-10 h-10 bg-slate-950 rounded-xl border border-red-500/50 flex items-center justify-center overflow-hidden shadow-lg shadow-red-500/20">
                <div class="absolute inset-1 rounded-full border border-red-500/30"></div>
                <div class="absolute top-1/2 left-1/2 w-5 h-5 origin-top-left animate-radar-sweep bg-gradient-to-tr from-red-500/60 to-transparent rounded-tr-full"></div>
                <div class="absolute w-2 h-2 bg-red-500 rounded-full animate-ping"></div>
            </div>
            <div>
                <h1 class="text-lg font-extrabold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                    우리동네 사건사고 
                    <span class="text-xs px-2.5 py-0.5 rounded bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-400 border border-emerald-300 dark:border-emerald-500/40 font-mono shadow-sm">실시간 관제</span>
                </h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">사소한 일상 사건부터 중대 범죄까지 전국 밀착 모니터링</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <!-- 글자 크기 조절 -->
            <div class="flex items-center bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-0.5">
                <button onclick="adjustFontSize(-1)" class="px-2 py-1 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 rounded">A-</button>
                <span id="fontSizeIndicator" class="px-2 text-xs font-mono text-slate-500 dark:text-slate-400">100%</span>
                <button onclick="adjustFontSize(1)" class="px-2 py-1 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 rounded">A+</button>
            </div>
            <button onclick="toggleTheme()" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-yellow-400 text-xs font-medium px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 transition flex items-center gap-2">
                <i id="themeIcon" class="fa-solid fa-moon"></i> <span id="themeText">다크모드</span>
            </button>
            <button onclick="openReportModal()" class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white text-xs md:text-sm font-semibold px-4 py-2 rounded-lg shadow-lg shadow-red-600/20 transition flex items-center gap-2">
                <i class="fa-solid fa-bullhorn"></i> 실시간 제보하기
            </button>
            <button onclick="manualRefreshData()" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs md:text-sm font-medium px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 transition flex items-center gap-2">
                <i class="fa-solid fa-rotate text-emerald-500"></i> 뉴스 새로고침
            </button>
        </div>
    </header>

    <!-- 메인 3분할 레이아웃 -->
    <main id="splitContainer" class="flex-1 flex flex-col lg:flex-row overflow-hidden w-full">
        
        <!-- 1. 왼쪽: 뉴스 피드 및 지역 선택 패널 -->
        <section id="leftPane" style="width: 28%; min-width: 250px;" class="bg-white dark:bg-slate-900/90 border-r border-slate-200 dark:border-slate-800 flex flex-col h-full overflow-hidden shrink-0">
            <div class="p-3 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 space-y-2">
                <div class="flex items-center justify-between text-xs text-slate-500">
                    <span class="font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-1">
                        <i class="fa-solid fa-location-dot text-red-500"></i> 지역별 상세 필터 (전국)
                    </span>
                </div>
                <div>
                    <select id="regionSelect" onchange="filterByRegion()" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-2 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-red-500 font-medium">
                        <option value="all">🌍 전체 지역 (전국 통합 보기)</option>
                        <optgroup label="서울특별시 (구·동)">
                            <option value="서울">서울특별시 전체</option>
                            <option value="강남구">강남구 (역삼·대치·신사 등)</option>
                            <option value="서초구">서초구</option>
                            <option value="송파구">송파구</option>
                            <option value="마포구">마포구 (홍대 등)</option>
                            <option value="종로구">종로구</option>
                            <option value="중구">중구</option>
                            <option value="영등포구">영등포구 (여의도 등)</option>
                            <option value="관악구">관악구 (신림 등)</option>
                        </optgroup>
                        <optgroup label="경기도 및 인천">
                            <option value="경기">경기도 전체</option>
                            <option value="수원">수원시</option>
                            <option value="성남">성남시 (분당 등)</option>
                            <option value="고양">고양시</option>
                            <option value="용인">용인시</option>
                            <option value="부천">부천시</option>
                            <option value="화성">화성시</option>
                            <option value="인천">인천광역시</option>
                        </optgroup>
                        <optgroup label="충청권 (천안·아산 등)">
                            <option value="천안">천안시 (두정·불당·성성 등)</option>
                            <option value="아산">아산시 (배방 등)</option>
                            <option value="대전">대전광역시</option>
                            <option value="세종">세종특별자치시</option>
                            <option value="청주">청주시</option>
                        </optgroup>
                        <optgroup label="부산 및 영남·호남권">
                            <option value="부산">부산광역시 (해운대 등)</option>
                            <option value="대구">대구광역시</option>
                            <option value="광주">광주광역시</option>
                            <option value="울산">울산광역시</option>
                            <option value="제주">제주특별자치도</option>
                        </optgroup>
                    </select>
                </div>
            </div>
            <div id="newsListContainer" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2.5"></div>
        </section>

        <div id="resizer1" class="resizer hidden lg:block bg-slate-200 dark:bg-slate-800 hover:bg-red-500"></div>

        <!-- 2. 중앙: 기사 상세 원문 뷰어 패널 (UI 군더더기 완전 제거, 원문만 즉시 표시) -->
        <section id="centerPane" style="width: 40%; min-width: 300px;" class="bg-slate-50 dark:bg-slate-950 border-r border-slate-200 dark:border-slate-800 flex flex-col h-full overflow-hidden shrink-0">
            <div class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-2.5 flex items-center space-x-2 overflow-x-auto shrink-0">
                <button onclick="setCategoryFilter('all')" data-cat="all" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-red-600 text-white transition whitespace-nowrap">전체</button>
                <button onclick="setCategoryFilter('강력·치안')" data-cat="강력·치안" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300 hover:bg-slate-300 whitespace-nowrap">강력·치안</button>
                <button onclick="setCategoryFilter('재난·안전')" data-cat="재난·안전" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300 hover:bg-slate-300 whitespace-nowrap">재난·안전</button>
                <button onclick="setCategoryFilter('사이버·금융')" data-cat="사이버·금융" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300 hover:bg-slate-300 whitespace-nowrap">사이버·금융</button>
                <button onclick="setCategoryFilter('실시간 제보')" data-cat="실시간 제보" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300 hover:bg-slate-300 whitespace-nowrap">실시간 제보</button>
                <button onclick="setCategoryFilter('범죄 다발 지역')" data-cat="범죄 다발 지역" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-200 text-rose-600 dark:bg-slate-800 dark:text-rose-400 hover:bg-slate-300 whitespace-nowrap border border-rose-500/50">🚨 7일 다발 지역</button>
            </div>
            
            <!-- 원문 본문이 바로 출력되는 순수 영역 -->
            <div id="detailViewContainer" class="flex-1 overflow-y-auto custom-scrollbar p-6 select-text flex flex-col space-y-4"></div>
        </section>

        <div id="resizer2" class="resizer hidden lg:block bg-slate-200 dark:bg-slate-800 hover:bg-red-500"></div>

        <!-- 3. 오른쪽: 인터랙티브 지도 패널 -->
        <section id="rightPane" style="flex: 1; min-width: 240px;" class="bg-white dark:bg-slate-900 flex flex-col h-full relative overflow-hidden">
            <div class="absolute top-3 right-3 z-[400] flex items-center gap-2">
                <div class="bg-white/90 dark:bg-slate-900/90 backdrop-blur border border-slate-200 dark:border-slate-700 text-xs px-3 py-1.5 rounded-lg shadow-lg text-slate-700 dark:text-slate-300 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                    <span>동(洞) 단위 정밀 관제 지도</span>
                </div>
            </div>
            <div id="map" class="flex-1 w-full h-full z-10"></div>
        </section>
    </main>

    <!-- 실시간 제보 모달 -->
    <div id="reportModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-900/50">
                <h3 class="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-bullhorn text-red-500"></i> 현장 실시간 제보 등록
                </h3>
                <button onclick="closeReportModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 overflow-y-auto custom-scrollbar space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">제보 제목</label>
                    <input type="text" id="reportTitle" placeholder="예: 두정동 골목길 가로등 고장 및 소란" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:border-red-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">시·도</label>
                        <select id="reportSido" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-900 dark:text-white">
                            <option value="서울특별시">서울특별시</option>
                            <option value="경기도">경기도</option>
                            <option value="충청남도">충청남도</option>
                            <option value="부산광역시">부산광역시</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">상세 동(洞) 위치</label>
                        <input type="text" id="reportLocationDetail" placeholder="예: 천안시 서북구 두정동" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-900 dark:text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">상세 코멘트</label>
                    <textarea id="reportContent" rows="3" placeholder="현장 상황을 작성해주세요..." class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-3 text-xs text-slate-900 dark:text-white"></textarea>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 flex justify-end space-x-2">
                <button onclick="closeReportModal()" class="px-4 py-2 bg-slate-200 dark:bg-slate-800 text-xs font-medium text-slate-700 dark:text-slate-300 rounded-lg">취소</button>
                <button onclick="submitReport()" class="px-5 py-2 bg-red-600 hover:bg-red-500 text-xs font-semibold text-white rounded-lg">제보 등록하기</button>
            </div>
        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        let newsData = [];
        let currentCategory = 'all';
        let currentRegion = 'all';
        let selectedHotspotRegion = null;
        let selectedNewsId = null;
        let map, markersLayer;
        let currentFontSizePx = 16; // 기본 16px (100%)

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            initResizers();
            loadIncidentsFromJSON();
            setInterval(loadIncidentsFromJSON, 30000);
        });

        function initResizers() {
            const container = document.getElementById('splitContainer');
            const leftPane = document.getElementById('leftPane');
            const centerPane = document.getElementById('centerPane');
            const resizer1 = document.getElementById('resizer1');
            const resizer2 = document.getElementById('resizer2');

            let isResizing1 = false, isResizing2 = false;
            resizer1.addEventListener('mousedown', () => isResizing1 = true);
            resizer2.addEventListener('mousedown', () => isResizing2 = true);

            document.addEventListener('mousemove', (e) => {
                if (!isResizing1 && !isResizing2) return;
                const rect = container.getBoundingClientRect();
                const total = rect.width;
                if (isResizing1) {
                    const w = e.clientX - rect.left;
                    if (w >= 230 && w <= total * 0.5) leftPane.style.width = `${(w / total) * 100}%`;
                } else if (isResizing2) {
                    const lw = leftPane.getBoundingClientRect().width;
                    const cw = e.clientX - rect.left - lw - 6;
                    if (cw >= 280) centerPane.style.width = `${(cw / total) * 100}%`;
                }
                if (map) map.invalidateSize();
            });

            document.addEventListener('mouseup', () => { isResizing1 = false; isResizing2 = false; });
        }

        async function loadIncidentsFromJSON(isManualRefresh = false) {
            try {
                const res = await fetch('news.json?t=' + Date.now());
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) newsData = data;
                }
            } catch (e) { console.log("데이터 대기 중..."); }

            if (newsData.length === 0) {
                newsData = [{
                    id: 1, category: "강력·치안", title: "[안내] 실시간 관제 시스템 대기 중",
                    summary: "크롤러가 7일간의 전국 사건사고를 수집하는 중입니다.",
                    content: "잠시만 기다리시면 최신 속보가 업데이트됩니다.",
                    location: "서울특별시 중구", lat: 37.5636, lng: 126.9975,
                    time: "실시간", source: "시스템", timestamp: Date.now()/1000
                }];
            }

            const filtered = getFilteredNews();
            if ((isManualRefresh || !selectedNewsId) && filtered.length > 0) {
                selectedNewsId = filtered[0].id;
            }

            renderNewsList();
            if (currentCategory === '범죄 다발 지역') renderCrimeHotspotsView();
            else if (selectedNewsId) renderDetailView(selectedNewsId);
            updateMapMarkers();

            if (isManualRefresh && filtered.length > 0 && map) {
                const top = filtered[0];
                if (top.lat && top.lng) map.flyTo([top.lat, top.lng], 13, { duration: 1.2 });
            }
        }

        function initMap() {
            map = L.map('map').setView([36.5000, 127.5000], 7);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
            markersLayer = L.layerGroup().addTo(map);
            updateMapMarkers();
        }

        function updateMapMarkers(filteredList) {
            if (!markersLayer) return;
            markersLayer.clearLayers();
            
            if (currentCategory === '범죄 다발 지역') {
                getCrimeHotspotsData().forEach((stat, idx) => {
                    let size = Math.min(40, 16 + stat.count * 4);
                    let color = idx === 0 ? '#dc2626' : (idx === 1 ? '#ea580c' : '#f59e0b');
                    const icon = L.divIcon({
                        className: 'hotspot-icon',
                        html: `<div style="background-color: ${color}; width: ${size}px; height: ${size}px; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 11px; box-shadow: 0 0 15px ${color};">${stat.count}</div>`,
                        iconSize: [size, size], iconAnchor: [size/2, size/2]
                    });
                    const marker = L.marker([stat.lat, stat.lng], { icon });
                    marker.bindPopup(`<div style="font-family: sans-serif;"><b style="color:#dc2626">TOP ${idx+1} ${stat.region}</b><br>관련 건수: <b>${stat.count}건</b></div>`);
                    markersLayer.addLayer(marker);
                });
                return;
            }

            (filteredList || getFilteredNews()).slice(0, 150).forEach(news => {
                let color = '#ef4444';
                if (news.category === '재난·안전') color = '#f59e0b';
                else if (news.category === '사이버·금융') color = '#3b82f6';
                else if (news.category === '국가 안보') color = '#6366f1';

                const icon = L.divIcon({
                    className: 'custom-icon',
                    html: `<div style="background-color: ${color}; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px ${color};"></div>`,
                    iconSize: [14, 14], iconAnchor: [7, 7]
                });

                const marker = L.marker([news.lat, news.lng], { icon });
                marker.bindPopup(`
                    <div style="font-family: sans-serif; max-width: 220px;">
                        <span style="font-size: 10px; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-weight:bold;">${news.category}</span>
                        <h4 style="font-size: 12px; font-weight: bold; margin: 5px 0;">${news.title}</h4>
                        <p style="font-size: 11px; color: #475569; margin: 0;"><i class="fa-solid fa-location-dot text-red-500"></i> ${news.location}</p>
                    </div>
                `);
                marker.on('click', () => selectNews(news.id));
                markersLayer.addLayer(marker);
            });
        }

        function renderNewsList() {
            const container = document.getElementById('newsListContainer');
            container.innerHTML = '';
            const filtered = getFilteredNews();

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-xs text-slate-500">선택한 조건에 해당하는 사건사고가 없습니다.</div>`;
                return;
            }

            filtered.slice(0, 150).forEach(news => {
                const isSelected = news.id === selectedNewsId && currentCategory !== '범죄 다발 지역';
                let badgeClass = 'bg-rose-500/20 text-rose-600 border-rose-500/30';
                if (news.category === '재난·안전') badgeClass = 'bg-amber-500/20 text-amber-600 border-amber-500/30';
                else if (news.category === '사이버·금융') badgeClass = 'bg-blue-500/20 text-blue-600 border-blue-500/30';
                else if (news.category === '실시간 제보') badgeClass = 'bg-emerald-500/20 text-emerald-600 border-emerald-500/30';

                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border transition cursor-pointer text-left ${isSelected ? 'bg-slate-100 dark:bg-slate-800/90 border-red-500/60 shadow-md' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:bg-slate-50'}`;
                card.onclick = () => selectNews(news.id);

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-1.5 gap-1">
                        <span class="text-[10px] px-2 py-0.5 rounded border ${badgeClass} font-semibold shrink-0">${news.category}</span>
                        <span class="text-[10px] text-slate-500 truncate">${news.time}</span>
                    </div>
                    <h3 class="text-xs font-bold text-slate-900 dark:text-white line-clamp-2 mb-1">${news.title}</h3>
                    <p class="text-[11px] text-slate-600 dark:text-slate-400 line-clamp-2 mb-2">${news.summary}</p>
                    <div class="flex items-center justify-between text-[10px] text-slate-500 pt-1 border-t border-slate-100 dark:border-slate-800">
                        <span><i class="fa-solid fa-location-dot text-red-500"></i> ${news.location}</span>
                        <span class="font-medium">${news.source}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function getCrimeHotspotsData() {
            const counts = {}, coordsMap = {};
            newsData.filter(n => !n.location.includes('세부 위치 미상')).forEach(news => {
                let loc = news.location;
                if (!counts[loc]) {
                    counts[loc] = 0;
                    coordsMap[loc] = { lat: news.lat, lng: news.lng };
                }
                counts[loc]++;
            });

            let sorted = Object.keys(counts).map(reg => ({
                region: reg, count: counts[reg], lat: coordsMap[reg].lat, lng: coordsMap[reg].lng
            })).sort((a, b) => b.count - a.count);

            if (sorted.length === 0) {
                sorted = [{ region: "서울특별시 강남구", count: 3, lat: 37.5172, lng: 127.0473 }];
            }
            return sorted;
        }

        function renderCrimeHotspotsView() {
            const container = document.getElementById('detailViewContainer');
            let listHTML = '';
            getCrimeHotspotsData().forEach((item, index) => {
                let isSelected = selectedHotspotRegion === item.region;
                listHTML += `
                    <div onclick="selectHotspotRegion('${item.region}', ${item.lat}, ${item.lng})" class="bg-white dark:bg-slate-900 border ${isSelected ? 'border-red-500 bg-red-50/50' : 'border-slate-200 dark:border-slate-800'} p-4 rounded-xl flex items-center justify-between cursor-pointer hover:border-red-500 transition shadow-sm">
                        <div class="flex items-center space-x-3">
                            <span class="w-7 h-7 rounded-full bg-rose-600 text-white flex items-center justify-center text-xs font-extrabold shrink-0">${index + 1}</span>
                            <div>
                                <h4 class="text-sm font-bold text-slate-900 dark:text-white">${item.region}</h4>
                                <p class="text-xs text-slate-500">클릭 시 해당 동(洞)·지역 기사 리스트업</p>
                            </div>
                        </div>
                        <span class="text-base font-extrabold text-red-500">${item.count}건</span>
                    </div>
                `;
            });
            container.innerHTML = `
                <div class="space-y-4 flex-1 flex flex-col">
                    <div class="p-5 rounded-xl border-l-4 border-rose-600 bg-rose-50 dark:bg-rose-950/25">
                        <h2 class="text-base font-extrabold text-slate-900 dark:text-white">🚨 최근 7일간 사건사고 다발 지역 (동·구 단위)</h2>
                        <p class="text-xs text-slate-600 dark:text-slate-400 mt-1">지역을 누르면 왼쪽 리스트에 해당 동의 사건들이 정렬됩니다.</p>
                    </div>
                    <div class="space-y-2.5 flex-1 overflow-y-auto custom-scrollbar">${listHTML}</div>
                </div>
            `;
        }

        function selectHotspotRegion(region, lat, lng) {
            selectedHotspotRegion = region;
            renderCrimeHotspotsView();
            renderNewsList();
            if (map) map.flyTo([lat, lng], 14, { duration: 1.2 });
        }

        // 💡 UI 상자 없이 순수 원문 본문만 화면에 가득 차도록 표시되는 뷰어 함수
        function renderDetailView(id) {
            const news = newsData.find(n => n.id === id);
            const container = document.getElementById('detailViewContainer');
            if (!news) return;

            container.innerHTML = `
                <div class="space-y-3">
                    <div class="flex items-center justify-between text-xs text-slate-400">
                        <span class="px-2 py-0.5 rounded bg-red-500/20 text-red-500 font-bold">${news.category}</span>
                        <span>${news.time} · ${news.source}</span>
                    </div>
                    <h2 class="text-xl md:text-2xl font-black text-slate-900 dark:text-white leading-tight">${news.title}</h2>
                    <p class="text-xs text-red-500 font-semibold"><i class="fa-solid fa-location-dot"></i> ${news.location}</p>
                </div>
                <hr class="border-slate-200 dark:border-slate-800 my-2">
                <div class="flex-1 overflow-y-auto custom-scrollbar pr-2">
                    <p class="text-base md:text-lg text-slate-800 dark:text-slate-200 leading-relaxed whitespace-pre-line font-normal">${news.content || news.summary}</p>
                </div>
                ${news.link ? `
                    <div class="pt-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between shrink-0">
                        <span class="text-xs text-slate-500">언론사 전체 전문 확인</span>
                        <a href="${news.link}" target="_blank" class="inline-flex items-center gap-1.5 text-xs font-bold text-white bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg shadow transition">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> 언론사 원문 새 창으로 열기 &rarr;
                        </a>
                    </div>
                ` : ''}
            `;
        }

        function selectNews(id) {
            selectedNewsId = id;
            if (currentCategory === '범죄 다발 지역') { currentCategory = 'all'; selectedHotspotRegion = null; }
            renderNewsList();
            renderDetailView(id);
            const news = newsData.find(n => n.id === id);
            if (news && map && news.lat && news.lng) {
                map.flyTo([news.lat, news.lng], 14, { duration: 1.2 });
            }
        }

        function setCategoryFilter(cat) {
            currentCategory = cat;
            selectedHotspotRegion = null;
            if (cat === '범죄 다발 지역') renderCrimeHotspotsView();
            else { renderNewsList(); const f = getFilteredNews(); if (f.length > 0) selectNews(f[0].id); }
        }

        function filterByRegion() {
            currentRegion = document.getElementById('regionSelect').value;
            renderNewsList();
            updateMapMarkers();
            const f = getFilteredNews();
            if (f.length > 0) selectNews(f[0].id);
        }

        function getFilteredNews() {
            return newsData.filter(news => {
                if (selectedHotspotRegion) return news.location.includes(selectedHotspotRegion);
                const matchCat = (currentCategory === 'all' || news.category === currentCategory);
                let matchReg = true;
                if (currentRegion !== 'all') {
                    matchReg = news.location.includes(currentRegion);
                }
                return matchCat && matchReg;
            });
        }

        function manualRefreshData() {
            currentCategory = 'all'; currentRegion = 'all'; selectedHotspotRegion = null;
            document.getElementById('regionSelect').value = 'all';
            loadIncidentsFromJSON(true);
        }

        // 💡 글자 크기 조절 기능 정상화 함수
        function adjustFontSize(direction) {
            currentFontSizePx += direction * 2; // 한 번 누를 때마다 2px씩 증가/감소
            if (currentFontSizePx < 12) currentFontSizePx = 12; // 최소 12px
            if (currentFontSizePx > 24) currentFontSizePx = 24; // 최대 24px

            document.getElementById('appBody').style.fontSize = currentFontSizePx + 'px';
            
            // 퍼센트 표시 업데이트 (16px 기준 100%)
            const percent = Math.round((currentFontSizePx / 16) * 100);
            document.getElementById('fontSizeIndicator').textContent = percent + '%';
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            if (map) map.invalidateSize();
        }

        function openReportModal() { document.getElementById('reportModal').classList.remove('hidden'); }
        function closeReportModal() { document.getElementById('reportModal').classList.add('hidden'); }
        function submitReport() {
            const title = document.getElementById('reportTitle').value;
            const sido = document.getElementById('reportSido').value;
            const loc = document.getElementById('reportLocationDetail').value;
            const content = document.getElementById('reportContent').value;
            if (!title || !loc) { alert('제목과 위치를 입력해주세요.'); return; }
            
            const now = new Date();
            const newR = {
                id: Date.now(), category: '실시간 제보', title: `[시민제보] ${title}`,
                summary: content || title, content: content || '제보 내용',
                location: `${sido} ${loc}`, lat: 36.8151 + (Math.random()-0.5)*0.01, lng: 127.1139 + (Math.random()-0.5)*0.01,
                time: `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} (금) ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
                source: '시민 직접 제보', timestamp: now.getTime()/1000
            };
            newsData.unshift(newR);
            closeReportModal();
            selectNews(newR.id);
            renderNewsList();
            updateMapMarkers();
            alert('제보가 등록되었습니다!');
        }
    </script>
</body>
</html>
