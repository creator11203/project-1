<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리동네 사건사고 - 글로벌 실시간 관제 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: inherit; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        
        @keyframes radar-sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-radar-sweep {
            animation: radar-sweep 3s linear infinite;
        }

        .resizer {
            width: 6px;
            cursor: col-resize;
            transition: background-color 0.2s;
            flex-shrink: 0;
            position: relative;
            z-index: 20;
        }
        .resizer::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 24px;
            border-radius: 1px;
        }
    </style>
</head>
<body id="appBody" class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 h-screen flex flex-col overflow-hidden select-none transition-colors duration-200 text-base" style="font-size: 1rem;">

    <!-- 상단 헤더 -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-6 py-3 flex items-center justify-between shrink-0 shadow-sm transition-colors duration-200">
        <div class="flex items-center space-x-3">
            <div class="relative w-10 h-10 bg-slate-950 rounded-xl border border-red-500/50 flex items-center justify-center overflow-hidden shadow-lg shadow-red-500/20">
                <div class="absolute inset-1 rounded-full border border-red-500/30"></div>
                <div class="absolute inset-3 rounded-full border border-red-500/40"></div>
                <div class="absolute w-full h-0.5 bg-red-500/20"></div>
                <div class="absolute h-full w-0.5 bg-red-500/20"></div>
                <div class="absolute top-1/2 left-1/2 w-5 h-5 origin-top-left animate-radar-sweep bg-gradient-to-tr from-red-500/60 to-transparent rounded-tr-full"></div>
                <div class="absolute w-2 h-2 bg-red-500 rounded-full animate-ping"></div>
                <div class="absolute w-1.5 h-1.5 bg-red-400 rounded-full"></div>
            </div>
            <div>
                <h1 class="text-lg font-extrabold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                    우리동네 사건사고 
                    <span class="text-xs px-2.5 py-0.5 rounded bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-400 border border-emerald-300 dark:border-emerald-500/40 font-mono shadow-sm">글로벌 실시간 관제</span>
                </h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">최근 7일간 국내외 사건·사고 및 범죄 다발 지역 집중 모니터링</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <div class="flex items-center bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-0.5">
                <button onclick="adjustFontSize(-1)" title="글씨 작게" class="px-2 py-1 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 rounded">A-</button>

                <button onclick="adjustFontSize(1)" title="글씨 크게" class="px-2 py-1 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 rounded">A+</button>

            <button onclick="toggleTheme()" id="themeToggleBtn" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-yellow-400 text-xs font-medium px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 transition flex items-center gap-2" title="테마 전환">

            <button onclick="openReportModal()" class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white text-xs md:text-sm font-semibold px-4 py-2 rounded-lg shadow-lg shadow-red-600/20 transition flex items-center gap-2">

    <!-- 메인 3분할 플렉스 레이아웃 -->

                <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
                    <span class="font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-1">
                        <i class="fa-solid fa-location-dot text-red-500"></i> 지역 맞춤 필터
                    </span>
                    <button onclick="manualRefreshData()" class="hover:text-slate-900 dark:hover:text-white flex items-center gap-1 transition text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 px-2.5 py-1 rounded border border-slate-300 dark:border-slate-700">

                </div>
                <div>
                    <select id="regionSelect" onchange="filterByRegion()" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-800 dark:text-slate-200 focus:outline-none focus:border-red-500">

            <!-- 상단 카테고리 버튼 바 -->

                <button onclick="setCategoryFilter('all')" data-cat="all" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-red-600 text-white transition whitespace-nowrap shadow-sm">전체</button>
                <button onclick="setCategoryFilter('국가 안보')" data-cat="국가 안보" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition whitespace-nowrap">국가 안보</button>
                <button onclick="setCategoryFilter('강력·치안')" data-cat="강력·치안" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition whitespace-nowrap">강력·치안</button>
                <button onclick="setCategoryFilter('사이버·금융')" data-cat="사이버·금융" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition whitespace-nowrap">사이버·금융</button>
                <button onclick="setCategoryFilter('재난·안전')" data-cat="재난·안전" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition whitespace-nowrap">재난·안전</button>
                <button onclick="setCategoryFilter('실시간 제보')" data-cat="실시간 제보" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition whitespace-nowrap">실시간 제보</button>

                <button onclick="setCategoryFilter('해외 분쟁·테러')" data-cat="해외 분쟁·테러" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-200 text-orange-600 dark:bg-slate-800 dark:text-orange-400 hover:bg-slate-300 dark:hover:bg-slate-700 transition whitespace-nowrap border border-orange-500/30">🌍 해외 분쟁·테러</button>

                <div class="bg-white/90 dark:bg-slate-900/90 backdrop-blur border border-slate-200 dark:border-slate-700 text-xs px-3 py-1.5 rounded-lg shadow-lg text-slate-700 dark:text-slate-300 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>

    <!-- 실시간 제보 모달 -->
    <div id="reportModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] transition-colors duration-200">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-900/50">
                <h3 class="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-bullhorn text-red-500"></i> 현장 실시간 제보 등록

            <div class="p-6 overflow-y-auto custom-scrollbar space-y-4">

                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">시·도</label>
                        <select id="reportSido" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-red-500">
                            <option value="서울특별시">서울특별시</option>
                            <option value="경기도">경기도</option>
                            <option value="충청남도">충청남도</option>
                            <option value="부산광역시">부산광역시</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">위치 상세</label>
                        <input type="text" id="reportLocationDetail" placeholder="예: 천안시 서북구 두정동" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-red-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">상세 코멘트</label>
                    <textarea id="reportContent" rows="3" placeholder="현장 상황을 작성해주세요..." class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-3 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-red-500"></textarea>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 flex justify-end space-x-2">
                <button onclick="closeReportModal()" class="px-4 py-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-xs font-medium text-slate-700 dark:text-slate-300 rounded-lg">취소</button>
                <button onclick="submitReport()" class="px-5 py-2 bg-red-600 hover:bg-red-500 text-xs font-semibold text-white rounded-lg">제보 등록하기</button>

    <!-- 스크립트 로직 -->
    <script>
        let newsData = [];
        let currentCategory = 'all';
        let currentRegion = 'all';
        let selectedHotspotRegion = null; // 범죄 다발 지역에서 선택된 특정 지역 필터용
        let selectedNewsId = null;
        let map, markersLayer;
        let currentFontSizeLevel = 1;

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            initResizers();
            loadIncidentsFromJSON();

            setInterval(loadIncidentsFromJSON, 30000);
        });

        function initResizers() {
            const container = document.getElementById('splitContainer');
            const leftPane = document.getElementById('leftPane');
            const centerPane = document.getElementById('centerPane');
            const resizer1 = document.getElementById('resizer1');
            const resizer2 = document.getElementById('resizer2');

            let isResizing1 = false;
            let isResizing2 = false;

            resizer1.addEventListener('mousedown', () => { isResizing1 = true; document.body.style.cursor = 'col-resize'; });
            resizer2.addEventListener('mousedown', () => { isResizing2 = true; document.body.style.cursor = 'col-resize'; });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing1 && !isResizing2) return;
                const containerRect = container.getBoundingClientRect();
                const totalWidth = containerRect.width;

                if (isResizing1) {
                    const newLeftWidth = e.clientX - containerRect.left;
                    if (newLeftWidth >= 220 && newLeftWidth <= totalWidth * 0.5) {
                        leftPane.style.width = `${(newLeftWidth / totalWidth) * 100}%`;
                        if (map) map.invalidateSize();
                    }
                } else if (isResizing2) {
                    const leftWidth = leftPane.getBoundingClientRect().width;
                    const newCenterWidth = e.clientX - containerRect.left - leftWidth - 6;
                    if (newCenterWidth >= 280 && (leftWidth + newCenterWidth) <= totalWidth - 220) {
                        centerPane.style.width = `${(newCenterWidth / totalWidth) * 100}%`;
                        if (map) map.invalidateSize();
                    }
                }
            });

            document.addEventListener('mouseup', () => {
                if (isResizing1 || isResizing2) {
                    isResizing1 = false;
                    isResizing2 = false;
                    document.body.style.cursor = 'default';
                    if (map) map.invalidateSize();
                }
            });
        }

        async function loadIncidentsFromJSON(isManualRefresh = false) {
            try {
                const response = await fetch('news.json?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data) && data.length > 0) {
                        newsData = data;
                    }
                }
            } catch (error) {
                console.log("news.json 로드 대기 중...");
            }

            if (newsData.length === 0) {
                newsData = [
                    {
                        id: 1,
                        category: "강력·치안",
                        title: "[안내] 실시간 관제 시스템 대기 중",
                        summary: "크롤러가 백그라운드에서 최근 7일간의 뉴스를 수집하는 중입니다.",
                        content: "잠시만 기다리시면 최신 속보가 자동으로 업데이트됩니다.",
                        location: "서울특별시 중구",
                        lat: 37.5636,
                        lng: 126.9975,
                        time: "실시간",
                        source: "시스템 안내",
                        timestamp: Date.now() / 1000
                    }
                ];
            }

            const filtered = getFilteredNews();
            if ((isManualRefresh || !selectedNewsId) && filtered.length > 0) {
                selectedNewsId = filtered[0].id;
            }

            renderNewsList();
            if (currentCategory === '범죄 다발 지역') {
                renderCrimeHotspotsView();
            } else if (selectedNewsId) {
                renderDetailView(selectedNewsId);
            }
            updateMapMarkers();

            // 새로고침 시 지도도 제일 상단 기사 위치로 이동
            if (isManualRefresh && filtered.length > 0 && map) {
                const topNews = filtered[0];
                if (topNews.lat && topNews.lng) {
                    map.flyTo([topNews.lat, topNews.lng], 12, { duration: 1.2 });
                }
            }
        }

        function initMap() {
            map = L.map('map').setView([36.5000, 127.5000], 7);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            markersLayer = L.layerGroup().addTo(map);
            updateMapMarkers();
        }

        function updateMapMarkers(filteredList) {
            if (!markersLayer) return;
            markersLayer.clearLayers();
            
            if (currentCategory === '범죄 다발 지역') {
                const crimeStats = getCrimeHotspotsData();
                crimeStats.forEach((stat, idx) => {
                    let radiusSize = Math.min(38, 16 + stat.count * 5);
                    let hotspotColor = idx === 0 ? '#dc2626' : (idx === 1 ? '#ea580c' : '#f59e0b');

                    const hotspotIcon = L.divIcon({
                        className: 'hotspot-icon',

        function getCrimeHotspotsData() {
            const crimeNews = newsData.filter(n => 
                !n.location.includes('세부 위치 미상') && 
                !n.location.includes('대한민국 (세부') &&
                (n.category === '강력·치안' || n.category === '국가 안보' || n.category === '재난·안전' || n.title.includes('폭행') || n.title.includes('사건') || n.title.includes('사고') || n.title.includes('범죄') || n.title.includes('화재'))
            );
            const regionCounts = {};
            const regionCoordsMap = {};

            crimeNews.forEach(news => {
                let parts = news.location.split(' ');
                let locKey = parts[0] + (parts[1] ? ' ' + parts[1] : '');
                if (!locKey || locKey.includes('대한민국')) return;

                if (!regionCounts[locKey]) {
                    regionCounts[locKey] = 0;
                    regionCoordsMap[locKey] = { lat: news.lat, lng: news.lng };
                }
                regionCounts[locKey]++;
            });

            // 요구사항 4번: ㄱㄴㄷ 순 정렬 (가나다 오름차순 또는 건수순 원하시면 변경 가능, 여기서는 ㄱㄴㄷ 지역명 순 정렬 후 건수 반영)
            let sortedRegions = Object.keys(regionCounts).map(reg => ({
                region: reg,
                count: regionCounts[reg],
                lat: regionCoordsMap[reg].lat,
                lng: regionCoordsMap[reg].lng
            })).sort((a, b) => a.region.localeCompare(b.region, 'ko')); // ㄱㄴㄷ 순 정렬

            if (sortedRegions.length === 0) {
                sortedRegions = [
                    { region: "서울특별시 강남구", count: 5, lat: 37.5172, lng: 127.0473 },
                    { region: "충청남도 천안시", count: 4, lat: 36.8151, lng: 127.1139 },
                    { region: "경기도 수원시", count: 3, lat: 37.2636, lng: 127.0286 }
                ];
            }
            return sortedRegions;
        }

        function getFilteredNews() {
            return newsData.filter(news => {
                if (selectedHotspotRegion) {
                    return news.location.includes(selectedHotspotRegion);
                }

                const matchCategory = (currentCategory === 'all' || news.category === currentCategory);
                let matchRegion = true;
                if (currentRegion !== 'all') {
                    if (currentRegion === '해외') {
                        matchRegion = (news.category === '해외 분쟁·테러' || news.location.includes('해외'));
                    } else if (currentRegion === '충청') {
                        matchRegion = /충청|천안|아산|대전|세종|청주|충주|서산|당진/.test(news.location);
                    } else if (currentRegion === '영남') {
                        matchRegion = /부산|대구|울산|경상|창원|포항|구미|김해|진주|양산/.test(news.location);
                    } else if (currentRegion === '호남') {
                        matchRegion = /광주|전라|전북|전주|익산|군산|여수|순천|목포|제주/.test(news.location);
                    } else {
                        matchRegion = news.location.includes(currentRegion);
                    }
                }
                return matchCategory && matchRegion;
            });
        }

        function adjustFontSize(direction) {
            const levels = ['0.85rem', '1rem', '1.15rem', '1.3rem'];
            const percentTexts = ['85%', '100%', '115%', '130%'];
            
            currentFontSizeLevel += direction;
            if (currentFontSizeLevel < 0) currentFontSizeLevel = 0;
            if (currentFontSizeLevel >= levels.length) currentFontSizeLevel = levels.length - 1;

            document.getElementById('appBody').style.fontSize = levels[currentFontSizeLevel];
            document.getElementById('fontSizeIndicator').textContent = percentTexts[currentFontSizeLevel];
        }

            const title = document.getElementById('reportTitle').value;
            const sido = document.getElementById('reportSido').value;
            const locationDetail = document.getElementById('reportLocationDetail').value;
            const content = document.getElementById('reportContent').value;

            if (!title || !locationDetail) {
                alert('제목과 위치를 입력해주세요.');
                return;
            }

            const now = new Date();
            const days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
            const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} (${days[now.getDay()]}) ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const newReport = {
                id: Date.now(),
                category: '실시간 제보',
                title: `[시민제보] ${title}`,
                summary: content || title,
                content: content || '시민이 직접 등록한 실시간 제보입니다.',
                location: `${sido} ${locationDetail}`,
                lat: 36.8151 + (Math.random() - 0.5) * 0.02,
                lng: 127.1139 + (Math.random() - 0.5) * 0.02,
                time: dateStr,
                source: '시민 직접 제보',
                timestamp: now.getTime() / 1000
            };

            newsData.unshift(newReport);
            closeReportModal();
            selectNews(newReport.id);
            renderNewsList();
            updateMapMarkers();
            alert('제보가 등록되었습니다!');
        }
    </script>
</body>
