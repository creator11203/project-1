    <style>
        body { font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }

        /* 기사를 많이 불러와도 손잡이가 너무 작아지지 않게 최소 길이를 둠 */

        /* 스크롤 막대 손잡이 길이: 기사 요약 목록(#newsListContainer)과 다발 지역 순위가 똑같이 '화면 높이의 13%' 이상이 되게 함 (항목이 아무리 많아도 짧아지지 않음) */
        #detailViewContainer:has(#hotspotList)::-webkit-scrollbar { width: 12px; }
        #detailViewContainer:has(#hotspotList)::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 9px; }
        #detailViewContainer:has(#hotspotList)::-webkit-scrollbar-thumb { background-color: #94a3b8; border-radius: 999px; min-height: 13vh; border: 2px solid transparent; background-clip: content-box; }

        #detailViewContainer:has(#hotspotList)::-webkit-scrollbar-thumb:hover { background-color: #e11d48; }
        #hotspotList::-webkit-scrollbar { width: 12px; } #hotspotList::-webkit-scrollbar-thumb { min-height: 13vh; border-radius: 999px; background: #94a3b8; }
        .dark #detailViewContainer:has(#hotspotList)::-webkit-scrollbar-track { background: #1e293b; }

        .dark .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        /* 왼쪽 기사 목록 스크롤바: 넓고(12px) 손잡이 최소 64px, 칸 조정 막대(회색)와 구분되는 남색 */

        .dark #newsListContainer::-webkit-scrollbar-thumb:hover { background: #818cf8; }
        .mob-txt { display: none; }
        /* 같은 사건 관련 기사 꼬리표: 글자가 들어간 알약 모양 (색만으로 구분하지 않음) */
        .rel-chip { display: inline-flex; align-items: center; flex: none; padding: .12rem .5rem; border-radius: 999px; font-size: .6875rem; font-weight: 800; line-height: 1.35; white-space: nowrap; }

        /* 모든 버튼: 누르면 살짝 눌리고 색이 부드럽게 바뀜 (특이도 0 이라 개별 버튼의 자체 효과는 그대로 우선) */
        :where(button, [role="button"], .tab-btn) { transition: transform .14s cubic-bezier(.3,.8,.3,1), background-color .22s ease, color .22s ease, border-color .22s ease, opacity .22s ease, box-shadow .22s ease; }
        :where(button, [role="button"]):active:not(:disabled) { transform: scale(.96); }
        @media (prefers-reduced-motion: reduce) { :where(button, [role="button"]) { transition: none; } :where(button, [role="button"]):active { transform: none; } }
        @keyframes radar-sweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-radar-sweep { animation: radar-sweep 3s linear infinite; }
        
        /* 구분선(Resizer) 및 화살표 UI 가이드 */
        /* 칸 조정 막대: 기사 스크롤바(남색)와 헷갈리지 않게 옅은 회색 + 세로 점선 무늬, 올리면 주황 */
        .resizer { width: 8px; cursor: col-resize; transition: background-color 0.2s; flex-shrink: 0; position: relative; z-index: 20;
            background-color: #e2e8f0; background-image: radial-gradient(circle, #94a3b8 1px, transparent 1.4px); background-size: 8px 6px; background-position: center; background-repeat: repeat-y;
            border-left: 1px solid #cbd5e1; border-right: 1px solid #cbd5e1; }
        .dark .resizer { background-color: #1e293b; background-image: radial-gradient(circle, #475569 1px, transparent 1.4px); border-color: #334155; }
        .resizer:hover, .resizing .resizer { background-color: #fb923c; background-image: none; border-color: #f97316; }
        .resizer::after {
            content: "⇄";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #94a3b8;
            font-size: 10px;
            pointer-events: none;
            background: rgba(0,0,0,0.1);
            padding: 4px 1px;
            border-radius: 2px;
        }
        /* 창 크기를 끌어서 조절하는 동안 기사 원문(iframe)이 마우스를 가로채지 않도록 */
        .resizing iframe { pointer-events: none; }
        .resizing { user-select: none; }
        /* '실시간 업데이트 중' 뒤의 움직이는 점 3개 */
        .live-dots { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
        .live-dots i { width: 3px; height: 3px; border-radius: 50%; background: #10b981; animation: live-bounce 1.2s infinite ease-in-out; }
        .live-dots i:nth-child(2) { animation-delay: .2s; }
        .live-dots i:nth-child(3) { animation-delay: .4s; }
        /* 새로고침 화살표 회전 */
        .refresh-spin { display: inline-block; animation: refresh-rotate 2.4s linear infinite; }
        .refresh-spin.fast { animation-duration: .5s; }
        @keyframes refresh-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        /* 속보 헤드라인: 오른쪽에서 나와 왼쪽으로 흐름 (글을 읽는 방향과 같게) */
        @keyframes ticker-rtl { from { transform: translateX(var(--ticker-start, 100vw)); } to { transform: translateX(-100%); } }
        /* 속보 바: 같은 목록을 두 번 이어 붙여 왼쪽으로 반만큼 흐르면 처음과 똑같은 모습 → 10위 바로 뒤에 1위가 끊김 없이 이어짐 */
        @keyframes ticker-loop { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        .ticker-dot { width: 6px; height: 6px; border-radius: 999px; background: #fff; animation: ticker-blink 1.2s ease-in-out infinite; }
        @keyframes ticker-blink { 50% { opacity: .25; } }
        /* 화면 설정: 4개 패널(사건 목록·기사 원문·지도·커뮤니티)을 3칸에 자유롭게 배치 */
        .panel { display: flex; flex-direction: column; height: 100%; width: 100%; min-height: 0; min-width: 0; overflow: hidden; position: relative; }
        #detailViewContainer { overflow-x: hidden; overflow-wrap: anywhere; }
        /* 지도 마커 */
        .pin { border-radius: 50%; border: 2px solid #fff; box-sizing: border-box; }
        .pin.approx { border-style: dashed; opacity: .78; }
        .pin.exact { box-shadow: 0 0 0 2px rgba(15,23,42,.35), 0 2px 6px rgba(0,0,0,.45); }
        .pin.sel { animation: pin-pulse 1.4s ease-out infinite; }
        @keyframes pin-pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,.75); } 100% { box-shadow: 0 0 0 16px rgba(239,68,68,0); } }
        .cluster-bubble { border-radius: 50%; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 3px solid rgba(255,255,255,.9); box-shadow: 0 2px 8px rgba(0,0,0,.35); font-family: system-ui, sans-serif; }
        .safety-pin { position: relative; border-radius: 10px; background: #fff; border: 3px solid #0f172a; display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1; }
        .safety-pin > i { position: absolute; left: 50%; bottom: -9px; width: 8px; height: 8px; margin-left: -4px; transform: rotate(45deg); border-radius: 1px; }
        .safety-pin > span { position: relative; z-index: 1; }
        /* 지도에 항상 그리는 경찰서(파랑)·소방서(빨강) 표시: 병원(H)과 헷갈리지 않게 동그란 색 테두리 + 그림 */
        .station-pin { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid; display: flex; align-items: center; justify-content: center; font-size: 14px; line-height: 1; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
        .station-toggle { background: #fff; color: #0f172a; font-size: 11px; font-weight: 700; padding: 4px 8px; cursor: pointer; white-space: nowrap; border-radius: 6px; }
        .station-toggle.off { color: #94a3b8; text-decoration: line-through; }
        /* 경찰·소방 찾는 동안: 돌아가는 아이콘 + 흐르는 빛 + 깜빡이는 점으로 '지금 찾는 중'임이 한눈에 보이게 / 끝나면 초록 '완료' 표시 */
        .station-toggle.busy { color: #fff; background: linear-gradient(100deg, #2563eb 0%, #7c3aed 50%, #2563eb 100%); background-size: 200% 100%; animation: stationShimmer 1.2s linear infinite; box-shadow: 0 0 0 3px rgba(37,99,235,.35); }
        .station-toggle.done { color: #065f46; background: #d1fae5; box-shadow: 0 0 0 2px #10b981; }
        .dark .station-toggle.done { color: #a7f3d0; background: #064e3b; }
        .busy-spin { display: inline-block; width: .8rem; height: .8rem; border: 2px solid rgba(255,255,255,.45); border-top-color: #fff; border-radius: 50%; vertical-align: -2px; margin-right: .25rem; animation: busySpin .7s linear infinite; }
        .busy-dots::after { content: ''; animation: busyDots 1.2s steps(4, end) infinite; }
        @keyframes busySpin { to { transform: rotate(360deg); } }
        @keyframes busyDots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75%, 100% { content: '...'; } }
        @keyframes stationShimmer { to { background-position: -200% 0; } }
        .find-busy { display: flex; align-items: center; gap: .4rem; padding: .35rem .6rem; border-radius: 8px; background: #eff6ff; color: #1d4ed8; font-weight: 800; border: 1px solid #93c5fd; }
        .dark .find-busy { background: #172554; color: #bfdbfe; border-color: #1d4ed8; }
        .find-busy .busy-spin { border-color: rgba(37,99,235,.3); border-top-color: #2563eb; }
        .dark .station-toggle { background: #1e293b; color: #e2e8f0; }
        .dark .leaflet-container { background: #0b1220; }
        .leaflet-popup-content { margin: 10px 12px; }
        /* 커뮤니티 버튼 */
        .comm-btn { background: linear-gradient(135deg, #059669 0%, #0d9488 55%, #0284c7 100%); }
        .comm-btn:hover { filter: brightness(1.1); }
        /* 맨 위 주요 버튼 3개(안전 브리핑 · 우리동네 커뮤니티 · 실시간 제보하기)의 빛: 버튼마다 '자기 안에서만' 부드러운 유리 광택이 지나감.
           버튼 사이 여백(흰 배경)에는 빛이 전혀 그려지지 않고, 왼쪽 버튼 → 가운데 → 오른쪽 순서로 차례차례(--i 번째 버튼만큼 늦게) 반짝임.
           빛 모양: 딱딱한 대각선 줄 대신, 세로로 길쭉한 타원형 광택(넓고 옅은 번짐 + 가운데 가늘고 밝은 심지)이 살짝 휘어 보이며 미끄러지듯 지나감.
           가상 요소(::after)가 버튼 크기 그대로(inset 0, 둥근 모서리 그대로)라서 빛은 버튼 모양 밖으로 절대 나가지 않음.
           (--cx: 빛 가운데의 위치. 0 = 버튼 왼쪽 끝, 1 = 오른쪽 끝. 그림 크기 s 일 때 위치 % = (cx - s/2) / (1 - s)) */
        /* [2026-11-16 개선] 예전 빛이 불안정하고 갑자기 빨라지던 원인:
           ① 애니메이션하는 값이 등록된 사용자 변수(@property --cx)라 매 프레임 calc()가 다시 계산되고, 버튼 3개 × 가상 요소 2겹(6겹)이 매번 다시 그려졌음
           ② mix-blend-mode: soft-light 는 아래 그림과 섞는 계산이라 그리기 비용이 큼
           ③ 속도 곡선이 cubic-bezier(.55,.05,.25,1)(처음엔 느리다가 가운데서 확 빨라짐)이고 이동 시간도 1.6초로 짧았음
           → 가상 요소 1겹, 섞기 효과 없음, 단순한 background-position 이동 하나, 좌우 대칭의 부드러운 곡선(느리게 출발·느리게 멈춤)으로 바꿈.
           빛은 7초에 한 번, 약 2.4초 동안 천천히 지나가고 나머지는 쉼. 버튼은 왼쪽→오른쪽 순서로 0.5초씩 간격을 두고 반짝임. */
        .sweep-btn { position: relative; isolation: isolate; }
        .sweep-btn::after {
            content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1;
            background-image: linear-gradient(105deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.10) 30%, rgba(255,255,255,.30) 50%, rgba(255,255,255,.10) 70%, rgba(255,255,255,0) 100%);
            background-size: 45% 100%; background-repeat: no-repeat; background-position: -100% 0;
            animation: btn-glint 7s cubic-bezier(.45, 0, .55, 1) infinite;
            animation-delay: calc(var(--i, 0) * .5s + 1s);
        }
        @keyframes btn-glint { 0% { background-position: -100% 0; } 34% { background-position: 200% 0; } 100% { background-position: 200% 0; } }
        @media (prefers-reduced-motion: reduce) { .sweep-btn::after { animation: none; } }
        /* 맨 위 버튼 줄은 글씨 크기 조절과 상관없이 고정 → 크기를 px 대신 rem 으로 (제목 줄 고정 배율과 함께 항상 같은 크기) */
        .comm-faces span { width: 1.375rem; height: 1.375rem; border-radius: 50%; background: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: .8125rem; line-height: 1; border: .125rem solid #059669; margin-left: -.4375rem; }
        .comm-faces span:first-child { margin-left: 0; }
        .panel-flash { animation: panel-flash 1s ease-out 1; }
        @keyframes panel-flash { 0% { box-shadow: inset 0 0 0 4px #10b981; } 100% { box-shadow: inset 0 0 0 0 rgba(16,185,129,0); } }
        .react-chip { display: inline-flex; align-items: center; gap: 2px; font-size: 0.6875rem; padding: 1px 6px; border-radius: 999px; border: 1px solid #cbd5e1; background: rgba(255,255,255,.85); color: #334155; }
        .react-chip.on { border-color: #f43f5e; background: #ffe4e6; color: #be123c; font-weight: 700; }
        .dark .react-chip { background: rgba(15,23,42,.8); border-color: #475569; color: #e2e8f0; }
        .dark .react-chip.on { background: #4c0519; border-color: #f43f5e; color: #fecdd3; }
        .msg-row .msg-tools { visibility: hidden; }
        .msg-row:hover .msg-tools, .msg-row:focus-within .msg-tools { visibility: visible; }
        @media (hover: none) { .msg-row .msg-tools { visibility: visible; } }

    <!-- 스크립트 로직 -->
    <script>
        // ▼▼▼ 우리동네 커뮤니티 서버 설정 ▼▼▼
        // Firebase 콘솔에서 받은 설정값을 null 자리에 붙여넣으면 실제 커뮤니티가 켜집니다.
        // 예) const FIREBASE_CONFIG = { apiKey: "...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." };
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyC1xwQLRv48-Uy5rzXXYE6g426qXyGrjQc",
            authDomain: "townalertkr-b76f6.firebaseapp.com",
            projectId: "townalertkr-b76f6",
            storageBucket: "townalertkr-b76f6.firebasestorage.app",
            messagingSenderId: "373734693701",
            appId: "1:373734693701:web:4cf170c9aa4b164b367c2c"
        };   // ※ 이 값은 공개되어도 되는 값입니다. 데이터는 Firebase 콘솔의 Firestore 보안 규칙(firestore.rules)이 지킵니다.
        // ▲▲▲ 여기까지 ▲▲▲

        let newsData = [];
        let currentCategory = 'all';     // 'all' 또는 '범죄 다발 지역'
        // 보고 싶은 분류(여러 개 선택 가능). 누르면 선택, 다시 누르면 해제. 선택은 저장되어 다음에 접속해도 유지됩니다.
        let selCats = new Set((() => { try { return JSON.parse(localStorage.getItem('sel_cats') || '[]'); } catch (e) { return []; } })());
        // 빼고 볼 분류 (예: 해외 소식만 빼고 보기). 선택과 따로 저장되어 다음에 접속해도 유지됩니다.
        let exCats = new Set((() => { try { return JSON.parse(localStorage.getItem('ex_cats') || '[]'); } catch (e) { return []; } })());
        let catMode = (() => { try { return localStorage.getItem('cat_mode') === 'exclude' ? 'exclude' : 'include'; } catch (e) { return 'include'; } })();
        let lastToggled = null;
        // 다른 분류의 기사를 열 때(속보 줄·알림): 그 기사가 보이도록 분류 선택·제외를 풀어 줌
        function showInFilter(n) {
            if (selCats.size && !groupsOf(n).some(g => selCats.has(g))) selCats.clear();
            groupsOf(n).forEach(g => exCats.delete(g));
            if (!showCourt && isCourt(n)) { showCourt = true; lsSet('show_court', '1'); }   // 숨겨 둔 재판·판결 소식을 열 때는 다시 보이게
            saveSelCats();
        }
        // ---- 기사 단계: 지금 일어난 사건(incident) / 수사 중(police) / 재판·판결 소식(court) ----
        // scraper.py 가 news.json 에 stage 를 넣어 주지만, 예전 기사에는 없을 수 있어서 같은 기준으로 제목에서 다시 판정합니다.
        // 재판·판결(court)은 몇 달~몇 년 전 사건의 후속 소식이라 7일 다발 지역 집계·실시간 알림·지도 밀집도에서 빼고,
        // 목록에는 ⚖️ 표시로 보여 주며(끌 수 있음), 안전 브리핑에는 '재판·판결 소식' 칸에 따로 모읍니다.
        const STAGE_COURT_STRONG = /선고|징역|실형|집행\s*유예|(?<![가-힣])집유|재심|결심\s*(?:공판|재판)|불구속\s*재판|벌금형|무죄|유죄|항소|상고|판결|재판(?!매)|공판|(?:(?<![가-힣])|구속\s*|불구속\s*)기소(?!\s*의견)|법정\s*구속|감형|형량|양형|원심|파기|국민참여재판|[123]심(?![가-힣])/;
        const STAGE_COURT_WEAK = /법원|판사|재판부|대법원|검찰|지검|고검|대검|공소청/;
        const STAGE_NOW = /화재|불이?\s*나|숨져|숨진|숨졌|추락|충돌|추돌|난동|폭발|붕괴|실종|구조|대피|사고|체포|검거|붙잡|덜미|입건|구속|영장|압수\s*수색|발생|신고|출동/;
        const STAGE_POLICE = /구속|입건|검거|체포|송치|영장|압수\s*수색|수사|조사|붙잡|덜미|지명\s*수배|추적/;
        function stageOf(n) {
            if (!n) return 'incident';
            if (n.stage === 'police' || n.stage === 'incident') return n.stage;
            if (n._stage) return n._stage;
            const t = n.title || '';
            let s = 'incident';
            if (STAGE_COURT_STRONG.test(t) || (/구형/.test(t) && /징역|벌금|사형|금고|검찰/.test(t))) s = 'court';
            else if (STAGE_COURT_WEAK.test(t) && !STAGE_NOW.test(t) && !STAGE_POLICE.test(t)) s = 'court';   // '공소청 송치'는 수사 단계
            else if (STAGE_POLICE.test(t)) s = 'police';
            n._stage = s;
            return s;
        }
        function isCourt(n) { return stageOf(n) === 'court'; }
        // ---- 이 사이트에 올릴 기사인지 (실시간 사건사고 알리미 취지) ----
        //  · 재판 과정·판결 결과는 올리지 않음 ('검찰 송치'처럼 수사 단계 낱말이 있으면 수사 소식으로 보고 남김)
        //  · 해외 소식은 대한민국과 연결된 것만 (한국인·교민 피해, 한국 기업·선박, 국적기 사고, 국내 유입·송환 등)
        //  scraper.py 의 is_court_news() · korea_linked() 와 같은 기준입니다. (예전에 모아 둔 news.json 에도 바로 적용되도록 화면에서도 한 번 더 거름)
        const KOREA_LINK = /한국인|한국\s*국적|한국\s*(?:여성|남성|청년|학생|유학생|관광객|여행객|근로자|노동자|선원|선박|어선|기업|업체|공장|법인|직원|주재원|선교사|교민|가족|아동|아이)|우리\s*(?:국민|교민|선박|선원|어선|기업)|교민|재외\s*국민|한인|한국계|(?<![가-힣])韓|한국발|한국행|국적기|외교부|재외\s*공관|(?:주|駐)\s*?[가-힣]{1,8}\s*(?:한국\s*)?(?:대사관|총영사관|영사관|대사)|영사\s*(?:조력|협력|면담)|대한항공|아시아나|제주항공|티웨이|진에어|에어부산|에어서울|이스타항공|에어프레미아|국내\s*(?:유입|피해|송환|입국|조직|총책|일당)|(?:국내|한국)으?로\s*(?:송환|들여|밀반입|유입|압송)|(?:국내|한국)\s*(?:송환|압송)|밀반입/;
        const KOREA_EVENT = /사망|숨져|숨진|숨졌|사상|부상|다쳐|다쳤|중상|피격|피습|납치|감금|억류|나포|실종|사고|추락|화재|폭발|테러|총격|공격|피해|체포|구금|검거|구속|송환|압송|밀반입|비상\s*착륙|회항|고립|대피|침몰|전복|좌초|확진|감염|살해|폭행|강도|사기|도난|절도|협박/;
        const EN_KOREA = /(?<![A-Za-z])(?:South\s+)?Korean?s?(?![A-Za-z])|Seoul|Busan|Incheon|Korean\s+Air|Asiana|Jeju\s+Air|Samsung|Hyundai/i;
        function isCourtNews(n) {
            const t = (n && n.title) || '';
            if (STAGE_COURT_STRONG.test(t) || (/구형/.test(t) && /징역|벌금|사형|금고|검찰/.test(t))) return true;
            return STAGE_COURT_WEAK.test(t) && !STAGE_NOW.test(t) && !STAGE_POLICE.test(t);
        }
        // 연예 사진·근황·발언 기사, 기관 성과 홍보 기사 (scraper.py 의 NON_NEWS_RE · IDOL_RE · ACHIEVE_RE · PERSON_QUOTE_RE 와 같은 기준)
        const ENT_TAG = /\[\s*(?:사진|포토|PHOTO|화보|Oh!?\s*쎈|OSEN|★|☆|스타(?!트|벅스)|MD\s*포토|SC\s*[가-힣]|TEN\s*[가-힣]|텐\s*(?:아시아|이슈|포토)|엑['’]?s|N\s*(?:이슈|현장|인터뷰|리뷰|초점|무비)|종합\s*이슈|핫\s*이슈|직캠|움짤|PICK|연예|엔터|셀럽)[^\]]*\]|(?:Oh!?\s*쎈|OSEN)\s*(?:이슈|초점|포토|현장|리뷰|인터뷰|스타)/;
        const IDOL = /아일릿|ILLIT|뉴진스|에스파|aespa|아이브|IVE|르세라핌|BTS|방탄소년단|블랙핑크|BLACKPINK|세븐틴|스트레이\s*키즈|트와이스|엔시티|NCT|투모로우바이투게더|TXT|엔하이픈|제로베이스원|(?<![가-힣])라이즈|RIIZE|베이비몬스터|키스오브라이프|아일린|ITZY|케플러|프로미스나인|오마이걸|레드벨벳|마마무|보이넥스트도어|QWER|트리플에스|하츠투하츠|걸그룹|보이그룹|아이돌(?!보|봄)|컴백|팬미팅|팬사인회|음악방송|쇼케이스|개념\s*발언|소신\s*발언|(?:발언|과거|어록|명언)\s*(?:이|가)?\s*(?:다시\s*)?(?:재)?소환|안대\s*(?:낀|쓴)|공항\s*패션/i;
        const REAL_FACT = /구속|입건|검거|체포(?!\s*(?:하겠|할게|해\s*버릴|완료|성공|각))|송치|기소|징역|숨져|숨진|숨졌|사망|부상|다쳐|다친|다쳤|중상|화재|불이\s*나|폭발(?!적)|붕괴|추락|흉기|피습|폭행|들이받|추돌/;
        const ACHIEVE = /(?<![가-힣])성과(?!급)|실적\s*(?:발표|우수|1위|달성|공개|평가)|우수\s*(?:사례|기관|지자체|시책)|인정\s*받|인정받|효과\s*(?:톡톡|입증|거둬|거뒀|봤|확인)|\d+(?:\.\d+)?\s*%\s*(?:감소|증가|줄|늘|하락|상승|↓|↑)|환경\s*조성|(?:여성|어린이|노인)\s*안심|안심\s*(?:마을|귀갓길|골목|환경|비상벨)|(?:대상|최우수상|우수상|장관상|대통령상)\s*(?:수상|받|선정)/;
        const STRICT_FACT = /구속|입건|검거|체포|송치|기소|숨져|숨졌|숨진|다쳐|다쳤|붙잡|덜미|불이?\s*나|들이받|추돌|실형|징역/;

            window.addEventListener('resize', fitArticleFrame);

            document.addEventListener('click', (e) => {

                // 누른 버튼이 자기 창을 다시 그리면서(화면 설정의 2칸/3칸·칸 고르기 등) 이미 화면에서 빠진 경우:
                // 창 바깥을 누른 것으로 잘못 보고 창을 닫아 버리지 않도록 그냥 둠
                if (!document.contains(e.target)) return;
                if (!e.target.closest('#dateBarWrap')) toggleDateMenu(false);
                if (!e.target.closest('#layoutPanel') && !e.target.closest('[onclick="toggleLayoutPanel()"]')) toggleLayoutPanel(false);

        function initResizers() {
            const container = document.getElementById('splitContainer');
            const leftPane = document.getElementById('leftPane');
            const centerPane = document.getElementById('centerPane');
            const resizer1 = document.getElementById('resizer1');
            const resizer2 = document.getElementById('resizer2');

            let isResizing1 = false, isResizing2 = false;
            resizer1.addEventListener('mousedown', (e) => { isResizing1 = true; document.body.classList.add('resizing'); e.preventDefault(); });
            resizer2.addEventListener('mousedown', (e) => { isResizing2 = true; document.body.classList.add('resizing'); e.preventDefault(); });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing1 && !isResizing2) return;
                const rect = container.getBoundingClientRect();
                const total = rect.width;
                if (isResizing1) {
                    const w = e.clientX - rect.left;
                    if (w >= 230 && w <= total * (paneCount === 2 ? 0.78 : 0.5)) leftPane.style.width = `${(w / total) * 100}%`;
                } else if (isResizing2) {
                    const lw = leftPane.getBoundingClientRect().width;
                    const cw = e.clientX - rect.left - lw - 6;
                    if (cw >= 280) centerPane.style.width = `${(cw / total) * 100}%`;
                }
                if (map) map.invalidateSize();
            });

            document.addEventListener('mouseup', () => {
                if (isResizing1 || isResizing2) {      // 칸 너비를 바꾸면 기억해 두었다가 다음에 접속해도 그대로
                    try { localStorage.setItem(paneCount === 2 ? 'pane_w2' : 'pane_w', JSON.stringify([leftPane.style.width, centerPane.style.width])); } catch (e) {}
                }
                isResizing1 = false; isResizing2 = false; document.body.classList.remove('resizing'); fitArticleFrame();
            });
            applyPaneWidths();
        }

        const koSort = (a, b) => String(a).localeCompare(String(b), 'ko');
        function sortSidoOptions() {
            const sel = document.getElementById('sidoSelect');
            Array.from(sel.options).slice(1).sort((a, b) => koSort(a.value, b.value)).forEach(o => sel.appendChild(o));
        }
        function onSidoChange() {
            const sido = document.getElementById('sidoSelect').value;
            const sigunguSelect = document.getElementById('sigunguSelect');
            const dongSelect = document.getElementById('dongSelect');

            sigunguSelect.innerHTML = '<option value="all">시·군·구</option>';
            dongSelect.innerHTML = '<option value="all">읍·면·동</option>';
            dongSelect.disabled = true;

            if (sido === 'all') {
                sigunguSelect.disabled = true;
            } else {
                sigunguSelect.disabled = false;
                const sigungus = (regionHierarchy[sido] ? Object.keys(regionHierarchy[sido]) : []).sort(koSort);
                sigungus.forEach(sg => {
                    const opt = document.createElement('option');
                    opt.value = sg;
                    opt.textContent = sg;
                    sigunguSelect.appendChild(opt);
                });
            }
            filterByRegion();
        }
