        // 알림 소리 (별도 음원 파일 없이 브라우저가 직접 소리를 만듭니다)
        function ensureAudio() {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                if (!alertAudioCtx) alertAudioCtx = new AC();
                if (alertAudioCtx.state === 'suspended') alertAudioCtx.resume();
                return alertAudioCtx;
            } catch (e) { return null; }
        }
        function playAlertSound(name, volume) {
            const kind = name || alertCfg.sound;
            if (kind === 'none') return;
            const ctx = ensureAudio();
            if (!ctx) return;
            const vol = Math.max(0, Math.min(1, (volume == null ? alertCfg.volume : volume) / 100));
            if (vol === 0) return;
            const tone = (freq, start, dur, type) => {
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = type || 'sine';
                osc.frequency.value = freq;
                const t0 = ctx.currentTime + start;
                gain.gain.setValueAtTime(0.0001, t0);
                gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol * 0.5), t0 + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(t0); osc.stop(t0 + dur + 0.05);
            };
            if (kind === 'dingdong') { tone(880, 0, 0.45); tone(660, 0.35, 0.7); }
            else if (kind === 'bell') { tone(1318, 0, 1.2); tone(1976, 0, 0.8); tone(2637, 0, 0.5); }
            else if (kind === 'siren') { for (let i = 0; i < 6; i++) tone(i % 2 ? 980 : 720, i * 0.18, 0.18, 'square'); }
        }

        // 사진은 줄여서 글과 함께 저장, 동영상은 Firebase Storage 에 올림
        function compressImage(file, maxSide, maxBytes) {
            return new Promise((res, rej) => {
                const r = new FileReader();
                r.onerror = rej;
                r.onload = () => {
                    const img = new Image();
                    img.onerror = rej;
                    img.onload = () => {
                        let side = maxSide, q = 0.8, out = '';
                        for (let i = 0; i < 7; i++) {
                            const sc = Math.min(1, side / Math.max(img.width, img.height));
                            const c = document.createElement('canvas');
                            c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
                            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                            out = c.toDataURL('image/jpeg', q);
                            if (out.length * 0.75 <= maxBytes) break;
                            q = Math.max(0.4, q - 0.1); side = Math.round(side * 0.8);
                        }
                        res(out);
                    };
                    img.src = r.result;
                };
                r.readAsDataURL(file);
            });
        }

            if (f.type.indexOf('image/') === 0) {
                try { commAttach = { kind: 'img', dataUrl: await compressImage(f, 1280, 550 * 1024), name: f.name }; }
                catch (e) { commStatus('사진을 읽지 못했습니다.'); return; }
            } else if (f.type.indexOf('video/') === 0) {
                if (f.size > VIDEO_MAX_MB * 1024 * 1024) { commStatus('동영상은 ' + VIDEO_MAX_MB + 'MB 이하만 올릴 수 있습니다.'); return; }
                commAttach = { kind: 'video', file: f, name: f.name, preview: URL.createObjectURL(f) };
            } else { commStatus('사진 또는 동영상 파일만 올릴 수 있습니다.'); return; }
            renderCommComposer();
        }
        function commClearAttach() { commAttach = null; renderCommComposer(); }

        async function commPost() {
            const input = document.getElementById('commText');
            const text = (input.value || '').trim();
            if (!myTown) return;
            if (!text && !commAttach) { commStatus('내용을 입력하거나 사진·동영상을 첨부해 주세요.'); return; }
            if (text.length > 500) { commStatus('500자 이내로 적어 주세요.'); return; }
            if (commType !== 'sos') commType = 'report';      // 안전망에는 제보·SOS만 올라감
            const toPress = !!(document.getElementById('commPress') || {}).checked;
            const msg = Object.assign({ text: text, type: commType, ts: Date.now(), uid: COMM_UID, town: myTown.dong }, meFields());
            if (replyTo.talk) msg.replyTo = replyTo.talk;
            if (commType === 'report') {
                msg.kind = (document.getElementById('commKind') || {}).value || '기타';
                msg.place = (((document.getElementById('commPlace') || {}).value) || '').trim().slice(0, 60);
            }
            const key = townKey(myTown);
            try {
                const db = await commInit();
                if (commAttach && commAttach.kind === 'img') msg.img = commAttach.dataUrl;
                if (commAttach && commAttach.kind === 'video') {
                    if (db) {
                        commStatus('동영상을 올리는 중입니다...');
                        try { msg.video = await commUploadVideo(commAttach.file); }
                        catch (e) { console.error(e); commStatus('동영상 올리기에 실패했습니다. (Firebase Storage 설정이 필요합니다)'); return; }
                    } else { msg.video = commAttach.preview; msg.videoLocal = true; }
                }
                if (db) await commCol(key).add(msg);
                else {
                    msg.id = 'l' + Date.now() + Math.random().toString(36).slice(2, 7);
                    commMessages.unshift(msg);
                    commLocalWrite(key, commMessages);
                }
                input.value = '';
                const hadMedia = !!commAttach;
                commAttach = null;
                delete replyTo.talk;
                if (commType === 'sos') commType = 'report';
                renderCommComposer();
                renderCommMessages(true);
                commStatus('');
                if (toPress) openPressTip({ kind: msg.type === 'sos' ? 'SOS(긴급)' : (msg.kind || '기타'), place: msg.place || '', text: msg.text, ts: msg.ts, hasMedia: hadMedia });
            } catch (e) { console.error(e); commStatus('등록에 실패했습니다. 잠시 후 다시 시도해 주세요.'); }
        }

        function renderCommMsg(m, delFn) {
            const ctx = delFn === 'freeDelete' ? 'free' : 'talk';
            const mine = m.uid === COMM_UID, sos = m.type === 'sos', rep = m.type === 'report';
            const bubble = sos ? 'bg-red-50 dark:bg-red-950/70 border-red-400 text-slate-900 dark:text-red-50'
                : rep ? 'bg-amber-50 dark:bg-amber-950/60 border-amber-400 text-slate-900 dark:text-amber-50'
                : mine ? 'bg-emerald-100 dark:bg-emerald-900/80 border-emerald-300 dark:border-emerald-700 text-slate-900 dark:text-white'
                : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100';
            let media = '';
            if (m.img && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(m.img)) media += `<img src="${m.img}" onclick="openMedia(this.src)" class="mt-1 rounded-lg max-h-56 max-w-full cursor-zoom-in">`;
            const v = m.video ? (/^blob:/.test(m.video) ? m.video : safeUrl(m.video)) : '';
            if (v) media += `<video src="${esc(v)}" controls preload="metadata" class="mt-1 rounded-lg max-h-64 max-w-full"></video>`;

                        <div class="msg-bubble rounded-2xl border px-3 py-2 text-sm shadow-sm ${bubble}" style="max-width:100%;">
                            ${replyQuote(m, ctx)}
                            ${sos ? '<div class="text-[0.6875rem] font-extrabold text-red-600 dark:text-red-300 mb-0.5">🚨 SOS 긴급 도움 요청</div>' : ''}
                            ${rep ? `<div class="text-[0.6875rem] font-extrabold text-amber-700 dark:text-amber-300 mb-0.5">📢 실시간 제보 · ${esc(m.kind || '기타')}${m.place ? ' · ' + esc(m.place) : ''}</div>` : ''}
                            ${m.text ? `<p class="whitespace-pre-line break-words">${esc(m.text)}</p>` : ''}
                            ${media}
                        </div>
                        ${factRow(ctx, m, mine)}
                        ${reactRow(ctx, m, mine)}
                        ${mine ? `<button onclick="${delFn || 'commDelete'}('${esc(m.id)}')" class="text-[0.625rem] text-slate-400 hover:text-red-500 mt-0.5 px-1 rounded bg-white/70 dark:bg-slate-900/70">삭제</button>` : ''}
                    </div>
                </div>`;
        }
        function renderCommMessages(scrollBottom) {
            updateCommBadge();
            const list = document.getElementById('commList');
            if (!list) return;

            const live = commMessages.filter(m => m.type === 'sos' && now - m.ts < 86400000 && !isBlocked(m.uid)).sort((a, b) => b.ts - a.ts);
            const pinned = document.getElementById('commPinned');
            if (pinned) pinned.innerHTML = live.map(m => `<div class="px-3 py-2 bg-red-600 text-white text-xs flex items-start gap-2 border-b border-red-700"><b class="shrink-0">🚨 SOS</b><span class="flex-1 min-w-0 break-words">${esc(m.nick || '이웃')}: ${esc(m.text || '(첨부 확인)')}</span><span class="shrink-0 opacity-80">${timeAgo(m.ts)}</span></div>`).join('');
            const nearBottom = (list.scrollHeight - list.scrollTop - list.clientHeight) < 150;
            const sorted = commMessages.filter(m => !isBlocked(m.uid)).sort((a, b) => a.ts - b.ts);
            list.innerHTML = sorted.length ? sorted.map(m => renderCommMsg(m)).join('')
                : '<div class="text-center py-16 text-xs text-slate-400">아직 글이 없습니다. 첫 글을 남겨 보세요.</div>';

        // 이웃 명단 (최근 3분 안에 접속한 사람은 초록 점)
        function renderCommMembers() {
            const box = document.getElementById('commMembers');

            const list = commMembers.filter(m => !isBlocked(m.uid)).sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0));
            const isOn = m => now - (m.lastSeen || 0) < 3 * 60000;
            box.innerHTML = `<div class="px-3 py-2 text-[0.6875rem] font-bold text-slate-600 dark:text-slate-300 border-b border-slate-200 dark:border-slate-800 sticky top-0 bg-slate-50 dark:bg-slate-900">이웃 ${list.length}명 <span class="text-emerald-500">· 접속 중 ${list.filter(isOn).length}</span></div>`
                + list.map(m => `
                    <button onclick="showProfile('${esc(m.uid)}')" class="w-full flex items-center gap-2 px-3 py-1.5 text-left hover:bg-slate-200/70 dark:hover:bg-slate-800">
                        <span class="relative w-7 h-7 shrink-0">${avatarHtml(m, 'w-7 h-7', 'text-sm')}<span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2 border-white dark:border-slate-900 ${isOn(m) ? 'bg-emerald-500' : 'bg-slate-300'}"></span></span>
                        <span class="truncate text-xs text-slate-800 dark:text-slate-100">${esc(m.nick || '이웃')}${m.uid === COMM_UID ? ' (나)' : ''}</span>

        }

        // 프로필 카드
        function closeProfile() { const c = document.getElementById('commProfileCard'); if (c) c.classList.add('hidden'); }
        function showProfile(uid) {
            const card = document.getElementById('commProfileCard');
            if (!card) return;
            const mine = uid === COMM_UID;
            let m = commMembers.find(x => x.uid === uid);
            if (!m) {
                const last = commMessages.concat(freeMessages, marketItems, marketNation).find(x => x.uid === uid) || dmThreads.find(x => x.uid === uid);
                m = last ? { uid: uid, nick: last.nick, emoji: last.emoji, photo: last.photo, area: last.area } : { uid: uid };
            }
            if (mine) m = Object.assign({}, m, { nick: myNick(), emoji: commProfile.emoji, intro: commProfile.intro, joinedAt: commProfile.joinedAt, photo: myPhoto(), area: myArea() });
            if (!mine && blockedBy.has(uid)) { showAlertToast({ head: '프로필', title: '볼 수 없는 프로필입니다.' }); return; }
            const area = m.area || '';
            const posts = commMessages.filter(x => x.uid === uid).length;
            const on = m.lastSeen && Date.now() - m.lastSeen < 3 * 60000;
            card.innerHTML = `
                <div class="w-full max-w-xs bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-2xl p-5 text-center" onclick="event.stopPropagation()">
                    <div class="flex justify-center">${avatarHtml(m, 'w-20 h-20', 'text-4xl')}</div>
                    <div class="mt-2 text-base font-bold text-slate-900 dark:text-white">${esc(displayName(uid, m.nick))}${mine ? ' (나)' : ''}</div>
                    ${!mine && friendAlias(uid) ? `<div class="text-[0.625rem] text-slate-400">원래 이름: ${esc(m.nick || '이웃')}</div>` : ''}
                    <div class="text-xs font-semibold text-emerald-600 dark:text-emerald-400"><i class="fa-solid fa-location-dot"></i> ${esc(area || (myTown ? myArea() : '지역 미상'))}</div>
                    <div class="text-[0.6875rem] text-slate-500">${area && myTown && area !== myArea() ? '다른 동네 이웃' : (myTown ? esc(myTown.dong) + ' 이웃' : '')}${on || mine ? ' · <span class="text-emerald-500">접속 중</span>' : (m.lastSeen ? ' · ' + timeAgo(m.lastSeen) + ' 접속' : '')}</div>
                    <p class="mt-2 text-sm text-slate-700 dark:text-slate-200 break-words">${esc(m.intro || '아직 소개가 없습니다.')}</p>
                    <div class="mt-2 text-[0.6875rem] text-slate-500">작성한 글 ${posts}개${m.joinedAt ? ' · ' + timeAgo(m.joinedAt) + ' 가입' : ''}</div>
                    <div id="pfTrust" class="mt-1 text-[0.6875rem] font-bold text-amber-600 dark:text-amber-400">${trustHtml(trustCache[uid])}</div>
                    ${mine ? '' : `<div class="mt-2 flex items-center justify-center gap-1.5 text-[0.6875rem] text-slate-500"><span>대화 매너 평가</span><span id="mannerStars">${mannerStars(uid)}</span></div>
                    <div class="mt-3 flex flex-wrap gap-1.5 justify-center">${chatButton(uid)}${friendButtons(uid)}</div>
                    <div class="mt-1 text-[0.625rem] text-slate-400">익명 커뮤니티라 대화·친구는 상대가 수락해야 시작됩니다</div>`}
                    ${mine || !canChat(uid) ? '' : `<div class="mt-2 flex gap-2 justify-center">
                        <button onclick="closeProfile(); startCall('${esc(uid)}', profileShown.nick, false)" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 text-xs font-bold"><i class="fa-solid fa-phone"></i> 음성 통화</button>
                        <button onclick="closeProfile(); startCall('${esc(uid)}', profileShown.nick, true)" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 text-xs font-bold"><i class="fa-solid fa-video"></i> 영상 통화</button>
                    </div>`}
                    <div class="mt-3 flex gap-2 justify-center">
                        ${mine ? '<button onclick="editProfile()" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold">프로필 수정</button>' : ''}
                        <button onclick="closeProfile()" class="px-3 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold">닫기</button>
                    </div>
                    ${mine ? '' : `<div class="mt-3 pt-2 border-t border-slate-200 dark:border-slate-700">${iBlocked(uid)
                        ? `<button onclick="unblockUser('${esc(uid)}')" class="text-[0.6875rem] font-bold text-emerald-600 hover:underline">차단 해제하기</button>`
                        : `<button onclick="blockUser('${esc(uid)}', profileShown.nick, profileShown.emoji)" class="text-[0.6875rem] font-bold text-red-500 hover:underline">🚫 이 이웃 차단하기</button>`}</div>`}
                </div>`;
            card.classList.remove('hidden');
            profileShown = { uid: uid, nick: m.nick || '이웃', emoji: m.emoji || '🙂', photo: m.photo || '', area: area };
            loadTrust(uid).then(tr => { const el = document.getElementById('pfTrust'); if (el && profileShown.uid === uid) el.innerHTML = trustHtml(tr); });
        }
        let profileShown = { uid: '', nick: '', emoji: '', photo: '', area: '' };
        let commEditPhoto = null;     // 프로필 수정 중인 사진 (null=그대로, ''=지움, 그 외=새 사진)
        function editProfile(keep) {
            const card = document.getElementById('commProfileCard');
            const val = id => (document.getElementById(id) || {}).value;
            const nick = keep ? val('pfNick') : commProfile.nick, intro = keep ? val('pfIntro') : commProfile.intro;
            if (!keep) { commEditEmoji = commProfile.emoji || '🙂'; commEditPhoto = null; }
            const curPhoto = commEditPhoto === null ? myPhoto() : commEditPhoto;
            const inp = 'w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-900 dark:text-white';
            card.innerHTML = `
                <div class="w-full max-w-xs bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-2xl p-5 space-y-3" onclick="event.stopPropagation()">
                    <div class="text-sm font-bold text-slate-900 dark:text-white">내 프로필 수정</div>
                    <div class="flex items-center gap-3">
                        ${avatarHtml({ photo: curPhoto, emoji: commEditEmoji }, 'w-16 h-16', 'text-3xl')}
                        <div class="flex flex-col gap-1.5">
                            <input id="pfFile" type="file" accept="image/*" class="hidden" onchange="pickProfilePhoto(this)">
                            <button onclick="document.getElementById('pfFile').click()" class="px-3 py-1.5 rounded-lg border border-emerald-500 text-emerald-600 dark:text-emerald-400 text-xs font-bold hover:bg-emerald-50 dark:hover:bg-slate-800"><i class="fa-solid fa-image"></i> 내 앨범에서 사진 고르기</button>
                            ${curPhoto ? '<button onclick="commEditPhoto = \'\'; editProfile(true)" class="text-[0.6875rem] text-red-500 hover:underline text-left">사진 지우고 아이콘 쓰기</button>' : '<span class="text-[0.625rem] text-slate-400">사진이 없으면 아래 아이콘이 쓰입니다</span>'}
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-1.5 justify-center">
                        ${COMM_EMOJIS.map(e => `<button onclick="pickEmoji('${e}')" class="w-9 h-9 rounded-full text-xl border ${commEditEmoji === e ? 'border-emerald-500 ring-2 ring-emerald-400 bg-emerald-50 dark:bg-emerald-950' : 'border-slate-300 dark:border-slate-600'}">${e}</button>`).join('')}
                    </div>
                    <input id="pfNick" type="text" maxlength="12" placeholder="닉네임 (최대 12자)" class="${inp}">
                    <input id="pfIntro" type="text" maxlength="40" placeholder="한 줄 소개 (최대 40자)" class="${inp}">
                    <div class="flex gap-2 justify-end">
                        <button onclick="closeProfile()" class="px-3 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold">취소</button>
                        <button onclick="saveProfile()" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold">저장</button>
                    </div>
                </div>`;
            document.getElementById('pfNick').value = nick || '';
            document.getElementById('pfIntro').value = intro || '';
            card.classList.remove('hidden');
        }
        function pickEmoji(e) { commEditEmoji = e; editProfile(true); }
        async function pickProfilePhoto(input) {
            const f = input.files && input.files[0];
            input.value = '';
            if (!f || f.type.indexOf('image/') !== 0) return;
            try { commEditPhoto = await compressImage(f, 160, 14 * 1024); } catch (e) { showAlertToast({ head: '프로필', title: '사진을 읽지 못했습니다.' }); return; }
            editProfile(true);
        }
        function saveProfile() {
            commProfile.nick = (document.getElementById('pfNick').value || '').trim().slice(0, 12);
            commProfile.intro = (document.getElementById('pfIntro').value || '').trim().slice(0, 40);
            commProfile.emoji = commEditEmoji || '🙂';
            if (commEditPhoto !== null) commProfile.photo = commEditPhoto;
            commEditPhoto = null;
            lsSet('comm_profile', JSON.stringify(commProfile));
            closeProfile();
            commTouch();
            renderCommMembers();
            renderCommMessages(); renderFreeMessages();
        }

        // 사진 크게 보기
        function openMedia(src) {
            const v = document.getElementById('commMediaView');
            document.getElementById('commMediaImg').src = src;
            v.classList.remove('hidden');
        }
        function closeMedia() { document.getElementById('commMediaView').classList.add('hidden'); }

        // ---- 장터 (물건 사고팔기·교환·나눔) ----
        const MARKET_KINDS = ['판매', '교환', '나눔', '구함'];
        function kindLabel(k) { return (!k || k === '판매') ? '판매중' : k; }
        const IMG_DATA_RE = /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/;
        let commTab = 'talk';         // 'talk'(사건사고·이야기) / 'market'(장터)
        let marketItems = [], marketUnsub = null, marketOpen = null, marketChat = [], marketChatUnsub = null;
        let marketForm = false, marketAttach = null, marketFilter = '전체';
        let marketScope = 'town';     // 'town'(우리 동네 장터) / 'nation'(전국 장터)
        let marketNation = [], marketNationUnsub = null, marketQuery = '';

        function marketCol() { return commDoc(townKey(myTown)).collection('market'); }
        function marketColFor(tk) { return commDoc(tk || townKey(myTown)).collection('market'); }   // 물건이 올라온 동네의 장터
        function marketNationCol() { return commDb.collection('marketNational'); }                  // 전국 장터용 목록 (모든 동네의 물건이 함께 올라감)
        function marketFind(id) { return marketItems.find(x => x.id === id) || marketNation.find(x => x.id === id) || null; }
        async function subscribeMarketNation() {
            if (marketNationUnsub) { marketNationUnsub(); marketNationUnsub = null; }
            const db = await commInit();
            if (db) {
                marketNationUnsub = marketNationCol().orderBy('ts', 'desc').limit(300).onSnapshot(snap => {
                    marketNation = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
                    if (commTab === 'market' && marketScope === 'nation' && !marketOpen && !marketForm) renderMarket();
                }, err => console.error(err));
            } else { marketNation = marketItems.slice(); if (commTab === 'market') renderMarket(); }
        }
        function setMarketScope(sc) {
            marketScope = sc; marketOpen = null; stopMarketChat();
            if (sc === 'nation') subscribeMarketNation();
            else if (marketNationUnsub) { marketNationUnsub(); marketNationUnsub = null; }
            renderMarket();
        }
        function setMarketQuery(v) {
            marketQuery = (v || '').trim();
            renderMarket();
            const el = document.getElementById('mkSearch');
            if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} }
        }
        function marketLocalKey() { return 'comm_market_' + townKey(myTown); }
        function marketLocalSave() {
            const list = marketItems.slice(0, 100);
            if (!lsSet(marketLocalKey(), JSON.stringify(list))) lsSet(marketLocalKey(), JSON.stringify(list.map(i => Object.assign({}, i, { img: '' }))));
        }
        async function subscribeMarket() {
            if (marketUnsub) { marketUnsub(); marketUnsub = null; }
            if (!myTown) return;
            const db = await commInit();
            if (db) {
                marketUnsub = marketCol().orderBy('ts', 'desc').limit(100).onSnapshot(snap => {
                    marketItems = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
                    if (commTab === 'market') renderMarket();
                }, err => console.error(err));
            } else {
                try { marketItems = JSON.parse(lsGet(marketLocalKey()) || '[]'); } catch (e) { marketItems = []; }
                if (commTab === 'market') renderMarket();
            }
        }
        function stopMarketChat() { if (marketChatUnsub) { marketChatUnsub(); marketChatUnsub = null; } }
        function setCommTab(tab) {
            commTab = tab; marketOpen = null; marketForm = false; stopMarketChat();
            meetChatWith = null; meetMsg = '';
            renderCommunity();
            if (tab === 'market') { subscribeMarket(); if (marketScope === 'nation') subscribeMarketNation(); }
            if (tab === 'dm') subscribeDM();
            if (tab === 'meet') subscribeMeet();
            if (tab === 'free') subscribeFree();
            if (tab === 'friends') subscribeFriends();
            if (tab === 'praise') subscribePraise();
            if (tab !== 'dm') { dmWith = null; if (dmUnsub) { dmUnsub(); dmUnsub = null; } }
        }
        function setMarketFilter(f) { marketFilter = f; renderMarket(); }
        function openMarketForm(show) { marketForm = show; marketAttach = null; renderMarket(); }
        function marketStatus(m) { const el = document.getElementById('mkStatus'); if (el) el.textContent = m || ''; }

        async function marketPickFile(input) {
            const f = input.files && input.files[0];
            input.value = '';
            if (!f || f.type.indexOf('image/') !== 0) { marketStatus('사진 파일만 올릴 수 있습니다.'); return; }
            try { marketAttach = await compressImage(f, 1024, 350 * 1024); } catch (e) { marketStatus('사진을 읽지 못했습니다.'); return; }
            const p = document.getElementById('mkPreview');
            if (p) p.innerHTML = `<img src="${marketAttach}" class="h-20 rounded border border-slate-300">`;
        }

        async function marketPost() {
            const v = id => ((document.getElementById(id) || {}).value || '').trim();
            const title = v('mkTitle');
            if (!title) { marketStatus('물건 이름을 적어 주세요.'); return; }
            const item = Object.assign({
                kind: v('mkKind') || '판매', title: title.slice(0, 40), price: v('mkPrice').slice(0, 20), desc: v('mkDesc').slice(0, 500),
                contact: v('mkContact').slice(0, 60), img: marketAttach || '', status: 'open',
                uid: COMM_UID, ts: Date.now(), townKey: townKey(myTown)
            }, meFields());
            try {
                const db = await commInit();
                if (db) {
                    const ref = marketCol().doc();
                    await ref.set(item);
                    try { await marketNationCol().doc(ref.id).set(item); } catch (e) { console.error(e); }   // 전국 장터에도 함께 올림
                }
                else { item.id = 'm' + Date.now() + Math.random().toString(36).slice(2, 7); item.chat = []; marketItems.unshift(item); marketLocalSave(); }
                marketForm = false; marketAttach = null;
                renderMarket();
            } catch (e) { console.error(e); marketStatus('등록에 실패했습니다. 잠시 후 다시 시도해 주세요.'); }
        }
        async function marketSetStatus(id, status) {
            const it = marketFind(id);
            try {
                const db = await commInit();
                if (db) {
                    await marketColFor(it && it.townKey).doc(id).update({ status: status });
                    marketNationCol().doc(id).update({ status: status }).catch(() => {});
                } else { if (it) { it.status = status; marketLocalSave(); renderMarket(); } }
            } catch (e) { console.error(e); }
        }
        async function marketDelete(id) {
            if (!confirm('이 물건 글을 삭제할까요?')) return;
            const it = marketFind(id);
            try {
                const db = await commInit();
                if (db) {
                    await marketColFor(it && it.townKey).doc(id).delete();
                    marketNationCol().doc(id).delete().catch(() => {});
                } else { marketItems = marketItems.filter(x => x.id !== id); marketNation = marketNation.filter(x => x.id !== id); marketLocalSave(); }
                closeMarketItem();
            } catch (e) { console.error(e); }
        }
        async function openMarketItem(id) {
            marketOpen = id; marketChat = []; stopMarketChat();
            const it = marketFind(id);
            const db = await commInit();
            if (db) {
                marketChatUnsub = marketColFor(it && it.townKey).doc(id).collection('chat').orderBy('ts', 'asc').limit(200).onSnapshot(snap => {
                    marketChat = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
                    renderMarketChat();
                }, err => console.error(err));
            } else { marketChat = (it && it.chat) || []; }
            renderMarket();
        }
        function closeMarketItem() { marketOpen = null; stopMarketChat(); renderMarket(); }
        async function marketChatSend() {
            const input = document.getElementById('mkChatText');
            const text = ((input && input.value) || '').trim();
            if (!text || !marketOpen) return;
            const msg = Object.assign({ text: text.slice(0, 300), uid: COMM_UID, ts: Date.now() }, meFields());
            const cur = marketFind(marketOpen);
            if (cur && isBlocked(cur.uid)) return;
            try {
                const db = await commInit();

                        <input id="mkContact" type="text" maxlength="60" placeholder="연락 방법 (선택 · 예: 오픈채팅 주소) — 비워 두면 아래 문의 채팅으로만 연락" class="${inp}">

                        <button onclick="marketPost()" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold">등록하기</button>
                        <p class="text-[0.6875rem] text-slate-400">거래는 사람이 많은 곳에서 직접 만나서 하고, 먼저 돈을 보내 달라는 요구는 조심하세요.</p>

            // 2) 물건 상세 + 문의 채팅

                            <div class="mt-1 text-[0.6875rem] text-slate-500 flex flex-wrap items-center gap-1.5"><button onclick="showProfile('${esc(it.uid)}')" class="hover:underline inline-flex items-center gap-1">${avatarHtml(it, 'w-5 h-5', 'text-xs')} ${esc(it.nick || '이웃')}</button> · ${timeAgo(it.ts)}
                                <span class="px-1.5 py-0.5 rounded bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 font-bold"><i class="fa-solid fa-location-dot"></i> ${esc(it.area || myArea())}</span>
                                ${mine ? '' : `<button onclick="openDM('${esc(it.uid)}', marketFind('${esc(it.id)}').nick, marketFind('${esc(it.id)}').emoji, marketFind('${esc(it.id)}').photo, marketFind('${esc(it.id)}').area)" class="px-2 py-0.5 rounded bg-sky-600 hover:bg-sky-500 text-white font-bold"><i class="fa-solid fa-comment"></i> 글쓴이와 1:1 대화</button>`}
                            </div>
                            ${it.area && myTown && it.area !== myArea() ? '<div class="mt-1 text-[0.6875rem] text-amber-700 dark:text-amber-300">다른 동네에 올라온 물건입니다. 택배 거래를 할 때는 먼저 돈을 보내 달라는 요구를 특히 조심하세요.</div>' : ''}

                        <div id="mkRating">${tradeRatingHtml(it)}</div>
                        ${it.contact ? `<div class="text-xs text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 rounded-lg px-3 py-2">연락 방법: <b class="select-all">${esc(it.contact)}</b></div>` : ''}
                        <div class="pt-2 border-t border-slate-200 dark:border-slate-800">
                            <div class="text-xs font-bold text-slate-700 dark:text-slate-200 mb-2">💬 문의 채팅 <span class="font-normal text-slate-400">(이 물건을 보는 사람에게 공개됩니다)</span></div>
                            <div id="mkChat" class="space-y-2"></div>

                    </div>
                    <div class="border-t border-slate-200 dark:border-slate-800 p-3 flex items-end gap-2 shrink-0 bg-white dark:bg-slate-900">
                        ${emojiBtn('mkChatText')}
                        <textarea id="mkChatText" rows="1" maxlength="300" placeholder="${mine ? '문의에 답해 주세요' : '글쓴이에게 물어보세요 (예: 아직 있나요?)'}" class="flex-1 min-w-0 bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-2 text-sm text-slate-900 dark:text-white"></textarea>
                        <button onclick="marketChatSend()" class="px-4 py-2 rounded-lg text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-500 whitespace-nowrap">보내기</button>
                    </div>`;
                renderMarketChat();
                return;
            }

            // 3) 목록 (우리 동네 / 전국)
            const nation = marketScope === 'nation';
            const q = marketQuery.toLowerCase();
            const list = (nation ? marketNation : marketItems).filter(x => !isBlocked(x.uid) && (marketFilter === '전체' || x.kind === marketFilter)
                && (!q || ((x.title || '') + ' ' + (x.desc || '') + ' ' + (x.area || '')).toLowerCase().includes(q)));
            const chip = f => `<button onclick="setMarketFilter('${f}')" class="px-2.5 py-1 rounded-full text-[0.6875rem] font-bold border ${marketFilter === f ? 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 border-transparent' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-300 dark:border-slate-600'}">${f === '전체' ? f : kindLabel(f)}</button>`;
            const scopeBtn = (sc, label) => `<button onclick="setMarketScope('${sc}')" class="px-3 py-1.5 text-xs font-bold ${marketScope === sc ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'}">${label}</button>`;
            main.innerHTML = `
                <div class="px-3 py-2 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2 shrink-0">
                    <div class="inline-flex rounded-lg overflow-hidden border border-emerald-600">${scopeBtn('town', '🏘 우리 동네')}${scopeBtn('nation', '🌐 전국 장터 보기')}</div>
                    <button onclick="openMarketForm(true)" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold"><i class="fa-solid fa-plus"></i> 물건 올리기</button>
                </div>
                <div class="px-3 py-2 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center gap-2 shrink-0">
                    <div class="flex flex-wrap items-center gap-1.5">${['전체'].concat(MARKET_KINDS).map(chip).join('')}</div>
                    <input id="mkSearch" type="search" placeholder="${nation ? '전국에서 물건 찾기 (물건 이름·지역)' : '우리 동네에서 물건 찾기'}" onchange="setMarketQuery(this.value)" onkeydown="if (event.key === 'Enter') setMarketQuery(this.value)" class="flex-1 min-w-[8rem] bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1 text-xs text-slate-900 dark:text-white">
                </div>
                ${nation ? `<div class="px-3 py-1.5 text-[0.6875rem] bg-sky-50 dark:bg-sky-950/30 text-sky-800 dark:text-sky-200 border-b border-sky-200 dark:border-sky-800 shrink-0">전국 모든 동네에 올라온 물건입니다. 물건마다 올린 사람의 지역이 표시되고, 물건을 누르면 다른 동네 이웃과도 문의 채팅·1:1 대화를 할 수 있습니다.${FIREBASE_CONFIG ? '' : ' (체험 모드에서는 이 기기에서 올린 물건만 보입니다)'}</div>` : ''}
                <div class="flex-1 min-h-0 overflow-y-auto custom-scrollbar p-3">
                    ${list.length ? `<div class="grid grid-cols-2 md:grid-cols-3 gap-3">` + list.map(x => `
                        <button onclick="openMarketItem('${esc(x.id)}')" class="text-left rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 overflow-hidden hover:border-emerald-500 transition ${x.status === 'done' ? 'opacity-50' : ''}">
                            <div class="h-28 bg-slate-100 dark:bg-slate-800 flex items-center justify-center overflow-hidden">${x.img && IMG_DATA_RE.test(x.img) ? `<img src="${x.img}" class="w-full h-full object-cover">` : '<span class="text-3xl">📦</span>'}</div>
                            <div class="p-2">
                                <div class="flex items-center gap-1">${badge(x.kind)}${x.status === 'done' ? '<span class="text-[0.625rem] font-bold px-1.5 py-0.5 rounded bg-slate-400 text-white">완료</span>' : ''}</div>
                                <div class="mt-1 text-xs font-bold text-slate-900 dark:text-white truncate">${esc(x.title)}</div>
                                <div class="text-xs font-extrabold text-emerald-600 truncate">${esc(x.price || (x.kind === '나눔' ? '무료 나눔' : '가격 문의'))}</div>
                                <div class="text-[0.625rem] text-slate-500 truncate"><i class="fa-solid fa-location-dot text-emerald-500"></i> ${esc(shortArea(x.area) || (myTown ? myTown.dong : ''))}</div>
                                <div class="text-[0.625rem] text-slate-500 truncate">${esc(x.nick || '이웃')} · ${timeAgo(x.ts)}</div>
                            </div>
                        </button>`).join('') + `</div>` : `<div class="text-center py-12 text-xs text-slate-400 space-y-3"><div>${q ? '찾는 물건이 ' + (nation ? '전국 장터에' : '우리 동네에') + ' 없습니다.' : '아직 올라온 물건이 없습니다. 첫 물건을 올려 보세요.'}</div>${nation ? '' : '<button onclick="setMarketScope(\'nation\')" class="px-4 py-2 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-bold">🌐 전국 장터에서 찾아보기</button>'}</div>`}
                </div>`;
            const se = document.getElementById('mkSearch'); if (se) se.value = marketQuery;
        }

        // ---- 동네 친구 (같은 시·군·구 이웃과 서로 '좋아요'를 누르면 1:1 대화) ----
        const MEET_AGES = ['20대', '30대', '40대', '50대', '60대 이상'];
        const MEET_SAMPLES = [
            { uid: 'sample1', sample: true, nick: '예시 · 산책메이트', emoji: '🐶', age: '30대', intro: '저녁에 강아지 산책 같이 하실 분 찾아요.', tags: '산책, 반려견, 커피' },
            { uid: 'sample2', sample: true, nick: '예시 · 주말러너', emoji: '🌳', age: '20대', intro: '주말 아침 러닝 크루 만들고 싶어요.', tags: '러닝, 등산, 맛집' },
            { uid: 'sample3', sample: true, nick: '예시 · 동네책방', emoji: '⭐', age: '40대', intro: '한 달에 한 번 책 읽고 이야기 나눠요.', tags: '독서, 영화, 보드게임' }
        ];
        let meetProfile = (() => { try { return JSON.parse(lsGet('meet_profile') || 'null'); } catch (e) { return null; } })();
        let meetView = 'browse';      // 'browse'(둘러보기) / 'matches'(매칭·대화) / 'edit'(내 카드)
        let meetProfiles = [], meetLikesOut = new Set(), meetLikesIn = new Set(), meetUnsubs = [];
        let meetSeen = new Set((() => { try { return JSON.parse(lsGet('meet_seen') || '[]'); } catch (e) { return []; } })());
        let meetChatWith = null, meetChat = [], meetChatUnsub = null, meetPhoto = null, meetMsg = '';

        function meetKey() { return [myTown.sido, myTown.sigungu].join('_').replace(/[\s\/.#$\[\]]/g, ''); }
        function meetArea() { return myTown.sido + ' ' + myTown.sigungu; }
        function meetDoc() { return commDb.collection('meet').doc(meetKey()); }
        function pairId(a, b) { return [a, b].sort().join('__'); }
        function meetMatches() { return meetProfiles.filter(p => !isBlocked(p.uid) && meetLikesOut.has(p.uid) && meetLikesIn.has(p.uid)); }
        function stopMeet() { meetUnsubs.forEach(u => u()); meetUnsubs = []; if (meetChatUnsub) { meetChatUnsub(); meetChatUnsub = null; } }

        async function subscribeMeet() {
            stopMeet();
            if (!myTown || !meetProfile) { if (commTab === 'meet') renderMeet(); return; }
            const db = await commInit();
            if (!db) { meetProfiles = MEET_SAMPLES.slice(); if (commTab === 'meet') renderMeet(); return; }
            meetUnsubs.push(meetDoc().collection('profiles').orderBy('ts', 'desc').limit(200).onSnapshot(snap => {
                meetProfiles = snap.docs.map(d => d.data()).filter(p => p.uid !== COMM_UID);
                if (commTab === 'meet' && !meetChatWith) renderMeet();
            }, err => console.error(err)));
            meetUnsubs.push(meetDoc().collection('likes').where('from', '==', COMM_UID).onSnapshot(snap => {
                meetLikesOut = new Set(snap.docs.map(d => d.data().to));
                if (commTab === 'meet' && !meetChatWith) renderMeet();
            }, err => console.error(err)));
            let first = true;
            meetUnsubs.push(meetDoc().collection('likes').where('to', '==', COMM_UID).onSnapshot(snap => {
                if (!first) snap.docChanges().forEach(ch => {      // 내가 좋아요 한 사람이 나를 좋아요 → 매칭 알림
                    const from = ch.doc.data().from;
                    if (ch.type === 'added' && meetLikesOut.has(from)) meetNotifyMatch(from);
                });
                first = false;
                meetLikesIn = new Set(snap.docs.map(d => d.data().from));
                if (commTab === 'meet' && !meetChatWith) renderMeet();
            }, err => console.error(err)));
        }
        function meetNotifyMatch(uid) {
            const p = meetProfiles.find(x => x.uid === uid);
            showAlertToast({ head: '💞 동네 친구 매칭', title: (p ? p.nick : '이웃') + '님과 서로 좋아요를 눌렀어요. 대화를 시작해 보세요.', foot: meetArea(), openCommunity: true });
            playAlertSound();
        }

        async function meetPickPhoto(input) {
            const f = input.files && input.files[0];
            input.value = '';
            if (!f || f.type.indexOf('image/') !== 0) return;
            try { meetPhoto = await compressImage(f, 640, 200 * 1024); } catch (e) { return; }
            const p = document.getElementById('mtPreview');
            if (p) p.innerHTML = `<img src="${meetPhoto}" class="h-16 w-16 object-cover rounded-full border border-slate-300">`;
        }
        async function meetSaveProfile() {
            const v = id => ((document.getElementById(id) || {}).value || '').trim();
            const adult = (document.getElementById('mtAdult') || {}).checked;
            if (!adult) { meetMsg = '만 19세 이상만 이용할 수 있습니다. 확인란에 체크해 주세요.'; renderMeet(); return; }
            if (!v('mtIntro')) { meetMsg = '한 줄 소개를 적어 주세요.'; renderMeet(); return; }
            meetProfile = {
                uid: COMM_UID, nick: myNick(), emoji: commProfile.emoji || '🙂', age: v('mtAge') || '30대', intro: v('mtIntro').slice(0, 80),
                tags: v('mtTags').slice(0, 60), photo: meetPhoto || (meetProfile && meetProfile.photo) || '', adult: true, ts: Date.now()
            };
            lsSet('meet_profile', JSON.stringify(meetProfile));
            meetPhoto = null; meetMsg = ''; meetView = 'browse';
            try { const db = await commInit(); if (db) await meetDoc().collection('profiles').doc(COMM_UID).set(meetProfile); } catch (e) { console.error(e); }
            subscribeMeet();
            renderMeet();
        }
        async function meetLeave() {
            if (!confirm('동네 친구에서 내 카드를 내릴까요? 다른 이웃에게 더 이상 보이지 않습니다.')) return;
            try { const db = await commInit(); if (db) await meetDoc().collection('profiles').doc(COMM_UID).delete(); } catch (e) { console.error(e); }
            meetProfile = null; lsSet('meet_profile', 'null'); stopMeet(); meetProfiles = [];
            renderMeet();
        }
        function meetQueue() { return meetProfiles.filter(p => !isBlocked(p.uid) && !meetSeen.has(p.uid) && !meetLikesOut.has(p.uid)); }
        function meetMarkSeen(uid) { meetSeen.add(uid); lsSet('meet_seen', JSON.stringify(Array.from(meetSeen).slice(-500))); }
        function meetPass(uid) { meetMarkSeen(uid); renderMeet(); }
        async function meetLike(uid) {
            meetMarkSeen(uid);
            const p = meetProfiles.find(x => x.uid === uid);
            if (p && p.sample) { meetMsg = '예시 카드입니다. 체험 모드에서는 실제 매칭이 되지 않습니다.'; renderMeet(); return; }
            meetLikesOut.add(uid);
            try {
                const db = await commInit();
                if (db) await meetDoc().collection('likes').doc(COMM_UID + '__' + uid).set({ from: COMM_UID, to: uid, ts: Date.now() });
            } catch (e) { console.error(e); }
            if (meetLikesIn.has(uid)) meetNotifyMatch(uid);
            renderMeet();
        }
        function meetResetSeen() { meetSeen = new Set(); lsSet('meet_seen', '[]'); meetMsg = ''; renderMeet(); }
        function setMeetView(v) { meetView = v; meetMsg = ''; meetChatWith = null; if (meetChatUnsub) { meetChatUnsub(); meetChatUnsub = null; } renderMeet(); }

        async function openMeetChat(uid) {
            meetChatWith = uid; meetChat = [];
            if (meetChatUnsub) { meetChatUnsub(); meetChatUnsub = null; }
            const db = await commInit();
            if (db) {
                meetChatUnsub = meetDoc().collection('chats').doc(pairId(COMM_UID, uid)).collection('messages').orderBy('ts', 'asc').limit(300).onSnapshot(snap => {
                    meetChat = snap.docs.map(d => d.data());
                    renderMeetChat();
                }, err => console.error(err));
            }
            renderMeet();
        }
        async function meetChatSend() {
            const input = document.getElementById('mtChatText');
            const text = ((input && input.value) || '').trim();
            if (!text || !meetChatWith) return;
            const msg = { uid: COMM_UID, text: text.slice(0, 300), ts: Date.now() };
            try {
                const db = await commInit();
                if (db) await meetDoc().collection('chats').doc(pairId(COMM_UID, meetChatWith)).collection('messages').add(msg);
                else { meetChat.push(msg); renderMeetChat(); }
                input.value = '';
            } catch (e) { console.error(e); }
        }
        function renderMeetChat() {
            const box = document.getElementById('mtChat');
            if (!box) return;
            box.innerHTML = meetChat.length ? meetChat.map(m => {
                const mine = m.uid === COMM_UID;
                return `<div class="flex ${mine ? 'justify-end' : 'justify-start'}"><div style="max-width:78%;" class="rounded-2xl border px-3 py-1.5 text-sm ${mine ? 'bg-pink-100 dark:bg-pink-900/70 border-pink-300 dark:border-pink-700 text-slate-900 dark:text-white' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100'}"><span class="whitespace-pre-line break-words">${esc(m.text)}</span><div class="text-[0.625rem] text-slate-400 mt-0.5">${timeAgo(m.ts)}</div></div></div>`;
            }).join('') : '<div class="text-center py-10 text-xs text-slate-400">첫 인사를 건네 보세요.</div>';
            box.scrollTop = box.scrollHeight;
        }

        function meetAvatar(p, size) {
            return p.photo && IMG_DATA_RE.test(p.photo)
                ? `<img src="${p.photo}" class="${size} object-cover rounded-full border border-slate-300 dark:border-slate-600">`
                : `<div class="${size} rounded-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-600 flex items-center justify-center" style="font-size:2.2em;">${esc(p.emoji || '🙂')}</div>`;
        }

        function renderMeet() {
            const main = document.getElementById('commMain');
            if (!main) return;
            const inp = 'w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-900 dark:text-white';
            const msg = meetMsg ? `<p class="text-xs text-amber-600 dark:text-amber-400 text-center">${esc(meetMsg)}</p>` : '';

            // 1) 내 카드 만들기 / 수정
            if (!meetProfile || meetView === 'edit') {
                const p = meetProfile || {};
                main.innerHTML = `
                    <div class="flex-1 min-h-0 overflow-y-auto custom-scrollbar p-4 space-y-3">
                        <div class="flex items-center justify-between"><b class="text-sm text-slate-900 dark:text-white">💞 동네 친구 · 내 카드 ${meetProfile ? '수정' : '만들기'}</b>${meetProfile ? '<button onclick="setMeetView(\'browse\')" class="text-xs text-blue-500 hover:underline">← 돌아가기</button>' : ''}</div>
                        <div class="rounded-xl bg-pink-50 dark:bg-pink-950/30 border border-pink-200 dark:border-pink-800 p-3 text-xs text-slate-700 dark:text-slate-200 leading-relaxed">
                            <b>${esc(meetArea())}</b> 이웃의 카드를 넘겨 보다가 서로 <b>좋아요</b>를 누르면 1:1 대화가 열립니다. 닉네임과 아이콘은 커뮤니티 프로필을 그대로 씁니다.
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <select id="mtAge" class="${inp}">${MEET_AGES.map(a => `<option value="${a}" ${p.age === a ? 'selected' : ''}>${a}</option>`).join('')}</select>
                            <input id="mtTags" type="text" maxlength="60" placeholder="관심사 (예: 산책, 러닝, 커피)" class="col-span-2 ${inp}">
                        </div>
                        <input id="mtIntro" type="text" maxlength="80" placeholder="한 줄 소개 (최대 80자)" class="${inp}">
                        <div class="flex items-center gap-3">
                            <input id="mtFile" type="file" accept="image/*" class="hidden" onchange="meetPickPhoto(this)">
                            <button onclick="document.getElementById('mtFile').click()" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 text-xs text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700"><i class="fa-solid fa-camera"></i> 사진 (선택)</button>
                            <span id="mtPreview">${p.photo && IMG_DATA_RE.test(p.photo) ? `<img src="${p.photo}" class="h-16 w-16 object-cover rounded-full border border-slate-300">` : ''}</span>
                        </div>
                        <label class="flex items-start gap-2 text-xs text-slate-700 dark:text-slate-200"><input id="mtAdult" type="checkbox" class="mt-0.5" ${p.adult ? 'checked' : ''}><span>저는 <b>만 19세 이상</b>입니다. (미성년자는 이용할 수 없습니다)</span></label>
                        ${msg}
                        <button onclick="meetSaveProfile()" class="w-full py-2.5 rounded-xl bg-pink-600 hover:bg-pink-500 text-white text-sm font-bold">${meetProfile ? '저장' : '내 카드 올리고 시작하기'}</button>
                        ${meetProfile ? '<button onclick="meetLeave()" class="w-full py-2 rounded-xl text-xs text-red-500 hover:underline">내 카드 내리기 (그만 이용하기)</button>' : ''}
                        <p class="text-[0.6875rem] text-slate-400 leading-relaxed">처음 만날 때는 사람이 많은 공개된 장소에서 만나고, 돈을 요구하거나 개인정보를 캐묻는 상대는 조심하세요.</p>
                    </div>`;
                document.getElementById('mtTags').value = p.tags || '';
                document.getElementById('mtIntro').value = p.intro || '';
                return;
            }

            // 2) 1:1 대화
            if (meetChatWith) {
                const p = meetProfiles.find(x => x.uid === meetChatWith) || { nick: '이웃' };
                main.innerHTML = `
                    <div class="px-3 py-2 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between shrink-0">
                        <button onclick="setMeetView('matches')" class="text-xs text-blue-500 hover:underline">← 매칭 목록</button>
                        <b class="text-xs text-slate-800 dark:text-slate-100">${esc(p.emoji || '🙂')} ${esc(p.nick)} · ${esc(p.age || '')}</b>
                    </div>
                    <div id="mtChat" class="flex-1 min-h-0 overflow-y-auto custom-scrollbar p-3 space-y-2"></div>
                    <div class="border-t border-slate-200 dark:border-slate-800 p-3 flex items-end gap-2 shrink-0 bg-white dark:bg-slate-900">
                        ${emojiBtn('mtChatText')}
                        <textarea id="mtChatText" rows="1" maxlength="300" placeholder="메시지를 입력하세요" class="flex-1 min-w-0 bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-2 text-sm text-slate-900 dark:text-white"></textarea>
                        <button onclick="meetChatSend()" class="px-4 py-2 rounded-lg text-sm font-bold text-white bg-pink-600 hover:bg-pink-500 whitespace-nowrap">보내기</button>
                    </div>`;
                renderMeetChat();
                return;
            }

            const matches = meetMatches();
            const tab = (v, label) => `<button onclick="setMeetView('${v}')" class="px-2.5 py-1 rounded-full text-[0.6875rem] font-bold border ${meetView === v ? 'bg-pink-600 text-white border-pink-700' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-300 dark:border-slate-600'}">${label}</button>`;
            const head = `
                <div class="px-3 py-2 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2 shrink-0">
                    <div class="flex items-center gap-1.5">${tab('browse', '카드 둘러보기')}${tab('matches', '매칭·대화 ' + matches.length)}</div>
                    <button onclick="setMeetView('edit')" class="text-xs text-blue-500 hover:underline">내 카드 수정</button>
                </div>`;

            // 3) 매칭 목록
            if (meetView === 'matches') {
                main.innerHTML = head + `<div class="flex-1 min-h-0 overflow-y-auto custom-scrollbar p-3 space-y-2">${matches.length ? matches.map(p => `
                    <button onclick="openMeetChat('${esc(p.uid)}')" class="w-full flex items-center gap-3 p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:border-pink-500 text-left">
                        ${meetAvatar(p, 'w-12 h-12 text-xs')}
                        <div class="min-w-0"><div class="text-sm font-bold text-slate-900 dark:text-white truncate">${esc(p.nick)} <span class="text-xs font-normal text-slate-500">${esc(p.age || '')}</span></div><div class="text-xs text-slate-500 truncate">${esc(p.intro || '')}</div></div>
                        <span class="ml-auto text-xs font-bold text-pink-600 shrink-0">대화하기 ›</span>
                    </button>`).join('') : '<div class="text-center py-16 text-xs text-slate-400">아직 매칭된 이웃이 없습니다. 서로 좋아요를 누르면 여기에 나타납니다.</div>'}</div>`;
                return;
            }

            // 4) 카드 둘러보기 (한 장씩)
            const queue = meetQueue();
            const p = queue[0];
            main.innerHTML = head + `
                <div class="flex-1 min-h-0 overflow-y-auto custom-scrollbar p-4 flex flex-col items-center justify-center gap-3">
                    ${FIREBASE_CONFIG ? '' : '<div class="text-[0.6875rem] text-amber-700 dark:text-amber-300 text-center">체험 모드: 아래는 화면을 보여 주기 위한 <b>예시 카드</b>입니다. 서버를 연결하면 실제 이웃 카드가 나옵니다.</div>'}
                    ${p ? `
                    <div class="w-full max-w-xs rounded-3xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-xl p-6 text-center">
                        <div class="flex justify-center">${meetAvatar(p, 'w-28 h-28 text-base')}</div>
                        <div class="mt-3 text-lg font-extrabold text-slate-900 dark:text-white break-words">${esc(p.nick)}</div>
                        <div class="text-xs text-slate-500">${esc(p.age || '')} · ${esc(myTown.sigungu)}</div>
                        <p class="mt-2 text-sm text-slate-700 dark:text-slate-200 break-words">${esc(p.intro || '')}</p>
                        <div class="mt-2 flex flex-wrap justify-center gap-1">${(p.tags || '').split(',').map(s => s.trim()).filter(Boolean).slice(0, 6).map(s => `<span class="text-[0.6875rem] px-2 py-0.5 rounded-full bg-pink-50 dark:bg-pink-950/40 text-pink-700 dark:text-pink-300 border border-pink-200 dark:border-pink-800">${esc(s)}</span>`).join('')}</div>
                    </div>
                    <div class="flex items-center gap-6">
                        <button onclick="meetPass('${esc(p.uid)}')" title="넘기기" class="w-14 h-14 rounded-full border-2 border-slate-300 dark:border-slate-600 text-slate-500 text-xl bg-white dark:bg-slate-800 hover:border-slate-500">✕</button>
                        <button onclick="meetLike('${esc(p.uid)}')" title="좋아요" class="w-16 h-16 rounded-full bg-pink-600 hover:bg-pink-500 text-white text-2xl shadow-lg">♥</button>
                    </div>
                    <div class="text-[0.6875rem] text-slate-400">남은 카드 ${queue.length}장</div>` : `
                    <div class="text-center text-xs text-slate-400 space-y-3"><div>지금 볼 수 있는 카드를 모두 봤습니다.</div><button onclick="meetResetSeen()" class="px-3 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold">넘긴 카드 다시 보기</button></div>`}
                    ${msg}
                </div>`;
        }

        // ================= 이런저런(잡담) · 1:1 대화 · 통화 · 신뢰도 · 랜덤 채팅 · 초대 =================
        // 통화·랜덤 채팅·다른 사람과의 1:1 대화는 서버(Firebase)가 연결되어 있어야 동작합니다.
        function needServer(what) {
            showAlertToast({ head: '안내', title: what + '은(는) 서버(Firebase)를 연결한 뒤에 사용할 수 있습니다.', foot: '지금은 체험 모드입니다' });
        }

        // ---- 이런저런 (잡담 게시판) ----
        let freeMessages = [], freeUnsub = null, freeAttach = null;
        function freeLocalKey() { return 'comm_free_' + townKey(myTown); }
        async function subscribeFree() {
            if (freeUnsub) { freeUnsub(); freeUnsub = null; }
            if (!myTown) return;
            const db = await commInit();
            if (db) {
                freeUnsub = commDoc(townKey(myTown)).collection('free').orderBy('ts', 'desc').limit(200).onSnapshot(snap => {
                    freeMessages = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
                    renderFreeMessages();
                }, err => console.error(err));
            } else {
                try { freeMessages = JSON.parse(lsGet(freeLocalKey()) || '[]'); } catch (e) { freeMessages = []; }
                renderFreeMessages();
            }
        }
        function freeLocalSave() {
            if (!lsSet(freeLocalKey(), JSON.stringify(freeMessages.slice(0, 200)))) lsSet(freeLocalKey(), JSON.stringify(freeMessages.slice(0, 200).map(m => Object.assign({}, m, { img: '' }))));
        }
        async function freePickFile(input) {
            const f = input.files && input.files[0];
            input.value = '';
            if (!f || f.type.indexOf('image/') !== 0) return;
            try { freeAttach = await compressImage(f, 1280, 550 * 1024); } catch (e) { return; }
            const p = document.getElementById('freePreview');
            if (p) p.innerHTML = `<img src="${freeAttach}" class="h-10 rounded border border-slate-300"> <button onclick="freeAttach = null; document.getElementById('freePreview').innerHTML = '';" class="text-[0.6875rem] text-red-500">취소</button>`;
        }
        async function freePost() {
            const input = document.getElementById('freeText');
            const text = ((input && input.value) || '').trim();
            if (!myTown || (!text && !freeAttach)) return;
            const msg = Object.assign({ text: text.slice(0, 500), type: 'talk', ts: Date.now(), uid: COMM_UID }, meFields());
            if (freeAttach) msg.img = freeAttach;
            if (replyTo.free) msg.replyTo = replyTo.free;
            try {
                const db = await commInit();
                if (db) await commDoc(townKey(myTown)).collection('free').add(msg);
                else { msg.id = 'f' + Date.now() + Math.random().toString(36).slice(2, 7); freeMessages.unshift(msg); freeLocalSave(); }
                input.value = ''; freeAttach = null;
                clearReply('free');
                const p = document.getElementById('freePreview'); if (p) p.innerHTML = '';
                renderFreeMessages(true);
            } catch (e) { console.error(e); }
        }
        async function freeDelete(id) {
            if (!myTown || !confirm('이 글을 삭제할까요?')) return;
            try {
                const db = await commInit();
                if (db) await commDoc(townKey(myTown)).collection('free').doc(id).delete();
                else { freeMessages = freeMessages.filter(m => m.id !== id); freeLocalSave(); renderFreeMessages(); }
            } catch (e) { console.error(e); }
        }
        function renderFree() {
            const main = document.getElementById('commMain');
            if (!main) return;
            main.innerHTML = `
                <div id="freeList" class="flex-1 min-h-0 overflow-y-auto custom-scrollbar p-3 space-y-3"></div>
                <div class="border-t border-slate-200 dark:border-slate-800 p-2 space-y-1.5 shrink-0 bg-white dark:bg-slate-900">
                    <div id="freePreview" class="flex items-center gap-2 empty:hidden"></div>
                    <div id="replyBar_free"></div>
                    ${chatInputRow({ id: 'freeText', send: 'freePost()', label: '등록', attach: attachBtn('freeFile', 'image/*', 'freePickFile(this)', '사진 첨부'),
                        placeholder: '맛집, 날씨, 동네 소식… 이웃과 편하게 이야기해 보세요 (Shift+Enter 줄바꿈)', enter: true })}
                </div>`;
            const list = document.getElementById('freeList');
            if (list) list.style.background = commBg;
            renderReplyBar('free');
            renderFreeMessages(true);
        }
        function renderFreeMessages(scrollBottom) {
            const list = document.getElementById('freeList');
            if (!list) return;
            const nearBottom = (list.scrollHeight - list.scrollTop - list.clientHeight) < 150;
            const sorted = freeMessages.filter(m => !isBlocked(m.uid)).sort((a, b) => a.ts - b.ts);
            list.innerHTML = sorted.length ? sorted.map(m => renderCommMsg(m, 'freeDelete')).join('')
                : '<div class="text-center py-16 text-xs text-slate-400">아직 글이 없습니다. 가벼운 이야기로 시작해 보세요.</div>';
            if (scrollBottom || nearBottom) list.scrollTop = list.scrollHeight;
        }

        // ---- 칭찬해요 (좋은 공간·고마운 일·좋은 아이디어를 사진과 짧은 글로 공유. 잡담 금지, 댓글은 80자까지) ----
        const PRAISE_KINDS = [['place', '🏞 칭찬하고 싶은 공간'], ['deed', '🤝 고마운 일·선행'], ['idea', '💡 좋은 아이디어'], ['neighbor', '🌟 칭찬하고 싶은 이웃']];
        const PRAISE_POST_MAX = 300, PRAISE_REPLY_MAX = 80;
        let praiseMessages = [], praiseUnsub = null, praiseAttach = null, praiseKind = 'place', praiseOpen = new Set();
        function praiseLocalKey() { return 'comm_praise_' + townKey(myTown); }
        function praiseLocalSave() {
            if (!lsSet(praiseLocalKey(), JSON.stringify(praiseMessages.slice(0, 300)))) lsSet(praiseLocalKey(), JSON.stringify(praiseMessages.slice(0, 300).map(m => Object.assign({}, m, { img: '' }))));
        }
        async function subscribePraise() {
            if (praiseUnsub) { praiseUnsub(); praiseUnsub = null; }
            if (!myTown) return;
            const db = await commInit();
            if (db) {
                praiseUnsub = commDoc(townKey(myTown)).collection('praise').orderBy('ts', 'desc').limit(300).onSnapshot(snap => {
                    praiseMessages = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
                    renderPraiseList();
                }, err => console.error(err));
            } else {
                try { praiseMessages = JSON.parse(lsGet(praiseLocalKey()) || '[]'); } catch (e) { praiseMessages = []; }
                renderPraiseList();
            }
        }
        async function praisePickFile(input) {
            const f = input.files && input.files[0];
            input.value = '';
            if (!f || f.type.indexOf('image/') !== 0) return;
            try { praiseAttach = await compressImage(f, 1280, 550 * 1024); } catch (e) { return; }
            renderPraiseComposer();
        }
        function setPraiseKind(k) { praiseKind = k; renderPraiseComposer(); }
        function praiseCount() {
            const inp = document.getElementById('praiseText'), el = document.getElementById('praiseCount');
            if (!inp || !el) return;
            const max = replyTo.praise ? PRAISE_REPLY_MAX : PRAISE_POST_MAX;
            el.textContent = inp.value.length + ' / ' + max + '자';
            el.className = 'text-[0.625rem] ' + (inp.value.length > max ? 'text-red-500 font-bold' : 'text-slate-400');
        }
        function renderPraiseComposer() {
            const box = document.getElementById('praiseComposer');
            if (!box) return;
            const prev = (document.getElementById('praiseText') || {}).value || '';
            const rep = !!replyTo.praise;
            box.innerHTML = `
                ${rep ? '' : `<div class="hscroll gap-1">${PRAISE_KINDS.map(k => `<button onclick="setPraiseKind('${k[0]}')" class="px-2 py-0.5 rounded-full text-[0.6875rem] font-bold border ${praiseKind === k[0] ? 'bg-amber-500 text-white border-amber-600' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-300 dark:border-slate-600'}">${k[1]}</button>`).join('')}</div>`}
                ${praiseAttach && !rep ? `<div class="flex items-center gap-2 text-[0.6875rem]"><img src="${praiseAttach}" class="h-12 rounded border border-slate-300"><button onclick="praiseAttach = null; renderPraiseComposer()" class="text-red-500">사진 취소</button></div>` : ''}
                <div id="replyBar_praise"></div>
                ${chatInputRow({ id: 'praiseText', send: 'praisePost()', label: rep ? '댓글' : '올리기', max: rep ? PRAISE_REPLY_MAX : PRAISE_POST_MAX, rows: rep ? 1 : 3, minH: rep ? '2.5rem' : '4.25rem',
                    attach: rep ? '' : attachBtn('praiseFile', 'image/*', 'praisePickFile(this)', '사진 첨부'),
                    placeholder: rep ? '짧은 댓글 (80자 이내)' : '어떤 점이 좋았는지 짧게 소개해 주세요 (예: ○○공원 산책로에 꽃길이 생겼어요!)',
                    border: 'border-amber-400', btn: 'bg-amber-500 hover:bg-amber-400' })}
                <div class="flex justify-end"><span id="praiseCount" class="text-[0.625rem] text-slate-400"></span></div>`;
            const inp = document.getElementById('praiseText');
            if (inp) { inp.value = prev; inp.addEventListener('input', praiseCount); }
            renderReplyBar('praise');
            praiseCount();
        }
        async function praisePost() {
            const input = document.getElementById('praiseText');
            const text = ((input && input.value) || '').trim();
            if (!myTown) return;
            const rep = replyTo.praise;
            const max = rep ? PRAISE_REPLY_MAX : PRAISE_POST_MAX;
            if (!text && (rep || !praiseAttach)) return;
            if (text.length > max) { showAlertToast({ head: '칭찬해요', title: (rep ? '댓글은 ' : '글은 ') + max + '자 이내로 짧게 적어 주세요.' }); return; }

        function togglePraiseReplies(id) { if (praiseOpen.has(id)) praiseOpen.delete(id); else praiseOpen.add(id); renderPraiseList(); }
        function renderPraise() {

                            ${mine ? `<button onclick="praiseDelete('${esc(p.id)}')" class="text-[0.625rem] text-slate-400 hover:text-red-500">삭제</button>` : ''}

                                return `<button onclick="toggleReact('praise', '${esc(p.id)}', '${x[0]}')" class="react-chip ${on ? 'on' : ''}">${x[1]}${n ? ' ' + n : ''}</button>`; }).join('')}
                            <button onclick="togglePraiseReplies('${esc(p.id)}')" class="ml-auto text-[0.6875rem] font-bold text-amber-700 dark:text-amber-300">💬 댓글 ${rs.length}</button>

                        ${rs.map(r => `<div class="flex items-start gap-1.5 text-xs"><button onclick="showProfile('${esc(r.uid)}')" class="shrink-0">${avatarHtml(r, 'w-5 h-5', 'text-[0.625rem]')}</button>
                            <div class="min-w-0 flex-1"><b class="text-slate-700 dark:text-slate-200">${esc(displayName(r.uid, r.nick))}</b> <span class="text-slate-700 dark:text-slate-200 break-words">${esc(r.text)}</span>
                            <span class="text-[0.625rem] text-slate-400"> · ${timeAgo(r.ts)}</span>${r.uid === COMM_UID ? ` <button onclick="praiseDelete('${esc(r.id)}')" class="text-[0.625rem] text-slate-400 hover:text-red-500">삭제</button>` : ''}</div></div>`).join('') || '<div class="text-[0.6875rem] text-slate-400">첫 댓글을 남겨 보세요.</div>'}
                        <button onclick="praiseReply('${esc(p.id)}')" class="text-[0.6875rem] font-bold text-amber-700 dark:text-amber-300">↩ 댓글 쓰기 (80자 이내)</button>
                    </div>` : ''}

            }).join('') : '<div class="text-center py-16 text-xs text-slate-400 leading-relaxed" style="white-space: normal;">아직 칭찬 글이 없습니다.<br>우리 동네의 좋은 공간, 고마운 일, 좋은 아이디어를 사진과 함께 소개해 보세요.</div>';
            list.scrollTop = toTop ? 0 : keep;
        }

        // ---- 커뮤니티 탭 순서 (끌어다 놓아서 바꾸기, 저장됨) ----
        const COMM_TABS_DEFAULT = ['talk', 'praise', 'free', 'market', 'meet', 'friends', 'random', 'dm'];
        function commTabOrder() {
            let o = [];
            try { o = JSON.parse(lsGet('comm_tab_order') || '[]'); } catch (e) {}
            o = o.filter(k => COMM_TABS_DEFAULT.includes(k));
            COMM_TABS_DEFAULT.forEach(k => { if (!o.includes(k)) o.push(k); });
            return o;
        }
        let tabDragKey = null;
        function tabDragStart(e) { tabDragKey = e.currentTarget.dataset.tab; e.currentTarget.classList.add('dragging'); try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', tabDragKey); } catch (err) {} }
        function tabDragOver(e) {
            if (!tabDragKey) return;
            e.preventDefault();
            const el = e.currentTarget, r = el.getBoundingClientRect(), after = e.clientX > r.left + r.width / 2;
            el.classList.toggle('drop-after', after); el.classList.toggle('drop-before', !after);
        }
        function tabDragLeave(e) { e.currentTarget.classList.remove('drop-before', 'drop-after'); }
        function tabDragEnd(e) { tabDragKey = null; document.querySelectorAll('.comm-tab').forEach(t => t.classList.remove('dragging', 'drop-before', 'drop-after')); }
        function tabDrop(e) {
            e.preventDefault();
            const target = e.currentTarget.dataset.tab, r = e.currentTarget.getBoundingClientRect(), after = e.clientX > r.left + r.width / 2;
            if (!tabDragKey || tabDragKey === target) { tabDragEnd(); return; }
            const o = commTabOrder().filter(k => k !== tabDragKey);
            o.splice(o.indexOf(target) + (after ? 1 : 0), 0, tabDragKey);
            lsSet('comm_tab_order', JSON.stringify(o));
            tabDragEnd();
            renderCommunity();
        }

        // ---- 1:1 대화 요청 (익명 커뮤니티: 상대가 수락해야 대화를 시작할 수 있음) ----
        let chatReqs = [];            // 나에게 온 대화 요청
        let chatSent = new Set((() => { try { return JSON.parse(lsGet('chat_sent') || '[]'); } catch (e) { return []; } })());
        let dmAllowed = new Set((() => { try { return JSON.parse(lsGet('dm_allowed') || '[]'); } catch (e) { return []; } })());
        let chatReqUnsubs = [];
        function canChat(uid) { return isFriend(uid) || dmAllowed.has(uid) || meetMatches().some(p => p.uid === uid) || dmThreads.some(t => t.uid === uid && t.ts); }
        async function saveAllowed() {
            lsSet('dm_allowed', JSON.stringify(Array.from(dmAllowed)));
            try { const db = await commInit(); if (db) await db.collection('dmAllowed').doc(COMM_UID).set({ uids: Array.from(dmAllowed), ts: Date.now() }); } catch (e) { console.error(e); }
        }
        async function subscribeChatReqs() {
            chatReqUnsubs.forEach(u => { try { u(); } catch (e) {} }); chatReqUnsubs = [];
            const db = await commInit();
            if (!db) return;
            try { const d = await db.collection('dmAllowed').doc(COMM_UID).get(); (d.exists ? (d.data().uids || []) : []).forEach(u => dmAllowed.add(u)); lsSet('dm_allowed', JSON.stringify(Array.from(dmAllowed))); } catch (e) {}
            let first = true;
            chatReqUnsubs.push(db.collection('chatReqs').doc(COMM_UID).collection('list').orderBy('ts', 'desc').limit(100).onSnapshot(snap => {
                const prev = new Set(chatReqs.map(r => r.uid));
                chatReqs = snap.docs.map(d => d.data()).filter(r => r.uid && !isBlocked(r.uid) && !dmAllowed.has(r.uid));
                if (!first) chatReqs.filter(r => !prev.has(r.uid)).forEach(r => { showAlertToast({ head: '💬 대화 요청', title: (r.nick || '이웃') + '님이 1:1 대화를 요청했습니다.' + (r.msg ? ' "' + r.msg + '"' : ''), foot: '커뮤니티 > 1:1 대화에서 수락하거나 거절할 수 있습니다', openCommunity: true }); playAlertSound(); });
                first = false;
                if (commTab === 'dm') renderDM();
            }, err => console.error(err)));
            chatReqUnsubs.push(db.collection('chatAccepted').doc(COMM_UID).collection('list').onSnapshot(snap => {
                snap.docs.forEach(d => {
                    const r = d.data();
                    if (r.uid && !dmAllowed.has(r.uid)) {
                        dmAllowed.add(r.uid); chatSent.delete(r.uid); lsSet('chat_sent', JSON.stringify(Array.from(chatSent)));
                        saveAllowed();
                        showAlertToast({ head: '💬 대화 수락', title: (r.nick || '이웃') + '님이 대화 요청을 수락했습니다. 이제 1:1 대화를 할 수 있습니다.', openCommunity: true });
                    }
                    d.ref.delete().catch(() => {});
                });
            }, err => console.error(err)));
        }
        // 대화 요청 보내기 창 (짧은 인사말 50자)
        function askChat(uid) {
            const info = friendInfo(uid);
            const card = document.getElementById('commProfileCard');
            if (!card) return;
            card.innerHTML = `<div class="w-full max-w-xs bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-2xl p-5 space-y-3" onclick="event.stopPropagation()">
                <div class="text-sm font-bold text-slate-900 dark:text-white">💬 ${esc(displayName(uid, info.nick))}님에게 대화 요청</div>
                <p class="text-[0.6875rem] text-slate-500 leading-relaxed">우리동네 커뮤니티는 닉네임으로 활동하는 익명 공간이라, 상대가 <b>수락</b>해야 1:1 대화를 시작할 수 있습니다. 거절해도 상대에게 따로 알림이 가지 않습니다.</p>
                <input id="chatReqMsg" type="text" maxlength="50" placeholder="짧은 인사말 (선택, 50자) 예) 올리신 제보 관련해 여쭤봐도 될까요?" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-900 dark:text-white">
                <div class="flex gap-2 justify-end">
                    <button onclick="closeProfile()" class="px-3 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold">취소</button>
                    <button onclick="sendChatReq('${esc(uid)}')" class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold">요청 보내기</button>
                </div></div>`;
            card.classList.remove('hidden');
        }
        async function sendChatReq(uid) {
            const msg = (((document.getElementById('chatReqMsg') || {}).value) || '').trim().slice(0, 50);
            const info = friendInfo(uid);
            closeProfile();
            try {
                const db = await commInit();
                if (db) await db.collection('chatReqs').doc(uid).collection('list').doc(COMM_UID).set(Object.assign({ uid: COMM_UID, ts: Date.now(), msg: msg, photo: myPhoto() }, meFields()));
                chatSent.add(uid); lsSet('chat_sent', JSON.stringify(Array.from(chatSent)));
                showAlertToast({ head: '💬 대화 요청', title: displayName(uid, info.nick) + '님에게 대화 요청을 보냈습니다. 상대가 수락하면 알림이 오고 대화를 시작할 수 있습니다.' });
            } catch (e) { console.error(e); showAlertToast({ head: '💬 대화 요청', title: '요청을 보내지 못했습니다. 잠시 후 다시 시도해 주세요.' }); }
        }
        async function acceptChat(uid) {
            const r = chatReqs.find(x => x.uid === uid);

            chatReqs = chatReqs.filter(x => x.uid !== uid);

                const db = await commInit();

                    await db.collection('chatAccepted').doc(uid).collection('list').doc(COMM_UID).set(Object.assign({ uid: COMM_UID, ts: Date.now(), photo: myPhoto() }, meFields()));

        async function declineChat(uid) {
            chatReqs = chatReqs.filter(x => x.uid !== uid);

            if (commTab === 'dm') renderDM();

        // 프로필 카드의 대화·친구 버튼 (서로 동의해야 진행)
        function chatButton(uid) {
            const b = 'px-3 py-1.5 rounded-lg text-xs font-bold';
            if (canChat(uid)) return `<button onclick="openDM('${esc(uid)}', profileShown.nick, profileShown.emoji, profileShown.photo, profileShown.area)" class="${b} bg-sky-600 hover:bg-sky-500 text-white"><i class="fa-solid fa-comment"></i> 대화하기</button>`;
            if (chatReqs.some(r => r.uid === uid)) return `<button onclick="closeProfile(); acceptChat('${esc(uid)}')" class="${b} bg-sky-600 hover:bg-sky-500 text-white">대화 요청 수락</button><button onclick="closeProfile(); declineChat('${esc(uid)}')" class="${b} border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300">거절</button>`;
            if (chatSent.has(uid)) return `<span class="${b} text-slate-500 bg-slate-100 dark:bg-slate-800">💬 대화 요청 보냄 · 수락 대기</span>`;
            return `<button onclick="askChat('${esc(uid)}')" class="${b} bg-sky-600 hover:bg-sky-500 text-white"><i class="fa-solid fa-comment"></i> 대화 요청</button>`;

        // ---- 초대하기 ----
        async function inviteNeighbors() {
            const url = location.origin + location.pathname;
            const text = '[우리동네 사건사고] ' + (myTown ? myTown.dong + ' 커뮤니티' : '우리동네 커뮤니티') + '에 초대합니다. 동네 사건사고 알림과 이웃 이야기를 함께 봐요.';

                await navigator.clipboard.writeText(text + ' ' + url);
                showAlertToast({ head: '초대하기', title: '초대 글과 주소를 복사했습니다. 메신저에 붙여 넣어 보내 주세요.', foot: url });
            } catch (e) {
                showAlertToast({ head: '초대하기', title: '아래 주소를 복사해서 보내 주세요.', foot: url });
            }

        // ---- 1:1 대화 (채팅 앱처럼 상대마다 채팅방이 따로 있습니다) ----
        let dmThreads = [], dmWith = null, dmChat = [], dmUnsub = null, dmInboxUnsub = null, dmUnread = new Set(), dmInboxReady = false;
        function dmLocal() { try { return JSON.parse(lsGet('dm_local') || '{}'); } catch (e) { return {}; } }
        function dmRooms() {
            const rooms = dmThreads.filter(t => !isBlocked(t.uid));

            dmInboxReady = false;
            dmInboxUnsub = db.collection('dmThreads').doc(COMM_UID).collection('list').orderBy('ts', 'desc').limit(100).onSnapshot(snap => {
                if (dmInboxReady) snap.docChanges().forEach(ch => {
                    const d = ch.doc.data();

                        dmUnread.add(d.uid);
                        if (alertCfg.enabled && alertCfg.dm !== false) {
                            showAlertToast({ head: '✉ 1:1 대화', badge: d.nick || '이웃', title: d.last || '', foot: '눌러서 커뮤니티 열기', openCommunity: true });

                dmThreads = snap.docs.map(d => d.data());

        }
        async function openDM(uid, nick, emoji, photo, area) {
            if (uid === COMM_UID) return;
            if (isBlocked(uid)) { showAlertToast({ head: '1:1 대화', title: iBlocked(uid) ? '차단한 이웃입니다. [차단 관리]에서 차단을 풀면 대화할 수 있습니다.' : '이 이웃과는 대화할 수 없습니다.' }); return; }
            if (!canChat(uid)) {      // 익명 커뮤니티: 상대가 수락해야 대화 시작
                if (!profileShown.uid || profileShown.uid !== uid) profileShown = { uid: uid, nick: nick || '이웃', emoji: emoji || '🙂', photo: photo || '', area: area || '' };
                if (chatSent.has(uid)) { showAlertToast({ head: '💬 대화 요청', title: '이미 대화 요청을 보냈습니다. 상대가 수락하면 알림이 옵니다.' }); return; }
                askChat(uid); return;

            closeProfile();
            if (!isDocked('community')) document.getElementById('floatModal').classList.remove('hidden');
            dmWith = { uid: uid, nick: nick || '이웃', emoji: emoji || '🙂', photo: photo || '', area: area || '' };

                dmUnsub = db.collection('dm').doc(pairId(COMM_UID, uid)).collection('messages').orderBy('ts', 'asc').limit(300).onSnapshot(snap => {
