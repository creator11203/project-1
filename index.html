<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리동네 사건사고 - 글로벌 실시간 관제 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @keyframes radar-sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-radar-sweep {
            animation: radar-sweep 3s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- 상단 헤더 -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between shrink-0 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="relative w-10 h-10 bg-slate-950 rounded-xl border border-red-500/50 flex items-center justify-center overflow-hidden shadow-lg shadow-red-500/20">
                <div class="absolute inset-1 rounded-full border border-red-500/30"></div>
                <div class="absolute inset-3 rounded-full border border-red-500/40"></div>
                <div class="absolute w-full h-0.5 bg-red-500/20"></div>
                <div class="absolute h-full w-0.5 bg-red-500/20"></div>
                <div class="absolute top-1/2 left-1/2 w-5 h-5 origin-top-left animate-radar-sweep bg-gradient-to-tr from-red-500/60 to-transparent rounded-tr-full"></div>
                <div class="absolute w-2 h-2 bg-red-500 rounded-full animate-ping"></div>
                <div class="absolute w-1.5 h-1.5 bg-red-400 rounded-full"></div>
            </div>
            <div>
                <h1 class="text-lg font-extrabold tracking-tight text-white flex items-center gap-2">
                    우리동네 사건사고 
                    <span class="text-xs px-2.5 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-500/40 font-mono shadow-[0_0_10px_rgba(16,185,129,0.2)]">글로벌 실시간 관제</span>
                </h1>
                <p class="text-xs text-slate-400">국내외 사건·사고, 국가 안보 및 해외 분쟁·테러 실시간 모니터링 플랫폼</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <button onclick="openReportModal()" class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white text-xs md:text-sm font-semibold px-4 py-2 rounded-lg shadow-lg shadow-red-600/20 transition flex items-center gap-2">
                <i class="fa-solid fa-bullhorn"></i> 실시간 제보하기
            </button>
            <div class="h-6 w-px bg-slate-800"></div>
            <button onclick="loadIncidentsFromJSON()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs md:text-sm font-medium px-3 py-2 rounded-lg border border-slate-700 transition flex items-center gap-2">
                <i class="fa-solid fa-rotate text-emerald-400"></i> 뉴스 새로고침
            </button>
        </div>
    </header>

    <!-- 메인 3분할 레이아웃 -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-hidden">
        
        <!-- 왼쪽: 뉴스 피드 (3칸) -->
        <section class="lg:col-span-3 bg-slate-900/90 border-r border-slate-800 flex flex-col h-full overflow-hidden">
            <div class="p-3 border-b border-slate-800 bg-slate-900/50 space-y-2">
                <div class="flex items-center justify-between text-xs text-slate-400">
                    <span class="font-semibold text-slate-300 flex items-center gap-1">
                        <i class="fa-solid fa-location-dot text-red-500"></i> 지역 맞춤 필터
                    </span>
                    <button onclick="refreshNewsFeed()" class="hover:text-white flex items-center gap-1 transition text-slate-300"><i class="fa-solid fa-rotate text-red-500"></i> 초기화</button>
                </div>
            </div>
            <div id="newsListContainer" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2.5"></div>
        </section>

        <!-- 중앙: 상세 뷰어 (5칸) -->
        <section class="lg:col-span-5 bg-slate-950 flex flex-col h-full overflow-hidden border-r border-slate-800">
            <!-- 카테고리 탭 바 -->
            <div class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center space-x-2 overflow-x-auto shrink-0">
                <button onclick="setCategoryFilter('all')" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-red-600 text-white transition whitespace-nowrap shadow-sm">전체</button>
                <button onclick="setCategoryFilter('해외 분쟁·테러')" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">🌍 해외 분쟁·테러</button>
                <button onclick="setCategoryFilter('국가 안보')" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">국가 안보</button>
                <button onclick="setCategoryFilter('강력·치안')" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">강력·치안</button>
                <button onclick="setCategoryFilter('사이버·금융')" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">사이버·금융</button>
                <button onclick="setCategoryFilter('재난·안전')" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">재난·안전</button>
                <button onclick="setCategoryFilter('실시간 제보')" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">실시간 제보</button>
            </div>
            <div id="detailViewContainer" class="flex-1 overflow-y-auto custom-scrollbar p-6"></div>
        </section>

        <!-- 오른쪽: 인터랙티브 지도 (4칸) -->
        <section class="lg:col-span-4 bg-slate-900 flex flex-col h-full relative overflow-hidden">
            <div class="absolute top-3 right-3 z-[400] flex items-center gap-2">
                <div class="bg-slate-900/90 backdrop-blur border border-slate-700 p-1 rounded-lg shadow-lg flex items-center gap-1">
                    <button onclick="setMapTheme('dark')" id="themeDarkBtn" class="px-2 py-1 rounded text-[11px] font-semibold bg-red-600 text-white transition">다크 테마</button>
                    <button onclick="setMapTheme('light')" id="themeLightBtn" class="px-2 py-1 rounded text-[11px] font-medium text-slate-300 hover:text-white transition">라이트 테마</button>
                </div>
                <div class="bg-slate-900/90 backdrop-blur border border-slate-700 text-xs px-3 py-1.5 rounded-lg shadow-lg text-slate-300 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                    <span>글로벌 관제 지도</span>
                </div>
            </div>
            <div id="map" class="flex-1 w-full h-full z-10"></div>
        </section>

    </main>

    <!-- 스크립트 로직 -->
    <script>
        let newsData = [];
        let currentCategory = 'all';
        let selectedNewsId = 1;
        let map, markersLayer, currentTileLayer;

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            loadIncidentsFromJSON();
        });

        async function loadIncidentsFromJSON() {
            try {
                const response = await fetch('news.json?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data) && data.length > 0) {
                        newsData = data;
                    }
                }
            } catch (error) {
                console.log("news.json 로드 실패, 기본 데이터 유지");
            }

            if (newsData.length === 0) {
                newsData = [
                    {
                        id: 1,
                        category: "해외 분쟁·테러",
                        title: "[안내] 글로벌 관제 시스템 대기 중",
                        summary: "우크라이나, 러시아, 중동 등 해외 분쟁 및 테러 관련 외신 속보가 실시간 수집됩니다.",
                        content: "파이썬 크롤러를 통해 글로벌 분쟁 및 국내 사건·사고 데이터가 수집됩니다.",
                        location: "우크라이나 키이우",
                        lat: 50.4501,
                        lng: 30.5234,
                        time: "방금 전",
                        source: "시스템 안내"
                    }
                ];
            }

            if (selectedNewsId && !newsData.some(n => n.id === selectedNewsId)) {
                selectedNewsId = newsData[0].id;
            }

            renderNewsList();
            renderDetailView(selectedNewsId);
            updateMapMarkers();
        }

        function initMap() {
            map = L.map('map').setView([30.0000, 15.0000], 3); // 세계 지도가 잘 보이도록 초기 줌 조정
            setMapTheme('dark');
            markersLayer = L.layerGroup().addTo(map);
            updateMapMarkers();
        }

        function setMapTheme(theme) {
            if (currentTileLayer) map.removeLayer(currentTileLayer);
            const darkBtn = document.getElementById('themeDarkBtn');
            const lightBtn = document.getElementById('themeLightBtn');

            if (theme === 'dark') {
                currentTileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 });
                darkBtn.className = "px-2 py-1 rounded text-[11px] font-semibold bg-red-600 text-white transition";
                lightBtn.className = "px-2 py-1 rounded text-[11px] font-medium text-slate-300 hover:text-white transition";
            } else {
                currentTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
                lightBtn.className = "px-2 py-1 rounded text-[11px] font-semibold bg-red-600 text-white transition";
                darkBtn.className = "px-2 py-1 rounded text-[11px] font-medium text-slate-300 hover:text-white transition";
            }
            currentTileLayer.addTo(map);
        }

        function updateMapMarkers(filteredList) {
            if (!markersLayer) return;
            markersLayer.clearLayers();
            const listToMap = filteredList || newsData;

            listToMap.forEach(news => {
                let markerColor = '#ef4444'; // 기본 빨강
                if (news.category === '해외 분쟁·테러') markerColor = '#f97316'; // 주황/오렌지 (해외 분쟁)
                else if (news.category === '국가 안보') markerColor = '#6366f1'; // 인디고
                else if (news.category === '사이버·금융') markerColor = '#3b82f6'; // 파랑

                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div style="background-color: ${markerColor}; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px ${markerColor};"></div>`,
                    iconSize: [14, 14],
                    iconPoint: [7, 7]
                });

                const marker = L.marker([news.lat, news.lng], { icon: customIcon });
                marker.bindPopup(`
                    <div style="color: #0f172a; font-family: sans-serif; max-width: 200px;">
                        <span style="font-size: 10px; font-weight: bold; background: #e2e8f0; padding: 2px 6px; border-radius: 4px;">${news.category}</span>
                        <h4 style="font-size: 13px; font-weight: bold; margin: 6px 0 4px 0;">${news.title}</h4>
                        <p style="font-size: 11px; color: #475569; margin: 0;">${news.location}</p>
                    </div>
                `);

                marker.on('click', () => selectNews(news.id));
                markersLayer.addLayer(marker);
            });
        }

        function renderNewsList() {
            const container = document.getElementById('newsListContainer');
            container.innerHTML = '';
            const filtered = getFilteredNews();

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-xs text-slate-500">해당 조건의 기사가 없습니다.</div>`;
                return;
            }

            filtered.forEach(news => {
                const isSelected = news.id === selectedNewsId;
                let badgeClass = 'bg-red-500/20 text-red-400 border-red-500/30';
                if (news.category === '해외 분쟁·테러') badgeClass = 'bg-orange-500/20 text-orange-400 border-orange-500/30';
                else if (news.category === '국가 안보') badgeClass = 'bg-indigo-500/20 text-indigo-400 border-indigo-500/30';

                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border transition cursor-pointer text-left ${isSelected ? 'bg-slate-800/90 border-red-500/60 shadow-lg' : 'bg-slate-900 border-slate-800 hover:bg-slate-800/50'}`;
                card.onclick = () => selectNews(news.id);

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-1.5">
                        <span class="text-[10px] px-2 py-0.5 rounded border ${badgeClass} font-semibold">${news.category}</span>
                        <span class="text-[10px] text-slate-400">${news.time}</span>
                    </div>
                    <h3 class="text-xs font-bold text-white line-clamp-2 mb-1">${news.title}</h3>
                    <p class="text-[11px] text-slate-400 line-clamp-2 mb-2">${news.summary}</p>
                    <div class="flex items-center justify-between text-[10px] text-slate-500 pt-1 border-t border-slate-800">
                        <span><i class="fa-solid fa-globe text-orange-500"></i> ${news.location}</span>
                        <span class="font-medium text-slate-400">${news.source}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderDetailView(id) {
            const news = newsData.find(n => n.id === id);
            const container = document.getElementById('detailViewContainer');
            if (!news) return;

            let headerStyle = 'border-l-4 border-red-500 bg-red-500/10';
            if (news.category === '해외 분쟁·테러') headerStyle = 'border-l-4 border-orange-500 bg-orange-500/10';
            else if (news.category === '국가 안보') headerStyle = 'border-l-4 border-indigo-500 bg-indigo-500/10';

            container.innerHTML = `
                <div class="space-y-4 animate-fadeIn">
                    <div class="p-4 rounded-xl ${headerStyle}">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold px-2.5 py-1 rounded bg-slate-900 text-white">${news.category}</span>
                            <span class="text-xs text-slate-450">${news.time} · 출처: ${news.source}</span>
                        </div>
                        <h2 class="text-base md:text-lg font-extrabold text-white leading-snug">${news.title}</h2>
                    </div>

                    <div class="bg-slate-900/80 border border-slate-800 p-3 rounded-xl flex items-center justify-between text-xs text-slate-300">
                        <span class="flex items-center gap-1.5 font-medium">
                            <i class="fa-solid fa-globe text-orange-500"></i> 발생 지역: 
                            <strong class="text-white">${news.location}</strong>
                        </span>
                        <span class="text-[11px] text-slate-400 font-mono">위도: ${news.lat}, 경도: ${news.lng}</span>
                    </div>

                    ${news.link ? `
                        <div class="pt-1">
                            <a href="${news.link}" target="_blank" class="inline-flex items-center gap-2 text-xs text-blue-400 hover:text-blue-300 bg-blue-950/30 border border-blue-900/50 px-3 py-1.5 rounded-lg transition">
                                <i class="fa-solid fa-external-link-alt"></i> 원문 기사 보기
                            </a>
                        </div>
                    ` : ''}

                    <div class="text-xs md:text-sm text-slate-300 leading-relaxed space-y-3 pt-2">
                        <p>${news.content || news.summary}</p>
                    </div>
                </div>
            `;
        }

        function selectNews(id) {
            selectedNewsId = id;
            renderNewsList();
            renderDetailView(id);

            const news = newsData.find(n => n.id === id);
            if (news && map && news.lat && news.lng) {
                // 해외 지역은 넓게(줌 5), 국내 세부 지역은 가깝게(줌 12) 자동 줌인
                const zoomLevel = news.category === '해외 분쟁·테러' ? 5 : 12;
                map.flyTo([news.lat, news.lng], zoomLevel, { duration: 1.2 });
            }
        }

        function setCategoryFilter(category) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.textContent.includes(category) || (category === 'all' && btn.textContent.trim() === '전체')) {
                    btn.className = 'cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-red-600 text-white transition whitespace-nowrap shadow-sm';
                } else {
                    btn.className = 'cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap';
                }
            });
            renderNewsList();
            updateMapMarkers(getFilteredNews());
        }

        function getFilteredNews() {
            return newsData.filter(news => currentCategory === 'all' || news.category === currentCategory);
        }

        function refreshNewsFeed() {
            currentCategory = 'all';
            setCategoryFilter('all');
            map.flyTo([30.0000, 15.0000], 3);
        }
    </script>
</body>
</html>
