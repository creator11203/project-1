            evs.sort((a, b) => (b.items.length - a.items.length) || (b.lead.timestamp - a.lead.timestamp));
            const top = evs.slice(0, 10);
            if (top.length === 0) { track.innerHTML = ''; track.dataset.sig = ''; return; }
            // 헤드라인 순위가 그대로면 애니메이션을 건드리지 않음 (글씨 크기·창 크기를 바꿔도 처음부터 다시 시작하지 않고 계속 흐름)
            const sig = top.map(ev => ev.lead.id + ':' + ev.items.length).join(',');
            if (track.dataset.sig === sig && track.style.animation) return;
            track.dataset.sig = sig;
            // 오른쪽에서 나와 왼쪽으로 흐름: 1위가 맨 앞(왼쪽)에 놓여 가장 먼저 나옵니다
            track.innerHTML = top.map((ev, i) => `
                <button onclick="openHeadline(${ev.lead.id})" class="inline-flex items-center gap-1.5 mx-5 text-xs text-slate-800 dark:text-slate-100 hover:text-red-500">
                    <span class="px-1.5 py-0.5 rounded bg-red-600 text-white text-[0.625rem] font-extrabold">${i === 0 ? '속보' : (i + 1) + '위'}</span>
                    ${isOverseas(ev.lead) ? '<span class="px-1 py-0.5 rounded bg-zinc-700 text-white text-[0.625rem] font-bold">해외</span>' : ''}
                    <b>${esc(ev.lead.title)}</b>
                    <span class="text-slate-400">${esc((ev.lead.location || '').replace('대한민국 (세부 위치 미상)', ''))}${ev.items.length > 1 ? ' · 기사 ' + ev.items.length + '개' : ''}</span>
                </button>`).join('');
            const w = wrap.clientWidth || 600, tw = track.scrollWidth || top.length * 320;
            track.style.setProperty('--ticker-start', w + 'px');
            track.style.animation = 'none';
            void track.offsetWidth;
            track.style.animation = 'ticker-rtl ' + Math.max(20, Math.round((w + tw) / 70)) + 's linear infinite';
        }
        function openHeadline(id) {
            const n = newsData.find(x => x.id === id);
            if (!n) return;
            currentCategory = 'all'; currentSub = null; selectedHotspotRegion = null; hotspotArticleOpen = false;
            showInFilter(n);
            selectedDate = dateKey(n.timestamp); dateFollowToday = (selectedDate === todayKey());
            renderCategoryBar(); updateMapMarkers();
            selectNews(id);
        }

        // ================= 지도 =================
        const KOREA_VIEW = { center: [36.2, 127.8], zoom: 7 };
        const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
        const ESRI_ATTR = 'Tiles &copy; <a href="https://www.esri.com/">Esri</a>';
        // 지도 모양. 'auto' 는 화면이 다크모드면 어두운 지도, 아니면 기본 지도를 씁니다.
        // ※ 예전에 쓰던 CARTO 지도는 2025년부터 API 키가 없으면 'API KEY REQUIRED' 그림만 내려 줘서 지도가 보이지 않았습니다.
        //   그래서 API 키가 필요 없는 지도(OpenStreetMap · Esri)로 바꿨습니다. 한 지도 서버가 막히면 자동으로 다른 서버로 넘어갑니다.
        const MAP_STYLES = {
            auto: { name: '지도: 자동' },
            voyager: { name: '지도: 기본(한글 지명)', url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attr: OSM_ATTR, maxZoom: 19 },
            light: { name: '지도: 밝게', url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attr: OSM_ATTR, maxZoom: 19, cls: 'tiles-light' },
            dark: { name: '지도: 어둡게', url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attr: OSM_ATTR, maxZoom: 19, cls: 'tiles-dark' },
            street: { name: '지도: 도로 중심(Esri)', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', attr: ESRI_ATTR, maxZoom: 19 },
            gray: { name: '지도: 어두운 회색(Esri)', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', attr: ESRI_ATTR, maxZoom: 16 },
            sat: { name: '지도: 위성 사진', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', attr: ESRI_ATTR, maxZoom: 19 }
        };
        const MAP_FALLBACK = { voyager: 'street', light: 'street', dark: 'gray', street: 'voyager', gray: 'dark', sat: 'voyager' };
        let mapStyle = 'auto', baseLayer = null, safetyLayer = null, mapFallbackUsed = {};
        try {
            mapStyle = localStorage.getItem('map_style') || 'auto';
            if (mapStyle === 'osm') mapStyle = 'voyager';
            if (!MAP_STYLES[mapStyle]) mapStyle = 'auto';
        } catch (e) {}

        function applyMapStyle(forceKey) {
            if (!map) return;
            const key = forceKey || (mapStyle === 'auto' ? (document.documentElement.classList.contains('dark') ? 'dark' : 'voyager') : mapStyle);
            const st = MAP_STYLES[key];
            if (baseLayer) map.removeLayer(baseLayer);
            baseLayer = L.tileLayer(st.url, { maxZoom: 19, maxNativeZoom: st.maxZoom || 19, attribution: st.attr, className: st.cls || '', crossOrigin: false }).addTo(map);
            baseLayer.bringToBack();
            // 지도 조각이 연달아 실패하면(서버 장애·차단) 다른 지도 서버로 자동 전환
            let fails = 0, oks = 0;
            baseLayer.on('tileload', () => { oks++; });
            baseLayer.on('tileerror', () => {
                fails++;
                if (fails >= 6 && oks < 2 && MAP_FALLBACK[key] && !mapFallbackUsed[key]) {
                    mapFallbackUsed[key] = true;
                    console.warn('지도 서버 응답 없음 → 다른 지도로 전환:', key, '→', MAP_FALLBACK[key]);
                    applyMapStyle(MAP_FALLBACK[key]);
                }
            });
        }
        function setMapStyle(v) { mapStyle = MAP_STYLES[v] ? v : 'auto'; try { localStorage.setItem('map_style', mapStyle); } catch (e) {} applyMapStyle(); }

        function makeMarkersLayer() {
            if (!L.markerClusterGroup) return L.layerGroup();      // 플러그인을 못 불러온 경우: 묶지 않고 그대로 표시
            return L.markerClusterGroup({
                maxClusterRadius: 46, disableClusteringAtZoom: 13, showCoverageOnHover: false, spiderfyOnMaxZoom: true, chunkedLoading: true,
                iconCreateFunction: c => {
                    const n = c.getChildCount();
                    const size = n < 10 ? 34 : (n < 50 ? 42 : (n < 200 ? 50 : 58));
                    const color = n < 10 ? '#f59e0b' : (n < 50 ? '#f97316' : (n < 200 ? '#ef4444' : '#b91c1c'));
                    return L.divIcon({ className: '', html: `<div class="cluster-bubble" style="width:${size}px;height:${size}px;background:${color};font-size:${n < 100 ? 13 : 11}px;">${n}</div>`, iconSize: [size, size] });
                }
            });
        }

        function initMap() {
            map = L.map('map', { zoomControl: true, worldCopyJump: true }).setView(KOREA_VIEW.center, KOREA_VIEW.zoom);
            // 지도를 칸에 넣지 않아 화면에 없을 때(크기 0) 이동 애니메이션을 하면 오류가 나서, 그때는 위치만 바로 맞춰 둠
            const flyRaw = map.flyTo.bind(map);
            map.flyTo = (c, z, o) => { const s = map.getSize(); if (!s.x || !s.y) { try { map.setView(c, z, { animate: false }); } catch (e) {} return map; } return flyRaw(c, z, o); };
            L.control.scale({ imperial: false }).addTo(map);
            applyMapStyle();
            markersLayer = makeMarkersLayer().addTo(map);
            safetyLayer = L.layerGroup().addTo(map);
            const sel = document.getElementById('mapStyleSelect');
            if (sel) { sel.innerHTML = Object.keys(MAP_STYLES).map(k => `<option value="${k}">${MAP_STYLES[k].name}</option>`).join(''); sel.value = mapStyle; }
            const lg = document.getElementById('mapLegend');
            if (lg) lg.innerHTML = '<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#ef4444;border:2px solid #fff;box-shadow:0 0 0 1.5px #334155;vertical-align:-1px;"></span> 동·장소까지 확인된 위치 &nbsp; <span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#ef4444;border:2px dashed #fff;opacity:.75;vertical-align:-1px;"></span> 시·군·구 단위(대략)<br>숫자 = 그 근처 사건 수 (확대하면 하나씩 보입니다)';
            updateMapMarkers();
        }

        // 위치 정밀도: poi(요금소·역 등 장소) > dong(읍·면·동) > sgg(시·군·구) > sido(시·도). scraper.py 가 news.json 에 넣어 줍니다.
        function precOf(n) {
            if (!n || !hasCoords(n)) return null;
            if (n.prec) return n.prec;
            const loc = n.location || '';
            if (loc.startsWith('해외') || loc.startsWith('북한')) return 'world';
            return loc.includes(' ') ? 'sgg' : 'sido';
        }
        const PREC_RANK = { poi: 4, dong: 3, sgg: 2, sido: 1, world: 1 };
        const PREC_ZOOM = { poi: 16, dong: 15, sgg: 13, sido: 9, world: 5 };
        const PREC_TEXT = { poi: '장소까지 확인', dong: '읍·면·동까지 확인', sgg: '시·군·구 단위(대략)', sido: '시·도 단위(대략)', world: '해외(대략)' };
        // 같은 사건의 기사들 가운데 위치가 가장 자세한 기사
        function bestLocated(items) {
            let best = null;
            items.forEach(n => { const r = PREC_RANK[precOf(n)] || 0; if (r > 0 && (!best || r > best.r)) best = { n: n, r: r }; });
            return best ? best.n : null;
        }
        // 지도를 그 사건 위치로 이동. 위치가 자세할수록 더 가까이 확대하고, 위치를 모르면 전국 지도를 보여 줍니다.
        function focusMap(n, silent) {
            if (!map) return;
            const sz = map.getSize();
            if (!sz.x || !sz.y) {            // 지도가 화면에 없을 때(창으로 숨겨 둔 경우): 애니메이션 없이 위치만 맞춰 둠
                try { const p0 = precOf(n); if (p0) map.setView([n.lat, n.lng], PREC_ZOOM[p0] || 11, { animate: false }); } catch (e) {}
                return;
            }
            const p = precOf(n);
            if (!p) { if (!silent) map.flyTo(KOREA_VIEW.center, KOREA_VIEW.zoom, { duration: 1.0 }); return; }
            const z = PREC_ZOOM[p] || 11;
            map.flyTo([n.lat, n.lng], silent ? Math.min(map.getZoom(), Math.min(z, 11)) : z, { duration: 1.2 });
        }

        function updateMapMarkers() {
            if (!markersLayer) return;
            markersLayer.clearLayers();

            if (currentCategory === '범죄 다발 지역') {
                getCrimeHotspotsData().forEach((stat, idx) => {
                    let size = Math.min(40, 16 + stat.count * 4);
                    let color = idx === 0 ? '#dc2626' : (idx === 1 ? '#ea580c' : '#f59e0b');
                    const icon = L.divIcon({
                        className: 'hotspot-icon',
                        html: `<div style="background-color: ${color}; width: ${size}px; height: ${size}px; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: bold; box-shadow: 0 0 12px ${color};">${stat.count}</div>`,
                        iconSize: [size, size], iconAnchor: [size / 2, size / 2]
                    });
                    const marker = L.marker([stat.lat, stat.lng], { icon });
                    marker.bindPopup(`<div style="font-family: sans-serif;"><b style="color:#dc2626">TOP ${idx + 1} ${esc(stat.region)}</b><br>관련 건수: <b>${stat.count}건</b></div>`);
                    markersLayer.addLayer(marker);
                });
                return;
            }

            const list = [];
            groupEvents(getFilteredNews()).slice(0, 1200).forEach(ev => {
                const news = bestLocated(ev.items);
                if (!news) return;
                const g = groupOf(ev.lead);
                const color = CATEGORY_GROUPS[g].color;
                const selected = ev.items.some(n => n.id === selectedNewsId);
                const p = precOf(news);
                const exact = p === 'poi' || p === 'dong';
                const size = selected ? 22 : (exact ? 16 : (p === 'sgg' ? 14 : 12));
                const icon = L.divIcon({
                    className: 'custom-icon',
                    html: `<div class="pin ${exact ? 'exact' : (p === 'sgg' ? '' : 'approx')} ${selected ? 'sel' : ''}" style="background:${color};width:${size}px;height:${size}px;${exact || selected ? '' : 'box-shadow:0 0 8px ' + color + ';'}"></div>`,
                    iconSize: [size, size], iconAnchor: [size / 2, size / 2]
                });
                const marker = L.marker([news.lat, news.lng], { icon, zIndexOffset: selected ? 1000 : (exact ? 100 : 0) });
                marker.bindPopup(`
                    <div style="font-family: sans-serif; max-width: 240px;">
                        <span style="font-size: 10px; background: ${color}; color:#fff; padding: 2px 6px; border-radius: 4px; font-weight:bold;">${esc(ev.lead.category)}</span>
                        <h4 style="font-size: 12px; font-weight: bold; margin: 6px 0 4px;">${esc(ev.lead.title)}</h4>
                        <p style="font-size: 11px; color: #475569; margin: 0;"><i class="fa-solid fa-location-dot" style="color:#ef4444"></i> ${esc(news.location)}${ev.items.length > 1 ? ' · 관련 기사 ' + ev.items.length + '개' : ''}</p>
                        <p style="font-size: 10px; color: #94a3b8; margin: 2px 0 0;">위치: ${PREC_TEXT[p] || ''}${news.place ? ' · ' + esc(news.place) : ''}</p>
                    </div>
                `);
                marker.on('click', () => selectNews(ev.lead.id));
                list.push(marker);
            });
            if (markersLayer.addLayers) markersLayer.addLayers(list); else list.forEach(m => markersLayer.addLayer(m));
        }

        // ================= 중앙 상단: 카테고리 버튼 =================
        function renderCategoryBar() {
            const base = groupEvents(getFilteredNews(true)).map(ev => ev.lead);   // 사건 1건 = 1개로 셈
            const gCount = {}, sCount = {};
            const oc = oneCat();
            base.forEach(n => {
                groupsOf(n).forEach(g => { gCount[g] = (gCount[g] || 0) + 1; });   // 여러 분류에 해당하면 각 분류에 모두 셈
                if (oc && groupsOf(n).includes(oc)) tagsOf(n).forEach(s => { if (isOverseas(n) || SUB_TO_GROUP[s] === oc) sCount[s] = (sCount[s] || 0) + 1; });
            });
            const ACTIVE = ' ring-2 ring-offset-1 ring-slate-800 dark:ring-slate-200 dark:ring-offset-slate-900 font-bold';
            const allOn = currentCategory === 'all' && selCats.size === 0;
            const selN = Array.from(selCats).reduce((a, g) => a + (gCount[g] || 0), 0);

            let html = `<button onclick="setCategoryFilter('all')" data-cat="all" title="모든 분류 보기 (선택 모두 해제)" class="cat-btn px-2.5 py-1 rounded-md text-[0.6875rem] border whitespace-nowrap transition ${allOn ? 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 border-transparent font-bold shadow-sm' : 'bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border-slate-300 dark:border-slate-700 font-medium'}">전체 <span class="opacity-70 font-mono">${base.length}</span></button>`;
            if (selCats.size) html += `<span class="text-[0.625rem] font-bold text-indigo-600 dark:text-indigo-300 whitespace-nowrap">✓ ${selCats.size}개 선택 · 다시 누르면 해제</span>`;
            // 사건이 많은 순서대로 앞에 놓고, 해외는 항상 맨 뒤에 따로 구분해서 놓음
            const order = Object.keys(CATEGORY_GROUPS).filter(g => g !== OVERSEAS);
            const idx = {}; order.forEach((g, i) => { idx[g] = i; });
            order.sort((a, b) => ((gCount[b] || 0) - (gCount[a] || 0)) || (idx[a] - idx[b]));
            const btn = g => {
                const c = CATEGORY_GROUPS[g];
                const on = selCats.has(g);
                return `<button onclick="setCategoryFilter('${g}')" data-cat="${g}" aria-pressed="${on}" title="${esc(c.law || '')}${'\n'}누르면 선택 · 여러 개 함께 선택 가능 · 다시 누르면 해제" class="cat-btn px-2.5 py-1 rounded-md text-[0.6875rem] border whitespace-nowrap transition font-medium ${c.badge}${on ? ACTIVE + ' cat-on' : ''}${on && g === lastToggled ? ' cat-pop' : ''}${!on && g === lastToggled ? ' cat-unpop' : ''} ${(gCount[g] || 0) === 0 && !on ? 'opacity-50' : ''} ${selCats.size && !on ? 'cat-dim' : ''}">${on ? '<span class="cat-check">✓</span>' : ''}${c.label} <span class="opacity-70 font-mono">${gCount[g] || 0}</span></button>`;
            };
            html += order.map(btn).join('');
            html += `<span class="flex items-center pl-2 ml-1 border-l-2 border-dashed border-slate-400 dark:border-slate-500">${btn(OVERSEAS)}</span>`;
            html += `<span class="ml-auto flex items-center gap-1.5 pl-2 border-l-2 border-slate-300 dark:border-slate-600"><button onclick="setCategoryFilter('범죄 다발 지역')" data-cat="범죄 다발 지역" class="cat-btn px-2.5 py-1 rounded-md text-[0.6875rem] border whitespace-nowrap transition bg-rose-600 text-white border-rose-700 font-bold shadow-sm hover:bg-rose-500${currentCategory === '범죄 다발 지역' ? ACTIVE : ''}">🚨 7일간 전국 사건사고 다발 지역</button></span>`;
            document.getElementById('groupButtons').innerHTML = html;

            lastToggled = null;
            let sub = '';
            if (oc && CATEGORY_GROUPS[oc] && currentCategory !== '범죄 다발 지역') {   // 분류를 하나만 골랐을 때 세부 분류 표시
                const c = CATEGORY_GROUPS[oc];
                sub += `<span class="text-[0.625rem] text-slate-400 mr-0.5">세부:</span>`;
                sub += `<button onclick="setSubFilter(null)" class="px-2 py-0.5 rounded-full text-[0.625rem] border transition ${currentSub === null ? 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 border-transparent font-bold' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-300 dark:border-slate-700'}">전체 ${gCount[oc] || 0}</button>`;
                c.subs.forEach(s => {
                    const n = sCount[s] || 0;
                    sub += `<button onclick="setSubFilter('${s}')" class="px-2 py-0.5 rounded-full text-[0.625rem] border transition ${currentSub === s ? 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 border-transparent font-bold' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-300 dark:border-slate-700'} ${n === 0 ? 'opacity-40' : ''}">${s} ${n}</button>`;
                });
            }
            const subBox = document.getElementById('subButtons');
            subBox.innerHTML = sub;
            subBox.style.display = sub ? 'flex' : 'none';
            renderDateBar();
        }

        function renderDateBar() {
            const btn = document.getElementById('dateButton');
            const menu = document.getElementById('dateMenu');
            if (!btn || !menu) return;
            const days = last7Days();            // 항상 '지금' 기준으로 오늘 포함 7일
            const cur = days.find(d => d.key === selectedDate);
            btn.innerHTML = `<i class="fa-regular fa-calendar"></i> ${cur ? dateLabel(cur.ts) : '최근 7일 전체'} <i class="fa-solid fa-caret-down"></i>`;

            const perDay = {}, all = new Set();
            getFilteredNews(false, true).forEach(n => {
                const k = dateKey(n.timestamp || Date.now() / 1000);
                (perDay[k] = perDay[k] || new Set()).add(evOf(n));
                all.add(evOf(n));
            });
            const row = (key, label, n, on) => `<button onclick="setDate('${key}')" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded text-xs transition ${on ? 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 font-bold' : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700'}"><span>${label}</span><span class="font-mono opacity-70">${n}건</span></button>`;
            menu.innerHTML = days.map(d => row(d.key, dateLabel(d.ts), perDay[d.key] ? perDay[d.key].size : 0, d.key === selectedDate)).join('')
                + '<div class="my-1 border-t border-slate-200 dark:border-slate-700"></div>'
                + row('all', '최근 7일 전체', all.size, selectedDate === 'all');
        }

        // 30초마다: 자정이 지나 날짜가 바뀌었으면 날짜 표시를 새 날짜로 넘김
        function dateTick() {
            const today = todayKey();
            if (selectedDate !== 'all' && !last7Days().some(d => d.key === selectedDate)) { selectedDate = today; dateFollowToday = true; refreshAll(); return; }
            if (dateFollowToday && selectedDate !== today) { selectedDate = today; refreshAll(); return; }
            renderDateBar();
        }

        function toggleDateMenu(show) {
            const menu = document.getElementById('dateMenu');
            const hidden = menu.classList.contains('hidden');
            const want = (typeof show === 'boolean') ? show : hidden;
            if (want) menu.classList.remove('hidden'); else menu.classList.add('hidden');
        }

        function setDate(key) {
            selectedDate = key;
            dateFollowToday = (key === todayKey());
            renderLimit = 100;
            toggleDateMenu(false);
            const list = document.getElementById('newsListContainer');
            if (list) list.scrollTop = 0;
            refreshAll();
        }

        // ◀(이전 날짜) / ▶(다음 날짜)
        function stepDate(dir) {
            const keys = last7Days().map(d => d.key);
            let i = keys.indexOf(selectedDate);
            i = (i < 0) ? 0 : Math.max(0, Math.min(keys.length - 1, i + dir));
            setDate(keys[i]);
        }

        function refreshAll() {
            renderCategoryBar();
            renderNewsList();
            updateMapMarkers();
            if (currentCategory === '범죄 다발 지역') { if (!hotspotArticleOpen) renderCrimeHotspotsView(); return; }
            const f = getFilteredNews();
            if (f.length > 0) selectNews(f[0].id, true);
            else setDetailHTML('<div class="text-center py-20 text-slate-400 text-xs">조건에 맞는 기사가 없습니다.</div>');
        }

        // ================= 왼쪽: 사건 목록 (같은 사건 기사는 1건으로 묶음) =================
        function showMoreNews() { renderLimit += 100; renderNewsList(); }
        function toggleEvent(key) {
            if (expandedEvents.has(key)) expandedEvents.delete(key); else expandedEvents.add(key);
            renderNewsList();
        }

        function renderNewsList() {
            const container = document.getElementById('newsListContainer');
            const prevScroll = container.scrollTop;
            const filtered = getFilteredNews();
            const events = groupEvents(filtered);
            document.getElementById('listCount').textContent = '사건 ' + events.length + '건' + (filtered.length > events.length ? ' · 기사 ' + filtered.length + '개' : '');
            container.innerHTML = '';

            // 다발 지역에서 지역을 고른 상태: 맨 위에 어느 지역인지와 돌아가기 버튼
            if (currentCategory === '범죄 다발 지역' && selectedHotspotRegion) {
                const bar = document.createElement('div');
                bar.className = 'sticky top-0 z-20 -mx-3 -mt-3 px-3 py-2 bg-rose-600 text-white text-xs font-bold flex items-center justify-between gap-2';
                bar.innerHTML = `<span class="truncate">🚨 ${esc(selectedHotspotRegion)} · 최근 7일 사건 ${events.length}건</span><button class="shrink-0 px-2 py-0.5 rounded bg-white/20 hover:bg-white/30">← 다발 지역 순위</button>`;
                bar.querySelector ? (bar.querySelector('button').onclick = backToHotspots) : (bar.onclick = backToHotspots);
                container.appendChild(bar);
            }

            if (events.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'text-center py-10 text-xs text-slate-500 space-y-3';
                const isToday = selectedDate === todayKey();
                empty.innerHTML = `<div>${isToday ? '오늘은 아직 조건에 맞는 사건이 없습니다.' : '선택한 날짜/지역/카테고리에 해당하는 사건이 없습니다.'}</div>`
                    + (isToday ? '<button onclick="stepDate(1)" class="px-3 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold">← 어제 사건 보기</button>' : '');
                container.appendChild(empty);
                return;
            }

            const showHeaders = selectedDate === 'all' || (currentCategory === '범죄 다발 지역' && !!selectedHotspotRegion);
            const perDay = {};
            events.forEach(ev => { const k = dateKey(ev.lead.timestamp || Date.now() / 1000); perDay[k] = (perDay[k] || 0) + 1; });

            let lastKey = null;
            events.slice(0, renderLimit).forEach(ev => {
                const news = ev.lead;
                const ts = news.timestamp || Date.now() / 1000;
                const k = dateKey(ts);
                if (showHeaders && k !== lastKey) {
                    lastKey = k;
                    const h = document.createElement('div');
                    h.className = 'sticky top-0 z-10 -mx-3 px-3 py-1 text-[0.6875rem] font-bold text-slate-600 dark:text-slate-300 bg-slate-100/95 dark:bg-slate-800/95 backdrop-blur border-y border-slate-200 dark:border-slate-700 flex justify-between';
                    h.innerHTML = `<span>${dateLabel(ts)}</span><span class="font-mono text-slate-400">${perDay[k]}건</span>`;
                    container.appendChild(h);
                }

                const hasSelected = ev.items.some(n => n.id === selectedNewsId);
                const open = expandedEvents.has(ev.key);
                const card = document.createElement('div');
                card.className = `${freshEventKeys.has(ev.key) ? 'news-new ' : ''}rounded-xl border transition text-left overflow-hidden ${hasSelected ? 'bg-slate-100 dark:bg-slate-800/90 border-red-500/60 shadow-md' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-slate-400 dark:hover:border-slate-600'}`;

                const main = document.createElement('div');
                main.className = 'p-3 cursor-pointer';
                main.onclick = () => selectNews(news.id);
                main.innerHTML = `
                    <div class="flex items-start justify-between mb-1.5 gap-1">
                        <span class="flex flex-wrap items-center gap-1 min-w-0">
                            ${freshEventKeys.has(ev.key) ? '<span class="text-[0.625rem] px-1.5 py-0.5 rounded bg-emerald-600 text-white font-extrabold">NEW</span>' : ''}
                            ${isOverseas(news) ? '<span class="text-[0.625rem] px-1.5 py-0.5 rounded bg-zinc-700 text-white font-extrabold">🌍 해외</span>' : ''}
                            ${tagBadges(news)}
                        </span>
                        <span class="text-[0.625rem] text-slate-500 whitespace-nowrap shrink-0 font-mono" title="${esc(news.time)}">${esc(shortTime(news))}</span>
                    </div>
                    <h3 class="text-xs font-bold text-slate-900 dark:text-white line-clamp-2 mb-1">${esc(news.title)}</h3>
                    <p class="text-[0.6875rem] text-slate-600 dark:text-slate-400 line-clamp-2 mb-2">${esc(news.summary)}</p>
                    <div class="flex items-center justify-between gap-2 text-[0.625rem] text-slate-500 pt-1 border-t border-slate-100 dark:border-slate-800">
                        <span class="truncate"><i class="fa-solid fa-location-dot text-red-500"></i> ${esc(news.location)}</span>
                        <span class="font-medium shrink-0">${esc(news.source)}</span>
                    </div>`;
                card.appendChild(main);

                if (ev.items.length > 1) {
                    const tog = document.createElement('button');
                    tog.className = 'w-full px-3 py-1.5 text-[0.6875rem] font-bold text-blue-600 dark:text-blue-400 bg-slate-50 dark:bg-slate-800/60 border-t border-slate-200 dark:border-slate-700 flex items-center justify-between hover:bg-slate-100 dark:hover:bg-slate-800';
                    tog.innerHTML = `<span><i class="fa-regular fa-newspaper"></i> 같은 사건 관련 기사 ${ev.items.length}개</span><span>${open ? '접기 ▲' : '펼치기 ▼'}</span>`;
                    tog.onclick = () => toggleEvent(ev.key);
                    card.appendChild(tog);
                    if (open) {
                        ev.items.forEach(n => {
                            const row = document.createElement('div');
                            row.className = `px-3 py-1.5 text-[0.6875rem] cursor-pointer border-t border-slate-100 dark:border-slate-800 ${n.id === selectedNewsId ? 'bg-red-50 dark:bg-red-950/30 font-bold' : 'hover:bg-slate-50 dark:hover:bg-slate-800/60'}`;
                            row.onclick = () => selectNews(n.id);
                            row.innerHTML = `<div class="text-slate-800 dark:text-slate-100 line-clamp-2">${isOverseas(n) ? '<b class="text-zinc-500">[해외]</b> ' : ''}${esc(n.title)}</div><div class="text-[0.625rem] text-slate-500">${esc(n.source)} · ${esc(shortTime(n))}</div>`;
                            card.appendChild(row);
                        });
                    }
                }
                container.appendChild(card);
            });

            if (events.length > renderLimit) {
                const more = document.createElement('button');
                more.className = 'w-full py-2 text-xs font-bold text-blue-600 dark:text-blue-400 bg-slate-100 dark:bg-slate-800 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700';
                more.textContent = `더 보기 (${renderLimit} / ${events.length}건)`;
                more.onclick = showMoreNews;
                container.appendChild(more);
            }
            container.scrollTop = prevScroll;
        }

        // ================= 다발 지역 (사건 수 기준, 같은 사건의 기사 여러 개는 1건) =================
        // 기사의 시·군·구 (다발 지역 집계용). 해외·북한·위치 미상·시도만 아는 기사는 제외
        function hotspotRegionOf(n) {
            const loc = n.location || '';
            if (isOverseas(n) || loc.startsWith('북한') || loc.startsWith('해외') || loc.includes('미상') || !loc.includes(' ')) return null;
            return sigunguOf(loc);
        }
        // 최근 7일, 시·군·구별 '사건 수' (같은 사건을 다룬 기사 여러 개는 1건). 왼쪽 목록도 똑같은 기준으로 그 지역 사건을 보여 줌
        function getCrimeHotspotsData() {
            const stats = {};
            newsData.filter(n => inLast7(n) && n.source !== '시스템').forEach(news => {
                const reg = hotspotRegionOf(news);
                if (!reg) return;
                if (!stats[reg]) stats[reg] = { region: reg, events: new Set(), articles: 0, lat: null, lng: null };
                const s = stats[reg];
                s.events.add(evOf(news));
                s.articles++;
                if (s.lat == null && hasCoords(news)) { s.lat = news.lat; s.lng = news.lng; }
            });
            return Object.values(stats).map(s => {
                const c = SIGUNGU_CENTERS[s.region] || SIGUNGU_CENTERS[s.region.split(' ').slice(0, 2).join(' ')];
                return { region: s.region, count: s.events.size, articles: s.articles, lat: c ? c[0] : s.lat, lng: c ? c[1] : s.lng };
            }).filter(s => s.lat != null).sort((a, b) => (b.count - a.count) || (b.articles - a.articles)).slice(0, 30);
        }

        function renderCrimeHotspotsView() {
            hotspotArticleOpen = false;
            const container = document.getElementById('detailViewContainer');
            let listHTML = '';
            getCrimeHotspotsData().forEach((item, index) => {
                let isSelected = selectedHotspotRegion === item.region;
                listHTML += `
                    <div onclick="selectHotspotRegion('${esc(item.region)}', ${item.lat}, ${item.lng})" class="bg-white dark:bg-slate-900 border ${isSelected ? 'border-red-500 bg-red-50/50' : 'border-slate-200 dark:border-slate-800'} p-3 rounded-xl flex items-center justify-between cursor-pointer hover:border-red-400 transition">
                        <div class="flex items-center space-x-3">
                            <span class="w-7 h-7 rounded-full bg-rose-600 text-white flex items-center justify-center text-xs font-extrabold shrink-0">${index + 1}</span>
                            <div>
                                <h4 class="text-sm font-bold text-slate-900 dark:text-white">${esc(item.region)}</h4>
                                <p class="text-xs text-slate-500">관련 기사 ${item.articles}개 · 누르면 왼쪽에 사건 목록이 나옵니다</p>
                            </div>
                        </div>
                        <span class="text-base font-extrabold text-red-500 shrink-0">사건 ${item.count}건</span>
                    </div>
                `;
            });
            if (!listHTML) listHTML = '<div class="text-center py-10 text-xs text-slate-400">위치가 확인된 기사가 아직 없습니다.</div>';
            container.style.padding = '';
            container.innerHTML = `
                <div class="space-y-4 flex-1 flex flex-col">
                    <div class="p-5 rounded-xl border-l-4 border-rose-600 bg-rose-50 dark:bg-rose-950/25">
                        <h2 class="text-base font-extrabold text-slate-900 dark:text-white">🚨 최근 7일간 전국 사건사고 다발 지역</h2>
                        <p class="text-xs text-slate-600 dark:text-slate-400 mt-1">같은 사건을 다룬 기사 여러 개는 사건 1건으로 셉니다. 지역을 누르면 왼쪽에 그 지역 사건이 정리됩니다.</p>
                    </div>
                    <div class="space-y-2.5 flex-1 overflow-y-auto custom-scrollbar">${listHTML}</div>
                </div>
            `;
        }

        function selectHotspotRegion(region, lat, lng) {
            selectedHotspotRegion = region;
            renderLimit = 100;
            renderCrimeHotspotsView();
            renderNewsList();
            const list = document.getElementById('newsListContainer');
            if (list) list.scrollTop = 0;
            if (map) map.flyTo([lat, lng], 12, { duration: 1.2 });
        }
        function backToHotspots() {
            renderCrimeHotspotsView();
            renderNewsList();
        }

        // ================= 가운데: 기사 원문 (가운데 정렬, 양옆 여백) =================
        function setDetailHTML(html) {
            const container = document.getElementById('detailViewContainer');
            container.style.padding = '';
            container.innerHTML = html;
        }

        function renderDetailView(id) {
            const news = newsData.find(n => n.id === id);
            const container = document.getElementById('detailViewContainer');
            if (!news) {
                setDetailHTML(`<div class="text-center py-20 text-slate-400 text-xs">선택된 기사 정보를 찾을 수 없습니다.</div>`);
                return;
            }

            const link = safeUrl(news.link);
            const isGoogle = /news\.google\.com/.test(link);

            if (link && !isGoogle && news.embed !== false) {
                const embedUrl = link.replace(/^http:\/\//, 'https://');   // https 사이트 안에서는 http 페이지를 열 수 없어서 https로 시도
                const fab = 'inline-flex items-center gap-1 text-[0.6875rem] font-bold text-white bg-slate-900/80 hover:bg-blue-600 px-2.5 py-1.5 rounded-full shadow-lg';
                container.style.padding = '0';
                container.innerHTML = `
                    <div id="articleWrap" class="bg-slate-200 dark:bg-slate-950" style="position:relative; flex:1 1 auto; min-height:0; overflow:hidden;">
                        <iframe id="articleFrame" src="${esc(embedUrl)}" referrerpolicy="no-referrer"
                            sandbox="allow-scripts allow-same-origin allow-popups allow-forms"
                            style="position:absolute; top:0; left:0; border:0; background:#fff; transform-origin:0 0; box-shadow:0 0 24px rgba(0,0,0,.25);"></iframe>
                        <div style="position:absolute; right:14px; bottom:14px; z-index:5; opacity:.9;" class="flex items-center gap-1.5">
                            <button onclick="toggleArticleMode()" title="기사 보는 방식 바꾸기" class="${fab}"><i class="fa-solid fa-arrows-left-right"></i> 보기: ${articleMode === 'fit' ? '읽기 좋은 크기' : (articleMode === 'mobile' ? '모바일형' : '전체 축소')} (바꾸기)</button>
                            <a href="${esc(link)}" target="_blank" rel="noopener noreferrer" title="기사가 보이지 않으면 눌러서 새 창으로 여세요" class="${fab}"><i class="fa-solid fa-arrow-up-right-from-square"></i> 새 창</a>
                        </div>
                    </div>`;
                fitArticleFrame();
                return;
            }

            // 원문을 이 화면에 띄울 수 없는 기사 (언론사가 막아 둠 / 구글 뉴스 중계 주소 / 주소 없음)
            const notice = !link ? '이 기사는 원문 주소가 없습니다.'
                : (news.embed === false ? '이 언론사(' + esc(news.source || '') + ')는 다른 사이트 화면 안에서 기사를 여는 것을 막아 두었습니다. 아래 버튼으로 원문을 열어 주세요.'
                : '이 기사는 아직 구글 뉴스 중계 주소라서 이 화면에 바로 띄울 수 없습니다. 아래 버튼으로 원문을 열어 주세요.');
            setDetailHTML(`
                <div class="m-auto w-full max-w-2xl space-y-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                    <div class="flex flex-wrap items-center justify-between gap-2 text-sm text-slate-500">
                        <span class="flex flex-wrap items-center gap-1">${tagBadges(news, 'lg')}</span>
                        <span class="truncate">${esc(news.source || '')} · ${esc(news.time || '')}</span>
                    </div>
                    <h2 class="text-2xl font-black text-slate-900 dark:text-white leading-snug">${esc(news.title)}</h2>
                    <p class="text-sm text-red-500 font-semibold"><i class="fa-solid fa-location-dot"></i> ${esc(news.location || '')}</p>
                    ${news.summary && news.summary !== news.title ? `<p class="text-lg text-slate-700 dark:text-slate-200 leading-relaxed">${esc(news.content && news.content.length > news.summary.length ? news.content : news.summary)}</p>` : ''}
                    <p class="text-sm text-amber-700 dark:text-amber-300 bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800 rounded-lg px-3 py-2">${notice}</p>
                    ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-1.5 text-base font-bold text-white bg-blue-600 hover:bg-blue-500 px-4 py-3 rounded-lg shadow"><i class="fa-solid fa-arrow-up-right-from-square"></i> 기사 원문 새 창으로 열기</a>` : ''}
                </div>`);
        }

        function toggleArticleMode() {
            articleMode = articleMode === 'fit' ? 'mobile' : (articleMode === 'mobile' ? 'whole' : 'fit');
            try { localStorage.setItem('article_mode', articleMode); } catch (e) {}
            if (selectedNewsId) renderDetailView(selectedNewsId);
        }

        // 기사 원문 배치: 언제나 '이 칸의 너비'에 기사 전체가 들어오게 맞춥니다. (옆으로 넘겨 보는 가로 스크롤이 생기지 않게)
        //  - fit   : 기사 페이지를 PC 화면 폭으로 그린 뒤, 칸 너비에 맞게 통째로 축소합니다. 칸을 넓히면 글씨도 같이 커집니다.
        //  - mobile: 기사 페이지를 휴대폰 폭으로 그려서 칸 가운데에 놓습니다. (모바일 화면을 지원하는 언론사에서 글씨가 큼)
        // (다른 사이트 페이지의 내용 자체를 고치는 것은 브라우저 보안상 불가능해서, 그리는 폭과 배율만 조절합니다)
        function fitArticleFrame() {
            const wrap = document.getElementById('articleWrap');
            const frame = document.getElementById('articleFrame');
            if (!wrap || !frame) return;
            const w = wrap.clientWidth, h = wrap.clientHeight;
            if (!w || !h) return;
            const fontFactor = currentFontSizePx / 16;
            let shown, virtualWidth;
            if (articleMode === 'fit') {
                // 읽기 좋은 크기(기본): 글씨가 너무 작아지지 않도록 최소 0.9배(× 글씨 크기 설정) 이상으로 보여 줍니다.
                // 칸이 넓으면 PC 화면 그대로, 칸이 좁으면 언론사 페이지가 태블릿·모바일 배치로 바뀌어 글씨가 큼직하게 보입니다.
                shown = w;
                const scale0 = Math.max(w / ARTICLE_BASE_WIDTH, 0.9 * fontFactor);
                virtualWidth = Math.max(360, w / scale0);
            } else if (articleMode === 'whole') {
                shown = w;
                virtualWidth = Math.max(w, ARTICLE_BASE_WIDTH / fontFactor);   // PC 화면 전체를 칸에 맞게 축소 (글씨는 작아짐)
            } else {
                shown = Math.min(w, Math.round(ARTICLE_MOBILE_WIDTH * 1.5 * fontFactor));
                virtualWidth = Math.min(shown, ARTICLE_MOBILE_WIDTH);
            }
            const scale = shown / virtualWidth;
            frame.style.left = Math.round((w - shown) / 2) + 'px';
            frame.style.width = virtualWidth + 'px';
            frame.style.height = (h / scale) + 'px';
            frame.style.transform = 'scale(' + scale + ')';
        }

        function selectNews(id, silent) {
            selectedNewsId = id;
            const news = newsData.find(n => n.id === id);
            if (currentCategory === '범죄 다발 지역') {
                if (selectedHotspotRegion) {
                    // 다발 지역에서 고른 지역의 기사: 목록은 그대로 두고 가운데에 기사만 엶
                    hotspotArticleOpen = true;
                } else {
                    currentCategory = 'all'; currentSub = null;
                    renderCategoryBar();
                }
                updateMapMarkers();
            }
            renderNewsList();
            renderDetailView(id);
            if (!silent) updateMapMarkers();   // 선택한 사건의 점을 크게 표시
            if (news) {
                const same = newsData.filter(n => evOf(n) === evOf(news));
                focusMap(bestLocated(same) || news, silent);
            }
            if (!silent && hiddenPanel() === 'article') openFloat();   // 기사 원문 패널을 칸에 넣지 않은 경우: 창으로 띄움
        }

        // ================= 필터 =================
        function setCategoryFilter(cat) {
            if (cat === 'all') { selCats.clear(); currentCategory = 'all'; }
            else if (cat === '범죄 다발 지역') { currentCategory = cat; }
            else {                                   // 분류 버튼: 누르면 선택, 다시 누르면 해제 (여러 개 함께 선택 가능)
                currentCategory = 'all';
                if (selCats.has(cat)) selCats.delete(cat); else selCats.add(cat);
                lastToggled = cat;
            }
            saveSelCats();
            currentSub = null;
            selectedHotspotRegion = null;
            hotspotArticleOpen = false;
            renderLimit = 100;
            renderCategoryBar();
            updateMapMarkers();
            if (cat === '범죄 다발 지역') {
                renderNewsList();
                renderCrimeHotspotsView();
            } else {
                renderNewsList();
                const f = getFilteredNews();
                if (f.length > 0) selectNews(f[0].id, true);
                else setDetailHTML('<div class="text-center py-20 text-slate-400 text-xs">조건에 맞는 기사가 없습니다.</div>');
            }
        }

        function setSubFilter(sub) {
            currentSub = sub;
            selectedHotspotRegion = null;
            renderLimit = 100;
            renderCategoryBar();
            updateMapMarkers();
            renderNewsList();
            const f = getFilteredNews();
            if (f.length > 0) selectNews(f[0].id, true);
        }

        function filterByRegion() {
            renderLimit = 100;
            renderCategoryBar();
            renderNewsList();
            updateMapMarkers();
            const f = getFilteredNews();
            if (f.length > 0) selectNews(f[0].id, true);
        }

        function getFilteredNews(ignoreCategory = false, ignoreDate = false) {
            const sido = document.getElementById('sidoSelect').value;
            const sigungu = document.getElementById('sigunguSelect').value;
            const dong = document.getElementById('dongSelect').value;

            return newsData.filter(news => {
                const loc = news.location || '';
                if (selectedHotspotRegion && !ignoreCategory) return inLast7(news) && hotspotRegionOf(news) === selectedHotspotRegion;   // 순위 집계와 같은 기준
                if (ignoreDate ? !inLast7(news) : !inPeriod(news)) return false;

                if (!ignoreCategory && currentCategory !== '범죄 다발 지역' && selCats.size) {
                    if (!groupsOf(news).some(g => selCats.has(g))) return false;              // 화재+추돌 기사는 '화재·사고'와 '교통사고' 양쪽에 모두 나옴
                    if (currentSub && !tagsOf(news).includes(currentSub)) return false;
                }

                if (sido !== 'all') {
                    if (!loc.includes(sido)) return false;
                    if (sigungu !== 'all' && sigungu !== '전체') {
                        const city = sigungu.split(' ')[0];
                        const okSigungu = loc.includes(sigungu) || (sigungu.includes(' ') && loc.split(' ').pop() === city);
                        if (!okSigungu) return false;
                        if (dong !== 'all' && dong !== '전체') {
                            const cleanDong = dong.split('(')[0].trim();
                            if (!(loc.includes(cleanDong) || loc.includes(dongStem(cleanDong)))) return false;
                        }
                    }
                }
                return true;
            });
        }

        // ================= 화면 설정: 패널 4개를 3칸에 자유롭게 배치 =================
        // 칸에 넣지 않은 나머지 패널 1개는 상단 버튼(원래 '우리동네 커뮤니티' 버튼 자리)을 누르면 창으로 뜹니다.
        const PANELS = {
            list: { label: '사건 목록(요약 기사)', short: '사건 목록', icon: 'fa-list-ul' },
            article: { label: '기사 원문', short: '기사 원문', icon: 'fa-newspaper' },
            map: { label: '사건 발생 지도', short: '사건 발생 지도', icon: 'fa-map-location-dot' },
            community: { label: '우리동네 커뮤니티', short: '우리동네 커뮤니티', icon: 'fa-people-group' }
        };
        const SLOT_IDS = ['leftPane', 'centerPane', 'rightPane'];
        const SLOT_NAMES = ['왼쪽 칸', '가운데 칸', '오른쪽 칸'];
        const DEFAULT_LAYOUT = ['list', 'article', 'map'];
        const LAYOUT_PRESETS = [
            ['기본 (목록 · 원문 · 지도)', ['list', 'article', 'map']],
            ['커뮤니티를 오른쪽에 (목록 · 원문 · 커뮤니티)', ['list', 'article', 'community']],
            ['커뮤니티를 가운데에 (목록 · 커뮤니티 · 지도)', ['list', 'community', 'map']],
            ['지도를 크게 (목록 · 지도 · 원문)', ['list', 'map', 'article']]
        ];
        let layout = (() => {
            try {
                const l = JSON.parse(localStorage.getItem('layout_v1') || 'null');
                if (Array.isArray(l) && l.length === 3 && l.every(k => PANELS[k]) && new Set(l).size === 3) return l;
            } catch (e) {}
            return DEFAULT_LAYOUT.slice();
        })();
        let floatWide = false;
        try { floatWide = localStorage.getItem('float_wide') === '1'; } catch (e) {}

        function hiddenPanel() { return Object.keys(PANELS).find(k => !layout.includes(k)); }
        function panelEl(k) { return document.getElementById('panel-' + k); }
        function isDocked(k) { return layout.includes(k); }

        function applyLayout(first) {
            SLOT_IDS.forEach((id, i) => document.getElementById(id).appendChild(panelEl(layout[i])));
            const h = hiddenPanel();
            document.getElementById('floatBody').appendChild(panelEl(h));
            renderFloatButton();
            renderFloatHead();
            renderCommHead();
            if (!first) {
                try { localStorage.setItem('layout_v1', JSON.stringify(layout)); } catch (e) {}
                closeFloat();
                if (isDocked('community')) renderCommunity();
                setTimeout(() => { if (map) map.invalidateSize(); fitArticleFrame(); renderTicker(); }, 60);
                if (selectedNewsId && document.getElementById('articleFrame')) renderDetailView(selectedNewsId);   // 옮기면 원문 창이 비므로 다시 불러옴
            }
        }
        // 상단 버튼: 칸에 없는 패널을 여는 버튼 (커뮤니티일 때는 커뮤니티 전용 디자인)
        function renderFloatButton() {
            const wrap = document.getElementById('floatBtnWrap');
            const h = hiddenPanel();
            if (h === 'community') {
                wrap.innerHTML = `<button onclick="openCommunity()" title="이웃과 사건사고를 나누는 우리 동네 게시판" class="comm-btn relative text-white pl-2 pr-3.5 py-1.5 rounded-full shadow-md shadow-emerald-600/30 transition flex items-center gap-1.5 whitespace-nowrap">
                    <span class="comm-faces flex items-center" style="transform: scale(.9); transform-origin: left center; margin-right: -4px;"><span>🙂</span><span>🐶</span><span>🌸</span></span>
                    <span class="text-[0.8125rem] font-extrabold">우리동네 커뮤니티</span>
                    <span id="commBadge" class="hidden absolute -top-2 -right-2 bg-red-600 text-white text-[0.625rem] font-bold px-1.5 py-0.5 rounded-full animate-pulse">SOS</span>
                </button>`;
            } else {
                wrap.innerHTML = `<button onclick="openFloat()" class="bg-sky-600 hover:bg-sky-500 text-white text-[0.8125rem] font-extrabold px-3.5 py-2 rounded-lg shadow shadow-sky-600/20 transition flex items-center gap-1.5 whitespace-nowrap"><i class="fa-solid ${PANELS[h].icon}"></i> ${PANELS[h].short}</button>`;
            }
            if (typeof updateCommBadge === 'function') updateCommBadge();
        }
        function wideBtnHtml() {
            return `<button onclick="toggleFloatWide()" title="창 가로 길이 바꾸기" class="px-2 py-1 rounded border border-slate-300 dark:border-slate-600 text-[0.6875rem] font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 whitespace-nowrap"><i class="fa-solid fa-left-right"></i> ${floatWide ? '보통 크기로' : '가로로 길게 보기'}</button>`;
        }
        function renderFloatHead() {
            const head = document.getElementById('floatHead'), box = document.getElementById('floatBox');
            const h = hiddenPanel();
            box.classList.toggle('max-w-4xl', !floatWide);
            box.style.maxWidth = floatWide ? '96vw' : '';
            if (h === 'community') { head.style.display = 'none'; return; }     // 커뮤니티는 자체 제목 줄을 씀
            head.style.display = '';
            head.innerHTML = `<b class="text-sm text-slate-900 dark:text-white flex items-center gap-2"><i class="fa-solid ${PANELS[h].icon} text-sky-500"></i> ${PANELS[h].label}</b>
                <span class="flex items-center gap-1.5">${wideBtnHtml()}<button onclick="closeFloat()" class="text-slate-400 hover:text-slate-600 px-1"><i class="fa-solid fa-xmark text-lg"></i></button></span>`;
        }
        // 커뮤니티 패널 제목 줄의 오른쪽 버튼
        function renderCommHead() {
            const box = document.getElementById('commHeadBtns');
            if (!box) return;
            // 칸에 들어가 있을 때: 숨겨진 화면(예: 사건 발생 지도)은 맨 위 버튼 줄에 이미 버튼이 있으므로 여기에는 메뉴만 둠
            const menu = `<span class="relative"><button onclick="toggleCommMenu()" title="내 프로필 · 친구 · 초대 · 차단 관리 · 배경" class="comm-head-btn px-2 py-1 rounded-lg text-[0.6875rem] font-bold"><i class="fa-solid fa-bars"></i> <span class="hide-xnarrow">메뉴</span></button>
                <div id="commMenu" class="hidden absolute right-0 top-full mt-1 w-56 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-xl shadow-2xl p-1.5 text-slate-800 dark:text-slate-100" style="z-index: 40;"></div></span>`;
            const modeChip = '';
            if (isDocked('community')) {
                box.innerHTML = modeChip + menu;
            } else {
                const wide = `<button onclick="toggleFloatWide()" title="창 가로 길이 바꾸기" class="comm-head-btn px-2 py-1 rounded-lg text-[0.6875rem] font-bold"><i class="fa-solid fa-left-right"></i> <span class="hide-narrow">${floatWide ? '보통 크기로' : '가로로 길게 보기'}</span></button>`;
                box.innerHTML = modeChip + menu + wide + `<button onclick="closeFloat()" title="닫기" class="comm-head-btn px-2 py-1 rounded-lg"><i class="fa-solid fa-xmark"></i></button>`;
            }
        }
        function toggleCommMenu(show) {
            const m = document.getElementById('commMenu');
            if (!m) return;
            const want = (typeof show === 'boolean') ? show : m.classList.contains('hidden');
            if (!want) { m.classList.add('hidden'); return; }
            const item = (fn, icon, label, extra) => `<button onclick="toggleCommMenu(false); ${fn}" class="w-full flex items-center gap-2 px-2.5 py-1.5 rounded-lg text-xs text-left hover:bg-slate-100 dark:hover:bg-slate-700"><i class="fa-solid ${icon} w-4 text-center text-emerald-600"></i><span class="flex-1">${label}</span>${extra || ''}</button>`;
            m.innerHTML = myTown ? `
                <div class="px-2.5 py-1.5 text-[0.6875rem] text-slate-500"><i class="fa-solid fa-circle-check text-emerald-500"></i> ${esc(townName(myTown))} 인증됨</div>
                ${item(`showProfile('${COMM_UID}')`, 'fa-user', '내 프로필')}
                ${item(`setCommTab('friends')`, 'fa-user-group', '친구 목록', friendReqs.length ? `<span class="text-[0.625rem] font-bold text-white bg-red-500 rounded-full px-1.5">${friendReqs.length}</span>` : '')}
                ${item('inviteNeighbors()', 'fa-user-plus', '이웃 초대하기')}
                ${item('showBlockList()', 'fa-ban', '차단 관리' + (Object.keys(blocked).length ? ' ' + Object.keys(blocked).length : ''))}
                ${item('showReportGuide()', 'fa-scale-balanced', '제보 가이드라인 · 신뢰 지수')}
                <div class="px-2.5 py-1.5 flex items-center gap-1.5 text-[0.6875rem] text-slate-500">배경 <span id="commBgDots" class="flex items-center gap-1"></span></div>
                ${item('resetTown()', 'fa-location-crosshairs', '동네 다시 인증')}` : `<div class="px-2.5 py-2 text-xs text-slate-500">먼저 동네 인증을 해 주세요.</div>`;
            m.classList.remove('hidden');
            renderCommBg();
        }
        function toggleFloatWide() {
            floatWide = !floatWide;
            try { localStorage.setItem('float_wide', floatWide ? '1' : '0'); } catch (e) {}
            renderFloatHead(); renderCommHead();
            setTimeout(() => { if (map) map.invalidateSize(); fitArticleFrame(); }, 60);
        }
        function openFloat() {
            document.getElementById('floatModal').classList.remove('hidden');
            const h = hiddenPanel();
            if (h === 'community') { renderCommunity(); commTouch(); }
            setTimeout(() => { if (map) map.invalidateSize(); fitArticleFrame(); }, 60);
        }
        function closeFloat() {
            document.getElementById('floatModal').classList.add('hidden');
            if (typeof closeProfile === 'function') closeProfile();
        }
        function toggleLayoutPanel(show) {
            const p = document.getElementById('layoutPanel');
            if (!p) return;
            const want = (typeof show === 'boolean') ? show : p.classList.contains('hidden');
            if (want) { renderLayoutPanel(); p.classList.remove('hidden'); } else p.classList.add('hidden');
        }
        function renderLayoutPanel() {
            const p = document.getElementById('layoutPanel');
            const inp = 'w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded px-2 py-1.5 text-xs text-slate-800 dark:text-slate-100';
            const h = hiddenPanel();
            p.innerHTML = `
                <div class="flex items-center justify-between mb-2"><b class="text-sm text-slate-900 dark:text-white"><i class="fa-solid fa-table-columns"></i> 화면 설정</b><button onclick="toggleLayoutPanel(false)" class="text-slate-400 hover:text-slate-700 dark:hover:text-white">✕</button></div>
                <p class="text-[0.6875rem] text-slate-500 mb-2 leading-relaxed">화면 3칸에 어떤 화면을 놓을지 고르세요. 같은 화면을 고르면 두 칸이 서로 자리를 바꿉니다.</p>
                <div class="grid grid-cols-3 gap-1 mb-2">${layout.map((k, i) => `<div class="rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-800 p-1.5 text-center"><div class="text-[0.625rem] text-slate-400">${SLOT_NAMES[i]}</div><i class="fa-solid ${PANELS[k].icon} text-emerald-500"></i><div class="text-[0.625rem] font-bold text-slate-700 dark:text-slate-200 leading-tight">${PANELS[k].short}</div></div>`).join('')}</div>
                ${layout.map((k, i) => `
                    <label class="block text-[0.6875rem] text-slate-500 mb-0.5">${SLOT_NAMES[i]}</label>
                    <select onchange="setSlot(${i}, this.value)" class="${inp} mb-2">${Object.keys(PANELS).map(x => `<option value="${x}" ${x === k ? 'selected' : ''}>${PANELS[x].label}</option>`).join('')}</select>`).join('')}
                <div class="text-[0.6875rem] text-slate-500 mb-2">버튼으로 여는 화면: <b class="text-slate-800 dark:text-slate-100">${PANELS[h].label}</b> <span class="text-slate-400">(상단 오른쪽 버튼)</span></div>
                <div class="text-[0.6875rem] text-slate-500 mb-1">빠른 배치</div>
                <div class="space-y-1 mb-2">${LAYOUT_PRESETS.map((x, i) => `<button onclick="setLayoutPreset(${i})" class="w-full text-left px-2 py-1 rounded text-[0.6875rem] border ${JSON.stringify(x[1]) === JSON.stringify(layout) ? 'border-emerald-500 text-emerald-600 font-bold' : 'border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200'} hover:bg-slate-100 dark:hover:bg-slate-700">${x[0]}</button>`).join('')}</div>
                <label class="flex items-center justify-between text-xs text-slate-700 dark:text-slate-200 border-t border-slate-200 dark:border-slate-700 pt-2"><span>창으로 뜨는 화면을 가로로 길게</span><input type="checkbox" ${floatWide ? 'checked' : ''} onchange="toggleFloatWide()"></label>
                <p class="text-[0.625rem] text-slate-400 mt-2 leading-relaxed">칸 사이의 세로 막대(⇄)를 끌면 칸 너비를 바꿀 수 있습니다.</p>`;
        }
        function setSlot(i, key) {
            if (!PANELS[key] || layout[i] === key) return;
            const j = layout.indexOf(key);
            if (j >= 0) layout[j] = layout[i];      // 이미 다른 칸에 있으면 서로 자리 바꿈
            layout[i] = key;
            applyLayout();
            renderLayoutPanel();
        }
        function setLayoutPreset(i) { layout = LAYOUT_PRESETS[i][1].slice(); applyLayout(); renderLayoutPanel(); }

        // ================= 앱 다운로드 (QR 코드) =================
        // 앱 장터(구글 플레이·앱 스토어)에 앱을 올린 뒤, 아래 따옴표 안에 그 주소를 넣으면 QR 코드가 그 주소로 바뀝니다.
        // 비워 두면 QR 코드는 이 웹사이트 주소를 가리키고, 휴대폰 홈 화면에 추가해서 앱처럼 쓰는 방법을 안내합니다.
        const APP_LINKS = { android: '', ios: '' };
        function closeAppModal() { document.getElementById('appModal').classList.add('hidden'); }
        async function openAppModal() {
            const site = location.origin + location.pathname;
            const links = { android: APP_LINKS.android || site, ios: APP_LINKS.ios || site };
            const ready = !!(APP_LINKS.android || APP_LINKS.ios);
            const box = document.getElementById('appModalBox');
            box.innerHTML = `
                <div class="flex items-center justify-between mb-3"><b class="text-base text-slate-900 dark:text-white"><i class="fa-solid fa-mobile-screen-button text-emerald-500"></i> 휴대폰 앱으로 이용하기</b><button onclick="closeAppModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button></div>
                <p class="text-xs text-slate-600 dark:text-slate-300 mb-3">휴대폰 카메라로 QR 코드를 비추면 바로 열립니다.</p>
                <div class="grid grid-cols-2 gap-3">
                    ${[['android', 'fa-brands fa-android', '안드로이드', 'text-emerald-600'], ['ios', 'fa-brands fa-apple', '아이폰', 'text-slate-800 dark:text-white']].map(x => `
                    <div class="rounded-xl border border-slate-200 dark:border-slate-700 p-3 text-center">
                        <div class="text-sm font-bold ${x[3]} mb-2"><i class="${x[1]}"></i> ${x[2]}</div>
                        <div id="qr_${x[0]}" class="mx-auto bg-white p-2 rounded-lg inline-block" style="min-width:164px;min-height:164px;"></div>
                        <a href="${esc(links[x[0]])}" target="_blank" rel="noopener noreferrer" class="block mt-2 text-[0.625rem] text-blue-500 break-all hover:underline">${esc(links[x[0]])}</a>
                    </div>`).join('')}
                </div>
                ${ready ? '' : `<div class="mt-3 rounded-lg bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800 px-3 py-2 text-[0.6875rem] text-amber-800 dark:text-amber-200 leading-relaxed">
                    아직 앱 장터에 올린 앱이 없어서 QR 코드는 <b>이 웹사이트</b>로 연결됩니다. 휴대폰에서 연 뒤 아래처럼 하면 앱처럼 쓸 수 있습니다.<br>
                    · <b>안드로이드(크롬)</b>: 오른쪽 위 ⋮ → <b>홈 화면에 추가</b><br>
                    · <b>아이폰(사파리)</b>: 아래 공유 버튼 → <b>홈 화면에 추가</b></div>`}`;
            document.getElementById('appModal').classList.remove('hidden');
            try {
                await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js');
                ['android', 'ios'].forEach(k => { const el = document.getElementById('qr_' + k); el.innerHTML = ''; new QRCode(el, { text: links[k], width: 160, height: 160 }); });
            } catch (e) {
                ['android', 'ios'].forEach(k => { const el = document.getElementById('qr_' + k); if (el) el.innerHTML = '<div class="text-[0.6875rem] text-slate-500 p-4">QR 코드를 만들지 못했습니다.<br>아래 주소로 접속해 주세요.</div>'; });
            }
        }

        // ================= 내 주변 안전시설 (응급실·AED·소화기·경찰서·소방서·대피소·쉼터) =================
        // 공개 지도(OpenStreetMap)에 등록된 시설을 내 위치 주변에서 찾아 지도에 표시합니다. (별도 가입·인증키가 필요 없습니다)
        // 등록이 빠진 시설이 있을 수 있어서, 공식 안내 사이트 링크를 함께 보여 줍니다.
        const SAFETY_TYPES = [
            { k: 'er', icon: '🏥', name: '응급실 (응급의료기관)', on: true },
            { k: 'hospital', icon: '➕', name: '종합병원·병원', on: false },
            { k: 'aed', icon: '❤️', name: 'AED (자동심장충격기)', on: true },
            { k: 'ext', icon: '🧯', name: '소화기·소화전', on: true },
            { k: 'police', icon: '🚓', name: '경찰서·지구대·파출소', on: true },
            { k: 'fire', icon: '🚒', name: '소방서·119안전센터', on: true },
            { k: 'shelter', icon: '⛑️', name: '재난 대피소·대피 장소', on: true },
            { k: 'rest', icon: '🏠', name: '무더위·한파 쉼터로 쓰이는 곳 (주민센터·경로당·도서관)', on: false }
        ];
        const SAFETY_QUERY = {
            er: ['nwr["amenity"="hospital"]["emergency"="yes"]', 'nwr["healthcare"="hospital"]["emergency"="yes"]'],
            hospital: ['nwr["amenity"="hospital"]'],
            aed: ['nwr["emergency"="defibrillator"]'],
            ext: ['nwr["emergency"~"^(fire_extinguisher|fire_hydrant)$"]'],
            police: ['nwr["amenity"="police"]'],
            fire: ['nwr["amenity"="fire_station"]'],
            shelter: ['nwr["emergency"="assembly_point"]', 'nwr["amenity"="shelter"]["shelter_type"!="public_transport"]', 'nwr["social_facility"="shelter"]', 'nwr["military"="bunker"]["access"!="private"]'],
            rest: ['nwr["amenity"~"^(community_centre|townhall|library|social_centre)$"]']
        };

        function toggleSafetyPanel(show) {

        function safetyKind(tags) {

        function safetyName(tags, kind) {
            const base = { aed: 'AED', ext: tags.emergency === 'fire_hydrant' ? '소화전' : '소화기', er: '응급실', hospital: '병원', police: '경찰', fire: '소방', shelter: '대피 장소', rest: '공공시설' }[kind];
            const nm = tags['name:ko'] || tags.name || '';
            const where = tags['defibrillator:location'] || tags.description || tags.indoor === 'yes' && '실내' || '';
            return (nm || base) + (nm && (kind === 'aed' || kind === 'ext') ? ' (' + base + ')' : '') + (where && !nm ? ' · ' + where : '');
        }
        function safetyLocate() {
            return new Promise(res => {
                const fallback = why => { const c = map.getCenter(); res({ lat: c.lat, lng: c.lng, text: '지도 가운데 기준' + (why ? ' (' + why + ')' : '') }); };
                if (!navigator.geolocation) return fallback('이 기기는 위치 확인을 지원하지 않음');
                navigator.geolocation.getCurrentPosition(
                    pos => res({ lat: pos.coords.latitude, lng: pos.coords.longitude, text: '내 현재 위치 기준', mine: true }),

        async function safetySearch(useMapCenter) {
            if (safety.busy) return;
            const kinds = SAFETY_TYPES.filter(t => safety.on[t.k]).map(t => t.k);
            if (kinds.length === 0) { safety.msg = '찾을 시설을 하나 이상 골라 주세요.'; renderSafetyPanel(); return; }
            try { localStorage.setItem('safety_cfg', JSON.stringify({ on: safety.on, radius: safety.radius })); } catch (e) {}
            safety.busy = true; safety.msg = '주변 시설을 찾는 중입니다...'; renderSafetyPanel();
            const o = useMapCenter ? (() => { const c = map.getCenter(); return { lat: c.lat, lng: c.lng, text: '지도 가운데 기준' }; })() : await safetyLocate();
            safety.origin = o; safety.originText = o.text;
            const r = Math.round(safety.radius * 1000);
            const parts = [];
            kinds.forEach(k => SAFETY_QUERY[k].forEach(q => parts.push(q + '(around:' + r + ',' + o.lat.toFixed(5) + ',' + o.lng.toFixed(5) + ');')));
            const query = '[out:json][timeout:25];(' + parts.join('') + ');out center tags 400;';
            const servers = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];
            let data = null;
            for (const url of servers) {
                try {
                    const res = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(query), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
                    if (res.ok) { data = await res.json(); break; }
                } catch (e) {}
            }
            safety.busy = false;
            if (!data) { safety.msg = '시설 정보를 불러오지 못했습니다. 잠시 후 다시 시도하거나 아래 공식 사이트를 이용해 주세요.'; renderSafetyPanel(); return; }
            const seen = new Set();
            safety.results = (data.elements || []).map(el => {
                const lat = el.lat != null ? el.lat : (el.center && el.center.lat), lng = el.lon != null ? el.lon : (el.center && el.center.lon);
                if (lat == null || lng == null) return null;
                const kind = safetyKind(el.tags || {});
                if (!safety.on[kind]) return null;
                const name = safetyName(el.tags || {}, kind);
                const key = kind + '|' + name + '|' + lat.toFixed(3) + '|' + lng.toFixed(3);
                if (seen.has(key)) return null;
                seen.add(key);
                return { kind: kind, name: name, lat: lat, lng: lng, dist: distKm(lat, lng, o.lat, o.lng), phone: (el.tags || {}).phone || (el.tags || {})['contact:phone'] || '', addr: (el.tags || {})['addr:full'] || (el.tags || {})['addr:street'] || '' };
            }).filter(Boolean).sort((a, b) => a.dist - b.dist);
            safety.msg = safety.results.length ? '' : '반경 ' + safety.radius + 'km 안에서 등록된 시설을 찾지 못했습니다. 반경을 넓혀 보세요.';

            renderSafetyPanel();
        }
        function drawSafety() {
            if (!safetyLayer) return;
            safetyLayer.clearLayers();
            const o = safety.origin;
            if (!o) return;
            L.circle([o.lat, o.lng], { radius: safety.radius * 1000, color: '#ef4444', weight: 1.5, fillColor: '#ef4444', fillOpacity: 0.04, dashArray: '6 6' }).addTo(safetyLayer);
            L.marker([o.lat, o.lng], { zIndexOffset: 2000, icon: L.divIcon({ className: '', html: '<div style="width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 4px rgba(37,99,235,.3);"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }) })
                .bindPopup('<b>' + esc(o.text) + '</b>').addTo(safetyLayer);
            const icons = {}; SAFETY_TYPES.forEach(t => { icons[t.k] = t.icon; });
            safety.results.slice(0, 300).forEach((f, i) => {
                const m = L.marker([f.lat, f.lng], { zIndexOffset: 1500, icon: L.divIcon({ className: '', html: `<div class="safety-pin">${icons[f.kind]}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] }) });
                m.bindPopup(`<div style="font-family:sans-serif;max-width:220px;"><b style="font-size:12px;">${icons[f.kind]} ${esc(f.name)}</b><br><span style="font-size:11px;color:#475569;">여기서 약 ${f.dist < 1 ? Math.round(f.dist * 1000) + 'm' : f.dist.toFixed(1) + 'km'}${f.addr ? ' · ' + esc(f.addr) : ''}</span>${f.phone ? '<br><a style="font-size:11px;" href="tel:' + esc(f.phone.replace(/[^0-9+]/g, '')) + '">☎ ' + esc(f.phone) + '</a>' : ''}<br><a style="font-size:11px;" target="_blank" rel="noopener noreferrer" href="https://map.kakao.com/link/to/${encodeURIComponent(f.name)},${f.lat},${f.lng}">길찾기(카카오맵) ↗</a></div>`);
                f._m = m;
                safetyLayer.addLayer(m);
            });
            map.flyTo([o.lat, o.lng], safety.radius <= 1 ? 15 : (safety.radius <= 2 ? 14 : (safety.radius <= 5 ? 13 : 12)), { duration: 1.0 });
        }
        function safetyGo(i) { const f = safety.results[i]; if (!f) return; map.flyTo([f.lat, f.lng], 17, { duration: 0.8 }); if (f._m) setTimeout(() => f._m.openPopup(), 850); }
        function safetyClear() { safety.results = []; safety.origin = null; safety.msg = ''; if (safetyLayer) safetyLayer.clearLayers(); renderSafetyPanel(); }
        function renderSafetyPanel() {
            const p = document.getElementById('safetyPanel');
            if (!p) return;
            const inp = 'bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded px-2 py-1 text-xs text-slate-800 dark:text-slate-100';
            const fmt = d => d < 1 ? Math.round(d * 1000) + 'm' : d.toFixed(1) + 'km';
            let list = '';
            SAFETY_TYPES.forEach(t => {
                const rows = safety.results.map((f, i) => ({ f: f, i: i })).filter(x => x.f.kind === t.k);
                if (!rows.length) return;
                list += `<div class="mt-2"><div class="text-[0.6875rem] font-bold text-slate-700 dark:text-slate-200">${t.icon} ${t.name} <span class="font-normal text-slate-400">${rows.length}곳</span></div>`
                    + rows.slice(0, 6).map(x => `<button onclick="safetyGo(${x.i})" class="w-full flex items-center justify-between gap-2 px-2 py-1 rounded text-left text-[0.6875rem] text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800"><span class="truncate">${esc(x.f.name)}</span><span class="shrink-0 font-mono text-slate-500">${fmt(x.f.dist)}</span></button>`).join('') + '</div>';
            });
            p.innerHTML = `
                <div class="flex items-center justify-between mb-2"><b class="text-sm text-slate-900 dark:text-white">🆘 내 주변 안전시설</b><button onclick="toggleSafetyPanel(false)" class="text-slate-400 hover:text-slate-700 dark:hover:text-white">✕</button></div>
                <div class="grid grid-cols-2 gap-1.5 mb-2">
                    <a href="tel:119" class="text-center py-1.5 rounded-lg bg-red-600 hover:bg-red-500 text-white text-xs font-bold">🚒 119 화재·구급</a>
                    <a href="tel:112" class="text-center py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold">🚓 112 범죄 신고</a>
                </div>
                <div class="space-y-1 mb-2">${SAFETY_TYPES.map(t => `<label class="flex items-center gap-2 text-[0.6875rem] text-slate-700 dark:text-slate-200"><input type="checkbox" ${safety.on[t.k] ? 'checked' : ''} onchange="safety.on['${t.k}'] = this.checked"><span>${t.icon} ${t.name}</span></label>`).join('')}</div>
                <div class="flex items-center gap-1.5 mb-2">
                    <select onchange="safety.radius = Number(this.value)" class="${inp}">${[0.5, 1, 2, 5, 10].map(k => `<option value="${k}" ${safety.radius === k ? 'selected' : ''}>반경 ${k < 1 ? k * 1000 + 'm' : k + 'km'}</option>`).join('')}</select>
                    <button onclick="safetySearch(false)" class="flex-1 py-1.5 rounded bg-red-600 hover:bg-red-500 text-white text-xs font-bold whitespace-nowrap"><i class="fa-solid fa-location-crosshairs"></i> 내 위치에서 찾기</button>
                </div>
                <div class="flex items-center gap-1.5 mb-1">
                    <button onclick="safetySearch(true)" class="flex-1 py-1 rounded border border-slate-300 dark:border-slate-600 text-[0.6875rem] text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">지도 가운데에서 찾기</button>
                    <button onclick="safetyClear()" class="py-1 px-2 rounded border border-slate-300 dark:border-slate-600 text-[0.6875rem] text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700">지우기</button>
                </div>

        // ================= 우리 동네 사건사고 알림 =================
        // 새 기사가 들어왔을 때 '알림 지역'에 해당하면 지도 오른쪽 아래에 알림 창을 띄우고 소리를 냅니다.
        const ALERT_SOUNDS = { dingdong: '띵동', bell: '종소리', siren: '경보음', none: '소리 없음' };
        let alertCfg = (() => {
            const base = { enabled: true, sound: 'dingdong', volume: 70, scope: 'sigungu', region: null, useLocation: false, radiusKm: 5, sos: true, report: true, dm: true };
            try { return Object.assign(base, JSON.parse(localStorage.getItem('alert_cfg') || '{}')); } catch (e) { return base; }
        })();

        let alertAudioCtx = null;

        function saveAlertCfg() { try { localStorage.setItem('alert_cfg', JSON.stringify(alertCfg)); } catch (e) {} }
        function alertRegion() {
            if (alertCfg.region && alertCfg.region.sido) return alertCfg.region;
            if (typeof myTown !== 'undefined' && myTown) return { sido: myTown.sido, sigungu: myTown.sigungu, dong: myTown.dong };
            return null;
        }
        function alertRegionText() {
            const r = alertRegion();
            if (!r) return '아직 정하지 않음';
            return [r.sido, r.sigungu, (alertCfg.scope === 'dong' ? r.dong : '')].filter(Boolean).join(' ');
        }
        function matchAlertRegion(news) {
            const r = alertRegion();
            if (!r) return false;
            const loc = news.location || '';
            if (!loc.includes(r.sido)) return false;
            if (r.sigungu) {
                const city = r.sigungu.split(' ')[0];
                if (!(loc.includes(r.sigungu) || (r.sigungu.includes(' ') && loc.split(' ').pop() === city))) return false;
            }
            if (alertCfg.scope === 'dong' && r.dong) {
                if (!(loc.includes(r.dong) || loc.includes(dongStem(r.dong)))) return false;
            }
            return true;
        }

        // 새로 들어온 기사 확인 (loadIncidentsFromJSON 에서 호출)
        // ---- 현재 위치 기반 알림 ----
        function distKm(lat1, lng1, lat2, lng2) {
            const dy = (lat1 - lat2) * 111, dx = (lng1 - lng2) * 88;
            return Math.sqrt(dx * dx + dy * dy);
        }
        function hereText() {
            if (!alertHere) return '';
            return [alertHere.sido, alertHere.sigungu].filter(Boolean).join(' ');
        }
        function matchHere(news) {
            if (!alertCfg.useLocation || !alertHere) return false;
            if (isOverseas(news)) return false;
            const loc = news.location || '';
            if (alertHere.sigungu && loc.includes(alertHere.sido)) {
                const city = alertHere.sigungu.split(' ')[0];
                if (loc.includes(alertHere.sigungu) || (alertHere.sigungu.includes(' ') && loc.split(' ').pop() === city)) return true;
            }
            // 시·군·구 이름이 달라도 반경 안이면 알림 (시·도만 알려진 기사는 위치가 부정확하므로 제외)
            return hasCoords(news) && loc.includes(' ') && distKm(news.lat, news.lng, alertHere.lat, alertHere.lng) <= alertCfg.radiusKm;

        // 현재 위치 다시 확인 (5분마다 + 설정을 켤 때)
        function refreshHere(after) {
            if (!alertCfg.useLocation) return;

                const lat = pos.coords.latitude, lng = pos.coords.longitude;

                if (!near || near.dist > 60) { alertHere = null; alertHereMsg = '대한민국 밖에서는 현재 위치 알림을 쓸 수 없습니다.'; }
                else { alertHere = { lat: lat, lng: lng, sido: near.sido, sigungu: near.sigungu, ts: Date.now() }; alertHereMsg = ''; }
                updateAlertButton();
                const p = document.getElementById('alertPanel');
                if (p && !p.classList.contains('hidden')) renderAlertPanel();
                if (typeof after === 'function') after();
            }, err => {
                alertHereMsg = (err && err.code === 1) ? '위치 권한이 거부되었습니다. 주소창의 자물쇠 아이콘에서 위치를 허용해 주세요.' : '현재 위치를 확인하지 못했습니다.';
                const p = document.getElementById('alertPanel');

            }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 240000 });

        // 지역이 바뀌었을 때(또는 처음) 최근 6시간 사건을 한 번 알려줌
        function showHereSummary() {
            if (!alertCfg.enabled || !alertCfg.useLocation || !alertHere) return;
            const area = hereText();

            const since = Date.now() / 1000 - 6 * 3600;
            const recent = groupEvents(newsData.filter(n => n.timestamp >= since && matchHere(n))).map(ev => ev.lead);
            if (recent.length === 0) return;
            showAlertToast({
                head: '📍 현재 계신 지역에서 사건사고가 발생했어요', badge: area + ' · 최근 6시간 ' + recent.length + '건',
                title: recent[0].title, foot: (recent[0].location || '') + ' · ' + (recent[0].source || ''), newsId: recent[0].id, here: true
            });
            playAlertSound();
        }
        function startHereWatch() {
            if (alertHereTimer) { clearInterval(alertHereTimer); alertHereTimer = null; }

        function initAlerts() { updateAlertButton(); startHereWatch(); }

        // 새로 들어온 기사 확인 (loadIncidentsFromJSON 에서 호출)
        function checkNewIncidents(list) {
            if (alertSeenIds === null) { alertSeenIds = new Set(list.map(n => n.id)); alertSeenEvents = new Set(list.map(evOf)); return; }
            const newArticles = list.filter(n => !alertSeenIds.has(n.id));
            newArticles.forEach(n => alertSeenIds.add(n.id));
            const fresh = [];                      // 같은 사건의 후속 기사는 다시 알리지 않음
            newArticles.forEach(n => { if (!alertSeenEvents.has(evOf(n))) { alertSeenEvents.add(evOf(n)); fresh.push(n); } });
            if (!alertCfg.enabled) return;
            const here = fresh.filter(matchHere);
            const mine = fresh.filter(n => !here.includes(n) && matchAlertRegion(n));
            if (here.length === 0 && mine.length === 0) return;
            here.slice(0, 3).forEach(n => showAlertToast({
                head: '📍 현재 계신 지역에서 사건사고가 발생했어요', badge: n.category, title: n.title,
                foot: (n.location || '') + ' · ' + (n.source || ''), newsId: n.id, here: true
            }));
            mine.slice(0, 3).forEach(n => showAlertToast({
                head: '🔔 우리 동네 새 사건사고', badge: n.category, title: n.title,
                foot: (n.location || '') + ' · ' + (n.source || ''), newsId: n.id
            }));
            const extra = Math.max(0, here.length - 3) + Math.max(0, mine.length - 3);
            if (extra > 0) showAlertToast({ head: '🔔 새 사건사고', title: '외 ' + extra + '건이 더 있습니다.', foot: hereText() || alertRegionText() });
            playAlertSound();
        }

        // 알림 창 (지도 오른쪽 아래 네모 상자)
        function showAlertToast(o) {
            const box = document.getElementById('alertToasts');
            if (!box) return;
            const el = document.createElement('div');
            el.className = 'w-72 max-w-[80vw] rounded-xl border-2 ' + (o.danger ? 'border-red-600' : (o.here ? 'border-blue-500' : 'border-amber-500')) + ' bg-white dark:bg-slate-900 shadow-2xl p-3 text-left cursor-pointer';
            el.innerHTML = `
                <div class="flex items-center justify-between gap-2 mb-1">
                    <span class="text-[0.6875rem] font-extrabold ${o.danger ? 'text-red-600' : (o.here ? 'text-blue-600' : 'text-amber-600')}">${esc(o.head || '알림')}</span>
                    <button class="alert-x text-slate-400 hover:text-slate-700 dark:hover:text-white text-sm leading-none px-1" title="닫기">✕</button>
                </div>
