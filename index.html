        // 분류 조건(빼고 보기 · 골라 보기 · 세부 분류)을 통과하는지
        function catPass(news) {
            if (!showCourt && isCourt(news)) return false;                                          // ⚖️ 재판·판결 소식을 꺼 두면 숨김
            if (exCats.size && groupsOf(news).some(g => exCats.has(g))) return false;              // 빼고 보기로 고른 분류의 기사는 숨김
            if (selCats.size) {
                if (!groupsOf(news).some(g => selCats.has(g))) return false;                       // 화재+추돌 기사는 '화재·사고'와 '교통사고' 양쪽에 모두 나옴
                if (currentSub && !tagsOf(news).includes(currentSub)) return false;
            }
            return true;
        }
        function getFilteredNews(ignoreCategory = false, ignoreDate = false) {
            const sido = document.getElementById('sidoSelect').value;
            const sigungu = document.getElementById('sigunguSelect').value;
            const dong = document.getElementById('dongSelect').value;

            // 다발 지역에서 고른 지역: 순위와 똑같은 기준(사건 단위)으로, 그 사건의 관련 기사 전부
            let regionEvents = null;
            if (selectedHotspotRegion && !ignoreCategory) {
                regionEvents = new Set();
                hotspotEvents().forEach(ev => { if (ev.region === selectedHotspotRegion) regionEvents.add(ev.key); });
            }
            return newsData.filter(news => {
                const loc = news.location || '';
                if (regionEvents) return inLast7(news) && regionEvents.has(evOf(news));
                if (ignoreDate ? !inLast7(news) : !inPeriod(news)) return false;

                if (!ignoreCategory && currentCategory !== '범죄 다발 지역' && !catPass(news)) return false;

                if (sido !== 'all') {     // 지역을 고르면 그 지역 소식만 (전국 단위 소식·위치 미상은 '전체(전국)' 보기에서만 보임)
                    if (!loc.includes(sido)) return false;
                    if (sigungu !== 'all' && sigungu !== '전체') {
                        const city = sigungu.split(' ')[0];
                        const okSigungu = loc.includes(sigungu) || (sigungu.includes(' ') && loc.split(' ').pop() === city);
                        if (!okSigungu) return false;
                        if (dong !== 'all' && dong !== '전체') {
                            const cleanDong = dong.split('(')[0].trim();
                            if (!(loc.includes(cleanDong) || loc.includes(dongStem(cleanDong)))) return false;
                        }
                    }
                }
                return true;
            });
        }

        // ================= 화면 설정: 패널 4개를 3칸에 자유롭게 배치 =================
        // 칸에 넣지 않은 나머지 패널 1개는 상단 버튼(원래 '우리동네 커뮤니티' 버튼 자리)을 누르면 창으로 뜹니다.
        const PANELS = {
            list: { label: '사건 목록(요약 기사)', short: '사건 목록', icon: 'fa-list-ul' },
            article: { label: '기사 원문', short: '기사 원문', icon: 'fa-newspaper' },
            map: { label: '사건 발생 지도', short: '사건 발생 지도', icon: 'fa-map-location-dot' },
            community: { label: '우리동네 커뮤니티', short: '우리동네 커뮤니티', icon: 'fa-people-group' },
            briefing: { label: '오늘의 안전 브리핑', short: '안전 브리핑', icon: 'fa-clipboard-list' }
        };
        const SLOT_IDS = ['leftPane', 'centerPane', 'rightPane'];
        const SLOT_NAMES = ['왼쪽 칸', '가운데 칸', '오른쪽 칸'];
        const DEFAULT_LAYOUT = ['list', 'article', 'map'];
        const LAYOUT_PRESETS = [
            ['기본 (목록 · 원문 · 지도)', ['list', 'article', 'map']],
            ['커뮤니티를 오른쪽에 (목록 · 원문 · 커뮤니티)', ['list', 'article', 'community']],
            ['커뮤니티를 가운데에 (목록 · 커뮤니티 · 지도)', ['list', 'community', 'map']],
            ['지도를 크게 (목록 · 지도 · 원문)', ['list', 'map', 'article']],
            ['안전 브리핑을 오른쪽에 (목록 · 원문 · 브리핑)', ['list', 'article', 'briefing']],
            ['안전 브리핑 + 지도 (목록 · 브리핑 · 지도)', ['list', 'briefing', 'map']]
        ];
        // 휴대폰(가로 767px 이하): 칸 3개를 한 화면에 나란히 놓을 수 없으므로 한 번에 한 칸만 보여 주고, 아래 탭(목록·지도·원문)으로 넘김.
        // 이때는 화면 설정을 쓰지 않고 기본 배치(목록·원문·지도)로 고정하며, PC에서 저장해 둔 배치는 건드리지 않음.
        const MOBILE_MQ = window.matchMedia('(max-width: 767px), (max-height: 480px) and (pointer: coarse)');
        function isMobile() { return MOBILE_MQ.matches; }
        let layout = (() => {
            if (isMobile()) return DEFAULT_LAYOUT.slice();
            try {
                const l = JSON.parse(localStorage.getItem('layout_v1') || 'null');
                if (Array.isArray(l) && l.length === 3 && l.every(k => PANELS[k]) && new Set(l).size === 3) return l;
            } catch (e) {}
            return DEFAULT_LAYOUT.slice();
        })();
        // 창으로 뜨는 화면(커뮤니티 등)의 가로 너비: 화면 폭의 몇 %인지 (0 = 기본 크기). 한 번 바꾸면 기억해서 다음에도 그 크기로 엽니다.
        let floatW = 0;
        try { floatW = Number(localStorage.getItem('float_w')) || (localStorage.getItem('float_wide') === '1' ? 96 : 0); } catch (e) {}
        let floatWide = floatW > 0;
        const FLOAT_MIN = 35, FLOAT_MAX = 98;

        // 칸에 넣지 않은 화면들. 안전 브리핑은 칸에 없으면 기존처럼 상단 [안전 브리핑] 버튼으로 창을 엽니다.
        let floatKey = null;          // 지금 창(floatModal)에 띄운 화면
        // 화면 나누기: 3칸(왼쪽·가운데·오른쪽) 또는 2칸(왼쪽·오른쪽). 2칸일 때는 가운데 칸을 쓰지 않음
        let paneCount = (() => { if (isMobile()) return 3; try { return localStorage.getItem('pane_count') === '2' ? 2 : 3; } catch (e) { return 3; } })();
        function usedSlots() { return paneCount === 2 ? [0, 2] : [0, 1, 2]; }
        function hiddenPanels() { return Object.keys(PANELS).filter(k => !isDocked(k) && k !== 'briefing'); }
        function hiddenPanel() { const hs = hiddenPanels(); return (floatKey && hs.includes(floatKey)) ? floatKey : hs[0]; }
        function panelEl(k) { return document.getElementById('panel-' + k); }
        function isDocked(k) { return usedSlots().some(i => layout[i] === k); }
        function setPaneCount(n) {
            paneCount = n === 2 ? 2 : 3;
            if (!isMobile()) try { localStorage.setItem('pane_count', String(paneCount)); } catch (e) {}
            applyPaneWidths();
            applyLayout();
            renderLayoutPanel();
        }
        // 칸 너비: 3칸·2칸 따로 기억 (2칸은 기본 반반)
        function applyPaneWidths() {
            const left = document.getElementById('leftPane'), center = document.getElementById('centerPane');
            const two = paneCount === 2;
            center.style.display = two ? 'none' : '';
            document.getElementById('resizer2').style.display = two ? 'none' : '';
            let pw = null;
            try { pw = JSON.parse(localStorage.getItem(two ? 'pane_w2' : 'pane_w') || 'null'); } catch (e) {}
            const ok = v => typeof v === 'string' && /^[\d.]+%$/.test(v);
            left.style.width = pw && ok(pw[0]) ? pw[0] : (two ? '50%' : '28%');
            if (!two) center.style.width = pw && ok(pw[1]) ? pw[1] : '40%';
        }
        function placeFloatPanel(k) {
            const store = document.getElementById('panelStore'), body = document.getElementById('floatBody');
            Array.from(body.children).forEach(c => { if (c.id !== 'panel-' + k) store.appendChild(c); });
            if (k) body.appendChild(panelEl(k));
        }

        function applyLayout(first) {
            usedSlots().forEach(i => document.getElementById(SLOT_IDS[i]).appendChild(panelEl(layout[i])));
            const store = document.getElementById('panelStore');
            Object.keys(PANELS).forEach(k => { if (!isDocked(k)) store.appendChild(panelEl(k)); });
            if (!hiddenPanels().includes(floatKey)) floatKey = null;
            placeFloatPanel(hiddenPanel());
            if (isDocked('briefing')) openBriefing(briefTab === 'settings' ? 'settings' : 'report', true);
            if (!first) renderCategoryBar();      // 기사 원문 칸이 빠지면 목록 위에 분류 버튼을 보여 줌
            renderFloatButton();
            renderFloatHead();
            renderCommHead();
            if (!first) {
                if (!isMobile()) try { localStorage.setItem('layout_v1', JSON.stringify(layout)); } catch (e) {}
                closeFloat();
                if (isDocked('community')) renderCommunity();
                setTimeout(() => { if (map) map.invalidateSize(); fitArticleFrame(); renderTicker(); }, 60);
                if (selectedNewsId && document.getElementById('articleFrame')) renderDetailView(selectedNewsId);   // 옮기면 원문 창이 비므로 다시 불러옴
            }
        }
        // 휴대폰 아래 탭: 한 번에 한 칸(목록 · 지도 · 원문)만 보여 줌. 칸 이름과 탭은 data-m / data-mt 로 연결
        let _mtHist = [], _mtGoingBack = false;     // 휴대폰에서 거쳐 온 탭 기록 (뒤로가기 쓸기용)
        function setMobTab(t) {
            const sc = document.getElementById('splitContainer');
            if (sc && sc.dataset.m && sc.dataset.m !== t && !_mtGoingBack) { _mtHist.push(sc.dataset.m); if (_mtHist.length > 20) _mtHist.shift(); }
            const _prevTab = sc ? sc.dataset.m : t;
            if (sc) sc.dataset.m = t;
            if (sc && _prevTab !== t) { const o = mtabOrder(); mobPaneEnter(mobActivePane(), _mtGoingBack ? -1 : (o.indexOf(t) > o.indexOf(_prevTab) ? 1 : -1)); }
            document.querySelectorAll('#mobileTabs [data-mt]').forEach(b => b.classList.toggle('on', b.dataset.mt === t));
            // 기사 원문을 읽는 탭: 위쪽 메뉴는 접고 아래 알약은 작게 (원문은 다른 사이트 화면이라 스크롤을 알 수 없어 처음부터 작게 둠)
            if (t !== 'list') closeMobileHotspot(true);
            document.body.classList.toggle('m-compact', isMobile() && t === 'article');
            if (typeof dockShrinkNow === 'function') dockShrinkNow();
            document.body.classList.remove('m-hdr-open');
            syncMobReading();
            if (isMobile() && !document.getElementById('floatModal').classList.contains('hidden')) closeFloat();      // 커뮤니티 등 떠 있는 창이 열려 있으면 닫고 고른 탭으로
            setTimeout(() => { if (map) map.invalidateSize(); fitArticleFrame(); }, 60);
        }
        // 위쪽 메뉴 접기 상태: 기사 원문 탭, 또는 목록 탭에서 다발 지역 순위를 열었을 때
        function syncMobReading() {
            const sc = document.getElementById('splitContainer'), t = sc ? sc.dataset.m : '';
            const on = isMobile() && (t === 'article' || (t === 'list' && mHotspotOpen));
            document.body.classList.toggle('m-reading', on);
            if (!on) document.body.classList.remove('m-hdr-open');
        }
        // 아래로 스크롤하면 아래쪽 버튼들이 작아지고, 위로 올리면 원래 크기로 (목록·커뮤니티·요약 등 어디서든)
        (function mobileCompactOnScroll() {
            const lastY = new WeakMap();
            document.addEventListener('scroll', e => {
                if (!isMobile()) return;
                const el = e.target;
                if (!el || el === document || el.nodeType !== 1 || el.closest('#mobileDock')) return;
                const rd = document.body.classList.contains('m-reading');
                if (rd && el.id !== 'detailViewContainer' && el.id !== 'mHotspot') return;
                const y = el.scrollTop, p = lastY.has(el) ? lastY.get(el) : 0, dy = y - p;
                lastY.set(el, y);
                if (el.id === 'newsListContainer' && mListCatOpen && y > 40 && dy > 10) toggleListCat(false);     // 목록을 내려 보면 펼친 분류 줄은 접어 자리를 비움
                if (rd && y > 24 && dy > 6) {
                    document.body.classList.remove('m-hdr-open');
                    const cb = document.getElementById('categoryBar'); if (cb && !cb.classList.contains('cat-collapsed')) toggleCatBar(false);     // 펼친 분류 줄도 스크롤하면 접힘
                }      // 펼쳐 둔 위쪽 메뉴도 아래로 스크롤하면 다시 접힘
                if (y < 24) document.body.classList.remove('m-compact');
                else if (dy > 6) document.body.classList.add('m-compact');
                else if (dy < -6) document.body.classList.remove('m-compact');
            }, true);
        })();
        // 원문 탭의 작은 알약: 원문은 언론사 화면이라 그 안의 스크롤을 알 수 없어 처음부터 작게 둠 →
        //   작은 알약을 한 번 누르면 원래 크기로 커지고(그 터치로는 탭이 바뀌지 않음), 몇 초 뒤 또는 다른 탭으로 가면 다시 작아짐
        let _dockTimer = 0;
        function dockShrinkNow() { clearTimeout(_dockTimer); document.body.classList.remove('m-dock-open'); }
        function dockExpand() {
            document.body.classList.add('m-dock-open');
            clearTimeout(_dockTimer);
            _dockTimer = setTimeout(dockShrinkNow, 6000);
        }
        (function dockExpandInit() {
            const dock = document.getElementById('mobileDock'); if (!dock) return;
            dock.addEventListener('click', ev => {
                const sc = document.getElementById('splitContainer');
                if (!isMobile() || !sc || sc.dataset.m !== 'article') return;
                const b = document.body;
                if (b.classList.contains('m-compact') && !b.classList.contains('m-dock-open')) { ev.preventDefault(); ev.stopPropagation(); dockExpand(); }
                else if (b.classList.contains('m-dock-open')) dockExpand();      // 커진 상태에서 누르면 시간을 다시 늘림 (누른 버튼은 그대로 동작)
            }, true);

        // 휴대폰: 다발 지역 순위를 목록 탭 안에서 바로 열기 (원문 탭으로 왔다 갔다 하지 않음)
        let mHotspotOpen = false;
        function syncMobileHotspot() {
            if (!mHotspotOpen) return;

            if (!src || !dst || !src.querySelector('#hotspotList')) return;
            dst.innerHTML = src.innerHTML.replace(/id="hotspotList"/g, 'id="mHotspotList"');
        }
        function openMobileHotspot() {
            mHotspotOpen = true;
            document.body.classList.remove('m-hdr-open');
            if (currentCategory !== '범죄 다발 지역') setCategoryFilter('범죄 다발 지역', true);
            else renderCrimeHotspotsView(true);
            const pl = document.getElementById('panel-list'); if (pl) pl.classList.add('m-hot');
            syncMobReading();
            syncMobileHotspot();
            const m = document.getElementById('mHotspot'); if (m) m.scrollTop = 0;

        // mode: 'gps'(내 위치) / 'center'(지도 가운데) / 'same'(방금 찾은 곳에서 체크 항목만 바꿔 다시 찾기)
        //  ※ 예전에는 '내 위치에서 찾기'가 위치 권한을 기다리는 동안 다른 버튼이 아무 반응을 하지 않아 '지도 가운데에서 찾기'가 고장 난 것처럼 보였습니다.
        //    이제는 마지막에 누른 찾기가 항상 이깁니다.
        let safetySeq = 0;
        async function safetySearch(mode) {
            if (mode === true) mode = 'center';
            if (mode === false || !mode) mode = 'gps';
            if (!map) return;
            const kinds = SAFETY_TYPES.filter(t => safety.on[t.k]).map(t => t.k);
            saveSafetyCfg();
            if (kinds.length === 0) { safety.msg = '찾을 시설을 하나 이상 골라 주세요.'; safety.results = []; drawSafety(true); renderSafetyPanel(); return; }
            const seq = ++safetySeq;
            safety.busy = true; safety.msg = mode === 'gps' ? '내 위치를 확인하는 중입니다... (위치 권한 창이 뜨면 "허용"을 눌러 주세요)' : '주변 시설을 찾는 중입니다...'; renderSafetyPanel();
            let o;
            if (mode === 'center') { map.invalidateSize(); const c = map.getCenter(); o = { lat: c.lat, lng: c.lng, text: '지도 가운데 기준' }; }
            else if (mode === 'same' && safety.origin) o = safety.origin;
            else o = await safetyLocate();
            if (seq !== safetySeq) return;                  // 그 사이에 다른 찾기를 눌렀음
            safety.origin = o; safety.originText = o.text;
            drawMyLoc();                                    // 찾기를 누르면 반경 레이더도 함께 갱신
            safety.msg = '주변 시설을 찾는 중입니다...'; renderSafetyPanel();
            drawSafety(true);                               // 찾는 동안에도 기준 위치·반경 원을 먼저 보여 줌
            const r = Math.round(safety.radius * 1000);
            const parts = [];
            kinds.forEach(k => SAFETY_QUERY[k].forEach(q => parts.push(q + '(around:' + r + ',' + o.lat.toFixed(5) + ',' + o.lng.toFixed(5) + ');')));
            const query = '[out:json][timeout:25];(' + parts.join('') + ');out center tags 500;';
            // 공개 지도 서버는 자주 붐벼서(응답 없음·502) 하나씩 차례로 물으면 오래 걸리거나 실패함 → 여러 서버에 동시에 묻고 가장 먼저 온 답을 씀
            const servers = ['https://overpass-api.de/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://overpass.private.coffee/api/interpreter'];
            const ctls = [];
            const ask = url => new Promise((ok, no) => {
                const ctl = window.AbortController ? new AbortController() : null;
                if (ctl) { ctls.push(ctl); setTimeout(() => ctl.abort(), 30000); }
                fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(query), headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, signal: ctl ? ctl.signal : undefined })
                    .then(r => r.ok ? r.json() : Promise.reject(r.status)).then(j => (j && Array.isArray(j.elements)) ? ok(j) : no('bad')).catch(no);
            });
            let data = null;
            try {
                data = await new Promise((ok, no) => { let fails = 0; servers.forEach(u => ask(u).then(ok, () => { if (++fails === servers.length) no('all failed'); })); });
            } catch (e) {}
            ctls.forEach(c => { try { c.abort(); } catch (e) {} });   // 먼저 답이 오면 나머지 요청은 취소
            if (seq !== safetySeq) return;
            safety.busy = false;
            if (!data) { safety.msg = '시설 정보를 불러오지 못했습니다. 잠시 후 다시 시도하거나 아래 공식 사이트를 이용해 주세요.'; renderSafetyPanel(); return; }
            const seen = new Set();
            safety.results = (data.elements || []).map(el => {
                const lat = el.lat != null ? el.lat : (el.center && el.center.lat), lng = el.lon != null ? el.lon : (el.center && el.center.lon);
                if (lat == null || lng == null) return null;
                let kind = safetyKind(el.tags || {});
                // '병원'만 고르고 '응급실'은 안 골랐을 때 응급실 있는 병원이 빠지지 않게
                if (kind === 'er' && !safety.on.er && safety.on.hospital) kind = 'hospital';

                const name = safetyName(el.tags || {}, kind);

                if (seen.has(key)) return null;
                seen.add(key);
                return { kind: kind, name: name, lat: lat, lng: lng, dist: distKm(lat, lng, o.lat, o.lng), phone: (el.tags || {}).phone || (el.tags || {})['contact:phone'] || '', addr: (el.tags || {})['addr:full'] || (el.tags || {})['addr:street'] || '' };
            }).filter(Boolean).sort((a, b) => a.dist - b.dist);
            const missing = kinds.filter(k => !safety.results.some(f => f.kind === k)).map(k => SAFETY_BY[k].icon + ' ' + SAFETY_BY[k].name.split(' (')[0]);
            safety.msg = !safety.results.length ? '반경 ' + safety.radius + 'km 안에서 등록된 시설을 찾지 못했습니다. 반경을 넓혀 보세요.'
                : (missing.length ? '이 반경에서 찾지 못한 시설: ' + missing.join(', ') + ' (반경을 넓히거나 아래 공식 사이트를 확인하세요)' : '');

        }
        // ================= 내 위치 표시 · 반경 레이더 =================
        //  · 동네 인증(또는 [내 위치에서 찾기])을 하면 그 위치를 이 기기에만 저장해 두고, 지도에 파란 점으로 항상 표시합니다.
        //  · 안전시설 반경을 골랐다면 내 위치를 중심으로 그 반경만큼의 원이 생기고 레이더가 천천히 돕니다.
        //  · 둘 다 [내 주변 안전시설] 창의 '내 위치 표시 설정'에서 켜고 끌 수 있습니다.
        function myLocCfg() {
            if (!window._mlc) {

            }
            return window._mlc;
        }
        function saveMyLocCfg() { try { localStorage.setItem('myloc_cfg', JSON.stringify(myLocCfg())); } catch (e) {} }
        function myLocPos() { try { const p = JSON.parse(localStorage.getItem('my_loc') || 'null'); return p && isFinite(p.lat) && isFinite(p.lng) ? p : null; } catch (e) { return null; } }
        function setMyLoc(lat, lng) { try { localStorage.setItem('my_loc', JSON.stringify({ lat: lat, lng: lng, ts: Date.now() })); } catch (e) {} drawMyLoc(); }
        function clearMyLoc() { try { localStorage.removeItem('my_loc'); } catch (e) {} drawMyLoc(); }
        function mylocSet(k, v) { myLocCfg()[k] = v; saveMyLocCfg(); drawMyLoc(); renderSafetyPanel(); }
        function mylocRefresh() {
            if (!navigator.geolocation) { alert('이 기기는 위치 확인을 지원하지 않습니다.'); return; }

                () => alert('현재 위치를 확인하지 못했습니다. 브라우저의 위치 권한을 확인해 주세요.'), { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
        }

                    const d = Math.round(Math.min(4000, Math.max(30, 2 * km * 1000 / mpp)));

                        icon: L.divIcon({ className: '', html: `<div class="radar-disc" style="width:${d}px;height:${d}px;"><div class="radar-ring2"></div><div class="radar-ring3"></div></div>`, iconSize: [d, d], iconAnchor: [d / 2, d / 2] }) }).addTo(myLocLayer);
                }

                    .bindPopup('<b>📍 내 위치</b><br><span style="font-size:11px;">' + (c.radar && (c.chosen || (safety && safety.origin)) ? '반경 ' + safety.radius + 'km 레이더가 표시됩니다' : '[내 주변 안전시설]에서 반경을 고르면 레이더가 나타납니다') + '</span>').addTo(myLocLayer);
            } catch (e) {}

        function saveSafetyCfg() { try { localStorage.setItem('safety_cfg', JSON.stringify({ on: safety.on, radius: safety.radius })); } catch (e) {} }
        // 체크를 바꾸면: 이미 찾아 둔 곳이 있으면 같은 자리에서 바로 다시 찾아 지도에 반영
        function safetyToggle(k, on) {
            safety.on[k] = on; saveSafetyCfg();

        }
        function safetySetRadius(v) { safety.radius = Number(v) || 2; saveSafetyCfg(); myLocCfg().chosen = true; saveMyLocCfg(); drawMyLoc(); if (safety.origin) safetySearch('same'); }
        function safetyIcon(kind, big) {
            const t = SAFETY_BY[kind] || SAFETY_TYPES[0], s = big ? 40 : 34;
            return L.divIcon({ className: '', html: `<div class="safety-pin" style="width:${s}px;height:${s}px;border-color:${t.color};box-shadow:0 0 0 3px ${t.color}55, 0 3px 8px rgba(0,0,0,.45);"><span>${t.icon}</span><i style="background:${t.color};"></i></div>`, iconSize: [s, s + 8], iconAnchor: [s / 2, s + 8], popupAnchor: [0, -s] });

        // 지도 위 오른쪽 아래: 지금 표시 중인 안전시설 종류별 개수 (체크한 그림·색 그대로)
        // (지도 안내 상자 맨 위에 함께 표시 → 좁은 칸에서도 겹치지 않음)

                <div class="grid grid-cols-2 gap-x-2">${kinds.map(t => { const n = safety.results.filter(f => f.kind === t.k).length; return `<div class="flex items-center gap-1.5 py-0.5 ${n ? '' : 'opacity-50'}"><span class="inline-flex items-center justify-center w-5 h-5 rounded bg-white border-2 text-[0.75rem] shrink-0" style="border-color:${t.color};">${t.icon}</span><span class="flex-1 truncate">${esc(t.name.split(' (')[0].split('·')[0])}</span><b class="font-mono" style="color:${t.color};">${n}</b></div>`; }).join('')}</div>

        function safetyClear() { safetySeq++; safety.busy = false; safety.results = []; safety.origin = null; safety.originText = ''; safety.msg = ''; if (safetyLayer) safetyLayer.clearLayers(); renderSafetyLegend(); renderSafetyPanel(); }
        function renderSafetyPanel() {

                ${list}
                <div class="mt-3 pt-2 border-t border-slate-200 dark:border-slate-700 text-[0.625rem] text-slate-500 leading-relaxed">
                    공개 지도에 등록된 시설만 나오므로 빠진 곳이 있을 수 있습니다. 정확한 목록은 공식 사이트에서 확인하세요.<br>
                    · <a class="text-blue-500 hover:underline" target="_blank" rel="noopener noreferrer" href="https://www.e-gen.or.kr/egen/search_emergency_room.do">응급실 찾기 (응급의료포털)</a> ·
                    <a class="text-blue-500 hover:underline" target="_blank" rel="noopener noreferrer" href="https://www.e-gen.or.kr/egen/search_aed.do">AED 찾기</a><br>
                    · <a class="text-blue-500 hover:underline" target="_blank" rel="noopener noreferrer" href="https://www.safekorea.go.kr">대피소·무더위쉼터·한파쉼터 (국민재난안전포털)</a>
                </div>`;
        }

        // ================= 우리 동네 사건사고 알림 =================
        // 새 기사가 들어왔을 때 '알림 지역'에 해당하면 지도 오른쪽 아래에 알림 창을 띄우고 소리를 냅니다.
        const ALERT_SOUNDS = { dingdong: '띵동', bell: '종소리', siren: '경보음', none: '소리 없음' };
        let alertCfg = (() => {
            // court: 재판·판결 소식도 알릴지 (기본 꺼짐 — 지금 일어난 사건이 아니므로)
            const base = { enabled: true, sound: 'dingdong', volume: 70, scope: 'sigungu', region: null, useLocation: false, radiusKm: 5, sos: true, report: true, dm: true, court: false };
            try { return Object.assign(base, JSON.parse(localStorage.getItem('alert_cfg') || '{}')); } catch (e) { return base; }
        })();
        let alertSeenIds = null;      // 이미 본 기사 번호 (처음 불러올 때는 알림을 띄우지 않음)
        let alertAudioCtx = null;
        let alertSeenEvents = new Set();
        let alertHere = null;         // 현재 위치 { lat, lng, sido, sigungu, ts }
        let alertHereMsg = '';
        let alertHereTimer = null, alertSummaryArea = '';

        function saveAlertCfg() { try { localStorage.setItem('alert_cfg', JSON.stringify(alertCfg)); } catch (e) {} }
        function alertRegion() {
            if (alertCfg.region && alertCfg.region.sido) return alertCfg.region;
            if (typeof myTown !== 'undefined' && myTown) return { sido: myTown.sido, sigungu: myTown.sigungu, dong: myTown.dong };
            return null;
        }
        function alertRegionText() {
            const r = alertRegion();
            if (!r) return '아직 정하지 않음';
            return [r.sido, r.sigungu, (alertCfg.scope === 'dong' ? r.dong : '')].filter(Boolean).join(' ');
        }
        function matchAlertRegion(news) {
            const r = alertRegion();
            if (!r) return false;
            const loc = news.location || '';
            if (loc === '전국') return alertCfg.nation === true;   // 전국 단위 소식은 [전국 소식도 받기]를 켠 사람에게만
            if (!loc.includes(r.sido)) return false;
            if (r.sigungu) {
                const city = r.sigungu.split(' ')[0];
                if (!(loc.includes(r.sigungu) || (r.sigungu.includes(' ') && loc.split(' ').pop() === city))) return false;
            }
            if (alertCfg.scope === 'dong' && r.dong) {
                if (!(loc.includes(r.dong) || loc.includes(dongStem(r.dong)))) return false;
            }
            return true;
        }

        // 새로 들어온 기사 확인 (loadIncidentsFromJSON 에서 호출)
        // ---- 현재 위치 기반 알림 ----
        function distKm(lat1, lng1, lat2, lng2) {
            const dy = (lat1 - lat2) * 111, dx = (lng1 - lng2) * 88;
            return Math.sqrt(dx * dx + dy * dy);
        }
        function hereText() {
            if (!alertHere) return '';
            return [alertHere.sido, alertHere.sigungu].filter(Boolean).join(' ');
        }
        function matchHere(news) {
            if (!alertCfg.useLocation || !alertHere) return false;
            if (isOverseas(news)) return false;
            const loc = news.location || '';
            if (loc === '전국') return false;   // 전국 단위 소식은 '지금 계신 곳' 알림이 아님
            if (alertHere.sigungu && loc.includes(alertHere.sido)) {
                const city = alertHere.sigungu.split(' ')[0];
                if (loc.includes(alertHere.sigungu) || (alertHere.sigungu.includes(' ') && loc.split(' ').pop() === city)) return true;
            }
            // 시·군·구 이름이 달라도 반경 안이면 알림 (시·도만 알려진 기사는 위치가 부정확하므로 제외)
            if (news.prec === 'sido') return false;   // 시·도만 알려진 기사는 좌표가 대략적이라 반경 비교에서 제외
            return hasCoords(news) && loc.includes(' ') && distKm(news.lat, news.lng, alertHere.lat, alertHere.lng) <= alertCfg.radiusKm;
        }
        // 현재 위치 다시 확인 (5분마다 + 설정을 켤 때)
        function refreshHere(after) {
            if (!alertCfg.useLocation) return;
            if (!navigator.geolocation) { alertHereMsg = '이 기기(브라우저)는 위치 확인을 지원하지 않습니다.'; return; }
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude, lng = pos.coords.longitude;
                const near = nearestSigungu(lat, lng, 1)[0];
                if (!near || near.dist > 60) { alertHere = null; alertHereMsg = '대한민국 밖에서는 현재 위치 알림을 쓸 수 없습니다.'; }
                else { alertHere = { lat: lat, lng: lng, sido: near.sido, sigungu: near.sigungu, ts: Date.now() }; alertHereMsg = ''; }
                updateAlertButton();
                const p = document.getElementById('alertPanel');
                if (p && !p.classList.contains('hidden')) renderAlertPanel();
                if (typeof after === 'function') after();
            }, err => {
                alertHereMsg = (err && err.code === 1) ? '위치 권한이 거부되었습니다. 주소창의 자물쇠 아이콘에서 위치를 허용해 주세요.' : '현재 위치를 확인하지 못했습니다.';
                const p = document.getElementById('alertPanel');
                if (p && !p.classList.contains('hidden')) renderAlertPanel();
            }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 240000 });
        }
        // 지역이 바뀌었을 때(또는 처음) 최근 6시간 사건을 한 번 알려줌
        function showHereSummary() {
            if (!alertCfg.enabled || !alertCfg.useLocation || !alertHere) return;
            const area = hereText();
            if (area === alertSummaryArea) return;
            alertSummaryArea = area;
            const since = Date.now() / 1000 - 6 * 3600;
            const recent = groupEvents(newsData.filter(n => n.timestamp >= since && alertStageOk(n) && matchHere(n))).map(ev => ev.lead);
            if (recent.length === 0) return;
            showAlertToast({
                head: '📍 현재 계신 지역에서 사건사고가 발생했어요', badge: area + ' · 최근 6시간 ' + recent.length + '건',
                title: recent[0].title, foot: (recent[0].location || '') + ' · ' + (recent[0].source || ''), newsId: recent[0].id, here: true
            });
            playAlertSound();
        }
        function startHereWatch() {
            if (alertHereTimer) { clearInterval(alertHereTimer); alertHereTimer = null; }
            if (!alertCfg.useLocation) { alertHere = null; alertSummaryArea = ''; return; }
            refreshHere(showHereSummary);
            alertHereTimer = setInterval(() => refreshHere(showHereSummary), 5 * 60000);
        }
        function initAlerts() { updateAlertButton(); startHereWatch(); }

        // 알림을 보낼 단계인지: 발생·수사 기사는 알리고, 재판·판결 소식은 [알림 설정]에서 켠 사람에게만
        function alertStageOk(n) { return !isCourt(n) && alertGroupOk(n); }
        // 새로 들어온 기사 확인 (loadIncidentsFromJSON 에서 호출)
        function checkNewIncidents(list) {
            if (alertSeenIds === null) { alertSeenIds = new Set(list.map(n => n.id)); alertSeenEvents = new Set(list.map(evOf)); return; }
            const newArticles = list.filter(n => !alertSeenIds.has(n.id));
            newArticles.forEach(n => alertSeenIds.add(n.id));
            const fresh = [];                      // 같은 사건의 후속 기사는 다시 알리지 않음
            newArticles.forEach(n => { if (!alertSeenEvents.has(evOf(n))) { alertSeenEvents.add(evOf(n)); fresh.push(n); } });
            if (!alertCfg.enabled) return;
            // 새로 모인 기사라도 3시간보다 오래된 일(지난 날짜 채우기·구글 검색으로 뒤늦게 들어온 기사)은 '방금 난 사건'이 아니므로 알리지 않음
            const freshSince = Date.now() / 1000 - 3 * 3600;
            const live = fresh.filter(n => alertStageOk(n) && Number(n.timestamp) >= freshSince);
            // 이미 알린 사건이라도 '새로 드러난 내용'이 담긴 후속 기사가 들어오면 그 내용을 다시 알림 (예: 피해 규모 확대·용의자 검거·원인 확인)
            const newIds = new Set(newArticles.map(n => n.id));
            const upd = alertCfg.upd === false ? [] : groupEvents(list.filter(alertStageOk)).map(ev => ev.head).filter(h => h && newIds.has(h.id) && !live.includes(h) && Number(h.timestamp) >= freshSince);
            const updHere = upd.filter(matchHere), updMine = upd.filter(n => !updHere.includes(n) && matchAlertRegion(n));
            updHere.concat(updMine).slice(0, 3).forEach(n => showAlertToast({
                head: '🆕 사건 새 소식', badge: n.category, title: n.title,
                foot: (n.location || '') + ' · ' + (n.source || ''), newsId: n.id, here: updHere.includes(n)
            }));
            if (updHere.length || updMine.length) playAlertSound();
            const here = live.filter(matchHere);
            const mine = live.filter(n => !here.includes(n) && matchAlertRegion(n));
            if (here.length === 0 && mine.length === 0) return;
            here.slice(0, 3).forEach(n => showAlertToast({
                head: '📍 현재 계신 지역에서 사건사고가 발생했어요', badge: n.category, title: n.title,
                foot: (n.location || '') + ' · ' + (n.source || ''), newsId: n.id, here: true
            }));
            mine.slice(0, 3).forEach(n => showAlertToast({
                head: '🔔 우리 동네 새 사건사고', badge: n.category, title: n.title,
                foot: (n.location || '') + ' · ' + (n.source || ''), newsId: n.id
            }));
            const extra = Math.max(0, here.length - 3) + Math.max(0, mine.length - 3);
            if (extra > 0) showAlertToast({ head: '🔔 새 사건사고', title: '외 ' + extra + '건이 더 있습니다.', foot: hereText() || alertRegionText() });
            playAlertSound();
        }

        // 알림 창 (화면 오른쪽 아래)
        //  · 잠깐 보였다가 저절로 사라짐 (보통 4초, 위험·SOS·내 위치 알림은 8초). 마우스를 올려 두면 멈춤
        //  · 한 번에 최대 5개: 6번째가 오면 가장 오래된 것부터 밀려나며 새 알림이 아래에 붙음
        //  · 2개 이상 떠 있으면 위에 '알림 N개 · 모두 닫기' 막대
        const TOAST_MAX = 5, TOAST_MS = 5000, TOAST_LONG_MS = 8000;
        function toastStackBar() {
            const box = document.getElementById('alertToasts');
            if (!box) return;
            let bar = document.getElementById('toastBar');
            const n = box.querySelectorAll('.toast-card:not(.toast-out)').length;
            if (n < 2) { if (bar) bar.remove(); return; }
            if (!bar) {
                bar = document.createElement('div');
                bar.id = 'toastBar';
                bar.className = 'toast-bar';
                box.insertBefore(bar, box.firstChild);
            }
            bar.innerHTML = `<span><i class="fa-solid fa-bell"></i> 알림 ${n}개</span><button onclick="clearToasts()">모두 닫기 <i class="fa-solid fa-xmark"></i></button>`;
        }
        function clearToasts() {
            document.querySelectorAll('#alertToasts .toast-card').forEach(el => el._close && el._close());
        }
        // ================= 지난 알림 목록 (오른쪽 아래 확성기 버튼) =================
        //  알림창은 몇 초 뒤 사라져서 못 보고 지나갈 수 있으므로, 뜬 알림을 이 기기에 최근 10건까지 기록해 두고 다시 볼 수 있게 함
        const ALERT_LOG_KEY = 'alert_log_v1', ALERT_LOG_SEEN = 'alert_log_seen';
        function alertLogLoad() { try { const a = JSON.parse(localStorage.getItem(ALERT_LOG_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
        function alertLogSave(a) { try { localStorage.setItem(ALERT_LOG_KEY, JSON.stringify(a.slice(0, 10))); } catch (e) {} }
        function alertLogAdd(o) {
            if (!(o.newsId || o.danger || o.here || o.commTab || o.live || o.openCommunity || o.briefing)) return;   // '안내·확인' 같은 단순 알림은 기록하지 않음
            const a = alertLogLoad();
            a.unshift({ ts: Date.now(), head: o.head || '알림', title: o.title || '', badge: o.badge || '', foot: o.foot || '', danger: !!o.danger, here: !!o.here,
                newsId: o.newsId || null, commTab: o.commTab || null, openCommunity: !!o.openCommunity, live: o.live || null, briefing: !!o.briefing });
            alertLogSave(a);
            alertLogBadge();
            const p = document.getElementById('alertLogPanel');
            if (p && !p.classList.contains('hidden')) renderAlertLog();
        }
        function alertLogUnread() { const seen = Number(localStorage.getItem(ALERT_LOG_SEEN) || 0); return alertLogLoad().filter(x => x.ts > seen).length; }
        function alertLogBadge() {
            const n = alertLogUnread();
            ['alertLogBadge', 'alertLogBadgeTop'].forEach(id => { const b = document.getElementById(id); if (!b) return; b.textContent = n > 99 ? '99+' : String(n); b.classList.toggle('hidden', !n); });
        }
        function toggleAlertLog(show) {
            const p = document.getElementById('alertLogPanel'); if (!p) return;
            const want = (typeof show === 'boolean') ? show : p.classList.contains('hidden');
            if (want) {
                try { localStorage.setItem(ALERT_LOG_SEEN, String(Date.now())); } catch (e) {}
                renderAlertLog(); p.classList.remove('hidden'); alertLogBadge();
                const t = document.getElementById('alertToasts'); if (t) t.style.right = 'calc(22rem + 2rem)';   // 열려 있는 동안 새 알림창은 목록 왼쪽에 뜸
            } else {
                p.classList.add('hidden');
                const t = document.getElementById('alertToasts'); if (t) t.style.right = '';
            }
        }
        function alertAgo(ts) {
            const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
            if (s < 60) return '방금'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전';
            return Math.floor(s / 86400) + '일 전';
        }
        function renderAlertLog() {
            const p = document.getElementById('alertLogPanel'); if (!p) return;
            const a = alertLogLoad();
            p.innerHTML = `<div class="flex items-center justify-between px-3 py-2 border-b border-slate-200 dark:border-slate-700 shrink-0">
                    <b class="text-sm text-slate-900 dark:text-white"><i class="fa-solid fa-bullhorn text-indigo-500"></i> 지난 알림 <span class="text-[0.6875rem] font-normal text-slate-400">${a.length}건</span></b>
                    <span class="flex items-center gap-2">${a.length ? '<button onclick="alertLogClear()" class="text-[0.6875rem] text-slate-400 hover:text-rose-500">모두 지우기</button>' : ''}<button onclick="toggleAlertLog(false)" class="text-slate-400 hover:text-slate-700 dark:hover:text-white" aria-label="닫기">✕</button></span></div>
                <div class="overflow-y-auto custom-scrollbar p-2 space-y-1.5">${a.length ? a.map((x, i) => `
                    <button onclick="alertLogOpen(${i})" class="w-full text-left rounded-xl border p-2 ${x.danger ? 'border-rose-300 bg-rose-50 dark:bg-rose-950/30 dark:border-rose-800' : (x.here ? 'border-emerald-300 bg-emerald-50 dark:bg-emerald-950/30 dark:border-emerald-800' : 'border-slate-200 bg-slate-50 dark:bg-slate-800/60 dark:border-slate-700')} hover:brightness-95">
                        <div class="flex items-center justify-between gap-2 text-[0.625rem] font-bold text-slate-500"><span class="truncate">${esc(x.head)}${x.badge ? ' · ' + esc(x.badge) : ''}</span><span class="shrink-0">${alertAgo(x.ts)}</span></div>
                        <div class="text-xs font-bold text-slate-900 dark:text-white leading-snug mt-0.5 line-clamp-2">${esc(x.title)}</div>
                        ${x.foot ? `<div class="text-[0.625rem] text-slate-500 truncate mt-0.5">${esc(x.foot)}</div>` : ''}</button>`).join('') : '<div class="text-center text-xs text-slate-400 py-8 leading-relaxed">아직 받은 알림이 없어요.<br>새 알림이 뜨면 여기에 차곡차곡 쌓여요.</div>'}</div>`;
        }
        function alertLogClear() { alertLogSave([]); renderAlertLog(); alertLogBadge(); }
        function alertLogOpen(i) {
            const x = alertLogLoad()[i]; if (!x) return;
            if (x.newsId) {
                const n = newsData.find(v => v.id === x.newsId);
                if (n) { currentCategory = 'all'; currentSub = null; showInFilter(n); selectedHotspotRegion = null; hotspotArticleOpen = false; selectedDate = dateKey(n.timestamp); dateFollowToday = (selectedDate === todayKey()); renderCategoryBar(); selectNews(n.id); toggleAlertLog(false); }
                else alert('이 기사는 보관 기간(7일)이 지나 더는 목록에 없어요.');
            } else if (x.commTab) { openCommunity(); if (myTown) setTimeout(() => setCommTab(x.commTab), 30); toggleAlertLog(false); }
            else if (x.openCommunity) { openCommunity(); toggleAlertLog(false); }
            else if (x.live) { watchLive(x.live); toggleAlertLog(false); }
            else if (x.briefing) { openBriefing('report'); toggleAlertLog(false); }
        }
        window.addEventListener('load', () => setTimeout(alertLogBadge, 300));

        // ================= 바탕화면(컴퓨터 화면 오른쪽 아래) 알림 =================
        //  이 사이트 탭이 열려 있어도 다른 창·탭에서 작업 중이면 페이지 안의 알림창은 보이지 않으므로,
        //  브라우저 알림(윈도우는 화면 오른쪽 아래)으로도 띄움. 알림을 누르면 이 사이트 창으로 돌아와 해당 사건을 엶.
        function desktopNoticeState() {
            if (typeof Notification === 'undefined') return 'unsupported';
            return Notification.permission;   // granted / denied / default
        }
        function pageIsBackground() { return document.hidden || !document.hasFocus(); }
        function showDesktopNotice(o, toastEl) {
            if (alertCfg.desktop === false) return;
            if (desktopNoticeState() !== 'granted') return;
            if (!pageIsBackground()) return;
            if (!(o.test || o.newsId || o.danger || o.here || o.commTab || o.openCommunity || o.live || o.briefing)) return;   // 단순 안내는 제외
            const nt = new Notification(String(o.head || '알림').replace(/^[^\w가-힣]+/, ''), {
                body: (o.badge ? '[' + o.badge + '] ' : '') + (o.title || '') + (o.foot ? '\n' + o.foot : ''),
                tag: o.newsId ? 'news-' + o.newsId : undefined,
                requireInteraction: !!(o.danger || o.here),
                silent: false
            });
            nt.onclick = () => {
                try { window.focus(); } catch (e) {}
                try { toastEl && toastEl.onclick && toastEl.onclick({}); } catch (e) {}
                nt.close();
            };
        }
        async function setDesktopNotice(on) {
            alertCfg.desktop = !!on; saveAlertCfg();
            if (on && desktopNoticeState() === 'default') { try { await Notification.requestPermission(); } catch (e) {} }
            renderAlertPanel();
        }
        function desktopNoticeHint() {
            const s = desktopNoticeState();
            if (s === 'unsupported') return '이 브라우저는 바탕화면 알림을 지원하지 않아요.';
            if (alertCfg.desktop === false) return '꺼져 있어요.';
            if (s === 'granted') return '켜짐 · 다른 창에서 작업 중이어도 화면 오른쪽 아래에 알림이 떠요.';
            if (s === 'denied') return '브라우저에서 차단되어 있어요. 주소창 왼쪽 자물쇠 → 알림 → 허용으로 바꿔 주세요.';
            return '아래 [허용하기]를 누르고, 브라우저가 묻는 알림 권한을 [허용]해 주세요.';
        }

        function showAlertToast(o) {
            const box = document.getElementById('alertToasts');
            if (!box) return;
            try { alertLogAdd(o); } catch (e) {}
            const tone = o.danger ? 'danger' : (o.here ? 'here' : 'info');
            const ms = o.ms || ((o.danger || o.here || o.live) ? TOAST_LONG_MS : TOAST_MS);

        // 알림 소리 (별도 음원 파일 없이 브라우저가 직접 소리를 만듭니다)
        function ensureAudio() {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                if (!alertAudioCtx) alertAudioCtx = new AC();
                if (alertAudioCtx.state === 'suspended') alertAudioCtx.resume();
                return alertAudioCtx;
            } catch (e) { return null; }
        }
        function playAlertSound(name, volume) {
            const kind = name || alertCfg.sound;
            if (kind === 'none') return;
            const ctx = ensureAudio();
            if (!ctx) return;
            const vol = Math.max(0, Math.min(1, (volume == null ? alertCfg.volume : volume) / 100));
            if (vol === 0) return;
            const tone = (freq, start, dur, type) => {
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = type || 'sine';
                osc.frequency.value = freq;
                const t0 = ctx.currentTime + start;
                gain.gain.setValueAtTime(0.0001, t0);
                gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol * 0.5), t0 + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(t0); osc.stop(t0 + dur + 0.05);
            };
            if (kind === 'dingdong') { tone(880, 0, 0.45); tone(660, 0.35, 0.7); }
            else if (kind === 'bell') { tone(1318, 0, 1.2); tone(1976, 0, 0.8); tone(2637, 0, 0.5); }
            else if (kind === 'siren') { for (let i = 0; i < 6; i++) tone(i % 2 ? 980 : 720, i * 0.18, 0.18, 'square'); }

        async function voteFact(ctx, id, key) {
            const c = CHAT_CTX[ctx];

            const had = ((m.facts || {})[key] || []).includes(COMM_UID);

            try {

        // 개포1동 → 개포동 (같은 이름의 1동·2동은 하나의 동네로 묶음)

        // 사진은 줄여서 글과 함께 저장, 동영상은 Firebase Storage 에 올림
        function compressImage(file, maxSide, maxBytes) {
            return new Promise((res, rej) => {
                const r = new FileReader();
                r.onerror = rej;
                r.onload = () => {
                    const img = new Image();
                    img.onerror = rej;
                    img.onload = () => {
                        let side = maxSide, q = 0.8, out = '';
                        for (let i = 0; i < 7; i++) {
                            const sc = Math.min(1, side / Math.max(img.width, img.height));
                            const c = document.createElement('canvas');
                            c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
                            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                            out = c.toDataURL('image/jpeg', q);
                            if (out.length * 0.75 <= maxBytes) break;
                            q = Math.max(0.4, q - 0.1); side = Math.round(side * 0.8);
                        }
                        res(out);
                    };
                    img.src = r.result;
                };
                r.readAsDataURL(file);
            });
        }
        async function commUploadVideo(file) {

        // 제보 종류는 따로 고르지 않고 글 내용에서 짐작 (글 위의 작은 꼬리표로만 쓰임)
        const REPORT_KIND_RX = [['화재', /화재|불이|불길|연기|타고\s*있|전소/], ['교통사고', /교통사고|추돌|충돌|사고\s*났|차량\s*전복|들이받|오토바이\s*사고/], ['실종', /실종|잃어버|찾고\s*있|찾습니다|미아/],
            ['범죄 의심', /도둑|절도|폭행|싸움|흉기|강도|사기|수상한\s*거래|몰카|불법\s*촬영/], ['수상한 사람', /수상한\s*(?:사람|남성|여성|차)|배회|따라오/], ['안전사고', /넘어|미끄러|추락|떨어|부상|다쳤|쓰러|가스\s*냄새/],
            ['재난·날씨', /태풍|폭우|호우|폭설|지진|홍수|침수|산사태|강풍|한파|폭염|정전|단수/], ['도로·시설', /싱크홀|도로\s*(?:파손|공사|통제)|신호등|가로등|맨홀|공사|통제|고장|누수/]];
        // 제보 종류 표시: 종류마다 색·아이콘이 달라 한눈에 구분 (진한 바탕 + 흰 글씨, 글씨는 크지 않게)
        const KIND_STYLE = { '화재': ['🔥', 'bg-orange-600', '#ea580c'], '교통사고': ['🚗', 'bg-blue-600', '#2563eb'], '범죄 의심': ['🚔', 'bg-violet-600', '#7c3aed'], '수상한 사람': ['👀', 'bg-slate-700', '#334155'],

        // 글쓰기에서 고르는 테마 (순서 그대로 표시). SOS 는 실종·사고처럼 급한 것만 보여 줌
        const SAFETY_THEMES = ['실종', '교통사고', '화재', '범죄 의심', '수상한 사람', '안전사고', '재난·날씨', '도로·시설', '기타'];
        const SOS_THEMES = ['실종', '교통사고', '화재', '안전사고', '기타'];

                            <div class="mt-1.5 flex flex-wrap items-center gap-1"><span id="pfFollow" class="inline-flex gap-1">${!commOpen('people') ? '' : followCountsHtml(uid, followCache[uid] || (mine ? { following: Object.keys(following).map(u => ({ uid: u })), followers: followers } : null))}</span>${mine ? `<span id="pfTrust">${trustChipHtml(trustCache[uid])}</span>` : ''}</div>

                    ${mine ? '' : `<div id="pfTrust" class="mt-2">${trustHtml(trustCache[uid])}</div>`}
                    ${mine ? '' : `${!commOpen('people') ? '' : `<div class="mt-2 flex items-center justify-center gap-1.5 text-[0.6875rem] text-slate-500"><span>대화 매너 평가</span><span id="mannerStars">${mannerStars(uid)}</span></div>`}

                    ${commOpen('people') ? '<div class="mt-1 text-[0.625rem] text-slate-400">팔로우는 바로 되고, 1:1 대화는 상대가 수락하거나 서로 팔로우(맞팔)하면 시작됩니다</div>' : ''}
                    ${natTop ? '<div class="mt-2 inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-amber-100 dark:bg-amber-950/50 text-amber-800 dark:text-amber-200 text-[0.6875rem] font-bold">👑 이달의 전국 인기 이웃 · 동네가 달라도 팔로우·대화 요청을 보낼 수 있어요</div>' : ''}`}
                    ${mine || !canChat(uid) ? '' : `<div class="mt-2 flex gap-2 justify-center">
                        <button onclick="closeProfile(); startCall('${esc(uid)}', profileShown.nick, false)" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 text-xs font-bold"><i class="fa-solid fa-phone"></i> 음성 통화</button>
                        <button onclick="closeProfile(); startCall('${esc(uid)}', profileShown.nick, true)" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 text-xs font-bold"><i class="fa-solid fa-video"></i> 영상 통화</button>
                    </div>`}
                    <div class="mt-3 pt-3 border-t border-slate-200 dark:border-slate-700 text-left">
                        <div class="flex items-center justify-between mb-2">
                            <b class="text-sm text-slate-900 dark:text-white"><i class="fa-solid fa-table-cells"></i> ${mine ? '내 일상' : '일상 게시물'}</b>
                            ${mine ? `<button onclick="openFeedComposer()" title="새 게시물 쓰기" aria-label="새 게시물 쓰기" class="w-9 h-9 shrink-0 rounded-full bg-gradient-to-br from-rose-500 to-violet-600 text-white text-base shadow-lg ring-2 ring-white dark:ring-slate-900 flex items-center justify-center hover:scale-110 active:scale-95 transition"><i class="fa-solid fa-plus"></i></button>` : ''}
                        </div>
                        <div id="pfFeed"><div class="text-center py-8 text-xs text-slate-400">게시물을 불러오는 중…</div></div>
                    </div>
                    ${mine ? '' : `<div class="mt-3 pt-2 border-t border-slate-200 dark:border-slate-700">${iBlocked(uid)
                        ? `<button onclick="unblockUser('${esc(uid)}')" class="text-[0.6875rem] font-bold text-emerald-600 hover:underline">차단 해제하기</button>`
                        : `<button onclick="blockUser('${esc(uid)}', profileShown.nick, profileShown.emoji)" class="text-[0.6875rem] font-bold text-red-500 hover:underline">🚫 이 이웃 차단하기</button> <button onclick="openContentReport('user','${esc(uid)}', '${esc(uid)}')" class="ml-3 text-[0.6875rem] font-bold text-slate-500 hover:underline">🚩 신고하기</button>`}</div>`}
                </div>`;
            card.classList.remove('hidden');
            profileShown = { uid: uid, nick: m.nick || '이웃', emoji: m.emoji || '🙂', photo: m.photo || '', area: area };
            feedOpen = null; feedDraft = null; stopFeedComments();
            loadTrust(uid).then(tr => { const el = document.getElementById('pfTrust'); if (el && profileShown.uid === uid) el.innerHTML = mine ? trustChipHtml(tr) : trustHtml(tr); });

            // 상대가 '게시물 비공개'로 해 두었으면 격자 대신 자물쇠 안내
            const mem = commMembers.find(x => x.uid === uid);
            if (!mine && mem && mem.feedPublic === false) { document.getElementById('pfFeed').innerHTML = feedLockedHtml(); return; }
            loadFeed(uid).then(() => { if (profileShown.uid === uid) renderFeedGrid(uid); })
                .catch(e => { console.error(e); const el = document.getElementById('pfFeed'); if (el) el.innerHTML = '<div class="text-center py-8 text-xs text-slate-400">게시물을 불러오지 못했습니다.</div>'; });
        }

        // ================= 내 일상 (프로필 게시물 · 인스타그램처럼) =================
        //  - 내 프로필에서 글·사진(최대 4장)·동영상을 올려 일상을 기록하고, 이웃이 내 프로필에 들어와 게시물을 보며 서로를 알아 갑니다.
        //  - 게시물마다 ❤ 하트, 감정 표현(😂😮😢👏🔥), 댓글
        //  - 공개 설정: '게시물 공개'(끄면 나만 봄) · '우리동네 인기쟁이 순위 공개'(켠 사람만 순위에 나옴) — 내 프로필에서 바꿈
        //  - 저장: 서버(Firebase) 연결 시 feedPosts 컬렉션(댓글은 그 아래 comments), 체험 모드에서는 이 기기에만 저장
        const FEED_REACTS = ['😂', '😮', '😢', '👏', '🔥'];
        const FEED_IMG_MAX = 4, FEED_TEXT_MAX = 500, FEED_CMT_MAX = 200;
        const FEED_VIDEO_ON = false;     // 동영상 올리기: Firebase Storage(유료 요금제 필요할 수 있음)를 켠 뒤 true
        const FEED_VIDEO_RE = /^https:\/\/firebasestorage\.googleapis\.com\//;
        let feedCache = {};             // uid → 게시물 목록
        let feedOpen = null;            // 지금 크게 보고 있는 게시물 { uid, id }
        let feedComments = [], feedCommentsUnsub = null;
        let feedDraft = null;           // 새 게시물 { imgs: [dataUrl], video: { file, preview } }
        let feedBusy = false;
        function feedLocal() { try { return JSON.parse(lsGet('feed_posts') || '[]'); } catch (e) { return []; } }
        function feedLocalSave(list) {
            const l = list.slice(0, 60);
            if (!lsSet('feed_posts', JSON.stringify(l))) lsSet('feed_posts', JSON.stringify(l.map(p => Object.assign({}, p, { media: (p.media || []).slice(0, 1) }))));
        }
        function feedCol() { return commDb.collection('feedPosts'); }
        // 남의 게시물: 공개 + 차단 안 함 + 글쓴이가 '이 사람에게 내 게시물 숨기기'로 나를 넣지 않았을 때만 보임
        function feedVisible(p) { return !!p && (p.uid === COMM_UID || (p.pub !== false && !isBlocked(p.uid) && !(p.hideFrom || []).includes(COMM_UID))); }
        function feedFind(uid, id) { return (feedCache[uid] || []).find(p => p.id === id) || null; }
        function feedCount(o) { return o ? Object.keys(o).length : 0; }
        async function loadFeed(uid) {
            const db = await commInit();
            let posts;
            if (db) {
                const snap = await feedCol().where('uid', '==', uid).limit(90).get();
                posts = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
            } else posts = uid === COMM_UID ? feedLocal() : (demoOn() ? demoItems('feed').filter(p => p.uid === uid) : []);
            feedCache[uid] = posts.filter(feedVisible).sort((a, b) => (b.ts || 0) - (a.ts || 0));
            return feedCache[uid];
        }
        function feedStatsHtml(list) {
            const n = list ? list.length : '–';
            const hearts = list ? list.reduce((a, p) => a + feedCount(p.hearts) + feedCount(p.reacts), 0) : '–';
            const cmts = list ? list.reduce((a, p) => a + (p.comments || 0), 0) : '–';
            // 한 줄로 작게: '📷 게시물 3 · ❤ 받은 감정 12 · 💬 댓글 4'
            const cell = (icon, v, l) => `<span class="inline-flex items-center gap-1"><span class="opacity-70">${icon}</span>${l} <b class="text-slate-800 dark:text-slate-100">${v}</b></span>`;
            return `<div class="flex flex-wrap items-center gap-x-3 gap-y-0.5 text-[0.6875rem] text-slate-500">${cell('📷', n, '게시물')}${cell('❤', hearts, '받은 감정')}${cell('💬', cmts, '댓글')}</div>`;
        }
        // 작게 줄인 신뢰 지수 (내 프로필용): 점수·등급 한 줄. 누르면 신뢰 지수 기준 안내
        function trustChipHtml(t) {
            const score = t && t.count ? t.score : TRUST_BASE;
            const enough = t && t.count >= TRUST_MIN_VOTES;
            const col = trustColor(score);
            const grade = enough ? trustLevel(score)[1] : (t && t.count ? '평가 부족' : '평가 없음');
            return `<button onclick="showReportGuide()" title="${esc(TRUST_HELP)}" class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 border text-[0.6875rem] font-bold" style="border-color:${col[1]}; background:${col[2]}; color:${col[1]};"><i class="fa-solid fa-shield-halved text-[0.625rem]"></i>신뢰 ${score}<span class="font-semibold opacity-80">· ${esc(grade)}</span></button>`;
        }
        function feedLockedHtml() {
            return `<div class="text-center py-10 text-slate-400"><div class="text-3xl mb-1">🔒</div><div class="text-xs">이 이웃은 일상 게시물을 비공개로 설정했습니다.</div></div>`;
        }
        // 내 프로필에서만 보이는 공개 설정 스위치
        function feedPrivacyHtml() {
            const sw = (key, on, label, help) => `<label class="flex items-start gap-2 text-left cursor-pointer">
                <span class="relative mt-0.5 shrink-0"><input type="checkbox" class="peer sr-only" ${on ? 'checked' : ''} onchange="setFeedPrivacy('${key}', this.checked)">
                    <span class="block w-9 h-5 rounded-full bg-slate-300 dark:bg-slate-600 peer-checked:bg-emerald-500 transition"></span>
                    <span class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-white shadow transition peer-checked:translate-x-4"></span></span>
                <span class="min-w-0"><span class="block text-xs font-bold text-slate-800 dark:text-slate-100">${label}</span><span class="block text-[0.625rem] text-slate-500 leading-snug">${help}</span></span></label>`;
            return `<div class="mt-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-2">
                ${sw('feedPublic', commProfile.feedPublic !== false, '게시물 공개', '끄면 내 일상 게시물은 나만 볼 수 있습니다.')}
                ${sw('rankPublic', !!commProfile.rankPublic, '🏆 우리동네 인기쟁이 순위에 공개', '켜면 받은 ❤·감정·댓글로 정해지는 동네 인기 순위에 내 프로필이 나옵니다. (기본: 꺼짐)')}
            </div>`;
        }
        async function setFeedPrivacy(key, on) {
            commProfile[key] = !!on;
            lsSet('comm_profile', JSON.stringify(commProfile));
            commTouch();
            const flag = key === 'feedPublic' ? 'pub' : 'rank';
            // 이미 올린 내 게시물에도 바로 적용 (보는 사람·순위 계산이 게시물에 적힌 표시를 보므로)
            const mine = feedCache[COMM_UID] || await loadFeed(COMM_UID);
            const db = await commInit();
            if (db) {
                try { const b = db.batch(); mine.slice(0, 90).forEach(p => b.update(feedCol().doc(p.id), { [flag]: !!on })); await b.commit(); } catch (e) { console.error(e); }
            } else feedLocalSave(feedLocal().map(p => Object.assign(p, { [flag]: !!on })));
            mine.forEach(p => { p[flag] = !!on; });
            showAlertToast({ head: '공개 설정', title: key === 'feedPublic' ? (on ? '내 일상 게시물을 이웃에게 공개합니다.' : '내 일상 게시물을 나만 보도록 바꿨습니다.') : (on ? '우리동네 인기쟁이 순위에 내 프로필을 공개합니다.' : '인기쟁이 순위에서 내 프로필을 뺐습니다.') });
            if (commTab === 'popular') { popularLoadedAt = 0; renderPopular(); }
            // 내 프로필이 열려 있으면 스위치 모양도 맞춤
            document.querySelectorAll(`#commProfileCard input[onchange*="'${key}'"]`).forEach(x => { x.checked = !!on; });
        }
        function feedImgOk(m) { return m && m.k === 'img' && IMG_DATA_RE.test(m.src || ''); }
        function feedVideoOk(m) { return m && m.k === 'video' && (FEED_VIDEO_RE.test(m.url || '') || /^blob:/.test(m.url || '')); }
        function renderFeedGrid(uid) {
            const box = document.getElementById('pfFeed');
            if (!box) return;
            const list = feedCache[uid] || [];
            const st = document.getElementById('pfStats'); if (st) st.innerHTML = feedStatsHtml(list);
            if (!list.length) {
                box.innerHTML = `<div class="text-center py-10 text-slate-400"><div class="text-3xl mb-1">📷</div><div class="text-xs">${uid === COMM_UID ? '아직 게시물이 없습니다. 오른쪽 위 ＋ 버튼으로 오늘의 일상을 기록해 보세요.' : '아직 올린 게시물이 없습니다.'}</div></div>`;
                return;
            }
            // 칸 크기는 커뮤니티 화면 너비와 상관없이 고정(최대 7rem): 화면이 넓어도 커지지 않고, 아주 좁을 때만 3칸이 나란히 줄어듦
            box.innerHTML = `<div class="grid gap-1" style="grid-template-columns: repeat(3, minmax(0, 7rem)); justify-content: start;">${list.map(p => {
                const m = (p.media || [])[0];
                const inner = feedImgOk(m) ? `<img src="${m.src}" alt="" class="w-full h-full object-cover">`
                    : (feedVideoOk(m) ? `<div class="w-full h-full bg-slate-800 text-white flex items-center justify-center text-2xl"><i class="fa-solid fa-play"></i></div>`
                    : `<div class="w-full h-full p-2 bg-gradient-to-br from-sky-100 to-violet-100 dark:from-slate-800 dark:to-slate-700 text-[0.6875rem] text-slate-700 dark:text-slate-200 overflow-hidden text-left leading-snug break-words">${esc((p.text || '').slice(0, 90))}</div>`);
                return `<button onclick="openFeedPost('${esc(uid)}', '${esc(p.id)}')" class="relative aspect-square overflow-hidden rounded-md bg-slate-100 dark:bg-slate-800 group">${inner}
                    ${(p.media || []).length > 1 ? '<i class="fa-solid fa-clone absolute top-1 right-1 text-white text-xs" style="text-shadow:0 1px 3px rgba(0,0,0,.6)"></i>' : ''}
                    <span class="absolute inset-0 bg-black/45 text-white text-xs font-bold flex items-center justify-center gap-2 opacity-0 group-hover:opacity-100 transition">❤ ${feedCount(p.hearts)} · 💬 ${p.comments || 0}</span></button>`;
            }).join('')}</div>`;
        }
        // 게시물 크게 보기: 사진·동영상 + 글 + ❤ + 감정 표현 + 댓글
        function openFeedPost(uid, id) {
            feedOpen = { uid: uid, id: id };
            renderFeedPost();
            subscribeFeedComments(id);
        }
        function closeFeedPost() { feedOpen = null; stopFeedComments(); renderFeedGrid(profileShown.uid); }
        function renderFeedPost() {
            const box = document.getElementById('pfFeed');
            if (!box || !feedOpen) return;
            const p = feedFind(feedOpen.uid, feedOpen.id);
            if (!p) { closeFeedPost(); return; }
            const media = (p.media || []).map(m => feedImgOk(m) ? `<img src="${m.src}" alt="" onclick="openMedia(this.src)" class="w-full rounded-lg object-cover max-h-80 cursor-zoom-in">`
                : (feedVideoOk(m) ? `<video src="${esc(m.url)}" controls playsinline class="w-full rounded-lg max-h-80 bg-black"></video>` : '')).join('');
            const heartOn = !!(p.hearts && p.hearts[COMM_UID]);
            const myReact = p.reacts && p.reacts[COMM_UID];
            const rc = {}; Object.values(p.reacts || {}).forEach(e => { rc[e] = (rc[e] || 0) + 1; });
            const own = p.uid === COMM_UID;
            const st = document.getElementById('pfStats'); if (st) st.innerHTML = feedStatsHtml(feedCache[feedOpen.uid] || []);
            box.innerHTML = `<div class="space-y-2">
                <div class="flex items-center justify-between"><button onclick="closeFeedPost()" class="text-xs font-bold text-slate-500 hover:text-slate-800 dark:hover:text-white"><i class="fa-solid fa-arrow-left"></i> 게시물 목록</button>
                    <span class="text-[0.625rem] text-slate-400">${timeAgo(p.ts)}${p.pub === false ? ' · 🔒 나만 보기' : ''}</span></div>
                ${media ? `<div class="space-y-1.5">${media}</div>` : ''}
                ${p.text ? `<p class="text-sm text-slate-800 dark:text-slate-100 whitespace-pre-wrap break-words">${esc(p.text)}</p>` : ''}
                <div class="flex flex-wrap items-center gap-1.5 pt-1">
                    <button onclick="feedHeart()" class="px-2.5 py-1 rounded-full border text-xs font-bold transition ${heartOn ? 'border-rose-400 bg-rose-50 dark:bg-rose-950/50 text-rose-600' : 'border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:border-rose-300'}">${heartOn ? '❤️' : '🤍'} ${feedCount(p.hearts)}</button>
                    ${FEED_REACTS.map(e => `<button onclick="feedReact('${e}')" title="감정 표현" class="px-2 py-1 rounded-full border text-xs transition ${myReact === e ? 'border-amber-400 bg-amber-50 dark:bg-amber-950/50 font-bold' : 'border-slate-200 dark:border-slate-700 hover:border-amber-300'}">${e}${rc[e] ? ' ' + rc[e] : ''}</button>`).join('')}
                    ${own ? `<button onclick="feedDelete()" class="ml-auto text-[0.6875rem] text-slate-400 hover:text-red-500">삭제</button>` : reportBtn('feed', p.id, p.uid, 'ml-auto text-[0.6875rem] text-slate-400 hover:text-red-500')}
                </div>
                <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
                    <div class="text-xs font-bold text-slate-600 dark:text-slate-300 mb-1">💬 댓글 ${p.comments || 0}</div>
                    <div id="feedCmts" class="space-y-1.5 max-h-56 overflow-y-auto custom-scrollbar">${feedCommentsHtml()}</div>
                    ${(p.noReply || []).includes(COMM_UID) ? '<div class="text-[0.625rem] text-slate-400 mt-1">글쓴이가 댓글을 제한한 게시물입니다.</div>' : myTown ? `<div class="mt-2 flex gap-1.5"><input id="feedCmtIn" maxlength="${FEED_CMT_MAX}" placeholder="댓글 달기 (${FEED_CMT_MAX}자 이내)" onkeydown="if(event.key==='Enter'&&!event.isComposing)feedComment()" class="flex-1 min-w-0 bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-900 dark:text-white">
                        <button onclick="feedComment()" class="px-3 py-1.5 rounded-lg bg-violet-600 hover:bg-violet-500 text-white text-xs font-bold">게시</button></div>` : '<div class="text-[0.625rem] text-slate-400 mt-1">동네 인증을 하면 댓글을 달 수 있습니다.</div>'}
                </div></div>`;
        }
        function feedCommentsHtml() {
            const list = feedComments.filter(c => !isBlocked(c.uid));
            return list.length ? list.map(c => `<div class="flex items-start gap-1.5 text-xs"><button onclick="showProfile('${esc(c.uid)}')" class="shrink-0">${avatarHtml(c, 'w-6 h-6', 'text-xs')}</button>
                <div class="min-w-0 flex-1"><b class="text-slate-800 dark:text-slate-100">${esc(displayName(c.uid, c.nick))}</b> <span class="text-slate-700 dark:text-slate-200 break-words">${esc(c.text)}</span>
                <span class="text-[0.625rem] text-slate-400"> · ${timeAgo(c.ts)}</span>${c.uid === COMM_UID || (feedOpen && feedOpen.uid === COMM_UID) ? ` <button onclick="feedDeleteComment('${esc(c.id)}')" class="text-[0.625rem] text-slate-400 hover:text-red-500">삭제</button>` : ''}</div></div>`).join('')

        function openMySettings() {

        // 프로필 사진(아이콘)만 바꾸는 창 — 내 프로필의 사진을 누르면 열림

        document.addEventListener('keydown', (e) => {

        function openMyProfile() {

        // 사진 크게 보기

        const IMG_DATA_RE = /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/;
        var commSampleGroup = null;   // 사용 안내(투어) 중 동네 인증 전 방문자에게 보여 줄 '예시 게시물' 묶음 이름
        let commTab = 'talk';        // 'talk'(사건사고·이야기) / 'market'(장터)
        let marketItems = [], marketUnsub = null, marketOpen = null, marketChat = [], marketChatUnsub = null;
        let marketForm = false, marketAttach = null, marketFilter = '전체';
        let marketScope = 'town';     // 'town'(우리 동네 장터) / 'nation'(전국 장터)
        let marketNation = [], marketNationUnsub = null, marketQuery = '';

        function marketCol() { return commDoc(townKey(myTown)).collection('market'); }

        function marketFind(id) { return marketItems.find(x => x.id === id) || marketNation.find(x => x.id === id) || null; }

            if (marketNationUnsub) { marketNationUnsub(); marketNationUnsub = null; }

                marketNationUnsub = marketNationCol().orderBy('ts', 'desc').limit(300).onSnapshot(snap => {
                    marketNation = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));

            marketScope = sc; marketOpen = null; stopMarketChat();

            commTab = tab; marketOpen = null; marketForm = false; stopMarketChat();

                        <p class="text-[0.6875rem] text-slate-400">거래는 사람이 많은 곳에서 직접 만나서 하고, 먼저 돈을 보내 달라는 요구는 조심하세요.</p>
                    </div>`;

            }

            // 2) 물건 상세 + 문의 채팅
            const it = marketOpen ? marketFind(marketOpen) : null;
            if (it) {
                const mine = it.uid === COMM_UID, done = it.status === 'done';

                    <div class="px-3 py-2 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between shrink-0">
