                        <div>
                            <div class="flex items-center gap-2">${badge(it.kind)}${done ? '<span class="text-[0.625rem] font-bold px-1.5 py-0.5 rounded bg-slate-400 text-white">거래완료</span>' : ''}</div>
                            <h3 class="mt-1 text-base font-bold text-slate-900 dark:text-white break-words">${esc(it.title)}</h3>
                            <div class="text-sm font-extrabold text-emerald-600">${esc(it.price || (it.kind === '나눔' ? '무료 나눔' : '가격 문의'))}</div>
                            <div class="mt-1 text-[0.6875rem] text-slate-500 flex flex-wrap items-center gap-1.5"><button onclick="showProfile('${esc(it.uid)}')" class="hover:underline inline-flex items-center gap-1">${avatarHtml(it, 'w-5 h-5', 'text-xs')} ${esc(it.nick || '이웃')}</button> · ${timeAgo(it.ts)}
                                <span class="px-1.5 py-0.5 rounded bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 font-bold"><i class="fa-solid fa-location-dot"></i> ${esc(it.area || myArea())}</span>
                                ${mine || !commOpen('people') ? '' : `<button onclick="openDM('${esc(it.uid)}', marketFind('${esc(it.id)}').nick, marketFind('${esc(it.id)}').emoji, marketFind('${esc(it.id)}').photo, marketFind('${esc(it.id)}').area)" class="px-2 py-0.5 rounded bg-sky-600 hover:bg-sky-500 text-white font-bold"><i class="fa-solid fa-comment"></i> 글쓴이와 1:1 대화</button>`}
                            </div>
                            ${it.area && myTown && it.area !== myArea() ? '<div class="mt-1 text-[0.6875rem] text-amber-700 dark:text-amber-300">다른 동네에 올라온 물건입니다. 택배 거래를 할 때는 먼저 돈을 보내 달라는 요구를 특히 조심하세요.</div>' : ''}
                        </div>
                        ${it.desc ? `<p class="text-sm text-slate-800 dark:text-slate-100 whitespace-pre-line break-words">${esc(it.desc)}</p>` : ''}
                        <div id="mkRating">${tradeRatingHtml(it)}</div>
                        ${it.contact ? `<div class="text-xs text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 rounded-lg px-3 py-2">연락 방법: <b class="select-all">${esc(it.contact)}</b></div>` : ''}
                        <div class="pt-2 border-t border-slate-200 dark:border-slate-800">
                            <div class="text-xs font-bold text-slate-700 dark:text-slate-200 mb-2">💬 문의 채팅 <span class="font-normal text-slate-400">(이 물건을 보는 사람에게 공개됩니다)</span></div>
                            <div id="mkChat" class="space-y-2"></div>
                        </div>
                    </div>
                    <div class="border-t border-slate-200 dark:border-slate-800 p-3 flex items-end gap-2 shrink-0 bg-white dark:bg-slate-900">
                        ${emojiBtn('mkChatText')}
                        <textarea id="mkChatText" rows="1" maxlength="300" placeholder="${mine ? '문의에 답해 주세요' : '글쓴이에게 물어보세요 (예: 아직 있나요?)'}" class="flex-1 min-w-0 bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-2 text-sm text-slate-900 dark:text-white"></textarea>
                        <button onclick="marketChatSend()" class="px-4 py-2 rounded-lg text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-500 whitespace-nowrap">보내기</button>
                    </div>`;
                renderMarketChat();
                return;
            }

            // 3) 목록 (우리 동네 / 전국)
            const nation = marketScope === 'nation';
            const q = marketQuery.toLowerCase();
            const list = (nation ? marketNation : marketItems).filter(x => !isBlocked(x.uid) && (marketFilter === '전체' || x.kind === marketFilter)
                && (!q || ((x.title || '') + ' ' + (x.desc || '') + ' ' + (x.area || '')).toLowerCase().includes(q)));
            const chip = f => `<button onclick="setMarketFilter('${f}')" class="px-2.5 py-1 rounded-full text-[0.6875rem] font-bold border ${marketFilter === f ? 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 border-transparent' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-300 dark:border-slate-600'}">${f === '전체' ? f : kindLabel(f)}</button>`;
            const scopeBtn = (sc, label) => `<button onclick="setMarketScope('${sc}')" class="px-3 py-1.5 text-xs font-bold ${marketScope === sc ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'}">${label}</button>`;
            main.innerHTML = `
                <div class="px-3 py-2 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2 shrink-0">
                    <div class="inline-flex rounded-lg overflow-hidden border border-emerald-600">${scopeBtn('town', '🏘 우리 동네')}${scopeBtn('nation', '🌐 전국 장터 보기')}</div>
                    <button onclick="openMarketForm(true)" class="pb-write-fab px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold"><i class="fa-solid fa-plus"></i> 물건 올리기</button>
                </div>
                <div class="px-3 py-2 border-b border-slate-200 dark:border-slate-800 flex flex-wrap items-center gap-2 shrink-0">
                    <div class="mk-chips flex flex-wrap items-center gap-1.5">${['전체'].concat(MARKET_KINDS).map(chip).join('')}</div>
                    <input id="mkSearch" type="search" placeholder="${nation ? '전국에서 물건 찾기 (물건 이름·지역)' : '우리 동네에서 물건 찾기'}" onchange="setMarketQuery(this.value)" onkeydown="if (event.key === 'Enter') setMarketQuery(this.value)" class="flex-1 min-w-[8rem] bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-2.5 py-1 text-xs text-slate-900 dark:text-white">
                </div>
                ${nation ? `<div class="px-3 py-1.5 text-[0.6875rem] bg-sky-50 dark:bg-sky-950/30 text-sky-800 dark:text-sky-200 border-b border-sky-200 dark:border-sky-800 shrink-0">전국 모든 동네에 올라온 물건입니다. 물건마다 올린 사람의 지역이 표시되고, 물건을 누르면 다른 동네 이웃과도 문의 채팅을 할 수 있습니다.${FIREBASE_CONFIG ? '' : ' (체험 모드에서는 이 기기에서 올린 물건만 보입니다)'}</div>` : ''}
                <div class="mk-list flex-1 min-h-0 overflow-y-auto custom-scrollbar p-3">
                    ${list.length ? `<div class="grid grid-cols-2 md:grid-cols-3 gap-3">` + list.map(x => `
                        <button onclick="openMarketItem('${esc(x.id)}')" class="text-left rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 overflow-hidden hover:border-emerald-500 transition ${x.status === 'done' ? 'opacity-50' : ''}">
                            <div class="h-28 bg-slate-100 dark:bg-slate-800 flex items-center justify-center overflow-hidden">${x.img && IMG_DATA_RE.test(x.img) ? `<img src="${x.img}" class="w-full h-full object-cover">` : '<span class="text-3xl">📦</span>'}</div>
                            <div class="p-2">
                                <div class="flex items-center gap-1">${badge(x.kind)}${x.status === 'done' ? '<span class="text-[0.625rem] font-bold px-1.5 py-0.5 rounded bg-slate-400 text-white">완료</span>' : ''}</div>
                                <div class="mt-1 text-xs font-bold text-slate-900 dark:text-white truncate">${esc(x.title)}</div>
                                <div class="text-xs font-extrabold text-emerald-600 truncate">${esc(x.price || (x.kind === '나눔' ? '무료 나눔' : '가격 문의'))}</div>
                                <div class="text-[0.625rem] text-slate-500 truncate"><i class="fa-solid fa-location-dot text-emerald-500"></i> ${esc(shortArea(x.area) || (myTown ? myTown.dong : ''))}</div>
                                <div class="text-[0.625rem] text-slate-500 truncate">${esc(x.nick || '이웃')} · ${timeAgo(x.ts)}</div>
                            </div>
                        </button>`).join('') + `</div>` : `<div class="text-center py-12 text-xs text-slate-400 space-y-3"><div>${q ? '찾는 물건이 ' + (nation ? '전국 장터에' : '우리 동네에') + ' 없습니다.' : '아직 올라온 물건이 없습니다. 첫 물건을 올려 보세요.'}</div>${nation ? '' : '<button onclick="setMarketScope(\'nation\')" class="px-4 py-2 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-bold">🌐 전국 장터에서 찾아보기</button>'}</div>`}
                </div>`;
            const se = document.getElementById('mkSearch'); if (se) se.value = marketQuery;
        }

        // ---- 친구해요 (대화방 만들기·들어가기 + 같은 시·군·구 이웃과 서로 '좋아요'를 누르면 1:1 대화) ----
        const MEET_AGES = ['20대', '30대', '40대', '50대', '60대 이상'];
        const MEET_SAMPLES = [
            { uid: 'sample1', sample: true, nick: '예시 · 산책메이트', emoji: '🐶', age: '30대', intro: '저녁에 강아지 산책 같이 하실 분 찾아요.', tags: '산책, 반려견, 커피' },
            { uid: 'sample2', sample: true, nick: '예시 · 주말러너', emoji: '🌳', age: '20대', intro: '주말 아침 러닝 크루 만들고 싶어요.', tags: '러닝, 등산, 맛집' },
            { uid: 'sample3', sample: true, nick: '예시 · 동네책방', emoji: '⭐', age: '40대', intro: '한 달에 한 번 책 읽고 이야기 나눠요.', tags: '독서, 영화, 보드게임' }
        ];
        let meetProfile = (() => { try { return JSON.parse(lsGet('meet_profile') || 'null'); } catch (e) { return null; } })();
        let meetView = 'rooms';       // 'rooms'(대화방 목록) / 'roomNew'(방 만들기) / 'room'(방 안) / 'browse'(카드 둘러보기) / 'matches'(매칭·대화) / 'edit'(내 카드)
        const ROOM_VIEWS = ['rooms', 'roomNew', 'room'];
        let meetProfiles = [], meetLikesOut = new Set(), meetLikesIn = new Set(), meetUnsubs = [];
        let meetSeen = new Set((() => { try { return JSON.parse(lsGet('meet_seen') || '[]'); } catch (e) { return []; } })());
        let meetChatWith = null, meetChat = [], meetChatUnsub = null, meetPhoto = null, meetMsg = '';

        function meetKey() { return [myTown.sido, myTown.sigungu].join('_').replace(/[\s\/.#$\[\]]/g, ''); }
        function meetArea() { return myTown.sido + ' ' + myTown.sigungu; }
        function meetDoc() { return commDb.collection('meet').doc(meetKey()); }
        function pairId(a, b) { return [a, b].sort().join('__'); }
        function meetMatches() { return meetProfiles.filter(p => !isBlocked(p.uid) && meetLikesOut.has(p.uid) && meetLikesIn.has(p.uid)); }
        function stopMeet() { meetUnsubs.forEach(u => u()); meetUnsubs = []; if (meetChatUnsub) { meetChatUnsub(); meetChatUnsub = null; } }

        async function subscribeMeet() {
            stopMeet();
            if (!myTown || !meetProfile) { if (commTab === 'meet') renderMeet(); return; }
            const db = await commInit();
            if (!db) { meetProfiles = MEET_SAMPLES.slice(); if (commTab === 'meet') renderMeet(); return; }
            meetUnsubs.push(meetDoc().collection('profiles').orderBy('ts', 'desc').limit(200).onSnapshot(snap => {
                meetProfiles = snap.docs.map(d => d.data()).filter(p => p.uid !== COMM_UID);
                if (commTab === 'meet' && !meetChatWith) renderMeet();
            }, err => console.error(err)));
            meetUnsubs.push(meetDoc().collection('likes').where('from', '==', COMM_UID).onSnapshot(snap => {
                meetLikesOut = new Set(snap.docs.map(d => d.data().to));
                if (commTab === 'meet' && !meetChatWith) renderMeet();
            }, err => console.error(err)));
            let first = true;
            meetUnsubs.push(meetDoc().collection('likes').where('to', '==', COMM_UID).onSnapshot(snap => {
                if (!first) snap.docChanges().forEach(ch => {      // 내가 좋아요 한 사람이 나를 좋아요 → 매칭 알림
                    const from = ch.doc.data().from;
                    if (ch.type === 'added' && meetLikesOut.has(from)) meetNotifyMatch(from);
                });
                first = false;
                meetLikesIn = new Set(snap.docs.map(d => d.data().from));
                if (commTab === 'meet' && !meetChatWith) renderMeet();
            }, err => console.error(err)));
        }
        function meetNotifyMatch(uid) {
            const p = meetProfiles.find(x => x.uid === uid);
            showAlertToast({ head: '💞 친구해요 매칭', title: (p ? p.nick : '이웃') + '님과 서로 좋아요를 눌렀어요. 대화를 시작해 보세요.', foot: meetArea(), openCommunity: true });
            playAlertSound();
        }

        async function meetPickPhoto(input) {
            const f = input.files && input.files[0];
            input.value = '';
            if (!f || f.type.indexOf('image/') !== 0) return;
            try { meetPhoto = await compressImage(f, 640, 200 * 1024); } catch (e) { return; }
            const p = document.getElementById('mtPreview');
            if (p) p.innerHTML = `<img src="${meetPhoto}" class="h-16 w-16 object-cover rounded-full border border-slate-300">`;
        }
        async function meetSaveProfile() {
            const v = id => ((document.getElementById(id) || {}).value || '').trim();
            const adult = (document.getElementById('mtAdult') || {}).checked;
            if (!adult) { meetMsg = '만 19세 이상만 이용할 수 있습니다. 확인란에 체크해 주세요.'; renderMeet(); return; }
            if (!v('mtIntro')) { meetMsg = '한 줄 소개를 적어 주세요.'; renderMeet(); return; }
            meetProfile = {
                uid: COMM_UID, nick: myNick(), emoji: commProfile.emoji || '🙂', age: v('mtAge') || '30대', intro: v('mtIntro').slice(0, 80),
                tags: v('mtTags').slice(0, 60), photo: meetPhoto || (meetProfile && meetProfile.photo) || '', adult: true, ts: Date.now()
            };
            lsSet('meet_profile', JSON.stringify(meetProfile));
            meetPhoto = null; meetMsg = ''; meetView = 'browse';
            try { const db = await commInit(); if (db) await meetDoc().collection('profiles').doc(COMM_UID).set(meetProfile); } catch (e) { console.error(e); }
            subscribeMeet();
            renderMeet();
        }
        async function meetLeave() {
            if (!confirm('친구해요에서 내 카드를 내릴까요? 다른 이웃에게 더 이상 보이지 않습니다.')) return;
            try { const db = await commInit(); if (db) await meetDoc().collection('profiles').doc(COMM_UID).delete(); } catch (e) { console.error(e); }
            meetProfile = null; lsSet('meet_profile', 'null'); stopMeet(); meetProfiles = [];
            renderMeet();
        }
        function meetQueue() { return meetProfiles.filter(p => !isBlocked(p.uid) && !meetSeen.has(p.uid) && !meetLikesOut.has(p.uid)); }
        function meetMarkSeen(uid) { meetSeen.add(uid); lsSet('meet_seen', JSON.stringify(Array.from(meetSeen).slice(-500))); }
        function meetPass(uid) { meetMarkSeen(uid); renderMeet(); }
        async function meetLike(uid) {
            meetMarkSeen(uid);
            const p = meetProfiles.find(x => x.uid === uid);
            if (p && p.sample) { meetMsg = '예시 카드입니다. 체험 모드에서는 실제 매칭이 되지 않습니다.'; renderMeet(); return; }
            meetLikesOut.add(uid);
            try {
                const db = await commInit();
                if (db) await meetDoc().collection('likes').doc(COMM_UID + '__' + uid).set({ from: COMM_UID, to: uid, ts: Date.now() });
            } catch (e) { console.error(e); }
            if (meetLikesIn.has(uid)) meetNotifyMatch(uid);
            renderMeet();
        }
        function meetResetSeen() { meetSeen = new Set(); lsSet('meet_seen', '[]'); meetMsg = ''; renderMeet(); }
        function setMeetView(v) { if (v === 'rooms' && roomOpenId) v = 'room'; meetView = v; meetMsg = ''; roomMsg = ''; meetChatWith = null; if (meetChatUnsub) { meetChatUnsub(); meetChatUnsub = null; } renderMeet(); }

        async function openMeetChat(uid) {
            meetChatWith = uid; meetChat = [];
            if (meetChatUnsub) { meetChatUnsub(); meetChatUnsub = null; }
            const db = await commInit();
            if (db) {
                meetChatUnsub = meetDoc().collection('chats').doc(pairId(COMM_UID, uid)).collection('messages').orderBy('ts', 'asc').limit(300).onSnapshot(snap => {
                    meetChat = snap.docs.map(d => d.data());
                    renderMeetChat();
                }, err => console.error(err));
            }
            renderMeet();
        }
        async function meetChatSend() {
            const input = document.getElementById('mtChatText');
            const text = ((input && input.value) || '').trim();
            if (!text || !meetChatWith) return;
            const msg = { uid: COMM_UID, text: text.slice(0, 300), ts: Date.now() };
            try {
                const db = await commInit();
                if (db) await meetDoc().collection('chats').doc(pairId(COMM_UID, meetChatWith)).collection('messages').add(msg);
                else { meetChat.push(msg); renderMeetChat(); }
                input.value = '';
            } catch (e) { console.error(e); }
        }
        function renderMeetChat() {
            const box = document.getElementById('mtChat');
            if (!box) return;
            box.innerHTML = meetChat.length ? meetChat.map(m => {
                const mine = m.uid === COMM_UID;
                return `<div class="flex ${mine ? 'justify-end' : 'justify-start'}"><div style="max-width:78%;" class="rounded-2xl border px-3 py-1.5 text-sm ${mine ? 'bg-pink-100 dark:bg-pink-900/70 border-pink-300 dark:border-pink-700 text-slate-900 dark:text-white' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-900 dark:text-slate-100'}"><span class="whitespace-pre-line break-words">${esc(m.text)}</span><div class="text-[0.625rem] text-slate-400 mt-0.5">${timeAgo(m.ts)}</div></div></div>`;
            }).join('') : '<div class="text-center py-10 text-xs text-slate-400">첫 인사를 건네 보세요.</div>';
            box.scrollTop = box.scrollHeight;
        }

        // ---- 친구해요 대화방: 인원수·제목을 정해 방을 만들고, 관심 있는 이웃이 들어와 글 또는 음성으로 대화 ----
        //  · 방 종류: 글(💬) / 음성(🎙)  · 인원수: 2~10명  · 방은 우리 동네(시·군·구) 안에서만 보임
        //  · 서버(Firebase)가 연결되어 있으면 이웃에게 실제로 보이고, 음성방은 WebRTC(브라우저끼리 직접 연결)로 말소리가 오갑니다.
        //  · 체험 모드(서버 없음)에서는 예시 방 5개와 '내 기기에만 저장되는 내 방'만 보입니다.
        const ROOM_MAXES = [2, 3, 4, 5, 6, 8, 10];
        const ROOM_TTL = 24 * 3600 * 1000;       // 하루가 지난 방은 목록에서 뺌

        // ---- 음성방: 브라우저끼리 직접 연결(WebRTC 메시). 연결 정보(신호)만 서버(Firestore)로 주고받고 소리는 서버를 거치지 않음 ----
        async function roomVoiceStart(r) {

        function roomNewPc(u) {

        async function subscribeFree() {
            if (freeUnsub) { freeUnsub(); freeUnsub = null; }
            if (!myTown) return;
            const db = await commInit();
            if (db) {
                freeUnsub = commDoc(townKey(myTown)).collection('free').orderBy('ts', 'desc').limit(200).onSnapshot(snap => {
                    freeMessages = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
                    renderFreeMessages();
                }, err => console.error(err));
            } else {
                try { freeMessages = JSON.parse(lsGet(freeLocalKey()) || '[]'); } catch (e) { freeMessages = []; }
                freeMessages = demoMerge(freeMessages, 'free');
                renderFreeMessages();
            }
        }
        function freeLocalSave() {
            const keep = demoStrip(freeMessages);
            if (!lsSet(freeLocalKey(), JSON.stringify(keep.slice(0, 200)))) lsSet(freeLocalKey(), JSON.stringify(keep.slice(0, 200).map(m => Object.assign({}, m, { img: '' }))));

        async function freePickFile(input) {

        // ---- 칭찬해요 (좋은 공간·고마운 일·좋은 아이디어를 사진과 짧은 글로 공유. 잡담 금지, 댓글은 80자까지) ----
        const PRAISE_KINDS = [['all', '👏 칭찬해요'], ['place', '🏞 칭찬하고 싶은 공간'], ['deed', '🤝 고마운 일·선행'], ['idea', '💡 좋은 아이디어'], ['neighbor', '🌟 칭찬하고 싶은 이웃']];

        function renderPraise() {
            const main = document.getElementById('commMain');

                <div id="praiseList" class="flex-1 min-h-0 overflow-y-auto custom-scrollbar p-3 space-y-3"></div>

        function renderPraiseList(toTop) {

                                return `<button onclick="toggleReact('praise', '${esc(p.id)}', '${x[0]}')" class="react-chip ${on ? 'on' : ''}">${x[1]}${n ? ' ' + n : ''}</button>`; }).join('')}

                        <button onclick="praiseReply('${esc(p.id)}')" class="text-[0.6875rem] font-bold text-amber-700 dark:text-amber-300">↩ 댓글 쓰기 (80자 이내)</button>

        // ================= 커뮤니티 탭 묶음 =================
        // 탭이 11개로 늘어나 한 줄에 다 보이지 않던 문제 → 5개 묶음(큰 버튼)으로 나누고, 묶음 안의 탭은 그 아래 작은 줄에 보여 줌.
        // 안전망은 가장 중요해서 혼자 따로(빨간색), 맛집·핫플처럼 성격이 같은 것은 한 묶음으로.
        // ★ 단계별 공개 (2026-11-16): 지금은 안전망 · 동네 이야기 · 동네 장터만 엽니다. 나머지(맛집·핫플 / 이웃·대화 / 전국 TOP10 / 내 프로필 탭)는 화면에서만 숨겼고 코드는 그대로 있습니다.
        //   나중에 열 때는 아래 목록에 이름만 더하면 됩니다. 예) ['safe', 'life', 'market', 'local']  (people 을 열면 팔로우·1:1 대화 버튼도 함께 보입니다)
        const COMM_OPEN = ['safe', 'life', 'market', 'me'];
        function commOpen(k) { return COMM_OPEN.includes(k); }
        const COMM_GROUPS_ALL = [
            // c: 묶음 색, fa: 아이콘. 안전망은 고르지 않았을 때도 빨간색으로 칠해서 항상 눈에 띄게 (SOS 표시는 실제 SOS 글이 있을 때만 한 번)

            { k: 'life', label: '동네 이야기', fa: 'fa-house-chimney-user', c: 'sky', tabs: ['free', 'praise', 'wish', 'hello', 'popular'] },
            { k: 'market', label: '동네 장터', fa: 'fa-store', c: 'emerald', tabs: ['market'] },
            { k: 'local', label: '동네 맛집·핫플', fa: 'fa-utensils', c: 'orange', tabs: ['food', 'spot'] },
            // 이웃·대화: '팔로잉 소식'을 맨 앞에 (예전에 순서를 저장해 둔 사람도 한 번은 맨 앞으로 옮김 → groupTabs)
            { k: 'people', label: '이웃·대화', fa: 'fa-comments', c: 'violet', tabs: ['friends', 'meet', 'dm'] },
            { k: 'nation', label: '전국 TOP10', fa: 'fa-trophy', c: 'amber', tabs: ['national'] },
            { k: 'me', label: '내 프로필', fa: 'fa-circle-user', c: 'fuchsia', tabs: ['me'] }
        ];
        const COMM_GROUPS = COMM_GROUPS_ALL.filter(g => COMM_OPEN.includes(g.k));
        const COMM_TAB_LABEL = { talk: '우리동네 안전망', free: '이런저런', hello: '이사왔어요', wish: '아쉬워요', praise: '칭찬해요', food: '우리동네 맛집', spot: '우리동네 핫플',
            market: '동네 장터', popular: '우리동네 TOP10', meet: '친구해요', friends: '팔로잉 소식', random: '랜덤 채팅', dm: '1:1 대화', national: '이달의 전국 TOP10', me: '내 프로필' };
        const COMM_TAB_FA = { free: 'fa-mug-hot', hello: 'fa-hand', wish: 'fa-face-sad-tear', praise: 'fa-thumbs-up', food: 'fa-bowl-food', spot: 'fa-fire',
            popular: 'fa-ranking-star', meet: 'fa-user-plus', friends: 'fa-newspaper', random: 'fa-shuffle', dm: 'fa-envelope' };
        // 맨 위 큰 탭(묶음) 순서: 끌어서 바꾸고 저장. 안전망은 항상 맨 앞에 고정, 새로 생긴 묶음은 뒤에 붙음
        // (예전 순서를 저장한 사람은 '동네 장터'가 '동네 이야기' 바로 다음에 오도록 한 번만 옮김)
        function commGroupsOrdered() {
            let o = [];
            try { o = JSON.parse(lsGet('comm_group_order') || '[]'); } catch (e) {}
            if (o.length && lsGet('comm_group_order_v2') !== '1') {
                o = o.filter(k => k !== 'market'); const i = o.indexOf('life');
                o.splice(i < 0 ? o.length : i + 1, 0, 'market');
                lsSet('comm_group_order', JSON.stringify(o));
            }
            lsSet('comm_group_order_v2', '1');
            const keys = COMM_GROUPS.map(g => g.k);
            o = o.filter(k => keys.includes(k) && k !== 'safe');
            keys.forEach(k => { if (k !== 'safe' && !o.includes(k)) o.push(k); });
            return ['safe'].concat(o).map(k => COMM_GROUPS.find(g => g.k === k));
        }
        function commGroupKeys() { return commGroupsOrdered().map(g => g.k).filter(k => k !== 'safe'); }
        function commGroupOf(tab) { return COMM_GROUPS.find(g => g.tabs.includes(tab)) || COMM_GROUPS[0]; }
        // 묶음 안의 작은 탭 순서: 마우스로 끌어서 바꾸고 저장 (새로 생긴 탭은 맨 뒤에 붙음)
        function groupTabs(g) {
            let o = [];
            // 동네 이야기 기본 순서(이런저런·칭찬해요·아쉬워요·이사왔어요·TOP10)로 한 번 맞춤 — 이후 사용자가 끌어 바꾼 순서는 그대로 따름

            if (g.k === 'people' && lsGet('comm_order_people_v2') !== '1') {

                lsSet('comm_order_people_v2', '1');

            g.tabs.forEach(t => { if (!o.includes(t)) o.push(t); });
            return o;
        }
        function setCommGroup(k) {

            return `<div class="p-3 space-y-2.5">
                ${banner}

                ${posts.length ? posts.map(p => {
                    const mine = p.uid === COMM_UID, rs = (reps[p.id] || []).sort((a, c) => a.ts - c.ts), open = boardOpen.has(p.id);

                    const head = wish ? `<span class="flex items-center gap-1.5 min-w-0"><span class="text-xs font-bold text-slate-700 dark:text-slate-200 truncate">${esc(displayName(p.uid, p.nick))}${mine ? ' (나)' : ''}</span>${p.kind ? `<span class="shrink-0 text-[0.625rem] font-bold px-1.5 py-0.5 rounded-full ${B.chip}">${esc(p.kind)}</span>` : ''}</span>`

                                    ${mine ? `<button onclick="boardDelete('${b}', '${esc(p.id)}')" class="ml-auto text-[0.625rem] text-slate-400 hover:text-red-500">삭제</button>` : ''}

                            ${rs.map(r => `<div class="flex items-start gap-1.5 text-xs"><button onclick="showProfile('${esc(r.uid)}')" class="shrink-0">${avatarHtml(r, 'w-5 h-5', 'text-[0.625rem]')}</button><div class="min-w-0 flex-1"><b class="text-slate-700 dark:text-slate-200">${esc(displayName(r.uid, r.nick))}</b> <span class="text-slate-700 dark:text-slate-200 break-words">${esc(r.text)}</span><span class="text-[0.625rem] text-slate-400"> · ${timeAgo(r.ts)}</span>${r.uid === COMM_UID ? ` <button onclick="boardDelete('${b}', '${esc(r.id)}')" class="text-[0.625rem] text-slate-400 hover:text-red-500">삭제</button>` : ''}</div></div>`).join('') || '<div class="text-[0.6875rem] text-slate-400">첫 댓글을 남겨 보세요.</div>'}
                            <div class="flex gap-1.5"><input id="hr_${esc(p.id)}" maxlength="${BOARD_REPLY_MAX}" onkeydown="if (event.key === 'Enter' && !event.isComposing) boardReply('${b}', '${esc(p.id)}')" placeholder="${esc(B.replyPh)}" class="flex-1 min-w-0 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg px-2 py-1 text-xs text-slate-900 dark:text-white placeholder:text-slate-400"><button onclick="boardReply('${b}', '${esc(p.id)}')" class="px-3 rounded-lg ${B.btn} text-white text-xs font-bold">댓글</button></div>
                        </div>` : ''}

        }

        // ---- 커뮤니티 탭 순서 (끌어다 놓아서 바꾸기, 저장됨) ----
        const COMM_TABS_DEFAULT = ['talk', 'praise', 'free', 'market', 'meet', 'friends', 'dm'];
        function commTabOrder() {
            let o = [];
            try { o = JSON.parse(lsGet('comm_tab_order') || '[]'); } catch (e) {}
            o = o.filter(k => COMM_TABS_DEFAULT.includes(k));
            COMM_TABS_DEFAULT.forEach(k => { if (!o.includes(k)) o.push(k); });
            return o;
        }
        // 탭 끌기 안내는 처음 한 번만 (닫거나, 8초가 지나거나, 탭을 한 번 끌면 다시 안 보임)
        let tabHintTimer = null;
        function dismissTabHint() { lsSet('tab_hint_seen', '1'); const h = document.getElementById('tabHint'); if (h) h.remove(); }
        let tabDragKey = null;
        function tabDragStart(e) { tabDragKey = e.currentTarget.dataset.tab; e.currentTarget.classList.add('dragging'); try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', tabDragKey); } catch (err) {} }
        function tabDragOver(e) {
            if (!tabDragKey) return;
            e.preventDefault();
            const el = e.currentTarget, r = el.getBoundingClientRect(), after = e.clientX > r.left + r.width / 2;
            el.classList.toggle('drop-after', after); el.classList.toggle('drop-before', !after);
        }
        function tabDragLeave(e) { e.currentTarget.classList.remove('drop-before', 'drop-after'); }
        function tabDragEnd(e) { tabDragKey = null; document.querySelectorAll('.comm-tab').forEach(t => t.classList.remove('dragging', 'drop-before', 'drop-after')); }
        function tabDrop(e) {
            e.preventDefault();
            const target = e.currentTarget.dataset.tab, r = e.currentTarget.getBoundingClientRect(), after = e.clientX > r.left + r.width / 2;
            if (!tabDragKey || tabDragKey === target) { tabDragEnd(); return; }
            const o = commTabOrder().filter(k => k !== tabDragKey);
            o.splice(o.indexOf(target) + (after ? 1 : 0), 0, tabDragKey);
            lsSet('comm_tab_order', JSON.stringify(o));
            lsSet('tab_hint_seen', '1');
            tabDragEnd();
            renderCommunity();
        }

        // ---- 1:1 대화 요청 (익명 커뮤니티: 상대가 수락해야 대화를 시작할 수 있음) ----
        let chatReqs = [];            // 나에게 온 대화 요청
        let chatSent = new Set((() => { try { return JSON.parse(lsGet('chat_sent') || '[]'); } catch (e) { return []; } })());
        let dmAllowed = new Set((() => { try { return JSON.parse(lsGet('dm_allowed') || '[]'); } catch (e) { return []; } })());
        let chatReqUnsubs = [];
        function canChat(uid) { return isFriend(uid) || (isFollowing(uid) && followsMe(uid)) || dmAllowed.has(uid) || meetMatches().some(p => p.uid === uid) || dmThreads.some(t => t.uid === uid && t.ts); }
        async function saveAllowed() {
            lsSet('dm_allowed', JSON.stringify(Array.from(dmAllowed)));
            try { const db = await commInit(); if (db) await db.collection('dmAllowed').doc(COMM_UID).set({ uids: Array.from(dmAllowed), ts: Date.now() }); } catch (e) { console.error(e); }
        }
        async function subscribeChatReqs() {
            chatReqUnsubs.forEach(u => { try { u(); } catch (e) {} }); chatReqUnsubs = [];
            const db = await commInit();
            if (!db) return;
            try { const d = await db.collection('dmAllowed').doc(COMM_UID).get(); (d.exists ? (d.data().uids || []) : []).forEach(u => dmAllowed.add(u)); lsSet('dm_allowed', JSON.stringify(Array.from(dmAllowed))); } catch (e) {}
            let first = true;
            chatReqUnsubs.push(db.collection('chatReqs').doc(COMM_UID).collection('list').orderBy('ts', 'desc').limit(100).onSnapshot(snap => {
                const prev = new Set(chatReqs.map(r => r.uid));
                chatReqs = snap.docs.map(d => d.data()).filter(r => r.uid && !isBlocked(r.uid) && !dmAllowed.has(r.uid) && !isRestricted(r.uid));   // 제한한 사람의 대화 요청은 보이지 않음
                if (!first) chatReqs.filter(r => !prev.has(r.uid)).forEach(r => commAlert('chatReq', { head: '💬 대화 요청이 왔어요', title: (r.nick || '이웃') + '님이 1:1 대화를 요청했습니다.' + (r.msg ? ' "' + r.msg + '"' : ''), foot: '눌러서 수락하거나 거절하기', tab: 'dm' }));
                first = false;
                updateCommBadge();
                if (commTab === 'dm') renderDM();
            }, err => console.error(err)));
            chatReqUnsubs.push(db.collection('chatAccepted').doc(COMM_UID).collection('list').onSnapshot(snap => {
                snap.docs.forEach(d => {
                    const r = d.data();
                    if (r.uid && !dmAllowed.has(r.uid)) {
                        dmAllowed.add(r.uid); chatSent.delete(r.uid); lsSet('chat_sent', JSON.stringify(Array.from(chatSent)));
                        saveAllowed();
                        showAlertToast({ head: '💬 대화 수락', title: (r.nick || '이웃') + '님이 대화 요청을 수락했습니다. 이제 1:1 대화를 할 수 있습니다.', openCommunity: true });
                    }
                    d.ref.delete().catch(() => {});
                });
            }, err => console.error(err)));
        }
        // 대화 요청 보내기 창 (짧은 인사말 50자)
        function askChat(uid) {
            const info = friendInfo(uid);
            const card = document.getElementById('commProfileCard');
            if (!card) return;
            card.innerHTML = `<div class="w-full max-w-xs bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-2xl p-5 space-y-3" onclick="event.stopPropagation()">
                <div class="text-sm font-bold text-slate-900 dark:text-white">💬 ${esc(displayName(uid, info.nick))}님에게 대화 요청</div>

                <div class="flex gap-2 justify-end">

                    <button onclick="sendChatReq('${esc(uid)}')" class="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold">요청 보내기</button>
                </div></div>`;
            card.classList.remove('hidden');
        }
        async function sendChatReq(uid) {
            const msg = (((document.getElementById('chatReqMsg') || {}).value) || '').trim().slice(0, 50);
            const info = friendInfo(uid);
            closeProfile();

                const db = await commInit();

            } catch (e) { console.error(e); showAlertToast({ head: '💬 대화 요청', title: '요청을 보내지 못했습니다. 잠시 후 다시 시도해 주세요.' }); }

        async function acceptChat(uid) {
            const r = chatReqs.find(x => x.uid === uid);

            chatReqs = chatReqs.filter(x => x.uid !== uid);

                    await db.collection('chatAccepted').doc(uid).collection('list').doc(COMM_UID).set(Object.assign({ uid: COMM_UID, ts: Date.now(), photo: myPhoto() }, meFields()));

        // 프로필 카드의 대화·친구 버튼 (서로 동의해야 진행)
        function chatButton(uid) {

        // ---- 초대하기 ----
        async function inviteNeighbors() {

        // ---- 1:1 대화 (채팅 앱처럼 상대마다 채팅방이 따로 있습니다) ----

        async function startLive() {

        async function liveAnswer(vid, d) {
            const vref = live.ref.collection('viewers').doc(vid);

        // ---- 신뢰 지수 (거래 매너 + 대화 매너 + 제보 정확도를 모두 합친 이웃 평판) ----
        //  votes 하나 = { score: 1~5, kind: 'trade'(거래) | 'manner'(대화 매너) | 'report'(제보 사실 확인), from, ts }

        const TRUST_BASE = 50;

            [30, '낮음', 'text-amber-600 dark:text-amber-400'],

        const TRUST_MIN_VOTES = 3;  // 평가가 3건 미만이면 '평가 부족'으로 표시 (점수는 계산하지만 등급은 보통으로 봄)

            + '① 거래 매너 별점 ② 대화 매너 별점: ★5 +3점 · ★4 +1점 · ★3 0점 · ★2 −2점 · ★1 −4점. '
            + '③ 제보 사실 확인: 👍 사실이에요 +3점 · 🤔 확인 필요 0점 · 👎 사실과 달라요 −5점. '

        function trustLevel(score) { return TRUST_LEVELS.find(l => score >= l[0]) || TRUST_LEVELS[TRUST_LEVELS.length - 1]; }
        const trustCache = {};
        function trustLocal() { try { return JSON.parse(lsGet('trust_local') || '{}'); } catch (e) { return {}; } }
        async function loadTrust(uid) {
            const db = await commInit();
            let votes = [];
            if (db) {
                try { const snap = await db.collection('trust').doc(uid).collection('votes').limit(500).get(); votes = snap.docs.map(d => d.data()).filter(v => Number.isFinite(v.score)); } catch (e) { console.error(e); }
            } else {
                const l = trustLocal()[uid] || {};
                votes = Object.keys(l).map(k => (typeof l[k] === 'number') ? { score: l[k], kind: 'trade' } : l[k]).filter(v => v && Number.isFinite(v.score));
            }
            const by = {};
            votes.forEach(v => { const k = v.kind || 'trade'; (by[k] = by[k] || []).push(v.score); });

            const t = { score: score, count: votes.length, avg: avg(votes.map(v => v.score)), trade: { n: (by.trade || []).length, avg: avg(by.trade) }, manner: { n: (by.manner || []).length, avg: avg(by.manner) }, report: { n: (by.report || []).length, avg: avg(by.report) } };

        // 점수별 색 (등급표와 같은 구간): 매우 높음 초록 · 높음 청록 · 보통 파랑 · 낮음 주황 · 매우 낮음 빨강

                <span class="inline-flex items-center justify-center rounded-full text-white font-black" style="background:${col[1]}; min-width:2.6rem; height:2.1rem; font-size:1.05rem; padding:0 .4rem;">${score}</span>
                <span class="text-left leading-tight"><span class="block text-[0.625rem] font-bold opacity-80">신뢰 지수</span><span class="block text-sm font-extrabold">${esc(grade)}</span></span>
                <i class="fa-regular fa-circle-question opacity-70"></i><span class="tip-box">${esc(TRUST_HELP)}</span></span>`;
            const bar = `<div class="mx-auto mt-2 w-48 h-2.5 rounded-full overflow-hidden relative" style="background:linear-gradient(90deg,#dc2626 0%,#dc2626 30%,#d97706 30%,#d97706 45%,#2563eb 45%,#2563eb 65%,#0d9488 65%,#0d9488 80%,#059669 80%); opacity:.25;"></div>
                <div class="mx-auto -mt-2.5 w-48 h-2.5 rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${score}%; background:${col[1]};"></div></div>`;
            return `<div class="flex justify-center">${badge}</div>${bar}${detail}`;
        }
        async function saveTrustVote(targetUid, key, score, kind) {

            } else {
                const l = trustLocal(); l[targetUid] = l[targetUid] || {};

        }

        // ---- 랜덤 채팅 / 랜덤 화상 채팅 ----
        let rnd = { state: 'idle', mode: 'text', room: null, peer: null, msgs: [], unsubs: [] };   // state: idle / waiting / chatting / ended

        function rndListenRoom(db, roomId) {
            const ref = db.collection('randomRooms').doc(roomId);

                const d = snap.data();

                if (rnd.state === 'waiting' && d.b) {            // 내가 기다리던 방에 상대가 들어옴

        async function rndStart(mode) {

            renderRandom();
            const me = { uid: COMM_UID, nick: myNick(), emoji: commProfile.emoji || '🙂' };
            const lobby = db.collection('randomLobby').doc(mode);
            try {
                const res = await db.runTransaction(async tx => {
                    const snap = await tx.get(lobby);
                    const w = snap.exists ? snap.data().waiting : null;
                    if (w && w.uid !== COMM_UID && Date.now() - w.ts < 90000) { tx.set(lobby, { waiting: null }); return { join: w }; }
                    const room = db.collection('randomRooms').doc().id;
                    tx.set(lobby, { waiting: Object.assign({ room: room, ts: Date.now() }, me) });
                    return { wait: room };
                });
                if (res.join) {
                    if (isBlocked(res.join.uid)) { rnd.state = 'idle'; renderRandom(); showAlertToast({ head: '랜덤 채팅', title: '지금은 연결할 상대가 없습니다. 잠시 후 다시 시도해 주세요.' }); return; }
                    rnd.room = res.join.room; rnd.peer = { uid: res.join.uid, nick: res.join.nick, emoji: res.join.emoji }; rnd.state = 'chatting';
                    await db.collection('randomRooms').doc(rnd.room).set({ a: rnd.peer, b: me, status: 'open', mode: mode, ts: Date.now() });
                    rndListenRoom(db, rnd.room);
                    renderRandom();
                    if (mode === 'video') setTimeout(() => startCall(rnd.peer.uid, rnd.peer.nick, true), 1200);
                } else {
                    rnd.room = res.wait;
                    await db.collection('randomRooms').doc(rnd.room).set({ a: me, status: 'open', mode: mode, ts: Date.now() });
                    rndListenRoom(db, rnd.room);
                }
            } catch (e) { console.error(e); rnd.state = 'idle'; renderRandom(); showAlertToast({ head: '랜덤 채팅', title: '연결하지 못했습니다. 잠시 후 다시 시도해 주세요.' }); }
        }

                            <button onclick="rndStart(rnd.mode)" class="px-2.5 py-1 rounded-lg bg-violet-600 hover:bg-violet-500 text-white text-xs font-bold">다음 상대</button>

                    <p class="text-[0.6875rem] text-slate-400 max-w-sm leading-relaxed">불쾌한 상대는 바로 [나가기]를 누르세요. 개인정보·금전 요구에는 응하지 마세요. 화상 채팅은 카메라와 마이크 허용이 필요합니다.</p>

        function socialInit() {

        // ---- 예전 '친구' 데이터 (지금은 팔로우·팔로잉으로 바뀜) ----
        //  friends 는 예전에 친구였던 사람과 바로 대화할 수 있게(canChat) + 예전에 붙인 이름(alias)을 살리려고만 남겨 둠. 새로 친구를 맺는 화면은 없음
        let friends = (() => { try { return JSON.parse(lsGet('friends') || '{}') || {}; } catch (e) { return {}; } })();   // { uid: { nick, emoji, photo, area, alias, ts } }
        let friendReqs = [];          // 나에게 온 친구 요청

        async function saveFriends() {
            lsSet('friends', JSON.stringify(friends));

        async function subscribeFriends() {
            friendUnsubs.forEach(u => { try { u(); } catch (e) {} }); friendUnsubs = [];
            const db = await commInit();

            // ── 예전 '친구 요청/수락' 정리 (팔로우 방식으로 바뀜) ──
            //  · 아직 남아 있는 받은 친구 요청: 수락 화면이 없어졌으므로 조용히 지움 (상대는 이제 [팔로우]를 누르면 됨)
            //  · 예전에 보낸 요청을 상대가 수락한 기록: 그 사람을 팔로잉으로 옮김

        function friendInfo(uid) {

        // ================= 이웃 관리 (상대 프로필의 ⚙ 관리 버튼) =================
        //  원하지 않는 사람이 나를 팔로우했을 때 등을 대비한 장치. 모두 상대에게 알리지 않고 조용히 적용됩니다.
        //   · 팔로워에서 삭제: 상대를 내 팔로워 목록에서 지움 (상대가 다시 팔로우할 수는 있음 → 막으려면 차단)
        //   · 팔로우 취소
        //   · 내 게시물 숨기기: 이 사람에게만 내 '내 일상' 게시물이 보이지 않음 (다른 이웃에게는 그대로 공개)
        //   · 제한하기: 이 사람은 내 게시물에 댓글을 달 수 없고, 이 사람의 대화 요청·메시지 알림이 오지 않음
        //   · 이름 바꾸기: 나에게만 보이는 이름
        //   · 차단: 서로 글·프로필·대화가 보이지 않음 (기존 차단 기능)
        //  저장: 이 기기 + 서버 연결 시 peerPrefs/{나}. '숨기기·제한'은 내 게시물마다 hideFrom·noReply 목록으로도 기록 (상대 화면에서 걸러지도록)
        // var: 이 줄보다 먼저 실행되는 화면 코드(displayName)에서도 오류 없이 쓰이도록
        var peerPrefs = (() => { try { return JSON.parse(lsGet('peer_prefs') || '{}') || {}; } catch (e) { return {}; } })();   // { uid: { alias, hide, restrict } }
        function peerPref(uid, k) { return !!(peerPrefs[uid] && peerPrefs[uid][k]); }
        function peerList(k) { return Object.keys(peerPrefs).filter(u => peerPrefs[u] && peerPrefs[u][k]); }
        function isRestricted(uid) { return peerPref(uid, 'restrict'); }
        async function savePeerPrefs() {
            lsSet('peer_prefs', JSON.stringify(peerPrefs));
            try { const db = await commInit(); if (db) await db.collection('peerPrefs').doc(COMM_UID).set({ list: peerPrefs, ts: Date.now() }); } catch (e) { console.error(e); }
        }
        async function loadPeerPrefs() {
            try {
                const db = await commInit();
                if (!db) return;
                const d = await db.collection('peerPrefs').doc(COMM_UID).get();
                const list = d.exists ? (d.data().list || {}) : {};
                Object.keys(list).forEach(u => { peerPrefs[u] = Object.assign({}, list[u], peerPrefs[u] || {}); });
                lsSet('peer_prefs', JSON.stringify(peerPrefs));
            } catch (e) { console.error(e); }
        }
        // 숨기기·제한을 바꾸면 이미 올린 내 게시물에도 반영
        async function applyPeerToMyPosts(uid, field, on) {
            const db = await commInit();
            if (db) {
                try {
                    const snap = await feedCol().where('uid', '==', COMM_UID).limit(200).get();
                    const FV = firebase.firestore.FieldValue;
                    await Promise.all(snap.docs.map(d => d.ref.update({ [field]: on ? FV.arrayUnion(uid) : FV.arrayRemove(uid) })));
                } catch (e) { console.error(e); }
            } else {
                const list = feedLocal().map(p => {
                    if (p.uid !== COMM_UID) return p;
                    const a = (p[field] || []).filter(x => x !== uid);
                    if (on) a.push(uid);
                    return Object.assign({}, p, { [field]: a });
                });
                feedLocalSave(list);
            }
            (feedCache[COMM_UID] || []).forEach(p => { const a = (p[field] || []).filter(x => x !== uid); if (on) a.push(uid); p[field] = a; });
        }
        async function setPeerPref(uid, k, on) {
            peerPrefs[uid] = Object.assign({}, peerPrefs[uid], { [k]: !!on });
            await savePeerPrefs();
            if (k === 'hide') await applyPeerToMyPosts(uid, 'hideFrom', !!on);
            if (k === 'restrict') {
                await applyPeerToMyPosts(uid, 'noReply', !!on);
                if (on) { chatReqs = chatReqs.filter(r => r.uid !== uid); dmUnread.delete(uid); updateCommBadge(); }
            }
            const name = displayName(uid, (peerManageInfo && peerManageInfo.nick) || '이웃');
            const msg = { hide: on ? `${name}님에게 내 게시물이 보이지 않아요.` : `${name}님에게도 내 게시물이 다시 보여요.`,
                restrict: on ? `${name}님은 내 게시물에 댓글을 달 수 없고, 대화 요청·메시지 알림도 오지 않아요.` : `${name}님 제한을 풀었어요.` }[k];
            if (msg) showAlertToast({ head: '이웃 관리', title: msg });
            renderPeerManage();
        }
        // 이름 바꾸기 (나에게만 보이는 이름). 예전 친구 이름(alias)도 그대로 씀
        async function setFriendAlias(uid, alias) {
            const v = String(alias || '').trim().slice(0, 16);
            peerPrefs[uid] = Object.assign({}, peerPrefs[uid], { alias: v });
            if (isFriend(uid)) { friends[uid].alias = v; await saveFriends(); }
            await savePeerPrefs();
            if (commTab === 'friends') renderFollowFeed();
            else if (commTab === 'dm') renderDM();
            renderCommMessages(); renderFreeMessages();
        }
        function renameFriendPrompt(uid) {
            const cur = friendAlias(uid) || ((peerManageInfo && peerManageInfo.uid === uid && peerManageInfo.nick) || friendInfo(uid).nick || '');
            const v = prompt('이름 바꾸기 (나에게만 보이는 이름, 비우면 원래 이름)', cur);
            if (v === null) return;
            setFriendAlias(uid, v).then(() => { if (document.getElementById('peerManageBox')) renderPeerManage(); else if (profileShown.uid === uid) showProfile(uid); });
        }
        // 팔로워에서 삭제 (상대가 나를 팔로우한 기록을 지움)
        async function removeFollower(uid) {
            const name = displayName(uid, (peerManageInfo && peerManageInfo.nick) || '이웃');
            if (!confirm(`${name}님을 내 팔로워에서 삭제할까요?\n상대에게 따로 알림은 가지 않습니다. 다시 팔로우하지 못하게 하려면 [차단]을 이용해 주세요.`)) return;
            followers = followers.filter(f => f.uid !== uid);
            try { const db = await commInit(); if (db) await db.collection('followers').doc(COMM_UID).collection('list').doc(uid).delete(); } catch (e) { console.error(e); }
            showAlertToast({ head: '이웃 관리', title: `${name}님을 팔로워에서 삭제했어요.` });
            renderPeerManage();
            if (commTab === 'me') renderMeTab();
        }
        let peerManageInfo = null;
        function openPeerManage(uid) {
            if (!uid || uid === COMM_UID) return;
            peerManageInfo = profileShown.uid === uid ? Object.assign({}, profileShown) : Object.assign({ uid: uid }, followInfo(uid));
            renderPeerManage();
        }
        function renderPeerManage() {
            const card = document.getElementById('commProfileCard');
            const m = peerManageInfo;
            if (!card || !m) return;
            const uid = m.uid, u = esc(uid), blockedNow = iBlocked(uid);
            const sw = (k, on, icon, label, help) => `<label class="flex items-start gap-3 px-4 py-3 border-b border-slate-100 dark:border-slate-800 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/60">
                <span class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center shrink-0"><i class="fa-solid ${icon}"></i></span>
                <span class="flex-1 min-w-0 text-left"><span class="block text-[0.8125rem] font-bold text-slate-900 dark:text-white">${label}</span><span class="block text-[0.6875rem] text-slate-500 leading-snug">${help}</span></span>
                <span class="relative mt-1 shrink-0"><input type="checkbox" class="peer sr-only" ${on ? 'checked' : ''} onchange="setPeerPref('${u}', '${k}', this.checked)">
                    <span class="block w-9 h-5 rounded-full bg-slate-300 dark:bg-slate-600 peer-checked:bg-fuchsia-500 transition"></span>
                    <span class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-white shadow transition peer-checked:translate-x-4"></span></span></label>`;
            const act = (fn, icon, label, help, danger) => `<button onclick="${fn}" class="w-full flex items-start gap-3 px-4 py-3 border-b border-slate-100 dark:border-slate-800 last:border-0 text-left hover:bg-slate-50 dark:hover:bg-slate-800/60">
                <span class="w-8 h-8 rounded-lg ${danger ? 'bg-red-50 dark:bg-red-950/50 text-red-600' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'} flex items-center justify-center shrink-0"><i class="fa-solid ${icon}"></i></span>
                <span class="flex-1 min-w-0"><span class="block text-[0.8125rem] font-bold ${danger ? 'text-red-600' : 'text-slate-900 dark:text-white'}">${label}</span><span class="block text-[0.6875rem] text-slate-500 leading-snug">${help}</span></span></button>`;
            const rel = [followsMe(uid) ? '나를 팔로우함' : '', isFollowing(uid) ? '내가 팔로우 중' : ''].filter(Boolean).join(' · ') || '서로 팔로우하지 않음';
            card.innerHTML = `<div id="peerManageBox" class="w-full max-w-sm max-h-full flex flex-col bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-2xl overflow-hidden" style="white-space: normal;" onclick="event.stopPropagation()">
                <div class="flex items-center gap-3 px-4 py-3 border-b border-slate-200 dark:border-slate-700">
                    <button onclick="showProfile('${u}')" title="프로필로 돌아가기" class="text-slate-400 hover:text-slate-700 dark:hover:text-white"><i class="fa-solid fa-chevron-left"></i></button>
                    ${avatarHtml(m, 'w-10 h-10', 'text-lg')}
                    <div class="flex-1 min-w-0"><div class="text-sm font-extrabold text-slate-900 dark:text-white truncate">${esc(displayName(uid, m.nick))} 관리</div><div class="text-[0.625rem] text-slate-500">${rel} · 상대에게 알리지 않아요</div></div>
                    <button onclick="closeProfile()" class="text-slate-400 hover:text-slate-700 dark:hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden custom-scrollbar">
                    ${!commOpen('people') ? '' : `<div class="px-4 pt-3 pb-1 text-[0.6875rem] font-bold text-slate-400">팔로우</div>`}
                    ${!commOpen('people') ? '' : followsMe(uid) ? act(`removeFollower('${u}')`, 'fa-user-minus', '팔로워에서 삭제', '이 사람이 나를 팔로우한 기록을 지워요. 내 소식이 이 사람의 팔로잉 소식에 더 이상 올라가지 않아요.') : ''}
                    ${!commOpen('people') ? '' : isFollowing(uid) ? act(`unfollowUser('${u}').then(renderPeerManage)`, 'fa-user-xmark', '팔로우 취소', '이 사람의 새 게시물이 내 팔로잉 소식에 더 이상 올라오지 않아요.') : act(`followUser('${u}').then(renderPeerManage)`, 'fa-user-plus', '팔로우하기', '이 사람의 새 게시물을 팔로잉 소식에서 받아 봐요.')}
                    <div class="px-4 pt-3 pb-1 text-[0.6875rem] font-bold text-slate-400">내 게시물 공개 범위</div>
                    ${sw('hide', peerPref(uid, 'hide'), 'fa-eye-slash', '이 사람에게 내 게시물 숨기기', '이 사람에게만 내 일상 게시물이 보이지 않아요. 다른 이웃에게는 그대로 공개돼요.')}
                    ${sw('restrict', peerPref(uid, 'restrict'), 'fa-comment-slash', '제한하기', '이 사람은 내 게시물에 댓글을 달 수 없고, 이 사람의 대화 요청·메시지 알림이 오지 않아요.')}
                    <div class="px-4 pt-3 pb-1 text-[0.6875rem] font-bold text-slate-400">기타</div>
                    ${act(`renameFriendPrompt('${u}')`, 'fa-pen', '이름 바꾸기', friendAlias(uid) ? `지금: ${esc(friendAlias(uid))} (원래 이름 ${esc(m.nick || '이웃')})` : '나에게만 보이는 이름으로 바꿔요.')}
                    ${blockedNow ? act(`unblockUser('${u}'); setTimeout(renderPeerManage, 300)`, 'fa-unlock', '차단 해제', '다시 서로의 글·프로필이 보이고 대화할 수 있어요.')
                        : act(`blockUser('${u}', peerManageInfo.nick, peerManageInfo.emoji)`, 'fa-ban', '차단하기', '서로의 글·프로필·대화가 보이지 않고, 팔로우도 함께 끊겨요.', true)}
                </div></div>`;
            card.classList.remove('hidden');
        }

        // ================= 팔로우 · 팔로잉 (인스타그램·트위터처럼) =================
        //  · 프로필의 [팔로우]를 누르면 바로 팔로잉 (상대 수락 필요 없음) → 그 사람이 올린 '내 일상' 게시물이 [이웃·대화 > 팔로잉 소식]에 실시간으로 올라옴
        //  · 내 프로필·이웃 프로필에 팔로워/팔로잉 숫자, 누르면 누군지 목록
        //  · 서로 팔로우(맞팔)하면 대화 요청 없이 바로 1:1 대화 가능
        //  저장: 서버 연결 시 follows/{나}(내가 팔로우한 목록) + followers/{상대}/list/{나}(상대의 팔로워 목록). 체험 모드는 이 기기에만
        //  (예전 '친구'는 처음 한 번 팔로잉으로 옮겨 줌)
        let following = (() => {
            try {
                const v = JSON.parse(lsGet('following') || 'null');
                if (v && typeof v === 'object') return v;
                const f = JSON.parse(lsGet('friends') || '{}') || {}, o = {};
                Object.keys(f).forEach(u => { o[u] = { nick: f[u].nick, emoji: f[u].emoji, photo: f[u].photo, area: f[u].area, ts: f[u].ts || Date.now() }; });
                return o;
            } catch (e) { return {}; }
        })();
        let followers = [];                    // 나를 팔로우한 사람 [{ uid, nick, emoji, photo, area, ts }]
        let followUnsub = null, followFeed = [], followFeedUnsubs = [], followFeedReady = false;
        function isFollowing(uid) { return !!uid && uid !== COMM_UID && Object.prototype.hasOwnProperty.call(following, uid); }
        function followsMe(uid) { return followers.some(f => f.uid === uid); }
        function followInfo(uid) { return following[uid] || followers.find(f => f.uid === uid) || friendInfo(uid); }
        async function saveFollowing() {
            lsSet('following', JSON.stringify(following));
            try { const db = await commInit(); if (db) await db.collection('follows').doc(COMM_UID).set({ list: following, ts: Date.now() }); } catch (e) { console.error(e); }
        }
        async function followUser(uid) {
            if (!uid || uid === COMM_UID || isBlocked(uid)) return;
            const info = (profileShown.uid === uid ? profileShown : null) || followInfo(uid);
            following[uid] = { nick: info.nick || '이웃', emoji: info.emoji || '🙂', photo: info.photo || '', area: info.area || '', ts: Date.now() };
            await saveFollowing();
            try { const db = await commInit(); if (db) await db.collection('followers').doc(uid).collection('list').doc(COMM_UID).set(Object.assign({ uid: COMM_UID, ts: Date.now(), photo: myPhoto() }, meFields())); } catch (e) { console.error(e); }
            showAlertToast({ head: '➕ 팔로우', title: (info.nick || '이웃') + '님을 팔로우했어요. 새 게시물이 [팔로잉 소식]에 올라와요.' });
            followRefreshViews(uid);
            subscribeFollowFeed();
        }
        async function unfollowUser(uid) {
            if (!isFollowing(uid)) return;
            delete following[uid];
            await saveFollowing();
            try { const db = await commInit(); if (db) await db.collection('followers').doc(uid).collection('list').doc(COMM_UID).delete(); } catch (e) { console.error(e); }
            followRefreshViews(uid);
            subscribeFollowFeed();
        }
        function followRefreshViews(uid) {
            const card = document.getElementById('commProfileCard');
            if (uid && profileShown.uid === uid && card && !card.classList.contains('hidden') && !document.getElementById('followListBox')) showProfile(uid);
            if (document.getElementById('followListBox')) renderFollowList();
            if (commTab === 'friends') renderFollowFeed();
            if (commTab === 'me') renderMeTab();
            if (commTab === 'national') renderNational();
        }
        function followButton(uid) {
            if (!commOpen('people')) return '';          // 팔로우는 아직 열지 않음
            const b = 'px-3 py-1.5 rounded-lg text-xs font-bold';
            if (isFollowing(uid)) return `<button onclick="unfollowUser('${esc(uid)}')" title="눌러서 팔로우 취소" class="${b} bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-600 hover:border-red-300 hover:text-red-600"><i class="fa-solid fa-check"></i> 팔로잉</button>`;
            return `<button onclick="followUser('${esc(uid)}')" class="${b} bg-fuchsia-600 hover:bg-fuchsia-500 text-white"><i class="fa-solid fa-user-plus"></i> ${followsMe(uid) ? '맞팔로우' : '팔로우'}</button>`;
        }
        // 나를 팔로우한 사람 (실시간) + 새 팔로워 알림
        async function subscribeFollow() {
            if (followUnsub) { followUnsub(); followUnsub = null; }
            const db = await commInit();
            if (!db) return;
            try {   // 다른 기기에서 팔로우한 목록과 합침
                const d = await db.collection('follows').doc(COMM_UID).get();
                const list = d.exists ? (d.data().list || {}) : {};
                Object.keys(list).forEach(u => { if (!following[u]) following[u] = list[u]; });
                lsSet('following', JSON.stringify(following));
            } catch (e) { console.error(e); }
            let first = true;
            followUnsub = db.collection('followers').doc(COMM_UID).collection('list').orderBy('ts', 'desc').limit(500).onSnapshot(snap => {
                const prev = new Set(followers.map(f => f.uid));
                followers = snap.docs.map(d => d.data()).filter(f => f.uid && !isBlocked(f.uid));
                if (!first) followers.filter(f => !prev.has(f.uid)).forEach(f => commAlert('follow', { head: '➕ 새 팔로워', title: (f.nick || '이웃') + '님이 회원님을 팔로우하기 시작했어요.', foot: '눌러서 팔로잉 소식 보기', tab: 'friends' }));
                first = false;
                if (commTab === 'me') renderMeTab();
            }, err => console.error(err));
            subscribeFollowFeed();
        }
        // 팔로잉한 사람들의 '내 일상' 게시물 (실시간). Firestore 'in' 조건은 10명씩 나눠서 받음
        async function subscribeFollowFeed() {
            followFeedUnsubs.forEach(u => { try { u(); } catch (e) {} }); followFeedUnsubs = [];
            const uids = Object.keys(following).filter(u => !isBlocked(u));
            const db = await commInit();
            if (!db) {        // 체험 모드: 이 기기에 저장된 게시물 중 팔로잉한 사람 것만
                followFeed = feedLocal().filter(p => uids.includes(p.uid) && feedVisible(p)).sort((a, b) => (b.ts || 0) - (a.ts || 0));
                if (commTab === 'friends') renderFollowFeed();
                return;
            }
            const parts = {};
            followFeedReady = false;
            const seen = Number(lsGet('follow_feed_seen') || 0);
            for (let i = 0; i < uids.length; i += 10) {
                const chunk = uids.slice(i, i + 10), key = 'c' + i;
                let first = true;
                followFeedUnsubs.push(feedCol().where('uid', 'in', chunk).limit(60).onSnapshot(snap => {
                    const prevIds = new Set((parts[key] || []).map(p => p.id));
                    parts[key] = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).filter(feedVisible);
                    if (!first) parts[key].filter(p => !prevIds.has(p.id) && (p.ts || 0) > seen).forEach(p => commAlert('feed', { head: '📰 팔로잉 새 게시물', badge: p.nick || '이웃', title: (p.text || '').slice(0, 60) || '새 사진을 올렸어요', foot: '눌러서 팔로잉 소식 보기', tab: 'friends' }));
                    first = false;
                    followFeed = [].concat(...Object.values(parts)).sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 150);
                    if (commTab === 'friends') renderFollowFeed();
                }, err => console.error(err)));
            }
            if (!uids.length) { followFeed = []; if (commTab === 'friends') renderFollowFeed(); }
        }
        // 다른 사람의 팔로워·팔로잉 숫자 / 목록 (서버에서 읽음)
        const followCache = {};
        async function loadFollowOf(uid) {
            if (uid === COMM_UID) return { following: Object.keys(following).map(u => Object.assign({ uid: u }, following[u])), followers: followers.slice() };
            const db = await commInit();
            if (!db) return { following: [], followers: [] };
            try {
                const [fd, fs] = await Promise.all([db.collection('follows').doc(uid).get(), db.collection('followers').doc(uid).collection('list').limit(500).get()]);
                const fl = fd.exists ? (fd.data().list || {}) : {};
                const r = { following: Object.keys(fl).map(u => Object.assign({ uid: u }, fl[u])), followers: fs.docs.map(d => d.data()) };
                followCache[uid] = r;
                return r;
            } catch (e) { console.error(e); return { following: [], followers: [] }; }
        }
        // 숫자 두 칸 (누르면 목록)
        function followCountsHtml(uid, r) {
            const n = k => r ? r[k].filter(x => !isBlocked(x.uid)).length : '–';
            // 작은 알약 모양 (예: '12 팔로워') — 프로필 위쪽 공간을 덜 차지하도록
            const cell = (k, label) => `<button onclick="openFollowList('${esc(uid)}', '${k}')" class="inline-flex items-baseline gap-1 px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-fuchsia-50 dark:hover:bg-fuchsia-950/40 text-[0.6875rem] transition"><b class="text-slate-900 dark:text-white">${n(k)}</b><span class="font-semibold text-slate-500">${label}</span></button>`;
            return cell('followers', '팔로워') + cell('following', '팔로잉');
        }
        async function fillFollowCounts(uid, elId) {
            const r = await loadFollowOf(uid);
            const el = document.getElementById(elId);
            if (el) el.innerHTML = followCountsHtml(uid, r);
        }
        // 팔로워/팔로잉 목록 (프로필 카드 자리에 띄움)

                        : (list.length ? list.map(x => `<div class="flex items-center gap-2.5 px-4 py-2.5 border-b border-slate-100 dark:border-slate-800 last:border-0">

        // [이웃·대화 > 팔로잉 소식]: 팔로잉한 사람들의 일상 게시물을 SNS 피드처럼
        function renderFollowFeed() {

            if (demoOn()) { const d = demoItems('feed'); posts = posts.concat(d).sort((a, b) => (b.ts || 0) - (a.ts || 0)); people = people.concat(DEMO_PEOPLE.map(p => Object.assign({ area: d[0] && d[0].area }, p)).filter(p => !people.some(x => x.uid === p.uid))); }

                return `<article class="rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 overflow-hidden">
                    <div class="flex items-center gap-2.5 px-3.5 py-2.5">
                        <button onclick="showProfile('${esc(p.uid)}')" class="shrink-0 p-[2px] rounded-full bg-gradient-to-tr from-amber-400 via-rose-500 to-violet-600"><span class="block rounded-full bg-white dark:bg-slate-900 p-[1px]">${avatarHtml(p, 'w-8 h-8', 'text-base')}</span></button>

                        ${(p.ts || 0) > seen ? '<span class="px-1.5 py-0.5 rounded-full bg-rose-500 text-white text-[0.5625rem] font-black">NEW</span>' : ''}
                    </div>

                    <div class="px-3.5 py-2.5 flex items-center gap-4 text-[0.8125rem] font-bold text-slate-500 dark:text-slate-400">

                        <button onclick="followFeedOpen('${esc(p.uid)}', '${esc(p.id)}')" class="hover:text-violet-600"><i class="fa-regular fa-comment"></i> ${p.comments || 0}</button>
                        <button onclick="followFeedOpen('${esc(p.uid)}', '${esc(p.id)}')" class="ml-auto text-[0.6875rem] hover:text-violet-600">자세히 보기 <i class="fa-solid fa-chevron-right text-[0.5625rem]"></i></button>

            main.innerHTML = `<div class="flex-1 min-h-0 overflow-y-auto custom-scrollbar bg-slate-50 dark:bg-slate-950/40">
                <div class="px-3 pt-3 pb-2 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
                    <div class="flex items-center justify-between mb-2"><b class="text-sm text-slate-900 dark:text-white"><i class="fa-solid fa-newspaper text-fuchsia-500"></i> 팔로잉 소식</b>
                        <span class="flex gap-1.5"><button onclick="openFollowList('${COMM_UID}', 'following')" class="px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-[0.6875rem] font-bold text-slate-700 dark:text-slate-200">팔로잉 ${people.length}</button><button onclick="openFollowList('${COMM_UID}', 'followers')" class="px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-[0.6875rem] font-bold text-slate-700 dark:text-slate-200">팔로워 ${followers.length}</button></span></div>
                    ${people.length ? `<div class="hscroll gap-3 pb-1">${people.map(f => `<button onclick="showProfile('${esc(f.uid)}')" class="shrink-0 w-14 flex flex-col items-center gap-1"><span class="p-[2px] rounded-full bg-gradient-to-tr from-amber-400 via-rose-500 to-violet-600"><span class="block rounded-full bg-white dark:bg-slate-900 p-[2px]">${avatarHtml(f, 'w-11 h-11', 'text-xl')}</span></span><span class="text-[0.625rem] font-semibold text-slate-600 dark:text-slate-300 truncate w-full text-center">${esc(displayName(f.uid, f.nick))}</span></button>`).join('')}</div>` : ''}
                </div>
                <div class="p-3 space-y-3 max-w-xl mx-auto">
                    ${posts.length ? posts.map(card).join('') : `<div class="text-center py-14 px-6 text-xs text-slate-400 leading-relaxed" style="white-space: normal;">${people.length ? '팔로잉한 이웃이 아직 일상 게시물을 올리지 않았어요.<br>새 게시물이 올라오면 여기에 바로 보여요.' : '아직 팔로잉한 이웃이 없어요.<br>게시판·랭킹에서 이웃의 아이콘을 눌러 프로필을 열고 <b>팔로우</b>를 눌러 보세요.'}</div>`}
                </div></div>`;
        }
        // 피드의 게시물 자세히 보기 → 그 사람 프로필에서 게시물 열기 (❤·감정·댓글)
        function followFeedOpen(uid, id) {
            showProfile(uid);
            const p = followFeed.find(x => x.id === id);
            setTimeout(() => {
                if (p) { feedCache[uid] = feedCache[uid] || []; if (!feedFind(uid, id)) feedCache[uid].unshift(p); }
                openFeedPost(uid, id);
            }, 120);
        }

        // ---- 동네 인증 ----
        function nearestSigungu(lat, lng, n) {
            const arr = [];
            Object.keys(SIGUNGU_CENTERS).forEach(k => {
                const i = k.indexOf(' ');
                const sido = k.slice(0, i), sigungu = k.slice(i + 1);
                if (!(regionHierarchy[sido] && regionHierarchy[sido][sigungu])) return;
                const c = SIGUNGU_CENTERS[k];
                const dy = (c[0] - lat) * 111, dx = (c[1] - lng) * 88;
                arr.push({ sido: sido, sigungu: sigungu, dist: Math.sqrt(dx * dx + dy * dy) });
            });
            return arr.sort((a, b) => a.dist - b.dist).slice(0, n);
        }

        // 주소 글자에서 시·도 / 시·군·구 / 동을 찾아냄
        function matchTownFromText(text) {
            const sidos = Object.keys(regionHierarchy);
            let sido = sidos.find(s => text.includes(s));
            if (!sido) sido = sidos.find(s => (SIDO_ALIASES[s] || []).some(a => text.includes(a)));
            if (!sido) return null;
            let sigungu = null;
            Object.keys(regionHierarchy[sido]).forEach(sg => {
                if (sg.split(' ').every(p => text.includes(p)) && (!sigungu || sg.length > sigungu.length)) sigungu = sg;
            });
            if (!sigungu) return { sido: sido };
            let dong = null;
            regionHierarchy[sido][sigungu].forEach(d => {
                if (d === '전체') return;
                if ((text.includes(d) || text.includes(communityDong(d))) && (!dong || d.length > dong.length)) dong = d;
            });
            return { sido: sido, sigungu: sigungu, dong: dong ? communityDong(dong) : null };
        }

        async function reverseGeocode(lat, lng) {
            const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
            const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, 7000);
            try {
                const res = await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=ko&lat=' + lat + '&lon=' + lng, ctrl ? { signal: ctrl.signal } : undefined);
                if (!res.ok) return null;
                const j = await res.json();
                const text = Object.values(j.address || {}).join(' ') + ' ' + (j.display_name || '');
                return matchTownFromText(text);
            } catch (e) { return null; } finally { clearTimeout(timer); }
        }

        // ---- 동네 인증: 위치 확인 (권한이 막혀 있을 때 기기별 해결 방법을 단계별로 안내) ----
        function inAppBrowserName() {
            const m = (navigator.userAgent || '').match(/KAKAOTALK|NAVER\(inapp|Instagram|FB_IAB|FBAN|FBAV|Line\/|DaumApps|everytimeApp/i);
            return m ? m[0].replace(/\(inapp/i, '') : null;
        }
        function locGuideHtml(kind) {
            const ua = navigator.userAgent || '', ios = /iPhone|iPad|iPod/i.test(ua), and = /Android/i.test(ua);
            let title, steps;
            if (kind === 'inapp') {
                title = '앱 안의 간이 브라우저에서는 위치를 쓸 수 없는 경우가 많아요';
                steps = [ios ? '화면 오른쪽 아래(또는 위) ⋯ 메뉴에서 <b>[Safari로 열기]</b>를 눌러 주세요.' : '화면 오른쪽 위 ⋮ 메뉴에서 <b>[다른 브라우저로 열기]</b> 또는 <b>[Chrome으로 열기]</b>를 눌러 주세요.', '또는 아래 <b>[주소 복사]</b>를 누른 뒤 ' + (ios ? 'Safari' : 'Chrome') + ' 주소창에 붙여넣어 주세요.'];
            } else if (ios) {
                title = '이 사이트의 위치 사용이 꺼져 있어요';
                steps = ['<b>설정</b> 앱 → <b>개인정보 보호 및 보안</b> → <b>위치 서비스</b>가 켜져 있는지 확인해 주세요.', '같은 화면에서 <b>Safari 웹사이트</b>(또는 쓰는 브라우저)를 눌러 <b>[앱을 사용하는 동안]</b>으로 바꿔 주세요.', '주소창 왼쪽 <b>[aA]</b> → <b>웹사이트 설정</b> → <b>위치</b> → <b>허용</b>으로 바꿔도 돼요.'];
            } else if (and) {
                title = '이 사이트의 위치 사용이 꺼져 있어요';
                steps = ['화면 맨 위를 쓸어내려 <b>빠른 설정</b>에서 <b>[위치]</b>가 켜져 있는지 확인해 주세요. (꺼져 있으면 허용해도 같은 메시지가 떠요)', '주소창 왼쪽 <b>아이콘(자물쇠·설정)</b> → <b>권한</b> → <b>위치</b> → <b>허용</b>으로 바꿔 주세요.', 'Chrome이라면 오른쪽 위 ⋮ → <b>설정</b> → <b>사이트 설정</b> → <b>위치</b>에서 이 사이트를 <b>허용</b>해도 돼요.'];
            } else {
                title = '이 사이트의 위치 사용이 막혀 있어요';
                steps = ['주소창 왼쪽 <b>자물쇠 아이콘</b> → <b>위치</b> → <b>허용</b>으로 바꿔 주세요.', '컴퓨터의 위치 서비스(Windows 설정 → 개인정보 → 위치)가 꺼져 있으면 켜 주세요.'];
            }
            return `<div class="mt-2 rounded-xl border border-amber-300 dark:border-amber-700 bg-amber-50 dark:bg-amber-950/30 p-3 text-left text-slate-800 dark:text-slate-100">
                <p class="text-xs font-extrabold mb-1.5">📍 ${title}</p>
                <ol class="list-decimal pl-4 space-y-1 text-[0.75rem] leading-relaxed">${steps.map(x => `<li>${x}</li>`).join('')}</ol>
                ${and ? `<a href="intent:#Intent;action=android.settings.LOCATION_SOURCE_SETTINGS;end" class="mt-2.5 flex items-center justify-center gap-1.5 w-full py-2.5 rounded-lg bg-slate-800 dark:bg-slate-100 text-white dark:text-slate-900 text-xs font-bold"><i class="fa-solid fa-gear"></i> 휴대폰 위치 설정 바로 열기</a>
                <p class="text-[0.625rem] text-slate-500 dark:text-slate-400 mt-1">안 열리면 위 순서대로 직접 열어 주세요. (기기·브라우저에 따라 막혀 있을 수 있어요)</p>` : ''}
                ${ios ? `<p class="text-[0.625rem] text-slate-500 dark:text-slate-400 mt-2">※ iPhone은 웹사이트가 설정 앱을 직접 열 수 없어서, 위 순서대로 설정 앱을 열어 주세요.</p>` : ''}
                <div class="flex gap-2 mt-2.5">
                    ${kind === 'inapp' ? `<button onclick="copySiteUrl(this)" class="flex-1 py-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 text-xs font-bold">주소 복사</button>` : ''}
                    <button onclick="verifyTown()" class="flex-1 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold"><i class="fa-solid fa-rotate-right"></i> 설정했어요, 다시 시도</button>
                </div></div>`;
        }
        function commStatusHtml(html) { const el = document.getElementById('commStatus'); if (el) el.innerHTML = html || ''; }
        function copySiteUrl(btn) {
            const url = location.origin + '/';
            const done = () => { if (btn) { btn.textContent = '복사됨 ✓'; setTimeout(() => { btn.textContent = '주소 복사'; }, 1800); } };
            try { navigator.clipboard.writeText(url).then(done, () => window.prompt('주소를 복사하세요', url)); } catch (e) { window.prompt('주소를 복사하세요', url); }
        }
        async function onTownPosition(pos) {
            const lat = pos.coords.latitude, lng = pos.coords.longitude;
            const near = nearestSigungu(lat, lng, 3);
            if (near.length === 0 || near[0].dist > 60) { commStatus('대한민국 안에서만 동네 인증을 할 수 있습니다.'); return; }
            setMyLoc(lat, lng);               // 인증한 위치는 지도에 '내 위치'로 계속 표시 (이 기기에만 저장)
            commFound = await reverseGeocode(lat, lng);
            commCands = [];
            if (commFound && commFound.sigungu) commCands.push({ sido: commFound.sido, sigungu: commFound.sigungu });
            near.forEach(c => { if (!commCands.some(x => x.sido === c.sido && x.sigungu === c.sigungu)) commCands.push(c); });
            commStatus('');
            renderTownConfirm();
        }
        async function verifyTown() {
            if (!navigator.geolocation) { commStatus('이 기기(브라우저)는 위치 확인을 지원하지 않습니다.'); return; }
            const app = inAppBrowserName();
            // 이미 '차단'으로 저장되어 있으면 요청해도 창이 뜨지 않으므로, 바로 해결 방법을 안내
            try {
                if (navigator.permissions && navigator.permissions.query) {
                    const st = await navigator.permissions.query({ name: 'geolocation' });
                    if (st.state === 'denied') { commStatusHtml(locGuideHtml(app ? 'inapp' : 'denied')); return; }
                }
            } catch (e) {}
            commStatus('현재 위치를 확인하는 중입니다... (위치 권한 창이 뜨면 [허용]을 눌러 주세요)');
            const fail = err => {
                if (err && err.code === 1) commStatusHtml(locGuideHtml(app ? 'inapp' : 'denied'));
                else commStatus('위치를 확인하지 못했어요. 휴대폰의 위치(GPS)가 켜져 있는지 확인하고, 실내라면 창가에서 잠시 후 다시 눌러 주세요.');
            };
            // 동네를 찾는 데는 정밀한 GPS가 필요 없으므로 먼저 가볍게(빠르게) 요청하고, 안 되면 정밀하게 한 번 더 시도
            navigator.geolocation.getCurrentPosition(onTownPosition, err => {
                if (err && err.code === 1) return fail(err);
                navigator.geolocation.getCurrentPosition(onTownPosition, fail, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
            }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 });
        }

        function renderTownConfirm() {
            const box = document.getElementById('commConfirm');
            if (!box) return;
            const sel = 'w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-900 dark:text-white';
            box.innerHTML = `
                <div class="rounded-xl border border-slate-200 dark:border-slate-700 p-4 space-y-3">
                    <p class="text-sm font-bold text-slate-900 dark:text-white">현재 위치 근처의 동네입니다. 내 동네가 맞는지 확인해 주세요.</p>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="commSigungu" onchange="fillTownDongs()" class="${sel}">
                            ${commCands.map((c, i) => `<option value="${i}">${esc(c.sido + ' ' + c.sigungu)}</option>`).join('')}
                        </select>
                        <select id="commDong" class="${sel}"></select>
                    </div>
                    <input id="commNickFirst" type="text" maxlength="12" placeholder="닉네임 (예: 두정동주민)" value="${esc(commProfile.nick || '')}" class="${sel}">
                    <button onclick="confirmTown()" class="w-full py-2.5 rounded-xl bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-sm font-bold">이 동네로 인증 완료</button>
                </div>`;
            fillTownDongs();
