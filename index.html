<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <script>
        // 처음 접속하면 라이트 모드. 사용자가 고른 모드(라이트/다크)와 글씨 크기는 새로고침해도 그대로 유지됩니다.
        (function () {
            try {
                if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
                var f = Number(localStorage.getItem('font_px'));
                if (f >= 12 && f <= 24) {
                    document.documentElement.style.fontSize = f + 'px';
                    document.documentElement.style.setProperty('--fixed-zoom', String(16 / f));
                }
            } catch (e) {}
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리동네 사건사고 - 전국 실시간 관제 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- 지도 마커 묶음(클러스터): 멀리서 보면 숫자로 묶이고, 확대하면 하나씩 풀립니다 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: inherit; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        @keyframes radar-sweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-radar-sweep { animation: radar-sweep 3s linear infinite; }
        
        /* 구분선(Resizer) 및 화살표 UI 가이드 */
        .resizer { width: 6px; cursor: col-resize; transition: background-color 0.2s; flex-shrink: 0; position: relative; z-index: 20; background-color: #cbd5e1; }
        .dark .resizer { background-color: #1e293b; }
        .resizer:hover { background-color: #ef4444; }
        .resizer::after {
            content: "⇄";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #94a3b8;
            font-size: 10px;
            pointer-events: none;
            background: rgba(0,0,0,0.1);
            padding: 4px 1px;
            border-radius: 2px;
        }
        /* 창 크기를 끌어서 조절하는 동안 기사 원문(iframe)이 마우스를 가로채지 않도록 */
        .resizing iframe { pointer-events: none; }
        .resizing { user-select: none; }
        /* '실시간 업데이트 중' 뒤의 움직이는 점 3개 */
        .live-dots { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
        .live-dots i { width: 3px; height: 3px; border-radius: 50%; background: #10b981; animation: live-bounce 1.2s infinite ease-in-out; }
        .live-dots i:nth-child(2) { animation-delay: .2s; }
        .live-dots i:nth-child(3) { animation-delay: .4s; }
        /* 새로고침 화살표 회전 */
        .refresh-spin { display: inline-block; animation: refresh-rotate 2.4s linear infinite; }
        .refresh-spin.fast { animation-duration: .5s; }
        @keyframes refresh-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        /* 속보 헤드라인: 오른쪽에서 나와 왼쪽으로 흐름 (글을 읽는 방향과 같게) */
        @keyframes ticker-rtl { from { transform: translateX(var(--ticker-start, 100vw)); } to { transform: translateX(-100%); } }
        /* 화면 설정: 4개 패널(사건 목록·기사 원문·지도·커뮤니티)을 3칸에 자유롭게 배치 */
        .panel { display: flex; flex-direction: column; height: 100%; width: 100%; min-height: 0; min-width: 0; overflow: hidden; position: relative; }
        #detailViewContainer { overflow-x: hidden; overflow-wrap: anywhere; }
        /* 지도 마커 */
        .pin { border-radius: 50%; border: 2px solid #fff; box-sizing: border-box; }
        .pin.approx { border-style: dashed; opacity: .78; }
        .pin.exact { box-shadow: 0 0 0 2px rgba(15,23,42,.35), 0 2px 6px rgba(0,0,0,.45); }
        .pin.sel { animation: pin-pulse 1.4s ease-out infinite; }
        @keyframes pin-pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,.75); } 100% { box-shadow: 0 0 0 16px rgba(239,68,68,0); } }
        .cluster-bubble { border-radius: 50%; color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 3px solid rgba(255,255,255,.9); box-shadow: 0 2px 8px rgba(0,0,0,.35); font-family: system-ui, sans-serif; }
        .safety-pin { width: 26px; height: 26px; border-radius: 8px; background: #fff; border: 2px solid #0f172a; display: flex; align-items: center; justify-content: center; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
        .dark .leaflet-container { background: #0b1220; }
        .leaflet-popup-content { margin: 10px 12px; }
        /* 커뮤니티 버튼 */
        .comm-btn { background: linear-gradient(135deg, #059669 0%, #0d9488 55%, #0284c7 100%); }
        .comm-btn:hover { filter: brightness(1.1); }
        .comm-faces span { width: 22px; height: 22px; border-radius: 50%; background: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; border: 2px solid #059669; margin-left: -7px; }
        .comm-faces span:first-child { margin-left: 0; }
        .panel-flash { animation: panel-flash 1s ease-out 1; }
        @keyframes panel-flash { 0% { box-shadow: inset 0 0 0 4px #10b981; } 100% { box-shadow: inset 0 0 0 0 rgba(16,185,129,0); } }
        .react-chip { display: inline-flex; align-items: center; gap: 2px; font-size: 0.6875rem; padding: 1px 6px; border-radius: 999px; border: 1px solid #cbd5e1; background: rgba(255,255,255,.85); color: #334155; }
        .react-chip.on { border-color: #f43f5e; background: #ffe4e6; color: #be123c; font-weight: 700; }
        .dark .react-chip { background: rgba(15,23,42,.8); border-color: #475569; color: #e2e8f0; }
        .dark .react-chip.on { background: #4c0519; border-color: #f43f5e; color: #fecdd3; }
        .msg-row .msg-tools { visibility: hidden; }
        .msg-row:hover .msg-tools, .msg-row:focus-within .msg-tools { visibility: visible; }
        @media (hover: none) { .msg-row .msg-tools { visibility: visible; } }
        #tickerWrap:hover #tickerTrack { animation-play-state: paused; }
        @keyframes live-bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-5px); opacity: 1; } }

        /* 글씨 크기 조절은 1·2·3번 칸(과 창으로 뜨는 화면)에만 적용. 맨 위 제목 줄과 버튼 줄은 항상 100% 크기로 고정 */
        .fixed-scale { zoom: var(--fixed-zoom, 1); }
        /* 3칸 영역을 하나의 층으로 묶어서, 칸 안의 버튼(알림·안전시설·지도 모양)이 위에 뜨는 창(커뮤니티 등)을 뚫고 나오지 않게 함 */
        #splitContainer { isolation: isolate; position: relative; z-index: 0; }
        #floatModal { z-index: 1000; }
        /* 칸 너비를 줄이거나 늘려도 글자가 세로로 한 글자씩 쪼개지지 않게: 버튼·칩은 한 줄로, 넘치면 옆으로 넘겨 보기 */
        .panel button, .panel select, .nowrap-kids > * { white-space: nowrap; }
        .panel .wrap-ok, .panel .wrap-ok * { white-space: normal; }
        .hscroll { display: flex; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
        .hscroll > * { flex-shrink: 0; }
        .hscroll::-webkit-scrollbar { height: 4px; }
        .hscroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        .panel { container-type: inline-size; }
        @container (max-width: 560px) { .hide-narrow { display: none !important; } }
        @container (max-width: 420px) { .hide-xnarrow { display: none !important; } }
        .show-narrow { display: none; }
        @container (max-width: 560px) {
            .show-narrow { display: inline-block; }
            .dm-rooms { width: 100% !important; border-right: 0 !important; }
            .dm-rooms.has-chat { display: none !important; }
            .dm-chat.no-chat { display: none !important; }
        }
        /* 커뮤니티: 가운데 기사 화면과 확실히 구분되는 디자인 */
        #panel-community { border-top: 4px solid #10b981; }
        .comm-head { background: linear-gradient(120deg, #047857 0%, #0d9488 55%, #0369a1 100%); color: #fff; }
        .comm-head .comm-head-btn { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35); color: #fff; }
        .comm-head .comm-head-btn:hover { background: rgba(255,255,255,.28); }
        .comm-tab { transition: background-color .15s, color .15s; }
        /* 답장 원글로 이동할 때 원글을 잠깐 반짝이게 */
        .msg-jump { animation: msg-jump 1.6s ease-out 1; border-radius: 14px; }
        @keyframes msg-jump { 0% { background: rgba(14,165,233,.0); transform: scale(1); } 15% { background: rgba(14,165,233,.28); transform: scale(1.015); } 100% { background: rgba(14,165,233,0); transform: scale(1); } }
        .reply-quote { cursor: pointer; }
        .reply-quote:hover { filter: brightness(.95); }
        .msg-row { scroll-margin-top: 12px; }
        /* 신뢰 지수 안내 말풍선 */
        .tip { position: relative; display: inline-flex; align-items: center; gap: 3px; cursor: help; }
        .tip .tip-box { visibility: hidden; opacity: 0; position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); width: 250px; padding: 8px 10px; border-radius: 10px;
            background: #0f172a; color: #f8fafc; font-size: 11px; font-weight: 500; line-height: 1.5; text-align: left; white-space: normal; box-shadow: 0 8px 24px rgba(0,0,0,.35); transition: opacity .15s; z-index: 50; pointer-events: none; }
        .tip:hover .tip-box, .tip:focus .tip-box { visibility: visible; opacity: 1; }
        /* 새 기사가 들어왔을 때 목록 맨 위 카드 강조 */
        .news-new { animation: news-new 2.4s ease-out 1; }
        @keyframes news-new { 0% { box-shadow: 0 0 0 3px rgba(16,185,129,.9); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }
        /* 어두운 지도: 한글 지명이 나오는 기본 지도를 어둡게 바꿔서 사용 */
        .tiles-dark { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.55); }
        .tiles-light { filter: saturate(.55) brightness(1.04); }
        /* 분류 여러 개 선택: 선택될 때 톡 튀는 애니메이션 + ✓ 표시, 해제될 때 살짝 줄어듦 */
        .cat-btn { transition: transform .15s, opacity .15s, box-shadow .15s; }
        .cat-btn:active { transform: scale(.94); }
        .cat-on { box-shadow: 0 2px 8px rgba(15,23,42,.18); }
        .cat-dim { opacity: .62; }
        .cat-dim:hover { opacity: 1; }
        .cat-check { display: inline-block; margin-right: 3px; font-weight: 900; animation: cat-check .3s ease-out 1; }
        .cat-pop { animation: cat-pop .32s cubic-bezier(.3,1.6,.5,1) 1; }
        .cat-unpop { animation: cat-unpop .25s ease-out 1; }
        @keyframes cat-pop { 0% { transform: scale(.85); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
        @keyframes cat-unpop { 0% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes cat-check { 0% { transform: scale(0) rotate(-45deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
        /* 커뮤니티 탭 끌어서 순서 바꾸기 */
        .comm-tab[draggable="true"] { cursor: grab; }
        .comm-tab.dragging { opacity: .4; }
        .comm-tab.drop-before { box-shadow: -3px 0 0 0 #6366f1; }
        .comm-tab.drop-after { box-shadow: 3px 0 0 0 #6366f1; }
        .safety-tab { background: linear-gradient(135deg, #dc2626, #ea580c) !important; color: #fff !important; border-color: transparent !important; }
        .safety-tab.off { background: linear-gradient(135deg, #fee2e2, #ffedd5) !important; color: #b91c1c !important; border: 1px solid #fca5a5 !important; }
        .dark .safety-tab.off { background: linear-gradient(135deg, #450a0a, #431407) !important; color: #fecaca !important; border-color: #7f1d1d !important; }
    </style>
</head>
<body id="appBody" class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 h-screen flex flex-col overflow-hidden select-none transition-colors duration-200">

    <!-- 상단 헤더 -->
    <header id="appHeader" class="fixed-scale relative bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-2.5 flex items-center justify-between shrink-0 shadow-sm">
        <div class="flex items-center space-x-3 shrink-0">
            <div class="relative w-11 h-11 shrink-0 bg-slate-950 rounded-xl border border-red-500/50 flex items-center justify-center overflow-hidden shadow-lg shadow-red-500/20">
                <div class="absolute top-1/2 left-1/2 w-5 h-5 origin-top-left animate-radar-sweep bg-gradient-to-tr from-red-500/50 to-transparent rounded-tr-full"></div>
                <svg viewBox="0 0 48 48" class="absolute inset-0 w-full h-full" fill="none" stroke="#f87171" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" aria-label="대한민국 지도">
                    <path d="M10.5 8.8 L13.0 6.1 L17.3 5.9 L20.7 3.8 L22.3 7.3 L24.9 11.0 L26.8 15.2 L27.4 18.9 L27.0 22.5 L28.1 23.3 L27.3 27.2 L25.8 29.8 L24.3 30.6 L22.2 31.7 L21.3 33.1 L18.8 32.1 L17.0 33.1 L15.2 34.3 L13.7 34.7 L11.8 35.6 L9.5 36.2 L8.1 34.1 L8.7 31.0 L8.9 27.6 L9.5 26.1 L10.7 23.8 L9.4 21.2 L8.3 18.9 L7.3 17.6 L9.3 16.3 L11.5 15.9 L10.1 12.9 L9.5 10.5 Z" fill="rgba(239,68,68,0.18)"/>
                    <ellipse cx="9.7" cy="43.1" rx="2.6" ry="1.4" fill="rgba(239,68,68,0.18)"/>
                    <circle cx="8.0" cy="34.9" r="0.9" fill="#f87171" stroke="none"/>
                    <circle cx="22.3" cy="32.1" r="0.9" fill="#f87171" stroke="none"/>
                    <circle cx="9.1" cy="10.6" r="0.8" fill="#f87171" stroke="none"/>
                    <circle cx="36.0" cy="12.2" r="1.2" fill="#f87171" stroke="none"/>
                    <circle cx="42.1" cy="14.1" r="0.8" fill="#f87171" stroke="none"/>
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-extrabold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                    우리동네 사건사고 
                    <span class="text-xs px-2.5 py-0.5 rounded bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-400 border border-emerald-300 dark:border-emerald-500/40 font-mono shadow-sm">전국 실시간 관제</span>
                </h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">전국 모든 시·군·구·동 단위 안전 및 사건사고 밀착 모니터링</p>
            </div>
        </div>

        <div id="tickerWrap" class="hidden md:block flex-1 min-w-[12rem] mx-3 h-8 relative overflow-hidden rounded-lg bg-slate-100 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700" title="가장 많이 보도되고 있는 사건 순서입니다. 누르면 해당 기사로 이동합니다.">
            <div id="tickerTrack" class="absolute top-0 left-0 h-8 flex items-center whitespace-nowrap"></div>
        </div>
        
        <div class="flex items-center gap-1.5 shrink-0">
            <div class="flex items-center bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-0.5" title="1·2·3번 화면의 글씨 크기 (맨 위 제목 줄은 그대로)">
                <button onclick="adjustFontSize(-1)" class="px-1.5 py-1 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 rounded">A-</button>
                <span id="fontSizeIndicator" class="px-1 text-xs font-mono text-slate-500 dark:text-slate-400">100%</span>
                <button onclick="adjustFontSize(1)" class="px-1.5 py-1 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 rounded">A+</button>
            </div>
            <button onclick="toggleTheme()" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-yellow-400 text-xs font-medium px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 transition flex items-center gap-1.5 whitespace-nowrap">
                <i id="themeIcon" class="fa-solid fa-moon"></i> <span id="themeText">다크모드</span>
            </button>
            <div class="relative">
                <button onclick="toggleLayoutPanel()" title="화면 배치 바꾸기" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-medium px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 transition flex items-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-table-columns"></i> 화면 설정</button>
                <div id="layoutPanel" class="hidden absolute right-0 top-full mt-2 w-72 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl shadow-2xl p-3 text-left" style="z-index: 1200;"></div>
            </div>
            <button onclick="openAppModal()" title="휴대폰 앱으로 이용하기" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-medium px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 transition flex items-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-mobile-screen-button"></i> 앱 다운로드</button>
            <button onclick="openBriefing()" title="오늘·이번 주 주요 사건을 비서처럼 요약해 드립니다" class="relative bg-indigo-50 dark:bg-indigo-950/50 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 text-xs font-bold px-2.5 py-1.5 rounded-lg border border-indigo-300 dark:border-indigo-700 transition flex items-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-clipboard-list"></i> 안전 브리핑<span id="briefDot" class="hidden absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-red-500 border-2 border-white dark:border-slate-900"></span></button>
            <span id="floatBtnWrap"></span>
            <button onclick="openCommunity('report')" title="우리동네 안전망에 실시간 제보 · 언론사 제보도 함께" class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white text-[0.8125rem] font-extrabold px-3.5 py-2 rounded-lg shadow-md shadow-red-600/30 transition flex items-center gap-1.5 whitespace-nowrap">
                <i class="fa-solid fa-bullhorn"></i> 실시간 제보하기
            </button>
        </div>
    </header>

    <!-- 메인 3칸 레이아웃: 각 칸에 어떤 패널을 넣을지는 [화면 설정]에서 고릅니다 -->
    <main id="splitContainer" class="flex-1 flex flex-col lg:flex-row overflow-hidden w-full">
        <section id="leftPane" style="width: 28%; min-width: 250px;" class="bg-white dark:bg-slate-900/90 border-r border-slate-200 dark:border-slate-800 h-full overflow-hidden shrink-0"></section>
        <div id="resizer1" class="resizer hidden lg:block"></div>
        <section id="centerPane" style="width: 40%; min-width: 300px;" class="bg-slate-50 dark:bg-slate-950 border-r border-slate-200 dark:border-slate-800 h-full overflow-hidden shrink-0"></section>
        <div id="resizer2" class="resizer hidden lg:block"></div>
        <section id="rightPane" style="flex: 1; min-width: 240px;" class="bg-white dark:bg-slate-900 h-full relative overflow-hidden"></section>
    </main>

        function initResizers() {
            const container = document.getElementById('splitContainer');
            const leftPane = document.getElementById('leftPane');
            const centerPane = document.getElementById('centerPane');
            const resizer1 = document.getElementById('resizer1');
            const resizer2 = document.getElementById('resizer2');

            let isResizing1 = false, isResizing2 = false;
            resizer1.addEventListener('mousedown', (e) => { isResizing1 = true; document.body.classList.add('resizing'); e.preventDefault(); });
            resizer2.addEventListener('mousedown', (e) => { isResizing2 = true; document.body.classList.add('resizing'); e.preventDefault(); });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing1 && !isResizing2) return;
                const rect = container.getBoundingClientRect();
                const total = rect.width;
                if (isResizing1) {
                    const w = e.clientX - rect.left;
                    if (w >= 230 && w <= total * 0.5) leftPane.style.width = `${(w / total) * 100}%`;
                } else if (isResizing2) {
                    const lw = leftPane.getBoundingClientRect().width;
                    const cw = e.clientX - rect.left - lw - 6;
                    if (cw >= 280) centerPane.style.width = `${(cw / total) * 100}%`;
                }
                if (map) map.invalidateSize();
            });

            document.addEventListener('mouseup', () => { isResizing1 = false; isResizing2 = false; document.body.classList.remove('resizing'); fitArticleFrame(); });
        }

        const koSort = (a, b) => String(a).localeCompare(String(b), 'ko');
        function sortSidoOptions() {
            const sel = document.getElementById('sidoSelect');
            Array.from(sel.options).slice(1).sort((a, b) => koSort(a.value, b.value)).forEach(o => sel.appendChild(o));
        }
        function onSidoChange() {
            const sido = document.getElementById('sidoSelect').value;
            const sigunguSelect = document.getElementById('sigunguSelect');
            const dongSelect = document.getElementById('dongSelect');

            sigunguSelect.innerHTML = '<option value="all">시·군·구</option>';
            dongSelect.innerHTML = '<option value="all">읍·면·동</option>';
            dongSelect.disabled = true;

            if (sido === 'all') {
                sigunguSelect.disabled = true;
            } else {
                sigunguSelect.disabled = false;
                const sigungus = (regionHierarchy[sido] ? Object.keys(regionHierarchy[sido]) : []).sort(koSort);
                sigungus.forEach(sg => {
                    const opt = document.createElement('option');
                    opt.value = sg;
                    opt.textContent = sg;
                    sigunguSelect.appendChild(opt);
                });
            }
            filterByRegion();
        }

        function onSigunguChange() {
            const sido = document.getElementById('sidoSelect').value;
            const sigungu = document.getElementById('sigunguSelect').value;
            const dongSelect = document.getElementById('dongSelect');

            dongSelect.innerHTML = '<option value="all">읍·면·동</option>';

            if (sigungu === 'all') {
                dongSelect.disabled = true;
            } else {
                dongSelect.disabled = false;
                const dongs = ((regionHierarchy[sido] && regionHierarchy[sido][sigungu]) ? regionHierarchy[sido][sigungu] : []).slice().sort(koSort);
                dongs.forEach(d => {
                    if (d !== '전체') {
                        const opt = document.createElement('option');
                        opt.value = d;
                        opt.textContent = d;
                        dongSelect.appendChild(opt);
                    }
                });
            }
            filterByRegion();
        }

        function resetRegionFilter() {
            document.getElementById('sidoSelect').value = 'all';
            onSidoChange();
        }
