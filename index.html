<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리동네 사건사고 - 전국 실시간 관제 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: inherit; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
        @keyframes radar-sweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-radar-sweep { animation: radar-sweep 3s linear infinite; }
        
        /* 구분선(Resizer) 및 화살표 UI 가이드 */
        .resizer { width: 6px; cursor: col-resize; transition: background-color 0.2s; flex-shrink: 0; position: relative; z-index: 20; background-color: #cbd5e1; }
        .dark .resizer { background-color: #1e293b; }
        .resizer:hover { background-color: #ef4444; }
        .resizer::after {
            content: "⇄";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #94a3b8;
            font-size: 10px;
            pointer-events: none;
            background: rgba(0,0,0,0.1);
            padding: 4px 1px;
            border-radius: 2px;
        }
        /* 창 크기를 끌어서 조절하는 동안 기사 원문(iframe)이 마우스를 가로채지 않도록 */
        .resizing iframe { pointer-events: none; }
        .resizing { user-select: none; }
        /* '실시간 업데이트 중' 뒤의 움직이는 점 3개 */
        .live-dots { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
        .live-dots i { width: 3px; height: 3px; border-radius: 50%; background: #10b981; animation: live-bounce 1.2s infinite ease-in-out; }
        .live-dots i:nth-child(2) { animation-delay: .2s; }
        .live-dots i:nth-child(3) { animation-delay: .4s; }
        /* 새로고침 화살표 회전 */
        .refresh-spin { display: inline-block; animation: refresh-rotate 2.4s linear infinite; }
        .refresh-spin.fast { animation-duration: .5s; }
        @keyframes refresh-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        /* 속보 헤드라인: 왼쪽(로고 쪽)에서 나와 오른쪽(글씨 크기 버튼 쪽)으로 사라짐 */
        @keyframes ticker-ltr { from { transform: translateX(-100%); } to { transform: translateX(var(--ticker-end, 100vw)); } }
        #tickerWrap:hover #tickerTrack { animation-play-state: paused; }
        @keyframes live-bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-5px); opacity: 1; } }
    </style>
</head>
<body id="appBody" class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 h-screen flex flex-col overflow-hidden select-none transition-colors duration-200">

    <!-- 상단 헤더 -->
    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-6 py-3 flex items-center justify-between shrink-0 shadow-sm">
        <div class="flex items-center space-x-3 shrink-0">
            <div class="relative w-11 h-11 shrink-0 bg-slate-950 rounded-xl border border-red-500/50 flex items-center justify-center overflow-hidden shadow-lg shadow-red-500/20">
                <div class="absolute top-1/2 left-1/2 w-5 h-5 origin-top-left animate-radar-sweep bg-gradient-to-tr from-red-500/50 to-transparent rounded-tr-full"></div>
                <svg viewBox="0 0 48 48" class="absolute inset-0 w-full h-full" fill="none" stroke="#f87171" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" aria-label="대한민국 지도">
                    <path d="M10.5 8.8 L13.0 6.1 L17.3 5.9 L20.7 3.8 L22.3 7.3 L24.9 11.0 L26.8 15.2 L27.4 18.9 L27.0 22.5 L28.1 23.3 L27.3 27.2 L25.8 29.8 L24.3 30.6 L22.2 31.7 L21.3 33.1 L18.8 32.1 L17.0 33.1 L15.2 34.3 L13.7 34.7 L11.8 35.6 L9.5 36.2 L8.1 34.1 L8.7 31.0 L8.9 27.6 L9.5 26.1 L10.7 23.8 L9.4 21.2 L8.3 18.9 L7.3 17.6 L9.3 16.3 L11.5 15.9 L10.1 12.9 L9.5 10.5 Z" fill="rgba(239,68,68,0.18)"/>
                    <ellipse cx="9.7" cy="43.1" rx="2.6" ry="1.4" fill="rgba(239,68,68,0.18)"/>
                    <circle cx="8.0" cy="34.9" r="0.9" fill="#f87171" stroke="none"/>
                    <circle cx="22.3" cy="32.1" r="0.9" fill="#f87171" stroke="none"/>
                    <circle cx="9.1" cy="10.6" r="0.8" fill="#f87171" stroke="none"/>
                    <circle cx="36.0" cy="12.2" r="1.2" fill="#f87171" stroke="none"/>
                    <circle cx="42.1" cy="14.1" r="0.8" fill="#f87171" stroke="none"/>
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-extrabold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                    우리동네 사건사고 
                    <span class="text-xs px-2.5 py-0.5 rounded bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-400 border border-emerald-300 dark:border-emerald-500/40 font-mono shadow-sm">전국 실시간 관제</span>
                </h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">전국 모든 시·군·구·동 단위 안전 및 사건사고 밀착 모니터링</p>
            </div>
        </div>

        <div id="tickerWrap" class="hidden md:block flex-1 min-w-0 mx-4 h-8 relative overflow-hidden rounded-lg bg-slate-100 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700" title="가장 많이 보도되고 있는 사건 순서입니다. 누르면 해당 기사로 이동합니다.">
            <div id="tickerTrack" class="absolute top-0 left-0 h-8 flex items-center whitespace-nowrap"></div>
        </div>
        
        <div class="flex items-center space-x-3 shrink-0">
            <div class="flex items-center bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg p-0.5">
                <button onclick="adjustFontSize(-1)" class="px-2 py-1 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 rounded">A-</button>

            </div>
            <button onclick="toggleTheme()" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-yellow-400 text-xs font-medium px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-700 transition flex items-center gap-2">

            </button>
            <button onclick="openCommunity()" class="relative bg-emerald-600 hover:bg-emerald-500 text-white text-xs md:text-sm font-semibold px-4 py-2 rounded-lg shadow-lg shadow-emerald-600/20 transition flex items-center gap-2">

            </button>
            <button onclick="openCommunity('report')" class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white text-xs md:text-sm font-semibold px-4 py-2 rounded-lg shadow-lg shadow-red-600/20 transition flex items-center gap-2">
                <i class="fa-solid fa-bullhorn"></i> 실시간 제보하기
            </button>
            
        </div>
    </header>

    <!-- 메인 3분할 레이아웃 -->
    <main id="splitContainer" class="flex-1 flex flex-col lg:flex-row overflow-hidden w-full">
        
        <!-- 1. 왼쪽: 필터 및 뉴스 피드 -->
        <section id="leftPane" style="width: 28%; min-width: 250px;" class="bg-white dark:bg-slate-900/90 border-r border-slate-200 dark:border-slate-800 flex flex-col h-full overflow-hidden shrink-0">
            <div class="p-3 border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 space-y-2">
                <div class="flex items-center justify-between text-xs text-slate-500">
                    <span class="font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-1">
                        <i class="fa-solid fa-location-dot text-red-500"></i> 전국 지역별 상세 필터
                    </span>
                    <button onclick="manualRefreshData()" title="지금 바로 새 기사를 확인합니다 (기사는 이 버튼과 상관없이 자동으로 계속 갱신됩니다)" class="flex items-center gap-1.5 text-[0.6875rem] font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-300 dark:border-emerald-700 hover:bg-emerald-100 dark:hover:bg-emerald-900/50 px-2 py-1 rounded-md">

                    </button>
                </div>

                <div class="grid grid-cols-3 gap-1.5">
                    <select id="sidoSelect" onchange="onSidoChange()" class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded px-1.5 py-1 text-[0.6875rem] text-slate-800 dark:text-slate-200 focus:outline-none focus:border-red-500">
                        <option value="all">시·도(전국)</option>
                        <option value="서울특별시">서울특별시</option>
                        <option value="부산광역시">부산광역시</option>
                        <option value="대구광역시">대구광역시</option>
                        <option value="인천광역시">인천광역시</option>
                        <option value="광주광역시">광주광역시</option>
                        <option value="대전광역시">대전광역시</option>
                        <option value="울산광역시">울산광역시</option>
                        <option value="세종특별자치시">세종특별자치시</option>
                        <option value="경기도">경기도</option>
                        <option value="강원특별자치도">강원특별자치도</option>
                        <option value="충청북도">충청북도</option>
                        <option value="충청남도">충청남도</option>
                        <option value="전북특별자치도">전북특별자치도</option>
                        <option value="전라남도">전라남도</option>
                        <option value="경상북도">경상북도</option>
                        <option value="경상남도">경상남도</option>
                        <option value="제주특별자치도">제주특별자치도</option>
                    </select>

                    <select id="sigunguSelect" onchange="onSigunguChange()" disabled class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded px-1.5 py-1 text-[0.6875rem] text-slate-800 dark:text-slate-200 focus:outline-none focus:border-red-500 disabled:opacity-50">
                        <option value="all">시·군·구</option>
                    </select>

                    <select id="dongSelect" onchange="filterByRegion()" disabled class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded px-1.5 py-1 text-[0.6875rem] text-slate-800 dark:text-slate-200 focus:outline-none focus:border-red-500 disabled:opacity-50">
                        <option value="all">읍·면·동</option>
                    </select>
                </div>
            </div>

            <div id="dateBarWrap" class="relative px-3 py-1.5 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 flex items-center justify-between gap-2">
                <div class="flex items-center gap-1">
                    <button onclick="stepDate(1)" title="이전 날짜" class="px-1.5 py-1 rounded text-xs text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700"><i class="fa-solid fa-chevron-left"></i></button>
                    <button id="dateButton" onclick="toggleDateMenu()" title="날짜 선택" class="px-2.5 py-1 rounded-md text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-700 hover:border-red-500 whitespace-nowrap">날짜 선택</button>
                    <button onclick="stepDate(-1)" title="다음 날짜" class="px-1.5 py-1 rounded text-xs text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <span id="listCount" class="text-[0.6875rem] text-slate-500 font-medium whitespace-nowrap"></span>
                <div id="dateMenu" class="hidden absolute left-3 top-full mt-1 z-30 w-60 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg shadow-2xl p-1"></div>
            </div>

            <div id="newsListContainer" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2.5"></div>
        </section>

        <!-- 화살표 UI가 포함된 첫 번째 분할선 -->
        <div id="resizer1" class="resizer hidden lg:block"></div>

        <!-- 2. 중앙: 카테고리 및 원문 뷰어 패널 -->
        <section id="centerPane" style="width: 40%; min-width: 300px;" class="bg-slate-50 dark:bg-slate-950 border-r border-slate-200 dark:border-slate-800 flex flex-col h-full overflow-hidden shrink-0">
            <div id="categoryBar" class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-3 py-2 flex flex-col gap-1.5 shrink-0">
                <div id="groupButtons" class="flex flex-wrap items-center gap-1.5"></div>
                <div id="subButtons" class="flex flex-wrap items-center gap-1" style="display:none"></div>
            </div>
            
            <!-- 원문 본문 뷰어 영역 (상세 content 출력) -->
            <div id="detailViewContainer" class="flex-1 min-h-0 overflow-y-auto custom-scrollbar p-4 select-text flex flex-col gap-3"></div>
        </section>

        <!-- 화살표 UI가 포함된 두 번째 분할선 -->
        <div id="resizer2" class="resizer hidden lg:block"></div>

        <!-- 3. 오른쪽: 지도 패널 -->

            <div class="absolute top-3 right-3 z-[400] flex items-center gap-2">
                <button id="alertButton" onclick="toggleAlertPanel()" class="bg-white/95 dark:bg-slate-900/95 backdrop-blur border border-amber-400 text-xs font-bold px-3 py-1.5 rounded-lg shadow-lg text-slate-700 dark:text-slate-200 hover:bg-amber-50 dark:hover:bg-slate-800 whitespace-nowrap"><i class="fa-regular fa-bell"></i> 알림 설정</button>
                <div class="bg-white/90 dark:bg-slate-900/90 backdrop-blur border border-slate-200 dark:border-slate-700 text-xs px-3 py-1.5 rounded-lg shadow-lg text-slate-700 dark:text-slate-300 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                    <span>전국 동(洞) 단위 정밀 관제 지도</span>
                </div>
            </div>
            <div id="map" class="flex-1 w-full h-full z-10"></div>
            <div id="alertPanel" class="hidden absolute top-14 right-3 w-64 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl shadow-2xl p-3" style="z-index: 1100;"></div>
            <div id="alertToasts" class="absolute bottom-7 right-3 flex flex-col gap-2 items-end" style="z-index: 1100;"></div>
        </section>
    </main>

    <!-- 음성·영상 통화 화면 -->
    <div id="callOverlay" class="hidden fixed inset-0 bg-black/95 flex flex-col items-center justify-center" style="z-index: 70;">
        <div id="callInfo" class="absolute top-6 left-0 right-0 text-center text-white text-sm font-bold"></div>
        <div id="callAvatar" class="text-7xl" style="display:none;">📞</div>
        <video id="callRemote" autoplay playsinline class="max-w-full max-h-full"></video>
        <video id="callLocal" autoplay playsinline muted class="absolute bottom-24 right-4 w-32 rounded-lg border border-white/40 bg-black"></video>
        <div class="absolute bottom-6 flex gap-3">
            <button id="callMute" onclick="toggleMute()" class="px-4 py-2 rounded-full bg-white/20 hover:bg-white/30 text-white text-sm font-bold">마이크 끄기</button>
            <button onclick="endCall()" class="px-6 py-2 rounded-full bg-red-600 hover:bg-red-500 text-white text-sm font-bold"><i class="fa-solid fa-phone-slash"></i> 통화 종료</button>
        </div>
    </div>
    <div id="callIncoming" class="hidden fixed top-4 left-1/2 -translate-x-1/2 bg-white dark:bg-slate-900 border-2 border-emerald-500 rounded-2xl shadow-2xl px-5 py-3 text-center" style="z-index: 71;"></div>

    <!-- 우리동네 커뮤니티 창 -->
    <div id="communityModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="relative bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden flex flex-col" style="height: 88vh;">
            <div class="px-5 py-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-900/50 shrink-0">
                <h3 class="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-people-group text-emerald-500"></i> <span id="commTitle">우리동네 커뮤니티</span>
                </h3>
                <button onclick="closeCommunity()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="commBody" class="flex-1 min-h-0 flex flex-col select-text"></div>
            <div id="commProfileCard" onclick="closeProfile()" class="hidden absolute inset-0 z-10 bg-black/50 flex items-center justify-center p-4"></div>
        </div>
    </div>
    <div id="commMediaView" onclick="closeMedia()" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 cursor-zoom-out" style="z-index: 60;">
        <img id="commMediaImg" class="max-w-full max-h-full rounded-lg" alt="">
    </div>

    <!-- 스크립트 로직 -->
    <script>
        // ▼▼▼ 우리동네 커뮤니티 서버 설정 ▼▼▼
        // Firebase 콘솔에서 받은 설정값을 null 자리에 붙여넣으면 실제 커뮤니티가 켜집니다.
        // 예) const FIREBASE_CONFIG = { apiKey: "...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." };
        const FIREBASE_CONFIG = null;
        // ▲▲▲ 여기까지 ▲▲▲

        let newsData = [];
        let currentCategory = 'all';
        let selectedHotspotRegion = null;
        let selectedNewsId = null;
        let map, markersLayer;
        let currentFontSizePx = 16;

        const regionHierarchy = {
            "서울특별시": {

        function initResizers() {
            const container = document.getElementById('splitContainer');
            const leftPane = document.getElementById('leftPane');
            const centerPane = document.getElementById('centerPane');
            const resizer1 = document.getElementById('resizer1');
            const resizer2 = document.getElementById('resizer2');

            let isResizing1 = false, isResizing2 = false;
            resizer1.addEventListener('mousedown', (e) => { isResizing1 = true; document.body.classList.add('resizing'); e.preventDefault(); });
            resizer2.addEventListener('mousedown', (e) => { isResizing2 = true; document.body.classList.add('resizing'); e.preventDefault(); });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing1 && !isResizing2) return;
                const rect = container.getBoundingClientRect();
                const total = rect.width;
                if (isResizing1) {
                    const w = e.clientX - rect.left;
                    if (w >= 230 && w <= total * 0.5) leftPane.style.width = `${(w / total) * 100}%`;
                } else if (isResizing2) {
                    const lw = leftPane.getBoundingClientRect().width;
                    const cw = e.clientX - rect.left - lw - 6;
                    if (cw >= 280) centerPane.style.width = `${(cw / total) * 100}%`;
                }
                if (map) map.invalidateSize();
            });

            document.addEventListener('mouseup', () => { isResizing1 = false; isResizing2 = false; document.body.classList.remove('resizing'); fitArticleFrame(); });
        }

                sigunguSelect.disabled = false;
                const sigungus = regionHierarchy[sido] ? Object.keys(regionHierarchy[sido]) : [];
                sigungus.forEach(sg => {
                    const opt = document.createElement('option');
                    opt.value = sg;
                    opt.textContent = sg;
                    sigunguSelect.appendChild(opt);
                });
            }
            filterByRegion();
        }

        let renderLimit = 100;        // 왼쪽 목록에 한 번에 보여줄 개수
        const ARTICLE_BASE_WIDTH = 1100;   // 기사 원문을 이 폭(px) 기준으로 그린 뒤 가운데 창 폭에 맞게 축소
        let localReports = [];        // 이 화면에서 직접 등록한 제보
        let lastSig = '';
        let lastTag = '', pendingTag = '';   // news.json 이 바뀌었는지 확인하는 표식
        let dateFollowToday = true;   // 날짜를 직접 고르지 않았으면 항상 '오늘'을 따라감
        let hotspotArticleOpen = false;   // 다발 지역 화면에서 기사를 보고 있는 중인지
        const expandedEvents = new Set();  // '관련 기사'를 펼친 사건
        const READ_WIDTH = 820;            // 기사 원문을 가운데에 놓을 때의 폭(px)
        let articleWide = false;           // true: 넓게 보기(PC 화면 그대로) / false: 가운데 좁게 보기
        try { articleWide = localStorage.getItem('article_wide') === '1'; } catch (e) {}

        // ================= 공통 도우미 =================
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function safeUrl(u) {
            try { const x = new URL(u); return (x.protocol === 'http:' || x.protocol === 'https:') ? x.href : ''; } catch (e) { return ''; }
        }
        function groupOf(news) {
            const c = news.category;
            if (SUB_TO_GROUP[c]) return SUB_TO_GROUP[c];
            if (news.group && CATEGORY_GROUPS[news.group]) return news.group;
            if (CATEGORY_GROUPS[c]) return c;
            return LEGACY_GROUP[c] || '실종·제보';
        }
        function getCategoryBadgeClass(news) {
            return CATEGORY_GROUPS[groupOf(news)].badge;
        }
        // 같은 사건을 다룬 기사는 scraper.py 가 같은 사건번호(event)를 붙여 줍니다.
        function evOf(n) { return n.event || n.id; }
        // 기사 목록 → 사건 목록 [{ lead: 대표(가장 최근) 기사, items: 그 사건의 기사들 }]
        function groupEvents(list) {
            const map = new Map();
            list.forEach(n => {
                const k = evOf(n);
                if (!map.has(k)) map.set(k, { key: k, lead: n, items: [] });
                map.get(k).items.push(n);
            });
            return Array.from(map.values());
        }
        function todayKey() { return dateKey(Date.now() / 1000); }
        function sigunguOf(loc) {
            const w = (loc || '').split(' ');
            if (w.length >= 3 && w[1].endsWith('시') && w[2].endsWith('구')) return w.slice(0, 3).join(' ');
            return w.slice(0, 2).join(' ');
        }
        function hasCoords(n) { return Number.isFinite(n.lat) && Number.isFinite(n.lng); }

        const WD_KR = ['일', '월', '화', '수', '목', '금', '토'];
        function kstDate(ts) { return new Date((ts + 9 * 3600) * 1000); }
        function dateKey(ts) { const d = kstDate(ts); return d.getUTCFullYear() + '-' + (d.getUTCMonth() + 1) + '-' + d.getUTCDate(); }
        function dateLabel(ts) {
            const d = kstDate(ts);
            const label = (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일 (' + WD_KR[d.getUTCDay()] + ')';
            return dateKey(ts) === dateKey(Date.now() / 1000) ? '오늘 · ' + label : label;
        }
        function inLast7(news) {
            const ts = Number(news.timestamp) || 0;
            return !ts || ts >= Date.now() / 1000 - 7 * 86400;
        }
        function inPeriod(news) {
            if (!selectedDate || selectedDate === 'all') return inLast7(news);
            const ts = Number(news.timestamp) || 0;
            return !ts || dateKey(ts) === selectedDate;
        }
        function last7Days() {
            const now = Date.now() / 1000, arr = [];
            for (let i = 0; i < 7; i++) arr.push({ key: dateKey(now - i * 86400), ts: now - i * 86400 });
            return arr;
        }
        function dongStem(d) {
            const m = d.match(/^([가-힣]+?)(?=\d|제)/);
            return m ? m[1] : d;
        }

        // ================= 데이터 불러오기 =================
        async function loadIncidentsFromJSON(isManualRefresh = false) {
            let changed = false;
            if (!isManualRefresh && lastSig) {
                try {
                    const head = await fetch('news.json?t=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
                    const tag = head.headers.get('etag') || head.headers.get('last-modified') || '';
                    if (tag && tag === lastTag) return;      // 그대로면 내려받지 않음
                    pendingTag = tag;
                } catch (e) {}
            }
            try {
                const res = await fetch('news.json?t=' + Date.now(), { cache: 'no-store' });
                try { lastTag = pendingTag || res.headers.get('etag') || res.headers.get('last-modified') || lastTag; } catch (e) {}
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        data.forEach(n => { n.timestamp = Number(n.timestamp) || 0; });
                        data.sort((a, b) => b.timestamp - a.timestamp);
                        const sig = data.length + ':' + data[0].id + ':' + data[data.length - 1].id;
                        if (sig !== lastSig || isManualRefresh) {
                            newsData = localReports.concat(data);
                            checkNewIncidents(data);   // 우리 동네 새 사건 알림
                            lastSig = sig;
                            changed = true;
                        }
                    }
                }
            } catch (e) { console.log("데이터 대기 중..."); }

            if (newsData.length === 0) {
                newsData = [{
                    id: 1, category: "사건·수사", group: "실종·제보", title: "[안내] 전국 실시간 관제 시스템 대기 중",
                    summary: "크롤러가 7일간의 전국 사건사고를 수집하는 중입니다.",
                    content: "잠시만 기다리시면 최신 속보가 업데이트됩니다.",
                    location: "서울특별시 중구", lat: 37.5636, lng: 126.9975,
                    time: "실시간", source: "시스템", timestamp: Date.now() / 1000
                }];
                changed = true;
            }
            if (!changed && !isManualRefresh) return;   // 새 기사가 없으면 화면을 건드리지 않음
            if (!selectedDate) { selectedDate = todayKey(); dateFollowToday = true; }

            renderCategoryBar();
            renderNewsList();
            updateMapMarkers();
            renderTicker();
            const filtered = getFilteredNews();
            const stillThere = filtered.some(n => n.id === selectedNewsId);
            if (currentCategory === '범죄 다발 지역') {
                if (!hotspotArticleOpen) renderCrimeHotspotsView();
            } else if ((isManualRefresh || !selectedNewsId || !stillThere) && filtered.length > 0) {
                selectedNewsId = filtered[0].id;
                renderNewsList();
                renderDetailView(selectedNewsId);
                if (isManualRefresh && map && hasCoords(filtered[0])) map.flyTo([filtered[0].lat, filtered[0].lng], 13, { duration: 1.2 });
            }
        }

        // ================= 상단 속보 헤드라인 (가장 많이 보도되는 사건 순, 왼쪽 → 오른쪽으로 흐름) =================
        function renderTicker() {
            const wrap = document.getElementById('tickerWrap'), track = document.getElementById('tickerTrack');
            if (!wrap || !track) return;
            const since = Date.now() / 1000 - 24 * 3600;
            let evs = groupEvents(newsData.filter(n => n.timestamp >= since));
            if (evs.length < 5) evs = groupEvents(newsData.filter(inLast7));
            evs.sort((a, b) => (b.items.length - a.items.length) || (b.lead.timestamp - a.lead.timestamp));
            const top = evs.slice(0, 10);
            if (top.length === 0) { track.innerHTML = ''; return; }
            // 오른쪽으로 흐르므로 1위가 가장 먼저(오른쪽 끝에) 나오도록 거꾸로 놓음
            track.innerHTML = top.map((ev, i) => `
                <button onclick="openHeadline(${ev.lead.id})" class="inline-flex items-center gap-1.5 mx-5 text-xs text-slate-800 dark:text-slate-100 hover:text-red-500">
                    <span class="px-1.5 py-0.5 rounded bg-red-600 text-white text-[0.625rem] font-extrabold">${i === 0 ? '속보' : (i + 1) + '위'}</span>
                    <b>${esc(ev.lead.title)}</b>
                    <span class="text-slate-400">${esc((ev.lead.location || '').replace('대한민국 (세부 위치 미상)', ''))}${ev.items.length > 1 ? ' · 기사 ' + ev.items.length + '개' : ''}</span>
                </button>`).reverse().join('');
            const w = wrap.clientWidth || 600, tw = track.scrollWidth || top.length * 320;
            track.style.setProperty('--ticker-end', w + 'px');
            track.style.animation = 'none';
            void track.offsetWidth;
            track.style.animation = 'ticker-ltr ' + Math.max(20, Math.round((w + tw) / 70)) + 's linear infinite';
        }
        function openHeadline(id) {
            const n = newsData.find(x => x.id === id);
            if (!n) return;
            currentCategory = 'all'; currentSub = null; selectedHotspotRegion = null; hotspotArticleOpen = false;
            selectedDate = dateKey(n.timestamp); dateFollowToday = (selectedDate === todayKey());
            renderCategoryBar(); updateMapMarkers();
            selectNews(id);
        }

        // ================= 지도 =================
        function initMap() {
            map = L.map('map').setView([36.5000, 127.5000], 7);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
            markersLayer = L.layerGroup().addTo(map);
            updateMapMarkers();
        }

        function updateMapMarkers() {
            if (!markersLayer) return;
            markersLayer.clearLayers();

            if (currentCategory === '범죄 다발 지역') {
                getCrimeHotspotsData().forEach((stat, idx) => {
                    let size = Math.min(40, 16 + stat.count * 4);
                    let color = idx === 0 ? '#dc2626' : (idx === 1 ? '#ea580c' : '#f59e0b');
                    const icon = L.divIcon({
                        className: 'hotspot-icon',
                        html: `<div style="background-color: ${color}; width: ${size}px; height: ${size}px; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: bold; box-shadow: 0 0 12px ${color};">${stat.count}</div>`,
                        iconSize: [size, size], iconAnchor: [size / 2, size / 2]
                    });
                    const marker = L.marker([stat.lat, stat.lng], { icon });
                    marker.bindPopup(`<div style="font-family: sans-serif;"><b style="color:#dc2626">TOP ${idx + 1} ${esc(stat.region)}</b><br>관련 건수: <b>${stat.count}건</b></div>`);
                    markersLayer.addLayer(marker);
                });
                return;
            }

            groupEvents(getFilteredNews()).slice(0, 800).forEach(ev => {
                const news = ev.items.find(hasCoords);
                if (!news) return;
                const g = groupOf(ev.lead);
                const color = CATEGORY_GROUPS[g].color;
                const selected = ev.items.some(n => n.id === selectedNewsId);
                const size = selected ? 20 : 14;
                const icon = L.divIcon({
                    className: 'custom-icon',
                    html: `<div style="background-color: ${color}; width: ${size}px; height: ${size}px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px ${color};"></div>`,
                    iconSize: [size, size], iconAnchor: [size / 2, size / 2]
                });
                const marker = L.marker([news.lat, news.lng], { icon, zIndexOffset: selected ? 1000 : 0 });
                marker.bindPopup(`
                    <div style="font-family: sans-serif; max-width: 220px;">
                        <span style="font-size: 10px; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-weight:bold;">${esc(ev.lead.category)}</span>
                        <h4 style="font-size: 12px; font-weight: bold; margin: 5px 0;">${esc(ev.lead.title)}</h4>
                        <p style="font-size: 11px; color: #475569; margin: 0;"><i class="fa-solid fa-location-dot text-red-500"></i> ${esc(news.location)}${ev.items.length > 1 ? ' · 관련 기사 ' + ev.items.length + '개' : ''}</p>
                    </div>
                `);
                marker.on('click', () => selectNews(ev.lead.id));
                markersLayer.addLayer(marker);
            });
        }

        // ================= 중앙 상단: 카테고리 버튼 =================
        function renderCategoryBar() {
            const base = groupEvents(getFilteredNews(true)).map(ev => ev.lead);   // 사건 1건 = 1개로 셈
            const gCount = {}, sCount = {};
            base.forEach(n => {
                const g = groupOf(n);
                gCount[g] = (gCount[g] || 0) + 1;
                if (g === currentCategory) sCount[n.category] = (sCount[n.category] || 0) + 1;
            });
            const ACTIVE = ' ring-2 ring-offset-1 ring-slate-800 dark:ring-slate-200 dark:ring-offset-slate-900 font-bold';

            let html = `<button onclick="setCategoryFilter('all')" data-cat="all" class="cat-btn px-2.5 py-1 rounded-md text-[0.6875rem] border whitespace-nowrap transition ${currentCategory === 'all' ? 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 border-transparent font-bold shadow-sm' : 'bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border-slate-300 dark:border-slate-700 font-medium'}">전체 <span class="opacity-70 font-mono">${base.length}</span></button>`;
            Object.keys(CATEGORY_GROUPS).forEach(g => {
                const c = CATEGORY_GROUPS[g];
                html += `<button onclick="setCategoryFilter('${g}')" data-cat="${g}" class="cat-btn px-2.5 py-1 rounded-md text-[0.6875rem] border whitespace-nowrap transition font-medium ${c.badge}${currentCategory === g ? ACTIVE : ''}">${c.label} <span class="opacity-70 font-mono">${gCount[g] || 0}</span></button>`;
            });
            html += `<span class="ml-auto flex items-center gap-1.5 pl-2 border-l-2 border-slate-300 dark:border-slate-600"><button onclick="setCategoryFilter('범죄 다발 지역')" data-cat="범죄 다발 지역" class="cat-btn px-2.5 py-1 rounded-md text-[0.6875rem] border whitespace-nowrap transition bg-rose-600 text-white border-rose-700 font-bold shadow-sm hover:bg-rose-500${currentCategory === '범죄 다발 지역' ? ACTIVE : ''}">🚨 7일간 전국 사건사고 다발 지역</button></span>`;
            document.getElementById('groupButtons').innerHTML = html;

            let sub = '';
            if (CATEGORY_GROUPS[currentCategory]) {
                const c = CATEGORY_GROUPS[currentCategory];
                sub += `<span class="text-[0.625rem] text-slate-400 mr-0.5">세부:</span>`;
                sub += `<button onclick="setSubFilter(null)" class="px-2 py-0.5 rounded-full text-[0.625rem] border transition ${currentSub === null ? 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 border-transparent font-bold' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-300 dark:border-slate-700'}">전체 ${gCount[currentCategory] || 0}</button>`;
                c.subs.forEach(s => {
                    const n = sCount[s] || 0;
                    sub += `<button onclick="setSubFilter('${s}')" class="px-2 py-0.5 rounded-full text-[0.625rem] border transition ${currentSub === s ? 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 border-transparent font-bold' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-300 dark:border-slate-700'} ${n === 0 ? 'opacity-40' : ''}">${s} ${n}</button>`;
                });
            }
            const subBox = document.getElementById('subButtons');
            subBox.innerHTML = sub;
            subBox.style.display = sub ? 'flex' : 'none';
            renderDateBar();
        }

        function renderDateBar() {
            const btn = document.getElementById('dateButton');
            const menu = document.getElementById('dateMenu');
            if (!btn || !menu) return;
            const days = last7Days();            // 항상 '지금' 기준으로 오늘 포함 7일
            const cur = days.find(d => d.key === selectedDate);
            btn.innerHTML = `<i class="fa-regular fa-calendar"></i> ${cur ? dateLabel(cur.ts) : '최근 7일 전체'} <i class="fa-solid fa-caret-down"></i>`;

            const perDay = {}, all = new Set();
            getFilteredNews(false, true).forEach(n => {
                const k = dateKey(n.timestamp || Date.now() / 1000);
                (perDay[k] = perDay[k] || new Set()).add(evOf(n));
                all.add(evOf(n));
            });
            const row = (key, label, n, on) => `<button onclick="setDate('${key}')" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded text-xs transition ${on ? 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 font-bold' : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700'}"><span>${label}</span><span class="font-mono opacity-70">${n}건</span></button>`;
            menu.innerHTML = days.map(d => row(d.key, dateLabel(d.ts), perDay[d.key] ? perDay[d.key].size : 0, d.key === selectedDate)).join('')
                + '<div class="my-1 border-t border-slate-200 dark:border-slate-700"></div>'
                + row('all', '최근 7일 전체', all.size, selectedDate === 'all');
        }

        // 30초마다: 자정이 지나 날짜가 바뀌었으면 날짜 표시를 새 날짜로 넘김
        function dateTick() {
            const today = todayKey();
            if (selectedDate !== 'all' && !last7Days().some(d => d.key === selectedDate)) { selectedDate = today; dateFollowToday = true; refreshAll(); return; }
            if (dateFollowToday && selectedDate !== today) { selectedDate = today; refreshAll(); return; }
            renderDateBar();
        }

        function toggleDateMenu(show) {
            const menu = document.getElementById('dateMenu');
            const hidden = menu.classList.contains('hidden');
            const want = (typeof show === 'boolean') ? show : hidden;
            if (want) menu.classList.remove('hidden'); else menu.classList.add('hidden');
        }

        function setDate(key) {
            selectedDate = key;
            dateFollowToday = (key === todayKey());
            renderLimit = 100;
            toggleDateMenu(false);
            const list = document.getElementById('newsListContainer');
            if (list) list.scrollTop = 0;
            refreshAll();
        }

        // ◀(이전 날짜) / ▶(다음 날짜)
        function stepDate(dir) {
            const keys = last7Days().map(d => d.key);
            let i = keys.indexOf(selectedDate);
            i = (i < 0) ? 0 : Math.max(0, Math.min(keys.length - 1, i + dir));
            setDate(keys[i]);
        }

        function refreshAll() {
            renderCategoryBar();
            renderNewsList();
            updateMapMarkers();
            if (currentCategory === '범죄 다발 지역') { if (!hotspotArticleOpen) renderCrimeHotspotsView(); return; }
            const f = getFilteredNews();
            if (f.length > 0) selectNews(f[0].id, true);
            else setDetailHTML('<div class="text-center py-20 text-slate-400 text-xs">조건에 맞는 기사가 없습니다.</div>');
        }

        // ================= 왼쪽: 사건 목록 (같은 사건 기사는 1건으로 묶음) =================
        function showMoreNews() { renderLimit += 100; renderNewsList(); }
        function toggleEvent(key) {
            if (expandedEvents.has(key)) expandedEvents.delete(key); else expandedEvents.add(key);
            renderNewsList();
        }

        function renderNewsList() {
            const container = document.getElementById('newsListContainer');
            const prevScroll = container.scrollTop;
            const filtered = getFilteredNews();
            const events = groupEvents(filtered);
            document.getElementById('listCount').textContent = '사건 ' + events.length + '건' + (filtered.length > events.length ? ' · 기사 ' + filtered.length + '개' : '');
            container.innerHTML = '';

            // 다발 지역에서 지역을 고른 상태: 맨 위에 어느 지역인지와 돌아가기 버튼
            if (currentCategory === '범죄 다발 지역' && selectedHotspotRegion) {
                const bar = document.createElement('div');
                bar.className = 'sticky top-0 z-20 -mx-3 -mt-3 px-3 py-2 bg-rose-600 text-white text-xs font-bold flex items-center justify-between gap-2';
                bar.innerHTML = `<span class="truncate">🚨 ${esc(selectedHotspotRegion)} · 최근 7일</span><button class="shrink-0 px-2 py-0.5 rounded bg-white/20 hover:bg-white/30">← 다발 지역 순위</button>`;
                bar.querySelector ? (bar.querySelector('button').onclick = backToHotspots) : (bar.onclick = backToHotspots);
                container.appendChild(bar);
            }

            if (events.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'text-center py-10 text-xs text-slate-500 space-y-3';
                const isToday = selectedDate === todayKey();
                empty.innerHTML = `<div>${isToday ? '오늘은 아직 조건에 맞는 사건이 없습니다.' : '선택한 날짜/지역/카테고리에 해당하는 사건이 없습니다.'}</div>`
                    + (isToday ? '<button onclick="stepDate(1)" class="px-3 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold">← 어제 사건 보기</button>' : '');
                container.appendChild(empty);
                return;
            }

            const showHeaders = selectedDate === 'all' || (currentCategory === '범죄 다발 지역' && !!selectedHotspotRegion);
            const perDay = {};
            events.forEach(ev => { const k = dateKey(ev.lead.timestamp || Date.now() / 1000); perDay[k] = (perDay[k] || 0) + 1; });

            let lastKey = null;
            events.slice(0, renderLimit).forEach(ev => {
                const news = ev.lead;
                const ts = news.timestamp || Date.now() / 1000;
                const k = dateKey(ts);
                if (showHeaders && k !== lastKey) {
                    lastKey = k;
                    const h = document.createElement('div');
                    h.className = 'sticky top-0 z-10 -mx-3 px-3 py-1 text-[0.6875rem] font-bold text-slate-600 dark:text-slate-300 bg-slate-100/95 dark:bg-slate-800/95 backdrop-blur border-y border-slate-200 dark:border-slate-700 flex justify-between';

                const hasSelected = ev.items.some(n => n.id === selectedNewsId);

                const card = document.createElement('div');
                card.className = `rounded-xl border transition text-left overflow-hidden ${hasSelected ? 'bg-slate-100 dark:bg-slate-800/90 border-red-500/60 shadow-md' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-slate-400 dark:hover:border-slate-600'}`;

                const main = document.createElement('div');

                main.innerHTML = `
                    <div class="flex items-center justify-between mb-1.5 gap-1">

                    <h3 class="text-xs font-bold text-slate-900 dark:text-white line-clamp-2 mb-1">${esc(news.title)}</h3>
                    <p class="text-[0.6875rem] text-slate-600 dark:text-slate-400 line-clamp-2 mb-2">${esc(news.summary)}</p>
                    <div class="flex items-center justify-between gap-2 text-[0.625rem] text-slate-500 pt-1 border-t border-slate-100 dark:border-slate-800">
                        <span class="truncate"><i class="fa-solid fa-location-dot text-red-500"></i> ${esc(news.location)}</span>
                        <span class="font-medium shrink-0">${esc(news.source)}</span>
                    </div>`;
                card.appendChild(main);

                if (ev.items.length > 1) {
                    const tog = document.createElement('button');
                    tog.className = 'w-full px-3 py-1.5 text-[0.6875rem] font-bold text-blue-600 dark:text-blue-400 bg-slate-50 dark:bg-slate-800/60 border-t border-slate-200 dark:border-slate-700 flex items-center justify-between hover:bg-slate-100 dark:hover:bg-slate-800';
                    tog.innerHTML = `<span><i class="fa-regular fa-newspaper"></i> 같은 사건 관련 기사 ${ev.items.length}개</span><span>${open ? '접기 ▲' : '펼치기 ▼'}</span>`;
                    tog.onclick = () => toggleEvent(ev.key);
                    card.appendChild(tog);
                    if (open) {
                        ev.items.forEach(n => {
                            const row = document.createElement('div');
                            row.className = `px-3 py-1.5 text-[0.6875rem] cursor-pointer border-t border-slate-100 dark:border-slate-800 ${n.id === selectedNewsId ? 'bg-red-50 dark:bg-red-950/30 font-bold' : 'hover:bg-slate-50 dark:hover:bg-slate-800/60'}`;
                            row.onclick = () => selectNews(n.id);
                            row.innerHTML = `<div class="text-slate-800 dark:text-slate-100 line-clamp-2">${esc(n.title)}</div><div class="text-[0.625rem] text-slate-500">${esc(n.source)} · ${esc(n.time)}</div>`;

                container.appendChild(card);

            if (events.length > renderLimit) {
                const more = document.createElement('button');
                more.className = 'w-full py-2 text-xs font-bold text-blue-600 dark:text-blue-400 bg-slate-100 dark:bg-slate-800 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700';
                more.textContent = `더 보기 (${renderLimit} / ${events.length}건)`;
                more.onclick = showMoreNews;
                container.appendChild(more);

            container.scrollTop = prevScroll;

        // ================= 다발 지역 (사건 수 기준, 같은 사건의 기사 여러 개는 1건) =================
        function getCrimeHotspotsData() {
            const stats = {};
            newsData.filter(n => inLast7(n) && hasCoords(n) && groupOf(n) !== '해외·안보' && (n.location || '').includes(' ') && !(n.location || '').includes('세부 위치 미상')).forEach(news => {
                const reg = sigunguOf(news.location);
                if (!stats[reg]) stats[reg] = { region: reg, events: new Set(), articles: 0, lat: news.lat, lng: news.lng };
                stats[reg].events.add(evOf(news));
                stats[reg].articles++;
            });
            return Object.values(stats).map(s => ({ region: s.region, count: s.events.size, articles: s.articles, lat: s.lat, lng: s.lng }))
                .sort((a, b) => (b.count - a.count) || (b.articles - a.articles)).slice(0, 30);
        }

        function renderCrimeHotspotsView() {
            hotspotArticleOpen = false;
            const container = document.getElementById('detailViewContainer');
            let listHTML = '';
            getCrimeHotspotsData().forEach((item, index) => {

                            </div>
                        </div>
                        <span class="text-base font-extrabold text-red-500 shrink-0">사건 ${item.count}건</span>
                    </div>
                `;
            });
            if (!listHTML) listHTML = '<div class="text-center py-10 text-xs text-slate-400">위치가 확인된 기사가 아직 없습니다.</div>';
            container.style.padding = '';

                        <h2 class="text-base font-extrabold text-slate-900 dark:text-white">🚨 최근 7일간 전국 사건사고 다발 지역</h2>
                        <p class="text-xs text-slate-600 dark:text-slate-400 mt-1">같은 사건을 다룬 기사 여러 개는 사건 1건으로 셉니다. 지역을 누르면 왼쪽에 그 지역 사건이 정리됩니다.</p>
                    </div>
                    <div class="space-y-2.5 flex-1 overflow-y-auto custom-scrollbar">${listHTML}</div>
                </div>
            `;

        function selectHotspotRegion(region, lat, lng) {

            renderLimit = 100;
            renderCrimeHotspotsView();
            renderNewsList();

        // ================= 가운데: 기사 원문 (가운데 정렬, 양옆 여백) =================
        function setDetailHTML(html) {
            const container = document.getElementById('detailViewContainer');
            container.style.padding = '';
            container.innerHTML = html;
        }

        function renderDetailView(id) {
            const news = newsData.find(n => n.id === id);
            const container = document.getElementById('detailViewContainer');
            if (!news) {
                setDetailHTML(`<div class="text-center py-20 text-slate-400 text-xs">선택된 기사 정보를 찾을 수 없습니다.</div>`);

            const link = safeUrl(news.link);

            if (link && !isGoogle && news.embed !== false) {

                            sandbox="allow-scripts allow-same-origin allow-popups allow-forms"

                        <div style="position:absolute; right:14px; bottom:14px; z-index:5; opacity:.9;" class="flex items-center gap-1.5">
                            <button onclick="toggleArticleWide()" title="기사 폭 바꾸기" class="${fab}"><i class="fa-solid fa-arrows-left-right"></i> ${articleWide ? '가운데로 좁게' : '넓게 보기'}</button>
                            <a href="${esc(link)}" target="_blank" rel="noopener noreferrer" title="기사가 보이지 않으면 눌러서 새 창으로 여세요" class="${fab}"><i class="fa-solid fa-arrow-up-right-from-square"></i> 새 창</a>
                        </div>
                    </div>`;
                fitArticleFrame();
                return;
            }

            // 원문을 이 화면에 띄울 수 없는 기사 (언론사가 막아 둠 / 구글 뉴스 중계 주소 / 주소 없음)
            const notice = !link ? '이 기사는 원문 주소가 없습니다.'
                : (news.embed === false ? '이 언론사(' + esc(news.source || '') + ')는 다른 사이트 화면 안에서 기사를 여는 것을 막아 두었습니다. 아래 버튼으로 원문을 열어 주세요.'
                : '이 기사는 아직 구글 뉴스 중계 주소라서 이 화면에 바로 띄울 수 없습니다. 아래 버튼으로 원문을 열어 주세요.');
            const g = groupOf(news);
            setDetailHTML(`
                <div class="m-auto w-full max-w-xl space-y-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                    <div class="flex items-center justify-between gap-2 text-xs text-slate-500">
                        <span class="px-2 py-0.5 rounded border ${CATEGORY_GROUPS[g].badge} font-bold">${esc(news.category || '')}</span>
                        <span class="truncate">${esc(news.source || '')} · ${esc(news.time || '')}</span>
                    </div>
                    <h2 class="text-lg font-black text-slate-900 dark:text-white leading-snug">${esc(news.title)}</h2>
                    <p class="text-xs text-red-500 font-semibold"><i class="fa-solid fa-location-dot"></i> ${esc(news.location || '')}</p>
                    ${news.summary && news.summary !== news.title ? `<p class="text-sm text-slate-700 dark:text-slate-200 leading-relaxed">${esc(news.summary)}</p>` : ''}
                    <p class="text-xs text-amber-700 dark:text-amber-300 bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800 rounded-lg px-3 py-2">${notice}</p>
                    ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center gap-1.5 text-sm font-bold text-white bg-blue-600 hover:bg-blue-500 px-4 py-2.5 rounded-lg shadow"><i class="fa-solid fa-arrow-up-right-from-square"></i> 기사 원문 새 창으로 열기</a>` : ''}
                </div>`);
        }

        function toggleArticleWide() {
            articleWide = !articleWide;
            try { localStorage.setItem('article_wide', articleWide ? '1' : '0'); } catch (e) {}
            if (selectedNewsId) renderDetailView(selectedNewsId);
        }

        // 기사 원문 배치. 기본은 '가운데 좁게': 기사를 가운데에 두고 양옆에 여백을 줍니다.
        // 좁은 폭으로 열면 대부분의 언론사 페이지가 모바일형으로 바뀌어 양옆 광고·랭킹 뉴스가 빠집니다.
        // (다른 사이트 페이지의 내용 자체를 지우는 것은 브라우저 보안상 불가능합니다)
        function fitArticleFrame() {
            const wrap = document.getElementById('articleWrap');
            const frame = document.getElementById('articleFrame');
            if (!wrap || !frame) return;
            const w = wrap.clientWidth, h = wrap.clientHeight;
            if (!w || !h) return;
            const fontFactor = currentFontSizePx / 16;
            let shown, virtualWidth;
            if (articleWide) {
                shown = Math.max(200, w - 32);
                virtualWidth = Math.max(shown, ARTICLE_BASE_WIDTH) / fontFactor;
            } else {
                shown = Math.max(200, Math.min(READ_WIDTH, w - 48));
                virtualWidth = Math.max(shown, 360) / fontFactor;
            }
            const scale = shown / virtualWidth;
            frame.style.left = Math.round((w - shown) / 2) + 'px';
            frame.style.width = virtualWidth + 'px';
            frame.style.height = (h / scale) + 'px';
            frame.style.transform = 'scale(' + scale + ')';
        }

        function selectNews(id, silent) {
            selectedNewsId = id;
            const news = newsData.find(n => n.id === id);
            if (currentCategory === '범죄 다발 지역') {
                if (selectedHotspotRegion) {
                    // 다발 지역에서 고른 지역의 기사: 목록은 그대로 두고 가운데에 기사만 엶
                    hotspotArticleOpen = true;
                } else {
                    currentCategory = 'all'; currentSub = null;
                    renderCategoryBar();
                }
                updateMapMarkers();
            }
            renderNewsList();
            renderDetailView(id);
            if (news && map && hasCoords(news)) {
                map.flyTo([news.lat, news.lng], silent ? Math.min(map.getZoom(), 11) : 14, { duration: 1.2 });
            }
        }

        // ================= 필터 =================
        function setCategoryFilter(cat) {
            currentCategory = cat;
            currentSub = null;
            selectedHotspotRegion = null;
            hotspotArticleOpen = false;
            renderLimit = 100;
            renderCategoryBar();
            updateMapMarkers();
            if (cat === '범죄 다발 지역') {
                renderNewsList();
                renderCrimeHotspotsView();
            } else {
                renderNewsList();
                const f = getFilteredNews();
                if (f.length > 0) selectNews(f[0].id, true);
                else setDetailHTML('<div class="text-center py-20 text-slate-400 text-xs">조건에 맞는 기사가 없습니다.</div>');
            }
        }

        function setSubFilter(sub) {
            currentSub = sub;
            selectedHotspotRegion = null;
            renderLimit = 100;
            renderCategoryBar();
            updateMapMarkers();
            renderNewsList();
            const f = getFilteredNews();
            if (f.length > 0) selectNews(f[0].id, true);
        }

        function filterByRegion() {
            renderLimit = 100;
            renderCategoryBar();
            renderNewsList();
            updateMapMarkers();
            const f = getFilteredNews();
            if (f.length > 0) selectNews(f[0].id, true);
        }

        function getFilteredNews(ignoreCategory = false, ignoreDate = false) {
            const sido = document.getElementById('sidoSelect').value;
            const sigungu = document.getElementById('sigunguSelect').value;
            const dong = document.getElementById('dongSelect').value;

            return newsData.filter(news => {
                const loc = news.location || '';
                if (selectedHotspotRegion && !ignoreCategory) return inLast7(news) && loc.includes(selectedHotspotRegion);
                if (ignoreDate ? !inLast7(news) : !inPeriod(news)) return false;

                if (!ignoreCategory && currentCategory !== 'all' && currentCategory !== '범죄 다발 지역') {
                    if (groupOf(news) !== currentCategory) return false;
                    if (currentSub && news.category !== currentSub) return false;
                }

                if (sido !== 'all') {
                    if (!loc.includes(sido)) return false;
                    if (sigungu !== 'all' && sigungu !== '전체') {
                        const city = sigungu.split(' ')[0];
                        const okSigungu = loc.includes(sigungu) || (sigungu.includes(' ') && loc.split(' ').pop() === city);
                        if (!okSigungu) return false;
                        if (dong !== 'all' && dong !== '전체') {
                            const cleanDong = dong.split('(')[0].trim();
                            if (!(loc.includes(cleanDong) || loc.includes(dongStem(cleanDong)))) return false;
                        }
                    }
                }
                return true;
            });
        }

        // ================= 우리 동네 사건사고 알림 =================
        // 새 기사가 들어왔을 때 '알림 지역'에 해당하면 지도 오른쪽 아래에 알림 창을 띄우고 소리를 냅니다.
        const ALERT_SOUNDS = { dingdong: '띵동', bell: '종소리', siren: '경보음', none: '소리 없음' };
        let alertCfg = (() => {
            const base = { enabled: true, sound: 'dingdong', volume: 70, scope: 'sigungu', region: null, useLocation: false, radiusKm: 5 };
            try { return Object.assign(base, JSON.parse(localStorage.getItem('alert_cfg') || '{}')); } catch (e) { return base; }
        })();
        let alertSeenIds = null;      // 이미 본 기사 번호 (처음 불러올 때는 알림을 띄우지 않음)
        let alertAudioCtx = null;
        let alertSeenEvents = new Set();
        let alertHere = null;         // 현재 위치 { lat, lng, sido, sigungu, ts }
        let alertHereMsg = '';
        let alertHereTimer = null, alertSummaryArea = '';

        function saveAlertCfg() { try { localStorage.setItem('alert_cfg', JSON.stringify(alertCfg)); } catch (e) {} }
        function alertRegion() {
            if (alertCfg.region && alertCfg.region.sido) return alertCfg.region;
            if (typeof myTown !== 'undefined' && myTown) return { sido: myTown.sido, sigungu: myTown.sigungu, dong: myTown.dong };
            return null;
        }
        function alertRegionText() {
            const r = alertRegion();
            if (!r) return '아직 정하지 않음';
            return [r.sido, r.sigungu, (alertCfg.scope === 'dong' ? r.dong : '')].filter(Boolean).join(' ');
        }
        function matchAlertRegion(news) {
            const r = alertRegion();
            if (!r) return false;
            const loc = news.location || '';
            if (!loc.includes(r.sido)) return false;
            if (r.sigungu) {
                const city = r.sigungu.split(' ')[0];
                if (!(loc.includes(r.sigungu) || (r.sigungu.includes(' ') && loc.split(' ').pop() === city))) return false;
            }
            if (alertCfg.scope === 'dong' && r.dong) {
                if (!(loc.includes(r.dong) || loc.includes(dongStem(r.dong)))) return false;
            }
            return true;
        }

        // 새로 들어온 기사 확인 (loadIncidentsFromJSON 에서 호출)
        // ---- 현재 위치 기반 알림 ----
        function distKm(lat1, lng1, lat2, lng2) {
            const dy = (lat1 - lat2) * 111, dx = (lng1 - lng2) * 88;
            return Math.sqrt(dx * dx + dy * dy);
        }
        function hereText() {
            if (!alertHere) return '';
            return [alertHere.sido, alertHere.sigungu].filter(Boolean).join(' ');
        }
        function matchHere(news) {
            if (!alertCfg.useLocation || !alertHere) return false;
            if (groupOf(news) === '해외·안보') return false;
            const loc = news.location || '';
            if (alertHere.sigungu && loc.includes(alertHere.sido)) {
                const city = alertHere.sigungu.split(' ')[0];
                if (loc.includes(alertHere.sigungu) || (alertHere.sigungu.includes(' ') && loc.split(' ').pop() === city)) return true;
            }
            // 시·군·구 이름이 달라도 반경 안이면 알림 (시·도만 알려진 기사는 위치가 부정확하므로 제외)
            return hasCoords(news) && loc.includes(' ') && distKm(news.lat, news.lng, alertHere.lat, alertHere.lng) <= alertCfg.radiusKm;
        }
        // 현재 위치 다시 확인 (5분마다 + 설정을 켤 때)
        function refreshHere(after) {
            if (!alertCfg.useLocation) return;
            if (!navigator.geolocation) { alertHereMsg = '이 기기(브라우저)는 위치 확인을 지원하지 않습니다.'; return; }
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude, lng = pos.coords.longitude;
                const near = nearestSigungu(lat, lng, 1)[0];
                if (!near || near.dist > 60) { alertHere = null; alertHereMsg = '대한민국 밖에서는 현재 위치 알림을 쓸 수 없습니다.'; }
                else { alertHere = { lat: lat, lng: lng, sido: near.sido, sigungu: near.sigungu, ts: Date.now() }; alertHereMsg = ''; }
                updateAlertButton();
                const p = document.getElementById('alertPanel');
                if (p && !p.classList.contains('hidden')) renderAlertPanel();
                if (typeof after === 'function') after();
            }, err => {
                alertHereMsg = (err && err.code === 1) ? '위치 권한이 거부되었습니다. 주소창의 자물쇠 아이콘에서 위치를 허용해 주세요.' : '현재 위치를 확인하지 못했습니다.';
                const p = document.getElementById('alertPanel');
                if (p && !p.classList.contains('hidden')) renderAlertPanel();
            }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 240000 });
        }
        // 지역이 바뀌었을 때(또는 처음) 최근 6시간 사건을 한 번 알려줌
        function showHereSummary() {
            if (!alertCfg.enabled || !alertCfg.useLocation || !alertHere) return;
            const area = hereText();
            if (area === alertSummaryArea) return;
            alertSummaryArea = area;
            const since = Date.now() / 1000 - 6 * 3600;
            const recent = groupEvents(newsData.filter(n => n.timestamp >= since && matchHere(n))).map(ev => ev.lead);
            if (recent.length === 0) return;

                head: '📍 현재 계신 지역에서 사건사고가 발생했어요', badge: area + ' · 최근 6시간 ' + recent.length + '건',

        function startHereWatch() {

        // 새로 들어온 기사 확인 (loadIncidentsFromJSON 에서 호출)
        function checkNewIncidents(list) {
            if (alertSeenIds === null) { alertSeenIds = new Set(list.map(n => n.id)); alertSeenEvents = new Set(list.map(evOf)); return; }
            const newArticles = list.filter(n => !alertSeenIds.has(n.id));
            newArticles.forEach(n => alertSeenIds.add(n.id));
            const fresh = [];                      // 같은 사건의 후속 기사는 다시 알리지 않음
            newArticles.forEach(n => { if (!alertSeenEvents.has(evOf(n))) { alertSeenEvents.add(evOf(n)); fresh.push(n); } });

            const here = fresh.filter(matchHere);

        // 알림 소리 (별도 음원 파일 없이 브라우저가 직접 소리를 만듭니다)
        function ensureAudio() {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                if (!alertAudioCtx) alertAudioCtx = new AC();
                if (alertAudioCtx.state === 'suspended') alertAudioCtx.resume();
                return alertAudioCtx;
            } catch (e) { return null; }
        }
        function playAlertSound(name, volume) {
            const kind = name || alertCfg.sound;
            if (kind === 'none') return;
            const ctx = ensureAudio();
            if (!ctx) return;
            const vol = Math.max(0, Math.min(1, (volume == null ? alertCfg.volume : volume) / 100));
            if (vol === 0) return;
            const tone = (freq, start, dur, type) => {
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = type || 'sine';
                osc.frequency.value = freq;
                const t0 = ctx.currentTime + start;
                gain.gain.setValueAtTime(0.0001, t0);
                gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol * 0.5), t0 + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(t0); osc.stop(t0 + dur + 0.05);
            };
            if (kind === 'dingdong') { tone(880, 0, 0.45); tone(660, 0.35, 0.7); }
            else if (kind === 'bell') { tone(1318, 0, 1.2); tone(1976, 0, 0.8); tone(2637, 0, 0.5); }
            else if (kind === 'siren') { for (let i = 0; i < 6; i++) tone(i % 2 ? 980 : 720, i * 0.18, 0.18, 'square'); }
        }

        function setAlertCfg(key, value) { alertCfg[key] = value; saveAlertCfg(); if (key === 'scope' || key === 'enabled' || key === 'useLocation') renderAlertPanel(); updateAlertButton(); }
        function setAlertRegionFromTown() {

        // ================= 우리동네 커뮤니티 =================
        // 서버(Firebase)가 연결되어 있으면 같은 동네 사람들과 실시간으로 글·사진·동영상을 주고받고,
        // 연결 전에는 '체험 모드'로 이 기기에만 저장됩니다. (맨 위 FIREBASE_CONFIG 참고)
        const SIDO_ALIASES = {
            '서울특별시': ['서울'], '부산광역시': ['부산'], '대구광역시': ['대구'], '인천광역시': ['인천'], '광주광역시': ['광주'],
            '대전광역시': ['대전'], '울산광역시': ['울산'], '세종특별자치시': ['세종'], '경기도': ['경기'],

        };
        const TOWN_VALID_DAYS = 30;
        const COMM_EMOJIS = ['🙂', '😀', '😎', '🐶', '🐱', '🐻', '🦊', '🐰', '🌳', '🌸', '⭐', '🏠'];

        let myTown = null;            // { sido, sigungu, dong, verifiedAt }

        let commDb = null, commReady = null, commAttach = null, commLoadedOnce = false, commHeartbeat = null;
        let commCands = [], commFound = null, commEditEmoji = null;

        function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
        function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
        const COMM_UID = (() => {

        let commBg = lsGet('comm_bg') || '';

        // 개포1동 → 개포동 (같은 이름의 1동·2동은 하나의 동네로 묶음)
        function communityDong(d) {
            const m = d.match(/^([가-힣]+?)(?=\d|제\d)/);
            return m ? m[1] + d.slice(-1) : d;
        }
        function townDongs(sido, sigungu) {
            const list = (regionHierarchy[sido] && regionHierarchy[sido][sigungu]) || [];
            const out = [];

            return out;

        function townKey(t) { return [t.sido, t.sigungu, t.dong].join('_').replace(/[\s\/.#$\[\]]/g, ''); }
        function townName(t) { return t.sido + ' ' + t.sigungu + ' ' + t.dong; }

        function timeAgo(ts) {

        // ---- 저장소 (Firebase 또는 체험 모드) ----
        const loadedScripts = {};
        function loadScript(src) {

                    const s = document.createElement('script');
                    s.src = src; s.onload = res; s.onerror = () => rej(new Error('불러오기 실패: ' + src));
                    document.head.appendChild(s);
                });
            }
            return loadedScripts[src];
        }
        const FB_VER = 'https://www.gstatic.com/firebasejs/10.12.2/';

                if (!FIREBASE_CONFIG) return null;
                await loadScript(FB_VER + 'firebase-app-compat.js');
                await loadScript(FB_VER + 'firebase-firestore-compat.js');
                firebase.initializeApp(FIREBASE_CONFIG);
                commDb = firebase.firestore();
                return commDb;
            })().catch(e => { console.error(e); commDb = null; return null; });
            return commReady;

        function commDoc(key) { return commDb.collection('communities').doc(key); }
        function commCol(key) { return commDoc(key).collection('messages'); }
        function commLocalRead(key) { try { return JSON.parse(lsGet('comm_msgs_' + key) || '[]'); } catch (e) { return []; } }
        function commLocalWrite(key, list) {

            if (!lsSet('comm_msgs_' + key, JSON.stringify(slim))) {

        async function commSubscribe() {

                    if (commLoadedOnce) {

                            const m = ch.doc.data();

                        });

                commUnsubMembers = commDoc(key).collection('members').orderBy('lastSeen', 'desc').limit(200).onSnapshot(snap => {
                    commMembers = snap.docs.map(d => Object.assign({ uid: d.id }, d.data()));

        // 접속 표시: 내 프로필과 마지막 접속 시각을 동네 명단에 기록
        async function commTouch() {
            if (!myTown) return;
            const me = { uid: COMM_UID, nick: myNick(), emoji: commProfile.emoji || '🙂', intro: commProfile.intro || '', joinedAt: commProfile.joinedAt || Date.now(), lastSeen: Date.now() };
            const db = await commInit();
            if (db) { try { await commDoc(townKey(myTown)).collection('members').doc(COMM_UID).set(me, { merge: true }); } catch (e) { console.error(e); } }
            else { commMembers = [me]; renderCommMembers(); }
        }

        // 사진은 줄여서 글과 함께 저장, 동영상은 Firebase Storage 에 올림
        function compressImage(file, maxSide, maxBytes) {
            return new Promise((res, rej) => {
                const r = new FileReader();
                r.onerror = rej;
                r.onload = () => {
                    const img = new Image();
                    img.onerror = rej;
                    img.onload = () => {
                        let side = maxSide, q = 0.8, out = '';
                        for (let i = 0; i < 7; i++) {
                            const sc = Math.min(1, side / Math.max(img.width, img.height));
                            const c = document.createElement('canvas');
                            c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
                            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                            out = c.toDataURL('image/jpeg', q);
                            if (out.length * 0.75 <= maxBytes) break;
                            q = Math.max(0.4, q - 0.1); side = Math.round(side * 0.8);
                        }
                        res(out);
                    };
                    img.src = r.result;
                };
                r.readAsDataURL(file);
            });
        }
        async function commUploadVideo(file) {
            await loadScript(FB_VER + 'firebase-storage-compat.js');
            const safe = (file.name || 'video').replace(/[^0-9A-Za-z._-]/g, '_').slice(-40);
            const ref = firebase.storage().ref('communities/' + townKey(myTown) + '/' + COMM_UID + '_' + Date.now() + '_' + safe);
            await ref.put(file);
            return await ref.getDownloadURL();
        }
        async function commPickFile(input) {
            const f = input.files && input.files[0];
            input.value = '';
            if (!f) return;
            if (f.type.indexOf('image/') === 0) {
                try { commAttach = { kind: 'img', dataUrl: await compressImage(f, 1280, 550 * 1024), name: f.name }; }
                catch (e) { commStatus('사진을 읽지 못했습니다.'); return; }
            } else if (f.type.indexOf('video/') === 0) {
                if (f.size > VIDEO_MAX_MB * 1024 * 1024) { commStatus('동영상은 ' + VIDEO_MAX_MB + 'MB 이하만 올릴 수 있습니다.'); return; }
                commAttach = { kind: 'video', file: f, name: f.name, preview: URL.createObjectURL(f) };
            } else { commStatus('사진 또는 동영상 파일만 올릴 수 있습니다.'); return; }
            renderCommComposer();
        }
        function commClearAttach() { commAttach = null; renderCommComposer(); }

        async function commPost() {
            const input = document.getElementById('commText');
            const text = (input.value || '').trim();
            if (!myTown) return;
            if (!text && !commAttach) { commStatus('내용을 입력하거나 사진·동영상을 첨부해 주세요.'); return; }
            if (text.length > 500) { commStatus('500자 이내로 적어 주세요.'); return; }
            const msg = { nick: myNick(), emoji: commProfile.emoji || '🙂', text: text, type: commType, ts: Date.now(), uid: COMM_UID, town: myTown.dong };
            if (commType === 'report') {
                msg.kind = (document.getElementById('commKind') || {}).value || '기타';
                msg.place = (((document.getElementById('commPlace') || {}).value) || '').trim().slice(0, 60);
            }
            const key = townKey(myTown);
            try {
                const db = await commInit();
                if (commAttach && commAttach.kind === 'img') msg.img = commAttach.dataUrl;
                if (commAttach && commAttach.kind === 'video') {
                    if (db) {
                        commStatus('동영상을 올리는 중입니다...');
                        try { msg.video = await commUploadVideo(commAttach.file); }
                        catch (e) { console.error(e); commStatus('동영상 올리기에 실패했습니다. (Firebase Storage 설정이 필요합니다)'); return; }
                    } else { msg.video = commAttach.preview; msg.videoLocal = true; }
                }
                if (db) await commCol(key).add(msg);
                else {
                    msg.id = 'l' + Date.now() + Math.random().toString(36).slice(2, 7);
                    commMessages.unshift(msg);
                    commLocalWrite(key, commMessages);
                }
                input.value = '';
                commAttach = null;
                if (commType === 'sos') commType = 'talk';
                renderCommComposer();
                renderCommMessages(true);
                commStatus('');
            } catch (e) { console.error(e); commStatus('등록에 실패했습니다. 잠시 후 다시 시도해 주세요.'); }
        }

        async function commDelete(id) {
            if (!myTown || !confirm('이 글을 삭제할까요?')) return;
            const key = townKey(myTown);
            try {
                const db = await commInit();
                if (db) await commCol(key).doc(id).delete();
                else { commMessages = commMessages.filter(m => m.id !== id); commLocalWrite(key, commMessages); renderCommMessages(); }
            } catch (e) { console.error(e); commStatus('삭제에 실패했습니다.'); }
        }

        // ---- 화면 ----
        function commStatus(msg) { const el = document.getElementById('commStatus'); if (el) el.textContent = msg || ''; }
        function openCommunity(type) {
            if (type) { commTab = 'talk'; commType = type; marketOpen = null; marketForm = false; }   // 예: openCommunity('report') → 제보 쓰기
            document.getElementById('communityModal').classList.remove('hidden');
            renderCommunity();
            commTouch();
        }
        function closeCommunity() { document.getElementById('communityModal').classList.add('hidden'); closeProfile(); }

        function activeSosCount() {
            return commMessages.filter(m => m.type === 'sos' && Date.now() - m.ts < 86400000).length;
        }
        function updateCommBadge() {
            const b = document.getElementById('commBadge');
            if (!b) return;
            const n = activeSosCount();
            b.textContent = 'SOS ' + n;
            if (n > 0) b.classList.remove('hidden'); else b.classList.add('hidden');
        }

        function renderCommunity() {
            const body = document.getElementById('commBody');
            const title = document.getElementById('commTitle');
            if (!myTown) {
                title.textContent = '우리동네 커뮤니티';
                body.innerHTML = `
                    <div class="p-6 space-y-4 overflow-y-auto custom-scrollbar">
                        <div class="rounded-xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800 p-4 text-sm text-slate-700 dark:text-slate-200 leading-relaxed">
                            <b>동네 인증</b>을 하면 우리 동(洞) 이웃끼리 사건·사고를 제보·공유하고, 아이를 잃어버렸을 때처럼 급한 일에는 <b class="text-red-600">SOS</b>를 보낼 수 있습니다.<br>
                            <span class="text-xs text-slate-500">예) 개포1동에 살면 ‘개포동’ 전체 이웃이 함께 보는 게시판에 들어갑니다. 위치는 동네 확인에만 쓰이고 저장되지 않습니다.</span>
                        </div>
                        <button onclick="verifyTown()" id="commVerifyBtn" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold shadow"><i class="fa-solid fa-location-crosshairs"></i> 현재 위치로 동네 인증하기</button>
                        <p id="commStatus" class="text-xs text-amber-600 dark:text-amber-400"></p>
                        <div id="commConfirm"></div>
                    </div>`;
                return;
            }
