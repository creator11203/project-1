            evs.sort((a, b) => (b.items.length - a.items.length) || (b.lead.timestamp - a.lead.timestamp));
            const top = evs.slice(0, 10);
            if (top.length === 0) { track.innerHTML = ''; track.dataset.sig = ''; return; }
            // 헤드라인 순위가 그대로면 애니메이션을 건드리지 않음 (글씨 크기·창 크기를 바꿔도 처음부터 다시 시작하지 않고 계속 흐름)
            const sig = top.map(ev => ev.lead.id + ':' + ev.items.length).join(',');
            if (track.dataset.sig === sig && track.style.animation) return;
            track.dataset.sig = sig;
            // 1위 → 10위 순서로 왼쪽으로 흐르고, 10위 바로 뒤에 다시 1위가 이어짐 (같은 목록을 두 번 붙여 끊김 없이 반복)
            //   헤드라인만 빠르게 전하도록 지역·기사 개수 표시는 넣지 않음
            const one = top.map((ev, i) => `
                <button onclick="openHeadline(${ev.lead.id})" class="inline-flex items-center gap-1.5 pl-3 pr-4 text-xs text-slate-800 dark:text-slate-100 hover:text-red-500">
                    <span class="min-w-[1.25rem] h-[1.125rem] px-1 rounded bg-red-600 text-white text-[0.6875rem] font-black inline-flex items-center justify-center shadow-sm shadow-red-600/40">${i + 1}</span>
                    ${isOverseas(ev.lead) ? '<span class="px-1 py-0.5 rounded bg-zinc-700 text-white text-[0.625rem] font-bold">해외</span>' : ''}
                    <b>${esc(ev.lead.title)}</b>
                </button><span class="text-slate-300 dark:text-slate-600 select-none">|</span>`).join('');
            track.innerHTML = `<span class="inline-flex items-center">${one}</span><span class="inline-flex items-center" aria-hidden="true">${one}</span>`;
            const half = (track.scrollWidth / 2) || top.length * 320;
            track.style.animation = 'none';
            void track.offsetWidth;
            track.style.animation = 'ticker-loop ' + Math.max(20, Math.round(half / 70)) + 's linear infinite';
        }
        function openHeadline(id) {
            const n = newsData.find(x => x.id === id);
            if (!n) return;
            currentCategory = 'all'; currentSub = null; selectedHotspotRegion = null; hotspotArticleOpen = false;
            showInFilter(n);
            selectedDate = dateKey(n.timestamp); dateFollowToday = (selectedDate === todayKey());
            renderCategoryBar(); updateMapMarkers();
            selectNews(id);
        }

        // ================= 지도 =================
        const KOREA_VIEW = { center: [36.2, 127.8], zoom: 7 };
        const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
        const ESRI_ATTR = 'Tiles &copy; <a href="https://www.esri.com/">Esri</a>';
        // 지도 모양. 'auto' 는 화면이 다크모드면 어두운 지도, 아니면 기본 지도를 씁니다.
        // ※ 예전에 쓰던 CARTO 지도는 2025년부터 API 키가 없으면 'API KEY REQUIRED' 그림만 내려 줘서 지도가 보이지 않았습니다.
        //   그래서 API 키가 필요 없는 지도(OpenStreetMap · Esri)로 바꿨습니다. 한 지도 서버가 막히면 자동으로 다른 서버로 넘어갑니다.
        const MAP_STYLES = {
            auto: { name: '지도: 자동' },
            voyager: { name: '지도: 기본(한글 지명)', url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attr: OSM_ATTR, maxZoom: 19 },
            light: { name: '지도: 밝게', url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attr: OSM_ATTR, maxZoom: 19, cls: 'tiles-light' },
            dark: { name: '지도: 어둡게', url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', attr: OSM_ATTR, maxZoom: 19, cls: 'tiles-dark' },
            street: { name: '지도: 도로 중심(Esri)', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', attr: ESRI_ATTR, maxZoom: 19 },
            gray: { name: '지도: 어두운 회색(Esri)', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', attr: ESRI_ATTR, maxZoom: 16 },
            sat: { name: '지도: 위성 사진', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', attr: ESRI_ATTR, maxZoom: 19 }
        };
        const MAP_FALLBACK = { voyager: 'street', light: 'street', dark: 'gray', street: 'voyager', gray: 'dark', sat: 'voyager' };
        let mapStyle = 'auto', baseLayer = null, safetyLayer = null, myLocLayer = null, mapFallbackUsed = {};
        try {
            mapStyle = localStorage.getItem('map_style') || 'auto';
            if (mapStyle === 'osm') mapStyle = 'voyager';
            if (!MAP_STYLES[mapStyle]) mapStyle = 'auto';
        } catch (e) {}

        function applyMapStyle(forceKey) {
            if (!map) return;
            const key = forceKey || (mapStyle === 'auto' ? (document.documentElement.classList.contains('dark') ? 'dark' : 'voyager') : mapStyle);
            const st = MAP_STYLES[key];
            if (baseLayer) map.removeLayer(baseLayer);
            baseLayer = L.tileLayer(st.url, { maxZoom: 19, maxNativeZoom: st.maxZoom || 19, attribution: st.attr, className: st.cls || '', crossOrigin: false }).addTo(map);
            baseLayer.bringToBack();
            // 지도 조각이 연달아 실패하면(서버 장애·차단) 다른 지도 서버로 자동 전환
            let fails = 0, oks = 0;
            baseLayer.on('tileload', () => { oks++; });
            baseLayer.on('tileerror', () => {
                fails++;
                if (fails >= 6 && oks < 2 && MAP_FALLBACK[key] && !mapFallbackUsed[key]) {
                    mapFallbackUsed[key] = true;
                    console.warn('지도 서버 응답 없음 → 다른 지도로 전환:', key, '→', MAP_FALLBACK[key]);
                    applyMapStyle(MAP_FALLBACK[key]);
                }
            });
        }
        function setMapStyle(v) { mapStyle = MAP_STYLES[v] ? v : 'auto'; try { localStorage.setItem('map_style', mapStyle); } catch (e) {} applyMapStyle(); }

        function makeMarkersLayer() {
            if (!L.markerClusterGroup) return L.layerGroup();      // 플러그인을 못 불러온 경우: 묶지 않고 그대로 표시
            return L.markerClusterGroup({
                maxClusterRadius: 46, disableClusteringAtZoom: 13, showCoverageOnHover: false, spiderfyOnMaxZoom: true, chunkedLoading: true,
                iconCreateFunction: c => {
                    const n = c.getChildCount();
                    const size = n < 10 ? 34 : (n < 50 ? 42 : (n < 200 ? 50 : 58));
                    const color = n < 10 ? '#f59e0b' : (n < 50 ? '#f97316' : (n < 200 ? '#ef4444' : '#b91c1c'));
                    return L.divIcon({ className: '', html: `<div class="cluster-bubble" style="width:${size}px;height:${size}px;background:${color};font-size:${n < 100 ? 13 : 11}px;">${n}</div>`, iconSize: [size, size] });
                }
            });
        }

        function initMap() {
            map = L.map('map', { zoomControl: true, worldCopyJump: true }).setView(KOREA_VIEW.center, KOREA_VIEW.zoom);
            // 지도를 칸에 넣지 않아 화면에 없을 때(크기 0) 이동 애니메이션을 하면 오류가 나서, 그때는 위치만 바로 맞춰 둠
            const flyRaw = map.flyTo.bind(map);
            map.flyTo = (c, z, o) => { const s = map.getSize(); if (!s.x || !s.y) { try { map.setView(c, z, { animate: false }); } catch (e) {} return map; } return flyRaw(c, z, o); };
            L.control.scale({ imperial: false }).addTo(map);
            applyMapStyle();
            markersLayer = makeMarkersLayer().addTo(map);
            map.on('popupclose moveend zoomend dragend', () => setTimeout(flushPendingMarkers, 400));
            safetyLayer = L.layerGroup().addTo(map);
            myLocLayer = L.layerGroup().addTo(map);
            map.on('zoomend', drawMyLoc);
            drawMyLoc();
            initStationLayer();
            const sel = document.getElementById('mapStyleSelect');
            if (sel) { sel.innerHTML = Object.keys(MAP_STYLES).map(k => `<option value="${k}">${MAP_STYLES[k].name}</option>`).join(''); sel.value = mapStyle; }
            renderMapLegend();
            updateMapMarkers();
        }
        // ================= 경찰서·소방서 항상 표시 =================
        // 기본 지도(OpenStreetMap)는 확대하면 병원(H)은 잘 보이지만 경찰서·소방서는 거의 안 보여서,
        // 지도를 어느 곳으로 옮기든 확대(13단계 이상)하면 그 화면 안의 경찰서·지구대·파출소(🚓 파랑)와 소방서·119안전센터(🚒 빨강)를 따로 그려 줍니다.
        // 공개 지도 데이터(Overpass)를 0.1도 칸 단위로 한 번만 받아 기억해 두고, 같은 곳을 다시 볼 때는 다시 묻지 않습니다.
        const STATION_MIN_ZOOM = 14, STATION_CELL = 0.1;
        const STATION_KINDS = {
            police: { icon: '🚓', label: '경찰', color: '#1d4ed8', bg: '#dbeafe' },
            fire: { icon: '🚒', label: '소방', color: '#dc2626', bg: '#fee2e2' }
        };
        let stationLayer = null, stationTimer = null, stationBusy = false, stationCtl = null;
        let stationOn = (() => { try { return localStorage.getItem('station_on') !== '0'; } catch (e) { return true; } })();
        const stationCells = new Set();          // 이미 받아 온 칸
        const stationSeen = new Set();           // 이미 그린 시설 (중복 방지)
        function stationIcon(kind) {
            const k = STATION_KINDS[kind];
            return L.divIcon({ className: '', html: `<div class="station-pin" style="border-color:${k.color};background:${k.bg};"><span>${k.icon}</span></div>`, iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -12] });
        }
        function initStationLayer() {
            stationLayer = L.layerGroup();
            const Ctl = L.Control.extend({
                options: { position: 'topleft' },
                onAdd() {
                    const b = L.DomUtil.create('button', 'station-toggle leaflet-bar');
                    b.type = 'button';
                    L.DomEvent.disableClickPropagation(b);
                    b.onclick = () => { stationOn = !stationOn; try { localStorage.setItem('station_on', stationOn ? '1' : '0'); } catch (e) {} syncStationLayer(); };
                    this._b = b; return b;
                }
            });
            stationCtl = new Ctl().addTo(map);
            map.on('moveend zoomend', () => { clearTimeout(stationTimer); stationTimer = setTimeout(syncStationLayer, 150); });   // 목록 파일이 있으면 즉시(0.15초) 표시
            syncStationLayer();
            // 지도를 확대하기 전에 미리 목록(stations.json)을 받아 둠 → 확대하는 순간 '찾는 중' 없이 바로 표시
            if (stationOn) setTimeout(() => { if (stationDB === undefined) loadStationDB(true); }, 800);
        }
        function syncStationLayer() {
            if (!map || !stationLayer) return;
            const zoomOk = map.getZoom() >= STATION_MIN_ZOOM;
            const show = stationOn && zoomOk;
            if (stationCtl && stationCtl._b) {
                const b = stationCtl._b;
                const busyNow = stationOn && zoomOk && stationBusy;
                b.innerHTML = busyNow ? '<span class="busy-spin"></span><span class="busy-dots">경찰·소방 찾는 중</span>'
                    : `🚓🚒 <span>${stationOn ? (zoomOk ? '경찰·소방 표시 완료' : '확대하면 경찰·소방 표시') : '경찰·소방 숨김'}</span>`;
                b.classList.toggle('busy', busyNow);
                b.classList.toggle('done', stationOn && zoomOk && !stationBusy);
                b.title = stationOn ? '누르면 경찰서·소방서 표시를 끕니다' : '누르면 경찰서·소방서를 지도에 표시합니다 (확대했을 때)';
                b.classList.toggle('off', !stationOn);
            }
            if (!show) { if (map.hasLayer(stationLayer)) map.removeLayer(stationLayer); return; }
            if (!map.hasLayer(stationLayer)) stationLayer.addTo(map);
            // ① 수집기(scraper.py)가 미리 모아 둔 전국 경찰·소방 목록(stations.json)이 있으면 그걸로 즉시 표시 — 공개 지도 서버(Overpass)는 자주 붐비거나 멈춰서
            //    '찾는 중'이 몇십 초씩 걸렸음(실제로 502·504·무응답). 파일은 사이트와 같은 곳에 있어 서버를 기다릴 일이 없음
            if (stationDB === undefined) { loadStationDB(); return; }
            if (stationDB === null) return;
            if (Array.isArray(stationDB)) {
                const bb = map.getBounds().pad(0.25);
                stationDB.forEach(r => { if (!stationSeen.has(r.id) && bb.contains([r.lat, r.lng])) stnAdd(r); });
                return;
            }
            // ② 파일이 아직 없으면 예전처럼 공개 지도 서버에 물음
            // 화면 안에서 아직 안 받아 온 칸을 찾음. 이 기기에 저장해 둔 칸(7일)은 서버에 묻지 않고 바로 그림 → 두 번째부터는 거의 즉시 표시
            const bd = map.getBounds(), c = STATION_CELL;
            const need = [];
            for (let la = Math.floor(bd.getSouth() / c); la <= Math.floor(bd.getNorth() / c); la++)
                for (let ln = Math.floor(bd.getWest() / c); ln <= Math.floor(bd.getEast() / c); ln++) {
                    const key = la + ',' + ln;
                    if (stationCells.has(key)) continue;
                    const cached = stnCacheGet(key);
                    if (cached) { cached.forEach(stnAdd); stationCells.add(key); continue; }
                    need.push([la, ln]);
                }
            if (!need.length || stationBusy || need.length > 40 || Date.now() < stationCool) return;
            // 지도 가운데에 가까운 칸부터 최대 3칸씩 나눠서 물음 → 한 번에 큰 영역을 묻던 때보다 서버 응답이 훨씬 빠르고, 가운데 시설이 먼저 보임
            const cx = map.getCenter().lat / c, cy = map.getCenter().lng / c;
            need.sort((p, q) => Math.hypot(p[0] + .5 - cx, p[1] + .5 - cy) - Math.hypot(q[0] + .5 - cx, q[1] + .5 - cy));
            const batch = need.slice(0, 3);
            const q1 = batch.map(x => { const bb = [x[0] * c, x[1] * c, (x[0] + 1) * c, (x[1] + 1) * c].map(v => v.toFixed(3)).join(','); return `nwr["amenity"~"^(police|fire_station)$"](${bb});`; }).join('');
            const query = `[out:json][timeout:12];(${q1});out center tags 400;`;
            const servers = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter', 'https://overpass.private.coffee/api/interpreter'];
            const ctls = [];
            const ask = (url, ms) => new Promise((ok, no) => {
                const ctl = window.AbortController ? new AbortController() : null;
                if (ctl) { ctls.push(ctl); setTimeout(() => ctl.abort(), ms); }
                fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(query), headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, signal: ctl ? ctl.signal : undefined })
                    .then(r => r.ok ? r.json() : Promise.reject(r.status)).then(j => (j && Array.isArray(j.elements)) ? ok(j) : no('bad')).catch(no);
            });
            // 4개 서버에 동시에 묻고 가장 먼저 온 답을 씀. 오래 걸리던 원인: 붐비는 서버가 30초 뒤에야 실패했고, 실패하면 곧바로 같은 요청을 끝없이 반복했음 → 서버당 10초로 줄이고, 모두 실패하면 한 번만 더 시도한 뒤 15초 쉼
            const race = ms => new Promise((ok, no) => { let fails = 0; servers.forEach(u => ask(u, ms).then(ok, () => { if (++fails === servers.length) no('all failed'); })); });
            stationBusy = true; syncStationLabel();
            race(10000).catch(() => race(14000))
                .then(data => {
                    const byCell = {};
                    batch.forEach(x => { byCell[x[0] + ',' + x[1]] = []; });
                    (data.elements || []).forEach(el => {
                        const t = el.tags || {}, kind = t.amenity === 'police' ? 'police' : (t.amenity === 'fire_station' ? 'fire' : null);
                        const lat = el.lat != null ? el.lat : (el.center && el.center.lat), lng = el.lon != null ? el.lon : (el.center && el.center.lon);
                        if (!kind || lat == null || lng == null) return;
                        const rec = { id: el.type + el.id, kind: kind, lat: lat, lng: lng, name: t['name:ko'] || t.name || (kind === 'police' ? '경찰 시설' : '소방 시설'), phone: t.phone || t['contact:phone'] || '' };
                        stnAdd(rec);
                        const ck = Math.floor(lat / c) + ',' + Math.floor(lng / c);
                        if (byCell[ck]) byCell[ck].push(rec);
                    });
                    batch.forEach(x => { const k = x[0] + ',' + x[1]; stationCells.add(k); stnCacheSet(k, byCell[k] || []); });
                })
                .catch(() => { stationCool = Date.now() + 15000; })       // 서버가 모두 바쁘면 15초 뒤 지도를 움직일 때 다시 시도
                .finally(() => { ctls.forEach(x => { try { x.abort(); } catch (e) {} }); stationBusy = false; syncStationLayer(); });
        }
        // 이 기기에 저장해 둔 경찰·소방 시설 (칸 단위, 7일). 서버 응답을 기다리지 않고 바로 지도에 그리기 위함
        const STN_PREFIX = 'stn_v1_', STN_TTL = 7 * 86400000;
        let stationCool = 0;
        let stationDB;     // undefined: 아직 안 불러옴 / null: 불러오는 중 / false: stations.json 없음 / 배열: 전국 목록
        function loadStationDB(quiet) {
            if (stationDB === null) return;
            stationDB = null;
            if (!quiet) { stationBusy = true; syncStationLabel(); }
            fetch('stations.json?v=' + Math.floor(Date.now() / 3600000), { cache: 'default' }).then(r => r.ok ? r.json() : Promise.reject(r.status))
                .then(j => { stationDB = Array.isArray(j) && j.length > 100 ? j.map((a, i) => ({ id: 'd' + i, kind: a[0] === 'f' ? 'fire' : 'police', lat: a[1], lng: a[2], name: a[3] || (a[0] === 'f' ? '소방 시설' : '경찰 시설'), phone: a[4] || '' })) : false; })
                .catch(() => { stationDB = false; })
                .finally(() => { stationBusy = false; syncStationLayer(); });
        }
        function stnCacheGet(key) { try { const v = JSON.parse(localStorage.getItem(STN_PREFIX + key) || 'null'); if (v && Date.now() - v.ts < STN_TTL) return v.r; } catch (e) {} return null; }
        function stnCacheSet(key, r) {
            try { localStorage.setItem(STN_PREFIX + key, JSON.stringify({ ts: Date.now(), r: r })); }
            catch (e) { try { const ks = Object.keys(localStorage).filter(k => k.startsWith(STN_PREFIX)); ks.slice(0, Math.ceil(ks.length / 2)).forEach(k => localStorage.removeItem(k)); } catch (e2) {} }
        }
        function stnAdd(rec) {
            if (stationSeen.has(rec.id)) return;
            stationSeen.add(rec.id);
            const k = STATION_KINDS[rec.kind], kind = rec.kind, name = rec.name, phone = rec.phone, lat = rec.lat, lng = rec.lng;
            L.marker([lat, lng], { icon: stationIcon(kind), zIndexOffset: 1500, title: name })
                .bindTooltip(esc(name), { direction: 'top', offset: [0, -12] })
                .bindPopup(`<div style="font-family:sans-serif;max-width:220px;"><span style="font-size:10px;background:${k.color};color:#fff;padding:2px 6px;border-radius:4px;font-weight:bold;">${k.icon} ${kind === 'police' ? '경찰서·지구대·파출소' : '소방서·119안전센터'}</span><br><b style="font-size:12px;">${esc(name)}</b>${phone ? '<br><a style="font-size:11px;" href="tel:' + esc(phone.replace(/[^0-9+]/g, '')) + '">☎ ' + esc(phone) + '</a>' : ''}<br><span style="font-size:11px;color:#64748b;">긴급 신고는 ${kind === 'police' ? '112' : '119'}</span> · <a style="font-size:11px;" target="_blank" rel="noopener noreferrer" href="https://map.kakao.com/link/to/${encodeURIComponent(name)},${lat},${lng}">길찾기 ↗</a></div>`)
                .addTo(stationLayer);
        }
        function syncStationLabel() { syncStationLayerLabelOnly(); }
        function syncStationLayerLabelOnly() {
            if (!stationCtl || !stationCtl._b) return;
            const b = stationCtl._b;
            b.innerHTML = '<span class="busy-spin"></span><span class="busy-dots">경찰·소방 찾는 중</span>';
            b.classList.add('busy'); b.classList.remove('done');
        }

        // 지도 안내(범례): 지도에 실제로 그려지는 모양 그대로 보여 줌. 접어 둘 수 있고 상태는 기억됨
        let legendOpen = (() => { try { const v = localStorage.getItem('legend_open'); return v === null ? !window.matchMedia('(max-width: 767px)').matches : v !== '0'; } catch (e) { return true; } })();     // 휴대폰에서는 처음에 접어 둠 (지도를 가리지 않게)
        function toggleLegend() { legendOpen = !legendOpen; try { localStorage.setItem('legend_open', legendOpen ? '1' : '0'); } catch (e) {} renderMapLegend(); }
        function renderMapLegend() {
            const lg = document.getElementById('mapLegend');
            if (!lg) return;
            lg.dataset.open = legendOpen ? '1' : '0';
            if (!legendOpen) { lg.innerHTML = safetyLegendHtml() + `<button onclick="toggleLegend()" class="flex items-center gap-1.5 text-xs font-bold text-slate-700 dark:text-slate-200"><i class="fa-solid fa-circle-info text-blue-500"></i><span class="m-hide">지도 보는 법</span><i class="fa-solid fa-chevron-up text-[0.625rem] opacity-60 m-hide"></i></button>`; return; }
            const pin = (cls, size, extra) => `<span class="pin ${cls}" style="display:inline-block;width:${size}px;height:${size}px;background:#ef4444;vertical-align:middle;${extra || ''}"></span>`;
            const bub = (n, size, color) => `<span class="cluster-bubble" style="display:inline-flex;width:${size}px;height:${size}px;background:${color};font-size:10px;border-width:2px;vertical-align:middle;">${n}</span>`;
            const row = (icon, text) => `<div class="flex items-center gap-2"><span class="w-7 flex justify-center shrink-0">${icon}</span><span>${text}</span></div>`;
            const cats = Object.keys(CATEGORY_GROUPS).map(g => `<span class="inline-flex items-center gap-1 whitespace-nowrap"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${CATEGORY_GROUPS[g].color};"></span>${esc(CATEGORY_GROUPS[g].label.replace(/^[^\s가-힣]+\s/, ''))}</span>`).join('');
            lg.innerHTML = safetyLegendHtml() + `
                <div class="flex items-center justify-between gap-3 mb-1.5"><b class="text-xs text-slate-900 dark:text-white"><i class="fa-solid fa-circle-info text-blue-500"></i> 지도 보는 법</b><button onclick="toggleLegend()" title="접기" class="text-slate-400 hover:text-slate-700 dark:hover:text-white"><i class="fa-solid fa-chevron-down"></i></button></div>
                <div class="space-y-1 text-[0.75rem] text-slate-700 dark:text-slate-200">
                    ${row(pin('exact', 16), '<b>동·장소까지</b> 확인된 위치 (정확)')}
                    ${row(pin('', 14, 'box-shadow:0 0 8px #ef4444;'), '<b>시·군·구</b> 단위 위치 (대략)')}
                    ${row(pin('approx', 12, 'box-shadow:0 0 8px #ef4444;'), '<b>시·도</b> 단위 위치 (점선 · 더 대략)')}
                    <div class="flex items-center gap-2 pt-1 border-t border-slate-200 dark:border-slate-700"><span class="flex items-center gap-0.5 shrink-0">${bub(5, 20, '#f59e0b')}${bub(20, 22, '#f97316')}${bub(90, 24, '#ef4444')}${bub('2백', 26, '#b91c1c')}</span></div>
                    <div class="text-[0.6875rem] text-slate-500 dark:text-slate-400 leading-snug">동그라미 숫자 = 그 근처 사건 수 <span class="whitespace-nowrap">(노랑 1~9 · 주황 10~49 · 빨강 50~199 · 진빨강 200+)</span><br>확대하면 사건이 하나씩 보입니다.</div>
                    <details class="pt-1 border-t border-slate-200 dark:border-slate-700"><summary class="cursor-pointer text-[0.6875rem] font-bold text-slate-600 dark:text-slate-300">점 색깔 = 사건 분류 (펼치기)</summary><div class="mt-1 flex flex-wrap gap-x-2 gap-y-0.5 text-[0.6875rem]">${cats}</div></details>
                </div>`;
        }

        // 위치 정밀도: poi(요금소·역 등 장소) > dong(읍·면·동) > sgg(시·군·구) > sido(시·도). scraper.py 가 news.json 에 넣어 줍니다.
        function precOf(n) {
            if (!n || !hasCoords(n)) return null;
            if (n.prec) return n.prec;
            const loc = n.location || '';
            if (loc.startsWith('해외') || loc.startsWith('북한')) return 'world';
            return loc.includes(' ') ? 'sgg' : 'sido';
        }
        // inst = 법원·검찰·경찰청 같은 기관이 있는 곳으로만 잡은 위치 (사건이 실제로 일어난 곳이 아니라서 집계·지도 핀에서 뺌)
        const PREC_RANK = { poi: 4, dong: 3, sgg: 2, road: 1.5, sido: 1, inst: 1, world: 1 };
        const PREC_ZOOM = { poi: 16, dong: 15, sgg: 13, road: 9, sido: 9, inst: 11, world: 5 };
        const PREC_TEXT = { poi: '장소까지 확인', dong: '읍·면·동까지 확인', sgg: '시·군·구 단위(대략)', road: '고속도로 노선 위(구간 미상)', sido: '시·도 단위(대략)', inst: '법원·검찰 등 기관 소재지(사건 장소 아님)', world: '해외(대략)', nation: '전국 단위 소식(특정 지역 사건이 아님)', multi: '여러 지역에 걸친 소식(본문에 나온 지역을 모두 표시)' };

        // ---- 고속도로 노선 (highways.json · scraper.py 와 같은 파일) ----
        //  '호남고속도로 추돌사고'처럼 노선 이름이 있는 기사는 지도에 그 노선을 굵은 선으로 그리고, 노선 전체가 보이게 맞춤.
        //  예전에 모은 기사(route 가 없는 기사)도 제목에서 노선을 찾아, 찍힌 위치가 노선에서 30km 넘게 떨어져 있으면 노선 위로 옮김.
        let HW = {}, hwRx = [], hwLoaded = null, routeLayer = null;
        function loadHighways() {
            if (hwLoaded) return hwLoaded;
            hwLoaded = fetch('highways.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).then(d => {
                HW = {};
                const alts = [];
                Object.keys(d || {}).forEach(k => {
                    const v = d[k];
                    if (k.startsWith('_') || !v || !Array.isArray(v.segs)) return;
                    HW[k] = v;
                    (v.alias || [k]).forEach(a => alts.push([a.length, k, a.includes('고속도로') ? a : a + '\\s*(?:고속도로|고속국도|선\\s*고속도로)']));
                });
                alts.sort((a, b) => b[0] - a[0]);
                hwRx = alts.map(x => [x[1], new RegExp('(?<![가-힣0-9])' + x[2])]);
            }).catch(() => {});
            return hwLoaded;
        }
        function detectRoute(text) {
            let best = null;
            hwRx.forEach(([k, rx]) => { const m = rx.exec(text || ''); if (m && (!best || m.index < best[0])) best = [m.index, k]; });
            return best ? best[1] : null;
        }
        function routeOf(n) { return n && (n.route || n._route) && HW[n.route || n._route] ? (n.route || n._route) : null; }
        function hwNearest(k, lat, lng) {
            let best = null;
            (HW[k] ? HW[k].segs : []).forEach(seg => {
                for (let i = 0; i + 1 < seg.length; i++) {
                    const ax = seg[i][1] * 88, ay = seg[i][0] * 111, bx = seg[i + 1][1] * 88, by = seg[i + 1][0] * 111, px = lng * 88, py = lat * 111;
                    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
                    const t = L2 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / L2)) : 0;
                    const qx = ax + t * dx, qy = ay + t * dy, d = Math.hypot(px - qx, py - qy);
                    if (!best || d < best.d) best = { d: d, lat: qy / 111, lng: qx / 88 };
                }
            });
            return best;
        }
        function hwMiddle(k) {
            const segs = HW[k] ? HW[k].segs : [];
            const seg = segs.slice().sort((a, b) => b.length - a.length)[0];
            return seg ? seg[Math.floor(seg.length / 2)] : null;
        }
        // 예전 기사 위치 바로잡기 (scraper.py 가 route 를 넣기 전에 모은 기사)
        function fixRouteLocation(n) {
            if (!n || n.route || n.group === '해외') return;
            const k = detectRoute(n.title || '');
            if (!k) return;
            n._route = k;
            const near = hasCoords(n) ? hwNearest(k, n.lat, n.lng) : null;
            if (near && near.d <= 30) return;                          // 이미 노선 근처면 그대로
            const mid = hwMiddle(k);
            if (!mid) return;
            n.lat = mid[0]; n.lng = mid[1]; n.prec = 'road'; n.location = HW[k].name || (k + '고속도로');
        }
        // 지도에 노선 그리기 (기사를 고를 때). 다른 기사를 고르면 지움
        function drawRoute(n) {
            if (!map) return null;
            if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
            const k = routeOf(n);
            if (!k) return null;
            const segs = HW[k].segs;
            routeLayer = L.layerGroup([
                L.polyline(segs, { color: '#ffffff', weight: 9, opacity: .85, interactive: false }),
                L.polyline(segs, { color: '#2563eb', weight: 5, opacity: .9, dashArray: null, interactive: false }),
            ]).addTo(map);
            routeLayer._bounds = L.latLngBounds(segs.flat());
            const lbl = L.marker(hwMiddle(k), { interactive: false, icon: L.divIcon({ className: '', html: `<div style="transform:translate(-50%,-140%);white-space:nowrap;background:#2563eb;color:#fff;font:700 11px system-ui,sans-serif;padding:3px 8px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.3)">🛣️ ${esc(HW[k].name || k)}</div>` }) });
            routeLayer.addLayer(lbl);
            return routeLayer._bounds;
        }
        // 같은 사건의 기사들 가운데 위치가 가장 자세한 기사
        function bestLocated(items) {
            let best = null;
            items.forEach(n => { const r = PREC_RANK[precOf(n)] || 0; if (r > 0 && (!best || r > best.r)) best = { n: n, r: r }; });
            return best ? best.n : null;
        }
        // 지도를 그 사건 위치로 이동. 위치가 자세할수록 더 가까이 확대하고, 위치를 모르면 전국 지도를 보여 줍니다.
        function focusMap(n, silent) {
            if (!map) return;
            const sz = map.getSize();
            if (!sz.x || !sz.y) {            // 지도가 화면에 없을 때(창으로 숨겨 둔 경우): 애니메이션 없이 위치만 맞춰 둠
                try { const p0 = precOf(n); if (p0) map.setView([n.lat, n.lng], PREC_ZOOM[p0] || 11, { animate: false }); } catch (e) {}
                return;
            }
            const p = precOf(n);
            const rb = drawRoute(n);
            // 고속도로 노선만 아는 기사: 노선 전체가 보이게 / 노선 위 시·군·구까지 아는 기사: 그 지점으로 가까이
            if (rb && (p === 'road' || !p) && !silent) { map.flyToBounds(rb, { padding: [40, 40], duration: 1.2, maxZoom: 10 }); return; }
            if (!p) { if (!silent) map.flyTo(KOREA_VIEW.center, KOREA_VIEW.zoom, { duration: 1.0 }); return; }
            const z = rb && p === 'sgg' ? 11 : (PREC_ZOOM[p] || 11);
            map.flyTo([n.lat, n.lng], silent ? Math.min(map.getZoom(), Math.min(z, 11)) : z, { duration: 1.2 });
        }

        function updateMapMarkers() {
            if (!markersLayer) return;
            markersLayer.clearLayers();

            if (currentCategory === '범죄 다발 지역') {
                getCrimeHotspotsData().slice(0, 30).forEach((stat, idx) => {     // 지도에는 상위 30곳만 표시 (순위 목록은 전체)
                    let size = Math.min(40, 16 + stat.count * 4);
                    let color = idx === 0 ? '#dc2626' : (idx === 1 ? '#ea580c' : '#f59e0b');
                    const icon = L.divIcon({
                        className: 'hotspot-icon',
                        html: `<div style="background-color: ${color}; width: ${size}px; height: ${size}px; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: bold; box-shadow: 0 0 12px ${color};">${stat.count}</div>`,
                        iconSize: [size, size], iconAnchor: [size / 2, size / 2]
                    });
                    const marker = L.marker([stat.lat, stat.lng], { icon });
                    marker.bindPopup(`<div style="font-family: sans-serif;"><b style="color:#dc2626">TOP ${idx + 1} ${esc(stat.region)}</b><br>관련 건수: <b>${stat.count}건</b></div>`);
                    markersLayer.addLayer(marker);
                });
                return;
            }

            const list = [];
            groupEvents(getFilteredNews()).slice(0, 1200).forEach(ev => {
                // 법원·검찰 소재지로만 위치가 잡힌 기사는 핀을 찍지 않음 (사건이 거기서 난 게 아니므로)
                const news = bestLocated(ev.items.filter(n => precOf(n) !== 'inst'));
                if (!news) return;
                const court = ev.items.every(isCourt);     // 재판·판결 소식만 있는 사건: 흐린 점선 핀
                const g = groupOf(ev.lead);
                const color = CATEGORY_GROUPS[g].color;
                const selected = ev.items.some(n => n.id === selectedNewsId);
                const p = precOf(news);
                const exact = !court && (p === 'poi' || p === 'dong');
                const size = selected ? 22 : (exact ? 16 : (p === 'sgg' && !court ? 14 : 12));
                const icon = L.divIcon({
                    className: 'custom-icon',
                    html: `<div class="pin ${exact ? 'exact' : (p === 'sgg' && !court ? '' : 'approx')} ${selected ? 'sel' : ''}" style="background:${color};width:${size}px;height:${size}px;${exact || selected ? '' : 'box-shadow:0 0 8px ' + color + ';'}"></div>`,
                    iconSize: [size, size], iconAnchor: [size / 2, size / 2]
                });
                const marker = L.marker([news.lat, news.lng], { icon, zIndexOffset: selected ? 1000 : (exact ? 100 : 0) });
                marker.bindPopup(`
                    <div style="font-family: sans-serif; max-width: 240px;">
                        <span style="font-size: 10px; background: ${color}; color:#fff; padding: 2px 6px; border-radius: 4px; font-weight:bold;">${esc(ev.lead.category)}</span>
                        <h4 style="font-size: 12px; font-weight: bold; margin: 6px 0 4px;">${esc(ev.lead.title)}</h4>
                        <p style="font-size: 11px; color: #475569; margin: 0;"><i class="fa-solid fa-location-dot" style="color:#ef4444"></i> ${esc(news.location)}${ev.items.length > 1 ? ' · 관련 기사 ' + ev.items.length + '개' : ''}</p>
                        <p style="font-size: 10px; color: #94a3b8; margin: 2px 0 0;">위치: ${PREC_TEXT[p] || ''}${news.place ? ' · ' + esc(news.place) : ''}</p>
                        ${court ? '<p style="font-size: 10px; color: #64748b; margin: 2px 0 0;">⚖️ 재판·판결 소식 — 사건이 지금 일어난 것은 아닙니다</p>' : ''}
                    </div>
                `);
                marker.on('click', () => selectNews(ev.lead.id));
                list.push(marker);
            });
            if (markersLayer.addLayers) markersLayer.addLayers(list); else list.forEach(m => markersLayer.addLayer(m));
        }

        // ================= 중앙 상단: 카테고리 버튼 =================
        // 휴대폰: 분류 버튼 줄 접기/펼치기 (기사 원문 자리를 넓히기 위해 처음엔 접힘). 접힌 줄에는 지금 고른 분류를 요약해 보여 줌
        function toggleCatBar(open) {
            const bar = document.getElementById('categoryBar');
            if (!bar) return;
            const want = typeof open === 'boolean' ? open : bar.classList.contains('cat-collapsed');
            bar.classList.toggle('cat-collapsed', !want);
            if (!isMobile()) { try { localStorage.setItem('cat_pc_collapsed', want ? '0' : '1'); } catch (e) {} }
            const b = document.getElementById('catToggleBtn'); if (b) b.setAttribute('aria-expanded', String(want));
            setTimeout(() => { if (map) map.invalidateSize(); fitArticleFrame(); }, 60);
        }
        function catSummaryText() {
            const lab = g => (CATEGORY_GROUPS[g] && CATEGORY_GROUPS[g].label) || g;
            let t = '분류: 전체';
            if (currentCategory === '범죄 다발 지역') t = '분류: 7일 사고 다발 지역';
            else if (selCats.size) { const a = Array.from(selCats); t = '분류: ' + lab(a[0]) + (a.length > 1 ? ' 외 ' + (a.length - 1) : ''); }
            else if (exCats.size) t = '분류: ' + exCats.size + '개 빼고 보기';
            return t;
        }
        // 휴대폰: 사건 목록 탭에서도 분류를 바로 고를 수 있게 (원문 탭으로 갔다가 다시 목록으로 오지 않아도 됨). 평소엔 접어 두고 '분류: …' 줄만 보임
        let mListCatOpen = false;
        function toggleListCat(open) { mListCatOpen = typeof open === 'boolean' ? open : !mListCatOpen; renderCategoryBar(); }
        function updateCatToggle() {
            const el = document.getElementById('catToggleLabel');
            if (!el) return;
            const t = catSummaryText();
            el.textContent = t;
            // 다발 지역 순위를 보는 중이면 같은 자리의 버튼이 '← 원문'(바로 돌아가기)으로 바뀜
            const hb = document.getElementById('catHotBtn');
            if (hb) {
                const inHot = currentCategory === '범죄 다발 지역';
                hb.classList.toggle('cat-back', inHot);
                hb.innerHTML = inHot ? '<i class="fa-solid fa-arrow-left"></i> 원문' : '🚨 사고 다발 지역';
                hb.setAttribute('aria-label', inHot ? '기사 원문으로 돌아가기' : '사고 다발 지역 보기');
            }
        }
        function onCatHot() { if (currentCategory === '범죄 다발 지역') leaveHotspot(); else setCategoryFilter('범죄 다발 지역'); }
        // 다발 지역 순위에서 보던 기사 원문으로 바로 돌아가기 (분류를 '전체'로 바꾸지 않고 펼친 분류 줄도 접음)
        function leaveHotspot() {
            if (currentCategory !== '범죄 다발 지역') return;
            currentCategory = 'all'; selectedHotspotRegion = null; hotspotArticleOpen = false;
            renderLimit = 100;
            if (isMobile()) toggleCatBar(false);
            renderCategoryBar(); updateMapMarkers(); renderNewsList();
            const keep = selectedNewsId && newsData.some(n => n.id === selectedNewsId) ? selectedNewsId : null;
            const f = getFilteredNews(), id = keep || (f[0] && f[0].id);
            if (id) selectNews(id, true);
            else setDetailHTML('<div class="text-center py-20 text-slate-400 text-xs">조건에 맞는 기사가 없습니다.</div>');
        }
        function renderCategoryBar() {
            const base = groupEvents(getFilteredNews(true)).map(ev => ev.lead);   // 사건 1건 = 1개로 셈
            const gCount = {}, sCount = {};
            const oc = oneCat();
            base.forEach(n => {
                groupsOf(n).forEach(g => { gCount[g] = (gCount[g] || 0) + 1; });   // 여러 분류에 해당하면 각 분류에 모두 셈
                if (oc && groupsOf(n).includes(oc)) tagsOf(n).forEach(s => { if (isOverseas(n) || SUB_TO_GROUP[s] === oc) sCount[s] = (sCount[s] || 0) + 1; });
            });
            const ACTIVE = ' ring-2 ring-offset-1 ring-slate-800 dark:ring-slate-200 dark:ring-offset-slate-900 font-bold';
            const allOn = currentCategory === 'all' && selCats.size === 0;
            const selN = Array.from(selCats).reduce((a, g) => a + (gCount[g] || 0), 0);

            // 재판·판결 소식은 이제 아예 올리지 않으므로(keepOnSite) 보이기/숨기기 버튼도 없음
            const courtBtn = () => '';
            const allBtn = `<button onclick="setCategoryFilter('all')" data-cat="all" title="모든 분류 보기 (선택 모두 해제)" class="cat-btn px-2.5 py-1 rounded-md text-[0.6875rem] border whitespace-nowrap transition ${allOn ? 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 border-transparent font-bold shadow-sm' : 'bg-slate-200 text-slate-800 dark:bg-slate-800 dark:text-slate-200 border-slate-300 dark:border-slate-700 font-bold'}">전체 <span class="opacity-70 font-mono">${base.length}</span></button>`;
            let html = allBtn;
            // 사건이 많은 순서대로 앞에 놓고, 해외는 항상 맨 뒤에 따로 구분해서 놓음
            const order = Object.keys(CATEGORY_GROUPS).filter(g => g !== OVERSEAS);
            const idx = {}; order.forEach((g, i) => { idx[g] = i; });
            order.sort((a, b) => ((gCount[b] || 0) - (gCount[a] || 0)) || (idx[a] - idx[b]));
            const btn = g => {
                const c = CATEGORY_GROUPS[g];
                const on = selCats.has(g), ex = exCats.has(g);
                // 선택 표시(✓)·제외 표시(⊘)는 버튼 모서리에 겹쳐서 띄움 → 버튼 너비가 바뀌지 않아 옆 버튼들이 흔들리지 않음
                const tip = catMode === 'exclude' ? '누르면 이 분류를 빼고 보기 · 다시 누르면 다시 보기' : '누르면 선택 · 여러 개 함께 선택 가능 · 다시 누르면 해제';
                return `<button onclick="setCategoryFilter('${g}')" oncontextmenu="toggleExclude('${g}', event)" data-cat="${g}" aria-pressed="${on}" title="${esc(c.law || '')}${'\n'}${tip}${'\n'}(오른쪽 클릭: 바로 빼고 보기)" class="cat-btn relative px-2.5 py-1 rounded-md text-[0.6875rem] border whitespace-nowrap font-medium ${c.badge}${on ? ' cat-on' : ''}${ex ? ' cat-ex' : ''}${(on || ex) && g === lastToggled ? ' cat-pop' : ''}${!on && !ex && g === lastToggled ? ' cat-unpop' : ''} ${(gCount[g] || 0) === 0 && !on && !ex ? 'opacity-50' : ''} ${selCats.size && !on && !ex ? 'cat-dim' : ''}">${on ? '<span class="cat-check">✓</span>' : ''}${ex ? '<span class="cat-check cat-check-ex">⊘</span>' : ''}${c.label} <span class="opacity-70 font-mono">${gCount[g] || 0}</span></button>`;
            };
            html += order.map(btn).join('');
            html += `<span class="flex items-center pl-2 ml-1 border-l-2 border-dashed border-slate-400 dark:border-slate-500">${btn(OVERSEAS)}</span>`;
            // 선택 안내문: 한 줄로 짧게 + '골라 보기 / 빼고 보기' 전환 버튼
            const exMode = catMode === 'exclude';
            const hint = exMode
                ? (exCats.size ? `⊘ ${exCats.size}개 빼고 보는 중` : '누르면 그 분류만 빼고 보기')
                : (selCats.size ? `✓ ${selCats.size}개 선택됨 · 다시 누르면 해제` : '여러 개 함께 선택 가능');
            // 마우스를 올리면 바로 뜨는 안내 말풍선 (어떻게 누르면 되는지)
            const MODE_TIPS = {
                include: '<b>✓ 골라 보기</b><br>분류 버튼을 <b>마우스 왼쪽 클릭</b>하면 그 분류만 골라서 봅니다. 여러 개를 함께 고를 수 있고, 다시 누르면 해제됩니다.',
                exclude: '<b>⊘ 빼고 보기</b><br>분류 버튼을 <b>마우스 오른쪽 클릭</b>하면 바로 그 분류만 빼고 봅니다. (이 버튼을 켜 두면 왼쪽 클릭으로도 뺄 수 있습니다) 다시 누르면 다시 보입니다.'
            };
            const modeBtn = (m, label) => `<span class="tip tip-down ${m === 'exclude' ? 'tip-right' : ''}" style="cursor:pointer;"><button onclick="setCatMode('${m}')" class="px-1.5 py-0.5 text-[0.625rem] font-bold whitespace-nowrap ${catMode === m ? (m === 'exclude' ? 'bg-red-600 text-white' : 'bg-indigo-600 text-white') : 'text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">${label}</button><span class="tip-box">${MODE_TIPS[m]}</span></span>`;
            html += `<span class="ml-auto flex items-center gap-1.5 pl-2 border-l-2 border-slate-300 dark:border-slate-600">
                <span class="flex items-center rounded-md border border-slate-300 dark:border-slate-600">${modeBtn('include', '✓ 골라 보기')}${modeBtn('exclude', '⊘ 빼고 보기')}</span>
                <span class="cat-hint whitespace-nowrap text-[0.625rem] ${(exMode ? exCats.size : selCats.size) ? 'font-bold ' + (exMode ? 'text-red-600 dark:text-red-300' : 'text-indigo-600 dark:text-indigo-300') : 'text-slate-400'}">${hint}</span>
                ${exCats.size ? `<button onclick="clearExcluded()" title="빼 둔 분류를 모두 다시 보기" class="whitespace-nowrap text-[0.625rem] font-bold text-red-600 dark:text-red-300 border border-red-300 dark:border-red-700 rounded px-1.5 py-0.5 hover:bg-red-50 dark:hover:bg-red-950/40">⊘ 제외 ${exCats.size}개 해제</button>` : ''}
                ${courtBtn(false)}
                <button onclick="setCategoryFilter('범죄 다발 지역')" data-cat="범죄 다발 지역" class="cat-btn px-2.5 py-1 rounded-md text-[0.6875rem] border whitespace-nowrap transition bg-rose-600 text-white border-rose-700 font-bold shadow-sm hover:bg-rose-500${currentCategory === '범죄 다발 지역' ? ACTIVE : ''}">🚨 7일간 전국 사건사고 다발 지역</button></span>`;
            document.getElementById('groupButtons').innerHTML = html;
            // PC 는 처음에 펼쳐 두고(저장된 선택이 있으면 그대로), 휴대폰은 접어 둠. 한 번만 적용
            if (!window._catInit) {
                window._catInit = true;
                if (!isMobile()) {
                    let c = '0'; try { c = localStorage.getItem('cat_pc_collapsed') || '0'; } catch (e) {}
                    const bar = document.getElementById('categoryBar');
                    if (bar) bar.classList.toggle('cat-collapsed', c === '1');
                    const b = document.getElementById('catToggleBtn'); if (b) b.setAttribute('aria-expanded', String(c !== '1'));
                }
            }
            updateCatToggle();
            // 기사 원문 화면을 3칸에 넣지 않았을 때: 사건 목록(요약) 위에 분류 버튼을 한 줄로 줄여서 보여 줌
            const lcb = document.getElementById('listCatBar');
            const lcbMobile = isMobile();
            if (lcb && lcbMobile) {
                // 휴대폰: [분류: 전체 ▾] 줄 하나 + 펼치면 분류 버튼(줄바꿈) · 골라 보기/빼고 보기
                lcb.classList.remove('hidden');
                const chips = `${allBtn}${order.map(btn).join('')}<span class="flex items-center pl-1 ml-0.5 border-l-2 border-dashed border-slate-400 dark:border-slate-500">${btn(OVERSEAS)}</span>`;
                lcb.innerHTML = `<button type="button" onclick="toggleListCat()" aria-expanded="${mListCatOpen}" class="w-full flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border text-xs font-bold ${selCats.size || exCats.size ? 'border-indigo-400 bg-indigo-50 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-200' : 'border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200'}"><i class="fa-solid fa-filter text-indigo-500"></i><span class="flex-1 text-left truncate">${esc(catSummaryText())}</span><i class="fa-solid fa-chevron-${mListCatOpen ? 'up' : 'down'} text-[0.625rem] opacity-70"></i></button>`
                    + (mListCatOpen ? `<div class="flex flex-wrap items-center gap-1 pt-2">${chips}</div>
                    <div class="flex items-center gap-1.5 mt-1.5">
                        <span class="flex items-center rounded-md border border-slate-300 dark:border-slate-600 shrink-0">${modeBtn('include', '✓ 골라 보기')}${modeBtn('exclude', '⊘ 빼고 보기').replace('tip-right', '')}</span>
                        <span class="cat-hint truncate text-[0.625rem] ${(exMode ? exCats.size : selCats.size) ? 'font-bold ' + (exMode ? 'text-red-600 dark:text-red-300' : 'text-indigo-600 dark:text-indigo-300') : 'text-slate-400'}">${hint}</span>
                        ${exCats.size ? `<button onclick="clearExcluded()" class="shrink-0 whitespace-nowrap text-[0.625rem] font-bold text-red-600 dark:text-red-300 border border-red-300 dark:border-red-700 rounded px-1.5 py-0.5">⊘ 해제</button>` : ''}
                        <button type="button" onclick="toggleListCat(false)" class="ml-auto shrink-0 px-2 py-0.5 rounded-md text-[0.625rem] font-bold border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300">접기 <i class="fa-solid fa-chevron-up"></i></button>
                    </div>` : '');
            } else if (lcb) {
                const show = !isDocked('article');
                lcb.classList.toggle('hidden', !show);
                lcb.innerHTML = show ? `<div class="hscroll gap-1 items-center pt-2 pb-0.5" title="옆으로 밀어서 더 보기">${allBtn}${order.map(btn).join('')}<span class="flex items-center pl-1 ml-0.5 border-l-2 border-dashed border-slate-400 dark:border-slate-500">${btn(OVERSEAS)}</span></div>
                    <div class="flex items-center gap-1.5 mt-1">
                        <span class="flex items-center rounded-md border border-slate-300 dark:border-slate-600 shrink-0">${modeBtn('include', '✓ 골라 보기')}${modeBtn('exclude', '⊘ 빼고 보기').replace('tip-right', '')}</span>
                        <span class="cat-hint truncate text-[0.625rem] ${(exMode ? exCats.size : selCats.size) ? 'font-bold ' + (exMode ? 'text-red-600 dark:text-red-300' : 'text-indigo-600 dark:text-indigo-300') : 'text-slate-400'}">${hint}</span>
                        ${exCats.size ? `<button onclick="clearExcluded()" class="shrink-0 whitespace-nowrap text-[0.625rem] font-bold text-red-600 dark:text-red-300 border border-red-300 dark:border-red-700 rounded px-1.5 py-0.5">⊘ 해제</button>` : ''}
                        ${courtBtn(true)}
                        <button onclick="setCategoryFilter('범죄 다발 지역')" title="7일간 전국 사건사고 다발 지역 (기사 원문 창으로 열림)" class="cat-btn ml-auto shrink-0 px-2 py-0.5 rounded-md text-[0.625rem] border whitespace-nowrap bg-rose-600 text-white border-rose-700 font-bold">🚨 사고 다발 지역</button>
                    </div>` : '';
            }

            lastToggled = null;
            let sub = '';
            if (oc && CATEGORY_GROUPS[oc] && currentCategory !== '범죄 다발 지역') {   // 분류를 하나만 골랐을 때 세부 분류 표시
                const c = CATEGORY_GROUPS[oc];
                sub += `<span class="text-[0.625rem] text-slate-400 mr-0.5">세부:</span>`;
                sub += `<button onclick="setSubFilter(null)" class="px-2 py-0.5 rounded-full text-[0.625rem] border transition ${currentSub === null ? 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 border-transparent font-bold' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-300 dark:border-slate-700'}">전체 ${gCount[oc] || 0}</button>`;
                c.subs.forEach(s => {
                    const n = sCount[s] || 0;
                    sub += `<button onclick="setSubFilter('${s}')" class="px-2 py-0.5 rounded-full text-[0.625rem] border transition ${currentSub === s ? 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 border-transparent font-bold' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-300 dark:border-slate-700'} ${n === 0 ? 'opacity-40' : ''}">${s} ${n}</button>`;
                });
            }
            const subBox = document.getElementById('subButtons');
            subBox.innerHTML = sub;
            subBox.style.display = sub ? 'flex' : 'none';
            if (lcb && sub && ((lcbMobile && mListCatOpen) || (!lcbMobile && !isDocked('article')))) lcb.insertAdjacentHTML('beforeend', `<div class="hscroll gap-1 items-center mt-1">${sub}</div>`);
            renderDateBar();
        }

        function renderDateBar() {
            const btn = document.getElementById('dateButton');
            const menu = document.getElementById('dateMenu');
            if (!btn || !menu) return;
            const days = last7Days();            // 항상 '지금' 기준으로 오늘 포함 7일
            const cur = days.find(d => d.key === selectedDate);
            btn.innerHTML = `<i class="fa-regular fa-calendar"></i> ${cur ? dateLabel(cur.ts) : '최근 7일 전체'} <i class="fa-solid fa-caret-down"></i>`;

            const perDay = {}, all = new Set();
            getFilteredNews(false, true).forEach(n => {
                const k = dateKey(n.timestamp || Date.now() / 1000);
                (perDay[k] = perDay[k] || new Set()).add(evOf(n));
                all.add(evOf(n));
            });
            const row = (key, label, n, on) => `<button onclick="setDate('${key}')" class="w-full flex items-center justify-between px-2.5 py-1.5 rounded text-xs transition ${on ? 'bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 font-bold' : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700'}"><span>${label}</span><span class="font-mono opacity-70">${n}건</span></button>`;
            menu.innerHTML = days.map(d => row(d.key, dateLabel(d.ts), perDay[d.key] ? perDay[d.key].size : 0, d.key === selectedDate)).join('')
                + '<div class="my-1 border-t border-slate-200 dark:border-slate-700"></div>'
                + row('all', '최근 7일 전체', all.size, selectedDate === 'all');
        }

        // 30초마다: 자정이 지나 날짜가 바뀌었으면 날짜 표시를 새 날짜로 넘김
        function dateTick() {
            const today = todayKey();
            if (selectedDate !== 'all' && !last7Days().some(d => d.key === selectedDate)) { selectedDate = today; dateFollowToday = true; refreshAll(); return; }
            if (dateFollowToday && selectedDate !== today) { selectedDate = today; refreshAll(); return; }
            renderDateBar();
        }

        function toggleDateMenu(show) {
            const menu = document.getElementById('dateMenu');
            const hidden = menu.classList.contains('hidden');
            const want = (typeof show === 'boolean') ? show : hidden;
            if (want) menu.classList.remove('hidden'); else menu.classList.add('hidden');
        }

        function setDate(key) {
            selectedDate = key;
            dateFollowToday = (key === todayKey());
            renderLimit = 100;
            toggleDateMenu(false);
            const list = document.getElementById('newsListContainer');
            if (list) list.scrollTop = 0;
            refreshAll();
        }

        // ◀(이전 날짜) / ▶(다음 날짜)
        function stepDate(dir) {
            const keys = last7Days().map(d => d.key);
            let i = keys.indexOf(selectedDate);
            i = (i < 0) ? 0 : Math.max(0, Math.min(keys.length - 1, i + dir));
            setDate(keys[i]);
        }

        function refreshAll() {
            renderCategoryBar();
            renderNewsList();
            updateMapMarkers();
            if (currentCategory === '범죄 다발 지역') { if (!hotspotArticleOpen) renderCrimeHotspotsView(); return; }
            const f = getFilteredNews();
            if (f.length > 0) selectNews(f[0].id, true);
            else setDetailHTML('<div class="text-center py-20 text-slate-400 text-xs">조건에 맞는 기사가 없습니다.</div>');
        }

        // ================= 왼쪽: 사건 목록 (같은 사건 기사는 1건으로 묶음) =================
        function showMoreNews() { renderLimit += 100; renderNewsList(); }
        function toggleEvent(key) {
            if (expandedEvents.has(key)) expandedEvents.delete(key); else expandedEvents.add(key);
            renderNewsList();
        }

        // anchor=true: 자동 업데이트로 새 기사가 위에 추가될 때, 사용자가 보고 있던 위치가 밀려나지 않게 그대로 유지
        function renderNewsList(anchor) {
            const container = document.getElementById('newsListContainer');
            const prevScroll = container.scrollTop;
            const oldHeight = container.scrollHeight;
            // 지금 화면 맨 위에 보이던 기사 카드(기준 카드)와 그 위치 · 직전에 목록에 있던 사건들을 기억해 둠
            //  → 새로 그린 뒤 같은 카드가 같은 자리에 오도록 맞추고, '진짜 새로 생긴 기사가 보던 자리 위에 있을 때만' 알림을 띄움
            //  (예전에는 3분 안에 들어온 새 기사 수를 매번 세어서, 이미 본 기사나 아래쪽에 끼어든 기사 때문에 '새 기사'가 떴는데 맨 위는 그대로였음)
            let anchorKey = null, anchorOff = 0;
            if (anchor && prevScroll > 20) {
                const ctop = container.getBoundingClientRect().top;
                const first = Array.from(container.querySelectorAll('.news-card')).find(c => c.getBoundingClientRect().bottom > ctop + 4);
                if (first) { anchorKey = first.dataset.evk || null; anchorOff = first.getBoundingClientRect().top - ctop; }
            }
            const prevShown = window._shownKeys || new Set();
            const filtered = getFilteredNews();
            const events = groupEvents(filtered);
            window._shownKeys = new Set(events.map(e => e.key));
            document.getElementById('listCount').textContent = '사건 ' + events.length + '건' + (filtered.length > events.length ? ' · 기사 ' + filtered.length + '개' : '');
            container.innerHTML = '';

            // 다발 지역에서 지역을 고른 상태: 날짜 줄 바로 아래(목록 바깥)에 어느 지역인지와 돌아가기 버튼을 여백 없이 붙임
            const hotBar = document.getElementById('hotspotBar');
            if (hotBar) {
                if (currentCategory === '범죄 다발 지역' && selectedHotspotRegion) {
                    hotBar.innerHTML = `<span class="truncate">🚨 ${esc(selectedHotspotRegion)} · 최근 7일 사건 ${events.length}건</span><button class="shrink-0 px-2 py-0.5 rounded bg-white/20 hover:bg-white/30">← 사고 다발 지역 순위</button>`;
                    hotBar.querySelector('button').onclick = backToHotspots;
                    hotBar.classList.remove('hidden'); hotBar.classList.add('flex');
                } else {
                    hotBar.classList.add('hidden'); hotBar.classList.remove('flex');
                    hotBar.innerHTML = '';
                }
            }

            if (events.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'text-center py-10 text-xs text-slate-500 space-y-3';
                const isToday = selectedDate === todayKey();
                empty.innerHTML = `<div>${isToday ? '오늘은 아직 조건에 맞는 사건이 없습니다.' : '선택한 날짜/지역/카테고리에 해당하는 사건이 없습니다.'}</div>`
                    + (isToday ? '<button onclick="stepDate(1)" class="px-3 py-1.5 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold">← 어제 사건 보기</button>' : '');
                container.appendChild(empty);
                return;
            }

            const showHeaders = selectedDate === 'all' || (currentCategory === '범죄 다발 지역' && !!selectedHotspotRegion);
            const perDay = {};
            events.forEach(ev => { const k = dateKey((ev.latest || ev.lead).timestamp || Date.now() / 1000); perDay[k] = (perDay[k] || 0) + 1; });

            let lastKey = null;
            events.slice(0, renderLimit).forEach(ev => {
                const news = ev.lead;
                const ts = (ev.latest || news).timestamp || Date.now() / 1000;
                const k = dateKey(ts);
                if (showHeaders && k !== lastKey) {
                    lastKey = k;
                    const h = document.createElement('div');
                    // 목록 안쪽 여백(p-3)만큼 위로 끌어올려 붙임(-top-3): 위 줄(빨간 안내줄·날짜 줄)에 틈 없이 딱 붙어서, 스크롤할 때 그 틈으로 기사가 비치지 않음
                    h.className = (container.children.length ? '' : '-mt-3 ') + 'sticky -top-3 z-10 -mx-3 px-3 py-1 text-[0.6875rem] font-bold text-slate-600 dark:text-slate-300 bg-slate-100/95 dark:bg-slate-800/95 backdrop-blur border-y border-slate-200 dark:border-slate-700 flex justify-between';
                    h.innerHTML = `<span>${dateLabel(ts)}</span><span class="font-mono text-slate-400">${perDay[k]}건</span>`;
                    container.appendChild(h);
                }

                const hd = ev.head || news;                                    // 새 소식이 있으면 그 기사가 사건의 대표 제목
                const hdPick = hasCoords(hd) ? hd : news;                       // 눌렀을 때 지도에 띄울 기사 (위치를 모르면 대표 기사)
                const hasSelected = ev.items.some(n => n.id === selectedNewsId);
                const open = expandedEvents.has(ev.key);
                const card = document.createElement('div');
                card.className = `news-card ${freshEventKeys.has(ev.key) ? 'news-new ' : ''}${hasSelected ? 'is-sel ' : ''}rounded-xl border transition text-left overflow-hidden ${hasSelected ? 'bg-white dark:bg-slate-800/90 border-red-400/70' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800'}`;
                card.dataset.evk = ev.key;
                card.style.setProperty('--accent', (CATEGORY_GROUPS[groupOf(news)] || {}).color || '#94a3b8');

                const main = document.createElement('div');
                main.className = 'p-3 pl-3.5 cursor-pointer';
                main.tabIndex = 0;
                main.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectNews(hdPick.id); } };
                main.onclick = () => selectNews(hdPick.id);
                main.innerHTML = `
                    <div class="flex items-start justify-between mb-1.5 gap-1">
                        <span class="flex flex-wrap items-center gap-1 min-w-0">
                            ${freshEventKeys.has(ev.key) ? '<span class="new-badge"><i class="fa-solid fa-bolt"></i>NEW</span>' : ''}
                            ${ev.head ? '<span class="rel-chip rel-new" title="같은 사건에서 새로 드러난 내용이 있는 기사를 맨 위에 보여 줍니다">새 소식</span>' : ''}
                            ${isOverseas(news) ? '<span class="text-[0.625rem] px-1.5 py-0.5 rounded bg-zinc-700 text-white font-extrabold">🌍 해외</span>' : ''}
                            ${isCourt(news) ? courtBadge() : ''}
                            ${tagBadges(news)}
                        </span>
                        <span class="text-[0.625rem] text-slate-500 whitespace-nowrap shrink-0 font-mono" title="${esc(ev.latest && ev.latest !== news ? '가장 최근 기사 ' + ev.latest.time + ' · 대표 기사(내용이 가장 자세한 기사) ' + news.time : news.time)}">${esc(shortTime(ev.latest || news))}</span>
                    </div>
                    <h3 class="text-[0.8125rem] leading-snug font-bold text-slate-900 dark:text-white line-clamp-2 mb-1 tracking-tight">${esc(hd.title)}</h3>
                    <p class="text-[0.6875rem] text-slate-600 dark:text-slate-400 line-clamp-2 mb-2">${esc(hd.summary || news.summary)}</p>
                    ${ev.head && ev.first && ev.first.id !== hd.id ? `<p class="text-[0.625rem] text-slate-500 mb-1.5 line-clamp-1">처음 보도: ${esc(ev.first.title)}</p>` : ''}
                    <div class="flex items-center justify-between gap-2 text-[0.625rem] text-slate-500 pt-1 border-t border-slate-100 dark:border-slate-800">
                        <span class="truncate"><i class="fa-solid fa-location-dot text-red-500"></i> ${esc(news.location)}</span>
                        <span class="font-medium shrink-0 flex items-center gap-1.5">${esc(hd.source || news.source)}<button type="button" onclick="event.stopPropagation(); openShare(${hdPick.id})" title="이웃·커뮤니티에 공유" class="px-1.5 py-0.5 rounded border border-emerald-300 dark:border-emerald-700 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-50 dark:hover:bg-emerald-950/40 font-bold"><i class="fa-solid fa-share-nodes"></i> 공유</button></span>
                    </div>`;
                card.appendChild(main);

                if (ev.items.length > 1) {
                    const tog = document.createElement('button');
                    tog.className = 'w-full px-3 py-1.5 text-[0.6875rem] font-bold text-blue-600 dark:text-blue-400 bg-slate-50 dark:bg-slate-800/60 border-t border-slate-200 dark:border-slate-700 flex items-center justify-between hover:bg-slate-100 dark:hover:bg-slate-800';
                    tog.innerHTML = `<span><i class="fa-regular fa-newspaper"></i> 같은 사건 관련 기사 ${ev.items.length}개</span><span>${open ? '접기 ▲' : '펼치기 ▼'}</span>`;
                    tog.onclick = () => toggleEvent(ev.key);
                    card.appendChild(tog);
                    if (open) {
                        // 안내 한 줄: 아래 꼬리표가 무슨 뜻인지
                        const lg = document.createElement('div');
                        lg.className = 'px-3 py-1.5 text-[0.6875rem] text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-800/40 border-t border-slate-100 dark:border-slate-800 flex flex-wrap items-center gap-x-3 gap-y-1';
                        lg.innerHTML = `<span><span class="rel-chip rel-first">처음 보도</span> 이 사건의 첫 기사</span><span><span class="rel-chip rel-new">새 내용</span> 앞 기사에 없던 사실</span>`;
                        card.appendChild(lg);
                        ev.items.forEach(n => {
                            const row = document.createElement('div');
                            row.className = `px-3 py-2 cursor-pointer border-t border-slate-100 dark:border-slate-800 ${n.id === selectedNewsId ? 'bg-red-50 dark:bg-red-950/30' : 'hover:bg-slate-50 dark:hover:bg-slate-800/60'}`;
                            row.onclick = () => selectNews(n.id);
                            const chip = n._upd ? `<span class="rel-chip rel-new">새 내용${n._updWhy ? ' · ' + esc(String(n._updWhy).replace(/\s+/g, ' ').slice(0, 8)) : ''}</span>` : (ev.first && ev.first.id === n.id ? '<span class="rel-chip rel-first">처음 보도</span>' : '');
                            row.innerHTML = `<div class="flex items-center gap-1.5 mb-1 text-[0.6875rem] text-slate-500">${chip}${isOverseas(n) ? '<span class="rel-chip rel-first">해외</span>' : ''}<span class="truncate">${esc(n.source)}</span><span class="shrink-0 font-mono ml-auto">${esc(shortTime(n))}</span></div><div class="text-[0.8125rem] leading-snug text-slate-800 dark:text-slate-100 line-clamp-2 ${n.id === selectedNewsId ? 'font-bold' : 'font-medium'}">${esc(n.title)}</div>`;
                            card.appendChild(row);
                        });
                    }
                }
                container.appendChild(card);
            });

            if (events.length > renderLimit) {
                const more = document.createElement('button');
                more.className = 'w-full py-2 text-xs font-bold text-blue-600 dark:text-blue-400 bg-slate-100 dark:bg-slate-800 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700';
                more.textContent = `더 보기 (${renderLimit} / ${events.length}건)`;
                more.onclick = showMoreNews;
                container.appendChild(more);
            }
            if (anchor && prevScroll > 20) {
                let freshN = 0;
                const anchorCard = anchorKey ? Array.from(container.querySelectorAll('.news-card')).find(c => c.dataset.evk === anchorKey) : null;
                if (anchorCard) {
                    const ctop = container.getBoundingClientRect().top;
                    container.scrollTop += (anchorCard.getBoundingClientRect().top - ctop) - anchorOff;      // 보던 카드가 그 자리에 그대로 있게
                    const idx = events.findIndex(ev => ev.key === anchorKey);
                    freshN = events.slice(0, Math.max(0, idx)).filter(ev => !prevShown.has(ev.key)).length;  // 보던 자리 위에 새로 생긴 사건만
                } else {
                    container.scrollTop = prevScroll + Math.max(0, container.scrollHeight - oldHeight);
                }
                // 아래쪽을 보고 있었다면: 위에 새 기사가 왔다는 작은 알림 (누르면 맨 위로)
                if (freshN) {
                    const pill = document.createElement('button');
                    pill.className = 'new-pill sticky top-1 z-30 mx-auto w-max';
                    pill.innerHTML = '<i class="fa-solid fa-bell"></i> 새 기사 <b>' + freshN + '</b>건 <span>▲ 맨 위로</span>';
                    pill.onclick = () => { container.scrollTo({ top: 0, behavior: 'smooth' }); pill.remove(); };
                    container.insertBefore(pill, container.firstChild);
                    container.scrollTop += pill.offsetHeight;
                }
            } else container.scrollTop = prevScroll;
        }

        // ================= 다발 지역 (사건 수 기준, 같은 사건의 기사 여러 개는 1건) =================
        // 기사의 시·군·구 (다발 지역 집계용). 해외·북한·위치 미상·시도만 아는 기사와 법원·검찰 소재지로만 위치가 잡힌 기사는 제외
        function hotspotRegionOf(n) {
            const loc = n.location || '';
            if (isOverseas(n) || loc.startsWith('북한') || loc.startsWith('해외') || loc.includes('미상') || !loc.includes(' ')) return null;
            if (precOf(n) === 'inst' || precOf(n) === 'road') return null;     // 고속도로 노선만 아는 기사는 특정 시·군·구로 세지 않음
            return sigunguOf(loc.replace(/\s*\([^)]*고속도로[^)]*\)\s*$/, ''));
        }
        // 사건 하나 = 지역 하나: 같은 사건의 기사들이 서로 다른 곳으로 찍혀 있으면(예: 한 기사는 동까지, 다른 기사는 법원 소재지)
        //  예전에는 두 지역에 모두 1건씩 세어졌음 → 이제는 위치가 가장 자세한 기사의 시·군·구 한 곳에만 셉니다.
        function eventRegion(ev) {
            let best = null;
            const by = {};
            ev.items.forEach(n => {
                const r = hotspotRegionOf(n);
                if (!r) return;
                const o = by[r] = by[r] || { r: r, n: 0, p: 0 };
                o.n++; o.p = Math.max(o.p, PREC_RANK[precOf(n)] || 0);
            });
            Object.values(by).forEach(o => { if (!best || o.p > best.p || (o.p === best.p && o.n > best.n)) best = o; });
            return best ? best.r : null;
        }
        // 최근 7일(오늘 포함 7개 날짜) 사건 목록 → 사건마다 지역 하나. 지금 고른 분류(골라 보기·빼고 보기)를 그대로 따름
        // 재판·판결 소식(court)은 예전 사건의 후속 보도라 세지 않음 (같은 사건에 발생·수사 기사가 있으면 그 기사로 셈)
        function hotspotEvents() {
            const evs = groupEvents(newsData.filter(n => inLast7(n) && n.source !== '시스템' && !isCourt(n) && catPass(n)));
            evs.forEach(ev => { ev.region = eventRegion(ev); });
            // 집계에서 빠진 사건이 얼마나 되는지 (화면 안내문에 보여 줌: 위치를 못 찾았거나 시·도까지만 알려진 사건은 어느 시·군·구인지 몰라 셀 수 없음)
            const st = { total: evs.length, counted: 0, abroad: 0, sido: 0, unknown: 0 };
            evs.forEach(ev => {
                if (ev.region) { st.counted++; return; }
                if (ev.items.every(n => isOverseas(n) || (n.location || '').startsWith('북한'))) st.abroad++;
                else if (ev.items.some(n => (n.location || '') && precOf(n) === 'sido')) st.sido++;
                else st.unknown++;
            });
            hotspotStat = st;
            return evs.filter(ev => ev.region);
        }
        // 시·군·구별 '사건 수' (종류가 다른 사건마다 1건, 같은 사건을 다룬 기사 여러 개는 1건). 왼쪽 목록도 똑같은 기준
        function getCrimeHotspotsData() {
            const stats = {};
            hotspotEvents().forEach(ev => {
                const s = stats[ev.region] = stats[ev.region] || { region: ev.region, count: 0, articles: 0, types: {}, lat: null, lng: null };
                s.count++;
                s.articles += ev.items.length;
                const g = groupOf(ev.lead); s.types[g] = (s.types[g] || 0) + 1;
                const b = bestLocated(ev.items);
                if (s.lat == null && b) { s.lat = b.lat; s.lng = b.lng; }
            });
            return Object.values(stats).map(s => {
                const c = SIGUNGU_CENTERS[s.region] || SIGUNGU_CENTERS[s.region.split(' ').slice(0, 2).join(' ')];
                const types = Object.keys(s.types).sort((a, b) => s.types[b] - s.types[a]).map(g => ({ g: g, n: s.types[g] }));
                return { region: s.region, count: s.count, articles: s.articles, types: types, lat: c ? c[0] : s.lat, lng: c ? c[1] : s.lng };
            }).filter(s => s.lat != null).sort((a, b) => (b.count - a.count) || (b.articles - a.articles)).slice(0, 300);   // 예전에는 30위까지만 보여서 31위 이하 지역의 사건은 순위에서 통째로 사라졌음
        }

        function renderCrimeHotspotsView(keepScroll) {
            hotspotArticleOpen = false;
            const container = document.getElementById('detailViewContainer');
            const oldList = document.getElementById('hotspotList');
            // 실제로 스크롤되는 칸은 순위 목록이 아니라 바깥 칸(detailViewContainer)이라 거기의 위치를 기억함
            //  (기사를 보러 갔다 와도, 다발 지역 버튼을 다시 눌러도 보던 순위 위치로 돌아가도록)
            if (oldList) { hotspotScrollTop = Math.max(container.scrollTop, oldList.scrollTop); hotspotScrollAt = Date.now(); }
            // 마지막으로 순위를 스크롤한 지 HOTSPOT_SCROLL_KEEP_MIN 분이 지났으면 기억을 버리고 1위부터 다시 보여 줌
            if (Date.now() - hotspotScrollAt > HOTSPOT_SCROLL_KEEP_MIN * 60000) hotspotScrollTop = 0;
            const keepTop = keepScroll ? hotspotScrollTop : 0;
            if (!container._hotspotScrollBound) {
                container._hotspotScrollBound = true;
                container.addEventListener('scroll', () => { if (document.getElementById('hotspotList')) hotspotScrollTop = container.scrollTop; hotspotScrollAt = Date.now(); }, { passive: true });
            }
            let listHTML = '';
            const hsData = getCrimeHotspotsData();       // (이 안에서 hotspotStat 이 갱신됨)
            const hs = hotspotStat;
            const hsNote = hs ? `<p class="text-xs mt-2 font-bold text-rose-700 dark:text-rose-300">최근 7일 사건 ${hs.total}건 중 시·군·구까지 확인되어 집계된 사건 ${hs.counted}건 · 빠진 사건: 위치 미확인 ${hs.unknown}건, 시·도까지만 확인 ${hs.sido}건${hs.abroad ? ', 해외·북한 ' + hs.abroad + '건' : ''} · 총 ${hsData.length}개 지역</p>` : '';
            hsData.forEach((item, index) => {
                let isSelected = selectedHotspotRegion === item.region;
                listHTML += `
                    <div onclick="selectHotspotRegion('${esc(item.region)}', ${item.lat}, ${item.lng})" class="bg-white dark:bg-slate-900 border ${isSelected ? 'border-red-500 bg-red-50/50' : 'border-slate-200 dark:border-slate-800'} p-3 rounded-xl flex items-center justify-between cursor-pointer hover:border-red-400 transition">
                        <div class="flex items-center space-x-3">
                            <span class="w-7 h-7 rounded-full bg-rose-600 text-white flex items-center justify-center text-xs font-extrabold shrink-0">${index + 1}</span>
                            <div>
                                <h4 class="text-sm font-bold text-slate-900 dark:text-white">${esc(item.region)}</h4>
                                <p class="text-xs text-slate-500">관련 기사 ${item.articles}개 · 누르면 왼쪽에 사건 목록(관련 기사 펼치기 가능)이 나옵니다</p>
                                <div class="mt-1 flex flex-wrap gap-1">${item.types.slice(0, 4).map(t => `<span class="text-[0.625rem] px-1.5 py-0.5 rounded border ${CATEGORY_GROUPS[t.g].badge} font-bold">${esc(CATEGORY_GROUPS[t.g].label.replace(/^[^\s가-힣]+\s/, ''))} ${t.n}</span>`).join('')}</div>
                            </div>
                        </div>
                        <span class="text-base font-extrabold text-red-500 shrink-0">사건 ${item.count}건</span>
                    </div>
                `;
            });
            if (!listHTML) listHTML = '<div class="text-center py-10 text-xs text-slate-400">위치가 확인된 기사가 아직 없습니다.</div>';
            container.style.padding = '';
            setArtSlot('');
            container.innerHTML = `
                <div class="space-y-4 flex-1 flex flex-col">
                    <div class="p-5 rounded-xl border-l-4 border-rose-600 bg-rose-50 dark:bg-rose-950/25">
                        <h2 class="text-base font-extrabold text-slate-900 dark:text-white">🚨 최근 7일간 전국 사건사고 다발 지역</h2>
                        <p class="text-xs text-slate-600 dark:text-slate-400 mt-1">오늘 포함 최근 7일 동안 서로 다른 사건마다 1건으로 셉니다. 같은 사건을 다룬 기사 여러 개는 1건으로 묶고, 사건 하나는 위치가 가장 자세한 지역 한 곳에만 셉니다. 해외·위치 미상·시·도까지만 알려진 기사, 그리고 ⚖️ 재판·판결 소식(예전 사건의 후속 보도)과 법원·검찰 소재지로만 위치가 잡힌 기사는 빠집니다.${selCats.size || exCats.size ? ' <b class="text-rose-600">지금 고른 분류 기준으로 집계 중입니다.</b>' : ''} 지역을 누르면 왼쪽에 그 지역 사건이 정리됩니다.</p>
                        ${hsNote}
                    </div>
                    <div id="hotspotList" class="space-y-2.5 flex-1 overflow-y-auto custom-scrollbar">${listHTML}</div>
                </div>
            `;
            const newList = document.getElementById('hotspotList');
            newList.addEventListener('scroll', () => { hotspotScrollTop = newList.scrollTop || hotspotScrollTop; hotspotScrollAt = Date.now(); }, { passive: true });
            container.scrollTop = keepTop;
            if (keepTop) newList.scrollTop = Math.min(keepTop, newList.scrollHeight);
            syncMobileHotspot();
        }

        function selectHotspotRegion(region, lat, lng) {
            selectedHotspotRegion = region;
            renderLimit = 100;
            renderCrimeHotspotsView(true);
            renderNewsList();
            const list = document.getElementById('newsListContainer');
            if (list) list.scrollTop = 0;
            if (map) map.flyTo([lat, lng], 12, { duration: 1.2 });
            if (isMobile()) { closeMobileHotspot(true); setMobTab('list'); }     // 고른 지역의 사건은 목록 탭에 정리됨
        }
        function backToHotspots() {
            if (isMobile()) { renderCrimeHotspotsView(true); renderNewsList(); openMobileHotspot(); return; }   // 휴대폰: 목록 탭 안에서 순위로 돌아감
            renderCrimeHotspotsView(true);
            renderNewsList();
        }

        // ================= 가운데: 기사 원문 (가운데 정렬, 양옆 여백) =================
        function setDetailHTML(html) {
            setArtSlot('');
            const container = document.getElementById('detailViewContainer');
            if (document.getElementById('hotspotList') && container.scrollTop) { hotspotScrollTop = container.scrollTop; hotspotScrollAt = Date.now(); }   // 순위 화면을 떠나기 직전 위치 저장
            container.style.padding = '';
            container.innerHTML = html;
        }

        let pendingDetail = null;     // 기사 원문 화면이 숨어 있을 때 골라 둔 기사 (창을 열 때 그림)
        function articleVisible() { return isDocked('article') || (floatKey === 'article' && !document.getElementById('floatModal').classList.contains('hidden')); }
        function renderDetailView(id, forceCard) {
            if (!articleVisible()) { pendingDetail = { id: id, forceCard: forceCard }; return; }   // 안 보이는 곳에 언론사 페이지를 미리 불러오지 않음
            pendingDetail = null;
            const news = newsData.find(n => n.id === id);
            const container = document.getElementById('detailViewContainer');
            if (!news) {
                setDetailHTML(`<div class="text-center py-20 text-slate-400 text-xs">선택된 기사 정보를 찾을 수 없습니다.</div>`);
                return;
            }

            const link = safeUrl(news.link);
            const isGoogle = /news\.google\.com/.test(link);

            // 해외 언론은 다른 사이트 안에서 여는 것을 막아 둔 곳이 많아('연결을 거부했습니다'), 확인된 곳만 화면 안에 띄우고 나머지는 번역 요약 + 원문 버튼으로 보여 줌
            const tryEmbed = news.orig ? news.embed === true : news.embed !== false;
            if (link && !isGoogle && tryEmbed && !forceCard) {
                const embedUrl = link.replace(/^http:\/\//, 'https://');   // https 사이트 안에서는 http 페이지를 열 수 없어서 https로 시도
                const fab = 'inline-flex items-center gap-1 text-[0.6875rem] font-bold text-white bg-slate-900/80 hover:bg-blue-600 px-2.5 py-1.5 rounded-full shadow-lg';
                let host = ''; try { host = new URL(link).hostname.replace(/^www\./, ''); } catch (e) {}
                container.style.padding = '0';
                container.innerHTML = `
                    <div class="art-bar shrink-0 flex items-center gap-2 px-3 py-1.5 bg-blue-50 dark:bg-blue-950/40 border-b border-blue-200 dark:border-blue-900 text-[0.6875rem] text-slate-600 dark:text-slate-300">

        function addEdgeBack(id) {

            strip.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; on = true; hint.style.transition = 'opacity .15s'; }, { passive: true });

            const shown = w;
            const scale0 = Math.max(w / ARTICLE_BASE_WIDTH, 0.9 * fontFactor) * (articleZoom / 100);
            const virtualWidth = Math.max(200, w / scale0);
            const scale = shown / virtualWidth;
            frame.style.left = Math.round((w - shown) / 2) + 'px';
            frame.style.width = virtualWidth + 'px';
            frame.style.height = (h / scale) + 'px';
            frame.style.transform = 'scale(' + scale + ')';
        }

        function selectNews(id, silent) {
            selectedNewsId = id;
            const news = newsData.find(n => n.id === id);
            if (currentCategory === '범죄 다발 지역') {
                if (selectedHotspotRegion) {
                    // 다발 지역에서 고른 지역의 기사: 목록은 그대로 두고 가운데에 기사만 엶

            }
            renderNewsList();
            renderDetailView(id);
            if (!silent) updateMapMarkers();   // 선택한 사건의 점을 크게 표시
            if (news) {

            if (!silent && isMobile()) setMobTab('article');     // 휴대폰: 기사를 누르면 원문 탭으로
            // 기사 원문 화면을 칸에 넣지 않은 경우: 원문을 저절로 띄우지 않음 (보고 싶을 때 상단 [기사 원문] 버튼을 눌러서 엶)
            //  → 대신 그 버튼을 잠깐 반짝여서 '여기를 누르면 원문이 열린다'고 알려 줌
            if (!silent && !isDocked('article')) {
                const b = document.querySelector('#floatBtnWrap [data-panel="article"]');

            }
        }

        // ================= 필터 =================
        function setCategoryFilter(cat, stayOnList) {
            if (cat !== '범죄 다발 지역' && mHotspotOpen) closeMobileHotspot(true);
            if (cat === 'all') { selCats.clear(); currentCategory = 'all'; }
            else if (cat === '범죄 다발 지역') { currentCategory = cat; if (isMobile()) { if (!stayOnList) setMobTab('article'); toggleCatBar(false); } }     // 순위는 가운데 칸(원문 탭)에 나옴
            else if (catMode === 'exclude') {        // '빼고 보기' 모드: 누르면 그 분류를 숨김, 다시 누르면 다시 보임
                currentCategory = 'all';
                if (exCats.has(cat)) exCats.delete(cat); else { exCats.add(cat); selCats.delete(cat); }
                lastToggled = cat;
            }
            else {                                   // 분류 버튼: 누르면 선택, 다시 누르면 해제 (여러 개 함께 선택 가능)
                currentCategory = 'all';
                if (selCats.has(cat)) selCats.delete(cat); else { selCats.add(cat); exCats.delete(cat); }
                lastToggled = cat;
            }
            saveSelCats();
            currentSub = null;
            selectedHotspotRegion = null;
            hotspotArticleOpen = false;
            renderLimit = 100;
            renderCategoryBar();
            updateMapMarkers();
            if (cat === '범죄 다발 지역') {
                renderNewsList();
                renderCrimeHotspotsView(true);      // 다발 지역 버튼을 다시 눌러도 보던 순위 위치를 유지
                if (!isDocked('article')) openFloat('article');   // 다발 지역 순위는 기사 원문 화면에 나오므로, 칸에 없으면 창으로 보여 줌
            } else {
                renderNewsList();
                const f = getFilteredNews();
                if (f.length > 0) selectNews(f[0].id, true);
                else setDetailHTML('<div class="text-center py-20 text-slate-400 text-xs">조건에 맞는 기사가 없습니다.</div>');
            }
        }

        // 분류 버튼을 누를 때 '골라 보기'(선택) 할지 '빼고 보기'(제외) 할지
        function setCatMode(m) { catMode = m === 'exclude' ? 'exclude' : 'include'; saveSelCats(); renderCategoryBar(); }
        function clearExcluded() { exCats.clear(); saveSelCats(); refreshAll(); }
        // 오른쪽 클릭: 모드와 상관없이 그 분류만 바로 빼고 보기/다시 보기
        function toggleExclude(cat, ev) {
            if (ev) ev.preventDefault();
            const prev = catMode; catMode = 'exclude';
            setCategoryFilter(cat);
            catMode = prev; saveSelCats(); renderCategoryBar();
        }
        function setSubFilter(sub) {

            updateMapMarkers();
