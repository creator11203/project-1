<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리동네 사건사고 - 글로벌 실시간 관제 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        @keyframes radar-sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-radar-sweep {
            animation: radar-sweep 3s linear infinite;
        }

        .resizer {
            width: 6px;
            background-color: #1e293b;
            cursor: col-resize;
            transition: background-color 0.2s;
            flex-shrink: 0;
            position: relative;
            z-index: 20;
        }
        .resizer:hover, .resizer.resizing {
            background-color: #ef4444;
        }
        .resizer::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 24px;
            background-color: #64748b;
            border-radius: 1px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden select-none">

    <!-- 상단 헤더 -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between shrink-0 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="relative w-10 h-10 bg-slate-950 rounded-xl border border-red-500/50 flex items-center justify-center overflow-hidden shadow-lg shadow-red-500/20">
                <div class="absolute inset-1 rounded-full border border-red-500/30"></div>
                <div class="absolute inset-3 rounded-full border border-red-500/40"></div>
                <div class="absolute w-full h-0.5 bg-red-500/20"></div>
                <div class="absolute h-full w-0.5 bg-red-500/20"></div>
                <div class="absolute top-1/2 left-1/2 w-5 h-5 origin-top-left animate-radar-sweep bg-gradient-to-tr from-red-500/60 to-transparent rounded-tr-full"></div>
                <div class="absolute w-2 h-2 bg-red-500 rounded-full animate-ping"></div>
                <div class="absolute w-1.5 h-1.5 bg-red-400 rounded-full"></div>
            </div>
            <div>
                <h1 class="text-lg font-extrabold tracking-tight text-white flex items-center gap-2">
                    우리동네 사건사고 
                    <span class="text-xs px-2.5 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-500/40 font-mono shadow-[0_0_10px_rgba(16,185,129,0.2)]">글로벌 실시간 관제</span>
                </h1>
                <p class="text-xs text-slate-400">경계선을 드래그하여 3분할 창 크기를 자유롭게 조절할 수 있습니다</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-3">
            <button onclick="openReportModal()" class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white text-xs md:text-sm font-semibold px-4 py-2 rounded-lg shadow-lg shadow-red-600/20 transition flex items-center gap-2">
                <i class="fa-solid fa-bullhorn"></i> 실시간 제보하기
            </button>
            <div class="h-6 w-px bg-slate-800"></div>
            <button onclick="manualRefreshData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs md:text-sm font-medium px-3 py-2 rounded-lg border border-slate-700 transition flex items-center gap-2">
                <i class="fa-solid fa-rotate text-emerald-400"></i> 뉴스 새로고침
            </button>
        </div>
    </header>

    <!-- 메인 3분할 플렉스 레이아웃 -->
    <main id="splitContainer" class="flex-1 flex flex-col lg:flex-row overflow-hidden w-full">
        
        <!-- 1. 왼쪽: 뉴스 피드 패널 -->
        <section id="leftPane" style="width: 26%; min-width: 240px;" class="bg-slate-900/90 flex flex-col h-full overflow-hidden shrink-0">
            <div class="p-3 border-b border-slate-800 bg-slate-900/50 space-y-2">
                <div class="flex items-center justify-between text-xs text-slate-400">
                    <span class="font-semibold text-slate-300 flex items-center gap-1">
                        <i class="fa-solid fa-location-dot text-red-500"></i> 지역 맞춤 필터
                    </span>
                    <button onclick="manualRefreshData()" class="hover:text-white flex items-center gap-1 transition text-slate-300 bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded border border-slate-700">
                        <i class="fa-solid fa-rotate text-emerald-400"></i> 새로고침
                    </button>
                </div>
                <div>
                    <select id="regionSelect" onchange="filterByRegion()" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-red-500">
                        <option value="all">전체 지역 (국내외 통합)</option>
                        <option value="서울">서울특별시</option>
                        <option value="경기">경기도</option>
                        <option value="인천">인천광역시</option>
                        <option value="충청">충청권 (천안·대전·세종·청주 등)</option>
                        <option value="강원">강원특별자치도</option>
                        <option value="영남">영남권 (부산·대구·울산·창원·포항 등)</option>
                        <option value="호남">호남·제주권 (광주·전주·여수·제주 등)</option>
                        <option value="해외">해외 분쟁지역</option>
                    </select>
                </div>
            </div>
            <div id="newsListContainer" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2.5 select-text"></div>
        </section>

        <!-- 리사이저 1 -->
        <div id="resizer1" class="resizer hidden lg:block" title="드래그하여 창 크기 조절"></div>

        <!-- 2. 중앙: 상세 원문 뷰어 패널 -->
        <section id="centerPane" style="width: 42%; min-width: 300px;" class="bg-slate-950 flex flex-col h-full overflow-hidden shrink-0">
            <!-- 카테고리 선택 버튼 바 (선택 시 각 고유 색상 적용) -->
            <div class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center space-x-2 overflow-x-auto shrink-0">
                <button onclick="setCategoryFilter('all')" data-cat="all" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-red-600 text-white transition whitespace-nowrap shadow-sm">전체</button>
                <button onclick="setCategoryFilter('국가 안보')" data-cat="국가 안보" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">국가 안보</button>
                <button onclick="setCategoryFilter('강력·치안')" data-cat="강력·치안" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">강력·치안</button>
                <button onclick="setCategoryFilter('사이버·금융')" data-cat="사이버·금융" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">사이버·금융</button>
                <button onclick="setCategoryFilter('재난·안전')" data-cat="재난·안전" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">재난·안전</button>
                <button onclick="setCategoryFilter('실시간 제보')" data-cat="실시간 제보" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">실시간 제보</button>
                
                <div class="h-5 w-px bg-slate-700 shrink-0 mx-1"></div>
                
                <button onclick="setCategoryFilter('해외 분쟁·테러')" data-cat="해외 분쟁·테러" class="cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-orange-400 hover:bg-slate-700 transition whitespace-nowrap border border-orange-500/30">🌍 해외 분쟁·테러</button>
            </div>
            <div id="detailViewContainer" class="flex-1 overflow-y-auto custom-scrollbar p-5 select-text flex flex-col"></div>
        </section>

        <!-- 리사이저 2 -->
        <div id="resizer2" class="resizer hidden lg:block" title="드래그하여 창 크기 조절"></div>

        <!-- 3. 오른쪽: 인터랙티브 지도 패널 -->
        <section id="rightPane" style="flex: 1; min-width: 240px;" class="bg-slate-900 flex flex-col h-full relative overflow-hidden">
            <div class="absolute top-3 right-3 z-[400] flex items-center gap-2">
                <div class="bg-slate-900/90 backdrop-blur border border-slate-700 text-xs px-3 py-1.5 rounded-lg shadow-lg text-slate-300 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                    <span>글로벌 실시간 관제 지도</span>
                </div>
            </div>
            <div id="map" class="flex-1 w-full h-full z-10"></div>
        </section>

    </main>

    <!-- 실시간 제보 모달 -->
    <div id="reportModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/50">
                <h3 class="font-bold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-bullhorn text-red-500"></i> 현장 실시간 제보 등록
                </h3>
                <button onclick="closeReportModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 overflow-y-auto custom-scrollbar space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">제보 제목</label>
                    <input type="text" id="reportTitle" placeholder="예: 천안 도로 통제 상황" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">시·도</label>
                        <select id="reportSido" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-red-500">
                            <option value="서울특별시">서울특별시</option>
                            <option value="경기도">경기도</option>
                            <option value="충청남도">충청남도</option>
                            <option value="부산광역시">부산광역시</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">위치 상세</label>
                        <input type="text" id="reportLocationDetail" placeholder="예: 천안시 서북구 두정동" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-red-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">상세 코멘트</label>
                    <textarea id="reportContent" rows="3" placeholder="현장 상황을 작성해주세요..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-xs text-white focus:outline-none focus:border-red-500"></textarea>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-slate-800 bg-slate-900/50 flex justify-end space-x-2">
                <button onclick="closeReportModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 rounded-lg">취소</button>
                <button onclick="submitReport()" class="px-5 py-2 bg-red-600 hover:bg-red-500 text-xs font-semibold text-white rounded-lg">제보 등록하기</button>
            </div>
        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        let newsData = [];
        let currentCategory = 'all';
        let currentRegion = 'all';
        let selectedNewsId = null;
        let map, markersLayer;

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            initResizers();
            loadIncidentsFromJSON();

            setInterval(loadIncidentsFromJSON, 30000);
        });

        function initResizers() {
            const container = document.getElementById('splitContainer');
            const leftPane = document.getElementById('leftPane');
            const centerPane = document.getElementById('centerPane');
            const resizer1 = document.getElementById('resizer1');
            const resizer2 = document.getElementById('resizer2');

            let isResizing1 = false;
            let isResizing2 = false;

            resizer1.addEventListener('mousedown', () => {
                isResizing1 = true;
                resizer1.classList.add('resizing');
                document.body.style.cursor = 'col-resize';
            });

            resizer2.addEventListener('mousedown', () => {
                isResizing2 = true;
                resizer2.classList.add('resizing');
                document.body.style.cursor = 'col-resize';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing1 && !isResizing2) return;
                const containerRect = container.getBoundingClientRect();
                const totalWidth = containerRect.width;

                if (isResizing1) {
                    const newLeftWidth = e.clientX - containerRect.left;
                    if (newLeftWidth >= 220 && newLeftWidth <= totalWidth * 0.5) {
                        leftPane.style.width = `${(newLeftWidth / totalWidth) * 100}%`;
                        if (map) map.invalidateSize();
                    }
                } else if (isResizing2) {
                    const leftWidth = leftPane.getBoundingClientRect().width;
                    const newCenterWidth = e.clientX - containerRect.left - leftWidth - 6;
                    if (newCenterWidth >= 280 && (leftWidth + newCenterWidth) <= totalWidth - 220) {
                        centerPane.style.width = `${(newCenterWidth / totalWidth) * 100}%`;
                        if (map) map.invalidateSize();
                    }
                }
            });

            document.addEventListener('mouseup', () => {
                if (isResizing1 || isResizing2) {
                    isResizing1 = false;
                    isResizing2 = false;
                    resizer1.classList.remove('resizing');
                    resizer2.classList.remove('resizing');
                    document.body.style.cursor = 'default';
                    if (map) map.invalidateSize();
                }
            });
        }

        async function loadIncidentsFromJSON() {
            try {
                const response = await fetch('news.json?t=' + Date.now());
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data) && data.length > 0) {
                        newsData = data;
                    }
                }
            } catch (error) {
                console.log("news.json 로드 대기 중...");
            }

            if (newsData.length === 0) {
                newsData = [
                    {
                        id: 1,
                        category: "해외 분쟁·테러",
                        title: "[안내] 실시간 관제 시스템 대기 중",
                        summary: "크롤러가 백그라운드에서 뉴스를 수집하는 중입니다.",
                        content: "잠시만 기다리시면 최신 속보가 자동으로 업데이트됩니다.",
                        location: "우크라이나 키이우",
                        lat: 50.4501,
                        lng: 30.5234,
                        time: "실시간",
                        source: "시스템 안내",
                        timestamp: Date.now() / 1000
                    }
                ];
            }

            if (!selectedNewsId && newsData.length > 0) {
                selectedNewsId = newsData[0].id;
            }

            renderNewsList();
            if (selectedNewsId) renderDetailView(selectedNewsId);
            updateMapMarkers();
        }

        function initMap() {
            map = L.map('map').setView([36.5000, 127.5000], 7);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            markersLayer = L.layerGroup().addTo(map);
            updateMapMarkers();
        }

        function updateMapMarkers(filteredList) {
            if (!markersLayer) return;
            markersLayer.clearLayers();
            const listToMap = filteredList || getFilteredNews();

            listToMap.forEach(news => {
                let markerColor = '#ef4444';
                if (news.category === '해외 분쟁·테러') markerColor = '#f97316';
                else if (news.category === '국가 안보') markerColor = '#6366f1';
                else if (news.category === '사이버·금융') markerColor = '#3b82f6';

                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div style="background-color: ${markerColor}; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px ${markerColor};"></div>`,
                    iconSize: [14, 14],
                    iconPoint: [7, 7]
                });

                const marker = L.marker([news.lat, news.lng], { icon: customIcon });
                marker.bindPopup(`
                    <div style="color: #0f172a; font-family: sans-serif; max-width: 220px;">
                        <span style="font-size: 10px; font-weight: bold; background: #e2e8f0; padding: 2px 6px; border-radius: 4px;">${news.category}</span>
                        <h4 style="font-size: 13px; font-weight: bold; margin: 6px 0 4px 0;">${news.title}</h4>
                        <p style="font-size: 11px; color: #475569; margin: 0;">${news.location}</p>
                    </div>
                `);

                marker.on('click', () => selectNews(news.id));
                markersLayer.addLayer(marker);
            });
        }

        function renderNewsList() {
            const container = document.getElementById('newsListContainer');
            container.innerHTML = '';
            const filtered = getFilteredNews();

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-xs text-slate-500">해당 조건의 기사가 없습니다.</div>`;
                return;
            }

            filtered.forEach(news => {
                const isSelected = news.id === selectedNewsId;
                let badgeClass = 'bg-red-500/20 text-red-400 border-red-500/30';
                if (news.category === '해외 분쟁·테러') badgeClass = 'bg-orange-500/20 text-orange-400 border-orange-500/30';
                else if (news.category === '국가 안보') badgeClass = 'bg-indigo-500/20 text-indigo-400 border-indigo-500/30';

                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border transition cursor-pointer text-left ${isSelected ? 'bg-slate-800/90 border-red-500/60 shadow-lg' : 'bg-slate-900 border-slate-800 hover:bg-slate-800/50'}`;
                card.onclick = () => selectNews(news.id);

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-1.5 gap-1">
                        <span class="text-[10px] px-2 py-0.5 rounded border ${badgeClass} font-semibold shrink-0">${news.category}</span>
                        <span class="text-[10px] text-slate-400 truncate">${news.time}</span>
                    </div>
                    <h3 class="text-xs font-bold text-white line-clamp-2 mb-1">${news.title}</h3>
                    <p class="text-[11px] text-slate-400 line-clamp-2 mb-2">${news.summary}</p>
                    <div class="flex items-center justify-between text-[10px] text-slate-500 pt-1 border-t border-slate-800">
                        <span><i class="fa-solid fa-location-dot text-red-400"></i> ${news.location}</span>
                        <span class="font-medium text-slate-400">${news.source}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderDetailView(id) {
            const news = newsData.find(n => n.id === id);
            const container = document.getElementById('detailViewContainer');
            if (!news) return;

            let headerStyle = 'border-l-4 border-red-500 bg-red-500/10';
            if (news.category === '해외 분쟁·테러') headerStyle = 'border-l-4 border-orange-500 bg-orange-500/10';
            else if (news.category === '국가 안보') headerStyle = 'border-l-4 border-indigo-500 bg-indigo-500/10';

            container.innerHTML = `
                <div class="space-y-4 flex-1 flex flex-col">
                    <div class="p-4 rounded-xl ${headerStyle} shrink-0">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold px-2.5 py-1 rounded bg-slate-900 text-white">${news.category}</span>
                            <span class="text-xs text-slate-400">${news.time} · 출처: ${news.source}</span>
                        </div>
                        <h2 class="text-base md:text-lg font-extrabold text-white leading-snug">${news.title}</h2>
                    </div>

                    <div class="bg-slate-900/80 border border-slate-800 p-3 rounded-xl flex items-center justify-between text-xs text-slate-300 shrink-0">
                        <span class="flex items-center gap-1.5 font-medium">
                            <i class="fa-solid fa-location-dot text-red-500"></i> 매핑 위치: 
                            <strong class="text-white">${news.location}</strong>
                        </span>
                        <span class="text-[11px] text-slate-400 font-mono">위도: ${news.lat}, 경도: ${news.lng}</span>
                    </div>

                    <div class="bg-slate-900/50 border border-slate-800/80 rounded-xl p-4 text-xs md:text-sm text-slate-200 leading-relaxed space-y-3 shrink-0">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-2">
                            <span class="text-[11px] font-bold text-emerald-400"><i class="fa-solid fa-file-lines"></i> 수집된 원문 내용</span>
                            ${news.link ? `
                                <a href="${news.link}" target="_blank" class="inline-flex items-center gap-1.5 text-xs text-blue-400 hover:text-blue-300 bg-blue-950/40 border border-blue-800/60 px-2.5 py-1 rounded-md transition">
                                    <i class="fa-solid fa-arrow-up-right-from-square"></i> 언론사 원문 새 창 열기
                                </a>
                            ` : ''}
                        </div>
                        <p class="whitespace-pre-line">${news.content || news.summary}</p>
                    </div>

                    ${news.link ? `
                        <div class="flex-1 flex flex-col min-h-[360px] bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
                            <div class="bg-slate-800/80 px-3 py-1.5 text-[11px] text-slate-400 flex items-center justify-between border-b border-slate-700">
                                <span><i class="fa-solid fa-globe text-blue-400"></i> 원문 웹페이지 미리보기 (일부 언론사는 보안 정책상 새 창 열기만 지원)</span>
                                <a href="${news.link}" target="_blank" class="text-blue-400 hover:underline">직접 이동 &rarr;</a>
                            </div>
                            <iframe src="${news.link}" class="w-full flex-1 bg-white" sandbox="allow-same-origin allow-scripts allow-popups"></iframe>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function selectNews(id) {
            selectedNewsId = id;
            renderNewsList();
            renderDetailView(id);

            const news = newsData.find(n => n.id === id);
            if (news && map && news.lat && news.lng) {
                const zoomLevel = news.category === '해외 분쟁·테러' ? 5 : 12;
                map.flyTo([news.lat, news.lng], zoomLevel, { duration: 1.2 });
            }
        }

        // 카테고리 필터 클릭 시 각 카테고리별 맞춤 색상(클래스)이 적용되도록 수정
        function setCategoryFilter(category) {
            currentCategory = category;
            
            document.querySelectorAll('.cat-btn').forEach(btn => {
                const btnCat = btn.getAttribute('data-cat');
                
                if (btnCat === category) {
                    // 선택된 카테고리별 고유 색상 부여
                    if (category === 'all') {
                        btn.className = 'cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-red-600 text-white transition whitespace-nowrap shadow-sm';
                    } else if (category === '국가 안보') {
                        btn.className = 'cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition whitespace-nowrap shadow-sm';
                    } else if (category === '강력·치안') {
                        btn.className = 'cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-600 text-white transition whitespace-nowrap shadow-sm';
                    } else if (category === '사이버·금융') {
                        btn.className = 'cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white transition whitespace-nowrap shadow-sm';
                    } else if (category === '재난·안전') {
                        btn.className = 'cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-600 text-white transition whitespace-nowrap shadow-sm';
                    } else if (category === '실시간 제보') {
                        btn.className = 'cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white transition whitespace-nowrap shadow-sm';
                    } else if (category === '해외 분쟁·테러') {
                        btn.className = 'cat-btn px-3 py-1.5 rounded-lg text-xs font-semibold bg-orange-600 text-white transition whitespace-nowrap shadow-sm border border-orange-400';
                    }
                } else {
                    // 비선택 상태의 기본 스타일
                    if (btnCat === '해외 분쟁·테러') {
                        btn.className = 'cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-orange-400 hover:bg-slate-700 transition whitespace-nowrap border border-orange-500/30';
                    } else {
                        btn.className = 'cat-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap';
                    }
                }
            });

            renderNewsList();
            updateMapMarkers();
        }

        function filterByRegion() {
            currentRegion = document.getElementById('regionSelect').value;
            renderNewsList();
            updateMapMarkers();
        }

        function getFilteredNews() {
            return newsData.filter(news => {
                const matchCategory = (currentCategory === 'all' || news.category === currentCategory);
                let matchRegion = true;
                if (currentRegion !== 'all') {
                    if (currentRegion === '해외') {
                        matchRegion = (news.category === '해외 분쟁·테러' || news.location.includes('해외'));
                    } else if (currentRegion === '충청') {
                        matchRegion = /충청|천안|아산|대전|세종|청주|충주|서산|당진/.test(news.location);
                    } else if (currentRegion === '영남') {
                        matchRegion = /부산|대구|울산|경상|창원|포항|구미|김해|진주|양산/.test(news.location);
                    } else if (currentRegion === '호남') {
                        matchRegion = /광주|전라|전북|전주|익산|군산|여수|순천|목포|제주/.test(news.location);
                    } else {
                        matchRegion = news.location.includes(currentRegion);
                    }
                }
                return matchCategory && matchRegion;
            });
        }

        function manualRefreshData() {
            currentCategory = 'all';
            currentRegion = 'all';
            document.getElementById('regionSelect').value = 'all';
            setCategoryFilter('all');
            loadIncidentsFromJSON();
            map.flyTo([36.5000, 127.5000], 7);
        }

        function openReportModal() { document.getElementById('reportModal').classList.remove('hidden'); }
        function closeReportModal() { document.getElementById('reportModal').classList.add('hidden'); }
        function submitReport() {
            const title = document.getElementById('reportTitle').value;
            const sido = document.getElementById('reportSido').value;
            const locationDetail = document.getElementById('reportLocationDetail').value;
            const content = document.getElementById('reportContent').value;

            if (!title || !locationDetail) {
                alert('제목과 위치를 입력해주세요.');
                return;
            }

            const now = new Date();
            const days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
            const dateStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} (${days[now.getDay()]}) ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const newReport = {
                id: Date.now(),
                category: '실시간 제보',
                title: `[시민제보] ${title}`,
                summary: content || title,
                content: content || '시민이 직접 등록한 실시간 제보입니다.',
                location: `${sido} ${locationDetail}`,
                lat: 36.8151 + (Math.random() - 0.5) * 0.02,
                lng: 127.1139 + (Math.random() - 0.5) * 0.02,
                time: dateStr,
                source: '시민 직접 제보',
                timestamp: now.getTime() / 1000
            };

            newsData.unshift(newReport);
            closeReportModal();
            selectNews(newReport.id);
            renderNewsList();
            updateMapMarkers();
            alert('제보가 등록되었습니다!');
        }
    </script>
</body>
</html>
