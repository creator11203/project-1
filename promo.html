<title>우리동네 사건사고 · 홍보 영상</title>
<style>

<body>

<script>
const W = 1280, H = 720, DUR = 36;
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const FONT = "'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);

function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const R = rnd(7), DOTS = [];
[[.42,.20],[.47,.24],[.52,.22],[.60,.27],[.44,.33],[.40,.42],[.50,.40],[.60,.44],[.68,.50],[.45,.52],[.36,.58],[.42,.66],[.52,.60],[.60,.62],[.66,.68],[.50,.76],[.38,.82],[.30,.74],[.20,.90],[.74,.58]].forEach(c => DOTS.push({ x: c[0], y: c[1], p: R() * 6 }));

function bg(t, a = '#0f172a', b = '#312e81') {

  g.save(); g.globalAlpha = .08; g.strokeStyle = '#fff'; g.lineWidth = 1;

  g.restore();
}
function badge(label, t0, t) {

  g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * -14); rr(48, 40, bw, 40, 20); g.fillStyle = 'rgba(99,102,241,.9)'; g.fill(); g.restore();

}

}

const HEADS = ['[속보] 서울 마포구 골목 정전 복구 중', '경기 수원 영통사거리 접촉사고 · 우회 안내', '부산 해운대 해안도로 차량 화재 진화', '강원 강릉 산불 주의보 · 입산 통제', '대전 유성구 실종자 수색 협조 요청', '제주 애월 해상 기상 악화 · 여객선 결항'];
function sceneLive(t) {

  DOTS.forEach((d, i) => { const a = clamp(easeBack(seg(t, .3 + i * .12, .7 + i * .12))); if (a <= 0) return; const x = ox + d.x * mw, y = oy + d.y * mh, pul = (Math.sin(t * 4 + d.p) + 1) / 2;
    g.fillStyle = `rgba(239,68,68,${.25 * (1 - pul)})`; g.beginPath(); g.arc(x, y, (10 + pul * 26) * a, 0, 7); g.fill(); g.fillStyle = i % 4 === 0 ? '#f97316' : '#ef4444'; g.beginPath(); g.arc(x, y, 8 * a, 0, 7); g.fill(); });
  const bw = 600; rr(48, 150, bw, 54, 14); g.fillStyle = 'rgba(15,23,42,.85)'; g.fill(); rr(48, 150, 96, 54, 14); g.fillStyle = '#dc2626'; g.fill(); txt('속보', 96, 177, 24, '#fff', 900, 'center');
  g.save(); rr(150, 150, bw - 108, 54, 10); g.clip(); const off = (t * 150) % 3120; HEADS.concat(HEADS).forEach((h, i) => txt(h, 170 + i * 520 - off, 177, 22, '#e2e8f0', 700)); g.restore();
  [['🔥', '화재', '상가 1층 연기, 소방차 2대 출동', '#f97316'], ['🚗', '교통사고', '사거리 접촉사고 · 부상자 없음', '#3b82f6'], ['🔎', '실종', '80대 어르신 찾습니다', '#a855f7']].forEach((c, i) => {
    const a = easeOut(seg(t, 1.2 + i * .45, 1.9 + i * .45)); g.save(); g.globalAlpha = a; g.translate((1 - a) * -60, 0);
    rr(48, 240 + i * 92, bw, 78, 16); g.fillStyle = 'rgba(255,255,255,.95)'; g.fill(); rr(48, 240 + i * 92, 8, 78, 4); g.fillStyle = c[3]; g.fill();
    txt(c[0], 92, 279 + i * 92, 34, '#000', 800, 'center'); txt(c[1], 126, 262 + i * 92, 15, c[3], 900); txt(c[2], 126, 292 + i * 92, 20, '#0f172a', 800); g.restore(); });

}
function sceneRegion(t) {

  [['시·도', '경기도'], ['시·군·구', '남양주시'], ['읍·면·동', '화도읍']].forEach((s, i) => {
    const a = easeOut(seg(t, .3 + i * .9, .8 + i * .9)), done = t > 1.0 + i * .9; g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * 30);
    rr(120 + i * 360, 130, 330, 84, 18); g.fillStyle = '#fff'; g.fill(); if (done) { g.lineWidth = 4; g.strokeStyle = '#6366f1'; g.stroke(); }
    txt(s[0], 148 + i * 360, 156, 16, '#64748b', 700); txt(done ? s[1] : '선택하세요', 148 + i * 360, 190, 30, done ? '#0f172a' : '#94a3b8', 900); txt('▾', 420 + i * 360, 172, 26, '#64748b', 800, 'center'); g.restore();
    if (i < 2) txt('→', 462 + i * 360, 172, 36, '#a5b4fc', 900, 'center', a); });
  [['🚧', '도로 공사', '화도읍 마석 사거리 한 차로 통제', '#f59e0b'], ['🚓', '교통', '경춘로 정체 · 우회 권장', '#3b82f6'], ['🌧️', '생활안전', '호우 대비 배수로 점검 안내', '#14b8a6']].forEach((c, i) => {
    const a = easeOut(seg(t, 3.0 + i * .4, 3.6 + i * .4)); g.save(); g.globalAlpha = a; g.translate(0, (1 - a) * 40);
    rr(120, 250 + i * 86, 1040, 74, 18); g.fillStyle = 'rgba(255,255,255,.96)'; g.fill(); rr(120, 250 + i * 86, 8, 74, 4); g.fillStyle = c[3]; g.fill();
    txt(c[0], 176, 287 + i * 86, 36, '#000', 800, 'center'); txt(c[1], 224, 271 + i * 86, 16, c[3], 900); txt(c[2], 224, 302 + i * 86, 25, '#0f172a', 800); g.restore(); });
  caption(['시·군·구·동 단위로', '우리 동네 소식만 쏙'], 3.4, t);
}
function sceneBrief(t) {
  bg(t, '#1e1b4b', '#4c1d95'); badge('③ 안전 브리핑 · 지도 · 알림', 0, t);
  const a = easeBack(seg(t, .3, 1)); g.save(); g.translate(0, (1 - clamp(a)) * 50); g.globalAlpha = clamp(a);
  rr(90, 120, 520, 360, 26); g.fillStyle = '#fff'; g.fill(); rr(90, 120, 520, 74, 26); g.fillStyle = '#4f46e5'; g.fill(); g.fillRect(90, 160, 520, 34);
  txt('📋 오늘의 안전 브리핑', 124, 158, 26, '#fff', 900);
  [['오늘 전국 사건', '1,284건'], ['우리 동네 주의', '교통 3 · 화재 1'], ['이번 주 다발 지역', '수원 · 부산 · 창원']].forEach((r, i) => { const b = easeOut(seg(t, 1.0 + i * .5, 1.5 + i * .5)); g.save(); g.globalAlpha = b; txt(r[0], 124, 238 + i * 76, 20, '#64748b', 700); txt(r[1], 124, 270 + i * 76, 30, '#0f172a', 900); g.restore(); });
  g.restore();
  const b = easeOut(seg(t, .6, 1.4)); g.save(); g.globalAlpha = b; rr(680, 120, 510, 360, 26); g.fillStyle = '#dbeafe'; g.fill(); g.clip();
  g.strokeStyle = '#fff'; g.lineWidth = 12; for (let i = 0; i < 5; i++) { g.beginPath(); g.moveTo(680 + i * 130, 120); g.lineTo(780 + i * 110, 480); g.stroke(); }
  g.lineWidth = 9; for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(680, 190 + i * 120); g.lineTo(1190, 240 + i * 100); g.stroke(); }
  [[820, 250], [1010, 330], [920, 420], [1100, 200]].forEach((p, i) => { const k = clamp(easeBack(seg(t, 1.2 + i * .35, 1.7 + i * .35))); if (k <= 0) return; const pul = (Math.sin(t * 5 + i) + 1) / 2;
    g.fillStyle = `rgba(239,68,68,${.3 * (1 - pul)})`; g.beginPath(); g.arc(p[0], p[1], (14 + pul * 22) * k, 0, 7); g.fill(); g.fillStyle = '#ef4444'; g.beginPath(); g.arc(p[0], p[1], 11 * k, 0, 7); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 3; g.stroke(); });
  g.restore();
  const n = easeBack(seg(t, 3.0, 3.7)); g.save(); g.translate((1 - clamp(n)) * 400, 0); g.globalAlpha = clamp(n);
  rr(740, 515, 450, 84, 20); g.fillStyle = '#fff'; g.shadowColor = 'rgba(0,0,0,.4)'; g.shadowBlur = 24; g.fill(); g.shadowBlur = 0;
  txt('🔔', 786, 557, 36, '#000', 800, 'center'); txt('내 동네 속보 알림', 826, 541, 16, '#dc2626', 900); txt('화도읍 사거리 접촉사고 발생', 826, 573, 22, '#0f172a', 900); g.restore();
  caption(['브리핑 · 지도 · 알림으로', '놓치지 않게'], 3.2, t);
}
function sceneTop(t) {
  bg(t, '#422006', '#9a3412'); badge('④ 우리동네 커뮤니티 · 이달의 전국 TOP10', 0, t);
  const h = easeOut(seg(t, .2, .8)); g.save(); g.globalAlpha = h; rr(90, 110, 1100, 96, 24); const gr = g.createLinearGradient(90, 0, 1190, 0); gr.addColorStop(0, '#f59e0b'); gr.addColorStop(1, '#ea580c'); g.fillStyle = gr; g.fill();
  txt('🏆 이달의 전국 TOP10', 130, 150, 36, '#fff', 900); txt('전국 동네를 합쳐 공감 가장 많은 글 · 장소 · 이웃', 130, 186, 18, '#ffedd5', 700); g.restore();
  [['🥇', '서울 마포구 연남동', '골목 정전, 한 시간째 복구 중이에요', 42], ['🥈', '부산 해운대구 우동', '주민센터 직원분 너무 친절하세요', 38], ['🥉', '강원 강릉시 교동', '새벽 산책길 노을이 장관이에요', 35], ['4', '제주 제주시 애월읍', '제주 애월로 이사 왔어요, 반갑습니다!', 33], ['5', '경기 수원시 영통동', '영통 사거리 보행 신호가 너무 짧아요', 31]].forEach((r, i) => {
    const a = easeOut(seg(t, 1.0 + i * .5, 1.6 + i * .5)); g.save(); g.globalAlpha = a; g.translate((1 - a) * 120, 0); const y = 222 + i * 58;
    rr(90, y, 1100, 50, 14); g.fillStyle = 'rgba(255,255,255,.96)'; g.fill(); txt(r[0], 128, y + 26, i < 3 ? 28 : 22, '#92400e', 900, 'center');
    g.fillStyle = `hsl(${[200, 160, 20, 280, 340][i]} 70% 42%)`; rr(168, y + 12, 270, 26, 13); g.fill(); txt('📍 ' + r[1], 182, y + 26, 15, '#fff', 800);
    txt(r[2], 460, y + 26, 21, '#0f172a', 800); txt('❤ ' + r[3], 1160, y + 26, 21, '#e11d48', 900, 'right'); g.restore(); });
  caption(['이웃과 소통하고', '전국 인기 글까지 한눈에'], 3.8, t);
}
function sceneReport(t) {
  bg(t, '#450a0a', '#be123c'); badge('⑤ 실시간 제보', 0, t);
  const b = clamp(easeBack(seg(t, .3, 1))), pul = (Math.sin(t * 6) + 1) / 2;
  g.save(); g.translate(W / 2, 250); g.scale(.6 + .4 * b, .6 + .4 * b); g.globalAlpha = b;
  g.fillStyle = `rgba(255,255,255,${.12 + .12 * pul})`; rr(-250 - pul * 14, -56 - pul * 14, 500 + pul * 28, 112 + pul * 28, 56); g.fill();

  caption(['내가 본 사고,', '이웃의 안전이 됩니다'], 2.0, t);
}
function sceneCta(t) {
  bg(t, '#1e1b4b', '#4f46e5');
  for (let i = 0; i < 3; i++) { const p = ((t * .5 + i / 3) % 1); g.strokeStyle = `rgba(165,180,252,${(1 - p) * .5})`; g.lineWidth = 3; g.beginPath(); g.arc(W / 2, 250, 60 + p * 300, 0, 7); g.stroke(); }
  txt('🚨', W / 2, 250, 120, '#fff', 800, 'center', clamp(easeBack(seg(t, .1, .7))));
  const b = easeOut(seg(t, .5, 1.1)); g.save(); g.translate(0, (1 - b) * 30); txt('우리동네 사건사고', W / 2, 400, 84, '#fff', 900, 'center', b); g.restore();

  const d = clamp(easeBack(seg(t, 1.5, 2.1))); g.save(); g.translate(W / 2, 580); g.scale(d, d); rr(-210, -42, 420, 84, 42); g.fillStyle = '#fff'; g.fill(); txt('지금 바로 접속 ▶', 0, 0, 34, '#4f46e5', 900, 'center'); g.restore();

const SCENES = [[0, 4, sceneHook], [4, 10, sceneLive], [10, 16, sceneRegion], [16, 22, sceneBrief], [22, 29, sceneTop], [29, 33, sceneReport], [33, 36, sceneCta]];
function draw(t) {
  g.clearRect(0, 0, W, H);
  const s = SCENES.find(s => t >= s[0] && t < s[1]) || SCENES[SCENES.length - 1]; const lt = t - s[0]; s[2](lt);

  const f = Math.max(s[0] === 0 ? 0 : fin, s[1] >= DUR ? 0 : fout); if (f > 0) { g.fillStyle = `rgba(2,6,23,${f})`; g.fillRect(0, 0, W, H); }
}
// 재생: 시계 기반 (녹화 스크립트는 window.__T 로 시간을 직접 지정할 수 있음)
let start = performance.now();
function frame() { const t = window.__T != null ? window.__T : ((performance.now() - start) / 1000) % (DUR + 1); draw(Math.min(t, DUR - .001)); requestAnimationFrame(frame); }
document.getElementById('bPlay').onclick = () => { start = performance.now(); };
requestAnimationFrame(frame);
</script>
