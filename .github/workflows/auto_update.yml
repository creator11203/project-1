name: Auto Update Incidents and News

# scraper.py 는 비공개 저장소(PRIVATE_REPO)에 두고, 실행할 때만 가져와 씁니다.
# 수집은 이 공개 저장소의 Actions 에서 돌리므로 사용 시간 제한이 없습니다.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write

    env:
      PRIVATE_REPO: creator11203/scraper-private     # ← 비공개 저장소 이름 (만든 이름으로 바꾸세요)
      LOOP_MINUTES: 55
      CYCLE_SECONDS: 420
      GOOGLE_EVERY_SEC: 900

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout private scraper
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: _priv
          fetch-depth: 60

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser pytz

      # 정상 동작하는 scraper.py 고르기 (고장이면 비공개 저장소 기록에서 직전 정상 버전 사용)
      # 공개 로그에 소스 코드 줄이 새지 않도록 오류 출력은 마지막 한 줄만 보여 주고, 실행은 컴파일본(.pyc)으로 합니다.
      - name: Pick a working scraper (auto-recover)
        id: pick
        run: |
          echo "_priv/" >> .git/info/exclude
          cat > /tmp/ci_check.py <<'PY'
          import importlib.util, sys
          path = sys.argv[1]
          spec = importlib.util.spec_from_file_location("scraper_under_test", path)
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          for t in ["서울 강남구 역삼동 오피스텔 화재로 1명 숨져", "부산 해운대구서 음주운전 차량이 보행자 들이받아…50대 입건", "아이유 신곡 '살인자의 고백' 차트 1위"]:
              r = m.classify(t, t)
              if r:
                  m.locate(t, t, None, False)
          old = m.load_existing()[:300]
          out = m.reprocess_existing(old)
          if old and len(out) == 0:
              raise SystemExit("기존 기사를 하나도 다시 계산하지 못함")
          print("check ok")
          PY
          build() {  # $1 = 소스 파일 → scraper.pyc 로 컴파일하고 소스는 지움
            python -m py_compile "$1" && python - "$1" <<'PY'
          import sys, py_compile
          py_compile.compile(sys.argv[1], cfile="scraper_run.pyc", doraise=True)
          PY
            rm -f "$1"
          }
          cp _priv/scraper.py scraper.py
          if python /tmp/ci_check.py scraper.py >/tmp/out.txt 2>/tmp/err.txt; then
            build scraper.py
            echo "fallback=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::scraper.py 가 고장 났습니다 ($(tail -n 1 /tmp/err.txt | cut -c1-120)). 직전 정상 버전을 찾습니다."
          rm -f scraper.py
          for h in $(git -C _priv log --format=%H -n 40 -- scraper.py | tail -n +2); do
            git -C _priv show "$h:scraper.py" > scraper.py 2>/dev/null || continue
            if python /tmp/ci_check.py scraper.py >/dev/null 2>&1; then
              echo "::warning::자동 복구: ${h:0:7} 버전으로 수집합니다. scraper.py 를 고쳐 다시 올려 주세요."
              build scraper.py
              echo "fallback=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rm -f scraper.py
          done
          echo "::error::정상 동작하는 scraper.py 를 찾지 못했습니다."
          exit 1

      - name: Scrape and push repeatedly
        env:
          FALLBACK: ${{ steps.pick.outputs.fallback }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          END=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          ROUND=0
          FAILS=0
          while true; do
            ROUND=$((ROUND + 1))
            START=$(date +%s)
            echo "::group::수집 ${ROUND}회차 ($(TZ=Asia/Seoul date '+%H:%M:%S'))"
            if ! python scraper_run.pyc; then
              FAILS=$((FAILS + 1))
              echo "::error::실행 실패 (${ROUND}회차) — 다음 회차에 다시 시도합니다."
            fi
            git add news.json
            if [ -f tips.json ]; then git add tips.json; fi
            if [ -f blocked.json ]; then git add blocked.json; fi
            if [ -f geocache.json ]; then git add geocache.json; fi
            if [ -f stations.json ]; then git add stations.json; fi
            # dropped_log.json: 규칙으로 걸러진 제목 점검 기록 (화면에는 안 나옴). 다른 파일이 바뀌어 저장할 때만 함께 올림
            if ! git diff --staged --quiet && [ -f dropped_log.json ]; then git add dropped_log.json; fi
            if git diff --staged --quiet; then
              echo "변경된 뉴스가 없어 저장을 건너뜁니다."
            else
              git commit -m "Auto-update latest news dataset ($(TZ=Asia/Seoul date '+%m-%d %H:%M'))"
              if ! git pull --rebase --autostash origin ${{ github.ref_name }}; then
                git rebase --abort || true
                mkdir -p /tmp/keep
                for f in news.json tips.json blocked.json geocache.json stations.json; do
                  if [ -f "$f" ]; then cp "$f" "/tmp/keep/$f"; fi
                done
                git fetch origin ${{ github.ref_name }}
                git reset --hard origin/${{ github.ref_name }}
                for f in news.json tips.json blocked.json geocache.json stations.json; do
                  if [ -f "/tmp/keep/$f" ]; then cp "/tmp/keep/$f" "$f"; git add "$f"; fi
                done
                if git diff --staged --quiet; then
                  echo "::warning::저장할 새 내용이 없어 건너뜁니다."
                else
                  git commit -m "Auto-update latest news dataset ($(TZ=Asia/Seoul date '+%m-%d %H:%M'), 겹침 복구)"
                  git push || echo "::warning::올리기 실패 — 다음 회차에 다시 시도합니다."
                fi
              else
                git push || echo "::warning::올리기 실패 — 다음 회차에 다시 시도합니다."
              fi
            fi
            echo "::endgroup::"
            NOW=$(date +%s)
            NEXT=$(( START + CYCLE_SECONDS ))
            if [ $NEXT -ge $END ]; then break; fi
            if [ $NEXT -gt $NOW ]; then sleep $(( NEXT - NOW )); fi
          done
          if [ $FAILS -ge $ROUND ]; then
            echo "::error::이번 실행의 수집 ${ROUND}회가 모두 실패했습니다."
            exit 1
          fi
          if [ "$FALLBACK" = "1" ]; then
            echo "::error::기사는 직전 정상 버전으로 수집했습니다. scraper.py 를 고쳐 다시 올려 주세요."
            exit 1
          fi
