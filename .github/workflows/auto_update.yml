name: Auto Update Incidents and News

on:
  schedule:
    # 10분마다 실행 (GitHub Actions는 5분 미만 간격을 지원하지 않습니다)
    - cron: '*/10 * * * *'
  workflow_dispatch:   # Actions 탭에서 수동으로 "Run workflow" 버튼으로 실행할 수도 있습니다

# 이전 실행이 아직 끝나지 않았으면 겹쳐서 실행하지 않음
concurrency:
  group: auto-update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser pytz

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --staged --quiet; then
            echo "변경된 뉴스가 없어 저장을 건너뜁니다."
          else
            git commit -m "Auto-update latest news dataset [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
