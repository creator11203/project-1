name: Auto Update Incidents and News

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ⭐ 이 부분을 추가해야 합니다! (feedparser, pytz 설치)
      - name: Install dependencies
        run: |
          pip install feedparser pytz

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and push if changed
        uses: stefanzvu/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update latest domestic & global incidents [skip ci]"
          branch: main
