<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="우리동네 사건사고 로고: 레이더가 훑는 대한민국 지도">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c30"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".48"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity=".14"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 256) scale(230)">
      <stop offset="0" stop-color="#f87171" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <circle cx="256" cy="256" r="256" fill="url(#halo)"/>
    <!-- 관제 화면 격자 -->
    <g stroke="#f87171" stroke-opacity=".08" stroke-width="2">
      <path d="M64 0V512M128 0V512M192 0V512M256 0V512M320 0V512M384 0V512M448 0V512"/>
      <path d="M0 64H512M0 128H512M0 192H512M0 256H512M0 320H512M0 384H512M0 448H512"/>
    </g>
    <!-- 레이더 눈금 -->
    <g fill="none" stroke="#f87171" stroke-opacity=".22" stroke-width="3">
      <circle cx="256" cy="256" r="84"/>
      <circle cx="256" cy="256" r="152"/>
      <circle cx="256" cy="256" r="220"/>
      <path d="M256 20V492M20 256H492" stroke-dasharray="4 12"/>
    </g>
    <!-- 레이더가 훑고 지나간 부채꼴 -->
    <path d="M256 256 L256 26 A230 230 0 0 1 419 93 Z" fill="url(#sweep)"/>
    <path d="M256 256 L256 26" stroke="#fca5a5" stroke-width="4" stroke-linecap="round" opacity=".9"/>
  </g>
  <!-- 모서리 조준선 (관제 화면 느낌) -->
  <g fill="none" stroke="#f87171" stroke-width="7" stroke-linecap="round" opacity=".85">
    <path d="M44 100V60Q44 44 60 44H100"/>
    <path d="M412 44H452Q468 44 468 60V100"/>
    <path d="M44 412V452Q44 468 60 468H100"/>
    <path d="M468 412V452Q468 468 452 468H412"/>
  </g>
  <!-- 대한민국 지도 -->
  <g transform="translate(22 40) scale(9)" stroke-linejoin="round" stroke-linecap="round">
    <g filter="url(#glow)">
      <path d="M10.5 8.8 L13.0 6.1 L17.3 5.9 L20.7 3.8 L22.3 7.3 L24.9 11.0 L26.8 15.2 L27.4 18.9 L27.0 22.5 L28.1 23.3 L27.3 27.2 L25.8 29.8 L24.3 30.6 L22.2 31.7 L21.3 33.1 L18.8 32.1 L17.0 33.1 L15.2 34.3 L13.7 34.7 L11.8 35.6 L9.5 36.2 L8.1 34.1 L8.7 31.0 L8.9 27.6 L9.5 26.1 L10.7 23.8 L9.4 21.2 L8.3 18.9 L7.3 17.6 L9.3 16.3 L11.5 15.9 L10.1 12.9 L9.5 10.5 Z" fill="url(#land)" stroke="#f87171" stroke-width="1.15"/>
      <ellipse cx="9.7" cy="43.1" rx="2.6" ry="1.4" fill="url(#land)" stroke="#f87171" stroke-width="1.05"/>
    </g>
    <!-- 사건이 감지된 지점 -->
    <g fill="#fecaca">
      <circle cx="9.1" cy="10.6" r=".9"/>
      <circle cx="8.0" cy="34.9" r=".9"/>
      <circle cx="22.3" cy="32.1" r=".9"/>
      <circle cx="42.1" cy="14.1" r=".8"/>
    </g>
    <g fill="#ef4444" filter="url(#glow)">
      <circle cx="36.0" cy="12.2" r="1.3"/>
      <circle cx="17.6" cy="20.0" r="1.5"/>
    </g>
    <g fill="none" stroke="#f87171" stroke-width=".35" opacity=".85">
      <circle cx="17.6" cy="20.0" r="3.4"/>
      <circle cx="17.6" cy="20.0" r="5.6" opacity=".5"/>
      <circle cx="36.0" cy="12.2" r="3"/>
    </g>
  </g>
</svg>
